<script>
const SHAPE = 'ellipse';
const ELLIPSE = SHAPE !== 'now';
const K = 192 / 216;
const TH = {
  gold: { surface: '#FFFDF9', goldLight: '#FDE9D5', gold: '#F08A3C', text: '#1D2240', bg: '#F6F1E8' },
  rose: { surface: '#FFFDFC', goldLight: '#FBE3E6', gold: '#E2617F', text: '#2E1D2A', bg: '#FAEFEC' },
  night: { surface: '#172238', goldLight: '#3A2D26', gold: '#F59A4A', text: '#EEF1F7', bg: '#0E1626' },
};
class Component extends DCLogic {
/*CORE*/

  boardState() {
    const want = this.opt('look');
    return { look: want === 'cards' || want === 'rings' ? want : 'rail', drag: false, touched: false, zSel: null };
  }

  boardMount() {
    this.chipTimer = setTimeout(() => this.centerChip(false), 80);
  }

  boardUnmount() {
    clearTimeout(this.chipTimer);
    cancelAnimationFrame(this.gRaf);
  }

  componentDidUpdate() {
    if (this.chipKey !== this.lastChip) {
      const first = this.lastChip === undefined;
      this.lastChip = this.chipKey;
      if (!first) this.centerChip(true);
    }
  }

  showToast(toast) {
    clearTimeout(this.toastTimer);
    this.toastFlip = !this.toastFlip;
    if (toast.undoId || toast.msgId) this.setState({ toast: null });
    else this.setState({ toast });
    this.toastTimer = setTimeout(() => this.setState({ toast: null }), 2600);
  }

  centerChip(smooth) {
    const box = document.getElementById('zchips');
    const on = box && box.querySelector('.mk');
    if (!box || !on) return;
    const b = box.getBoundingClientRect();
    const o = on.getBoundingClientRect();
    const dx = o.left + o.width / 2 - (b.left + b.width / 2);
    if (smooth) box.scrollBy({ left: dx, behavior: 'smooth' });
    else box.scrollLeft += dx;
  }

  geo() {
    const W = ELLIPSE ? 390 / K : 350;
    const H = ELLIPSE ? 286 : 216;
    const RX = SHAPE === 'circle' ? 112 : 142;
    return { W, H, CX: W / 2, CY: 158, RX, RY: ELLIPSE ? 112 : 116, NRX: SHAPE === 'now' ? 100 : RX, NRY: ELLIPSE ? 112 : 46 };
  }

  ellipseLen(rx, ry, f) {
    const end = Math.PI * Math.max(0, Math.min(1, f));
    let len = 0;
    let px = rx;
    let py = 0;
    for (let i = 1; i <= 120; i++) {
      const a = (end * i) / 120;
      const x = rx * Math.cos(a);
      const y = ry * Math.sin(a);
      len += Math.hypot(x - px, y - py);
      px = x;
      py = y;
    }
    return len;
  }

  gPoint(e) {
    const g = this.geo();
    const r = document.getElementById('scene').getBoundingClientRect();
    return { x: (e.clientX - r.left - (r.width - g.W * K) / 2) / K, y: (e.clientY - r.top) / K };
  }

  orbPoint() {
    const g = this.geo();
    const t = this.now();
    const A0 = this.dayStart();
    const A1 = this.zmanSec('tzeit');
    const E = this.dayEnd();
    const f = (v) => Math.max(0, Math.min(1, v));
    if (t < A1) {
      const a = Math.PI * f((t - A0) / (A1 - A0));
      return { x: g.CX + g.RX * Math.cos(a), y: g.CY - g.RY * Math.sin(a) };
    }
    const a = Math.PI * f((t - A1) / (E - A1));
    return { x: g.CX - g.NRX * Math.cos(a), y: g.CY + g.NRY * Math.sin(a) };
  }

  gTime(p) {
    const { CX, CY, RX, RY, NRX, NRY } = this.geo();
    const A0 = this.dayStart();
    const A1 = this.zmanSec('tzeit');
    const E = this.dayEnd();
    if (p.y <= CY) {
      const nu = (p.x - CX) / RX;
      const nv = (CY - p.y) / RY;
      return { rho: Math.hypot(nu, nv), sec: A0 + (Math.atan2(nv, nu) / Math.PI) * (A1 - A0) };
    }
    const nu = (p.x - CX) / NRX;
    const nv = (p.y - CY) / NRY;
    return { rho: Math.hypot(nu, nv), sec: A1 + (Math.atan2(nv, -nu) / Math.PI) * (E - A1) };
  }

  gSet(sec) {
    this.gPend = sec;
    if (this.gRaf) return;
    this.gRaf = requestAnimationFrame(() => {
      this.gRaf = 0;
      this.gFlush();
    });
  }

  gFlush() {
    if (this.gPend == null) return;
    const v = this.gPend;
    this.gPend = null;
    this.scrub(v);
  }

  gDown(e) {
    if (e.button > 0) return;
    const p = this.gPoint(e);
    const orb = this.orbPoint();
    if (Math.hypot(p.x - orb.x, p.y - orb.y) > 30) return;
    try {
      e.currentTarget.setPointerCapture(e.pointerId);
    } catch (err) {}
    const hit = this.gTime(p);
    const cur = this.now();
    this.gDrag = { id: e.pointerId, off: hit.sec - cur, prev: cur };
    this.setState({ drag: true, touched: true, zSel: null });
  }

  gMove(e) {
    const d = this.gDrag;
    if (!d || e.pointerId !== d.id) return;
    const hit = this.gTime(this.gPoint(e));
    if (hit.rho < 0.15) return;
    const lo = this.dayStart();
    const hi = this.dayEnd() - 60;
    let sec = hit.sec - d.off;
    d.off *= 0.93;
    if (Math.abs(sec - d.prev) > (hi - lo) * 0.75) sec = d.prev < (lo + hi) / 2 ? lo : hi;
    sec = Math.max(lo, Math.min(hi, sec));
    d.prev = sec;
    this.gSet(sec);
  }

  gUp(e) {
    const d = this.gDrag;
    if (!d || e.pointerId !== d.id) return;
    this.gDrag = null;
    try {
      e.currentTarget.releasePointerCapture(e.pointerId);
    } catch (err) {}
    this.gFlush();
    this.setState({ drag: false });
  }

  gKey(e) {
    const t = this.now();
    const keys = { ArrowLeft: 900, ArrowUp: 900, ArrowRight: -900, ArrowDown: -900, PageUp: 3600, PageDown: -3600 };
    let to = null;
    if (e.key in keys) to = t + keys[e.key];
    else if (e.key === 'Home') to = this.dayStart();
    else if (e.key === 'End') to = this.dayEnd() - 60;
    if (to == null) return;
    e.preventDefault();
    this.setState({ zSel: null, touched: true });
    this.scrub(to);
  }

  hx(c) {
    return [1, 3, 5].map((i) => parseInt(c.slice(i, i + 2), 16));
  }

  st(a) {
    return '#' + a.map((v) => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0')).join('');
  }

  bl(top, bottom, share) {
    const k = Math.max(0, Math.min(1, share));
    return top.map((v, i) => Math.round(v * k + bottom[i] * (1 - k)));
  }

  lum(a) {
    const f = (v) => {
      v /= 255;
      return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
    };
    return 0.2126 * f(a[0]) + 0.7152 * f(a[1]) + 0.0722 * f(a[2]);
  }

  cr(a, b) {
    const hi = Math.max(this.lum(a), this.lum(b));
    const lo = Math.min(this.lum(a), this.lum(b));
    return (hi + 0.05) / (lo + 0.05);
  }

  skyKeys() {
    const z = {};
    this.zmanimList().forEach((x) => (z[x.id] = x.S));
    const end = this.dayEnd();
    const H = (c) => this.hx(c);
    const K1 = (t, top, mid, bot, cloud) => ({ t, top: H(top), mid: H(mid), bot: H(bot), cloud: H(cloud) });
    const alot = K1(z.alot, '#18215F', '#4B3D8E', '#9B6BA8', '#C9A6D6');
    return [
      alot,
      K1(z.netz, '#8DA3E0', '#F2B7B4', '#FFD9AE', '#FFD6CC'),
      K1(z.netz + (z.chatzot - z.netz) * 0.3, '#76B6F2', '#A8D4F6', '#D8EDFA', '#FFFFFF'),
      K1(z.chatzot, '#4B9DEB', '#6DB4F1', '#A8D5F8', '#FFFFFF'),
      K1(z.plag, '#5E9FE0', '#9CC5E8', '#F5D9A2', '#FFF6E4'),
      K1(z.shkia, '#5C5AA8', '#E4708C', '#FFB05C', '#FFC8B0'),
      K1(z.tzeit, '#161D58', '#2E3382', '#6C5BA8', '#9A8CC8'),
      K1(z.tzeit + (z.chatzotL - z.tzeit) * 0.25, '#070C1F', '#0F1A3E', '#1B2A58', '#7F8FC8'),
      K1(end - (z.netz - z.alot) * 0.7, '#060A19', '#0D1533', '#18224D', '#7F8FC8'),
      { ...alot, t: end },
    ];
  }

  skyAt(ms) {
    const keys = this.skyKeys();
    let i = 0;
    keys.forEach((k, index) => {
      if (ms >= k.t && index <= keys.length - 2) i = index;
    });
    const k = Math.max(0, Math.min(1, (ms - keys[i].t) / (keys[i + 1].t - keys[i].t)));
    const e = k * k * (3 - 2 * k);
    const m = (p) => this.bl(keys[i + 1][p], keys[i][p], e);
    return { top: m('top'), mid: m('mid'), bot: m('bot'), cloud: m('cloud') };
  }

  inkFor(s) {
    const zones = [s.top, this.bl(s.mid, s.top, 0.6), s.mid, s.bot];
    const dark = this.hx('#0A1228');
    const white = [255, 255, 255];
    const worst = (c) => Math.min(...zones.map((z) => this.cr(z, c)));
    const light = worst(white) > worst(dark);
    const ink = light ? white : dark;
    const opp = light ? this.hx('#080E22') : white;
    let n = 0;
    for (; n < 16; n++) {
      const a = 0.18 + 0.04 * n;
      if (Math.min(...zones.map((z) => this.cr(this.bl(opp, z, a), ink))) >= 5.2) break;
    }
    return { ink, opp, alpha: Math.round((0.18 + 0.04 * n) * 100) / 100, light };
  }

  ground(s) {
    const g = this.hx('#080C1E');
    return { back: this.bl(g, s.bot, 0.4), front: this.bl(g, s.bot, 0.58), shadeTop: this.bl(g, s.bot, 0.35), shadeBottom: this.bl(g, s.bot, 0.7) };
  }

  backdrop(s, share) {
    const g = this.ground(s);
    const op = 0.55 + (0.92 - 0.55) * share;
    return this.bl(this.bl(g.shadeBottom, g.shadeTop, share), s.bot, op);
  }

  glassInk(backdrops, fill) {
    const w = Math.min(...backdrops.map((b) => this.cr(this.bl(fill, b, 0.2), [255, 255, 255])));
    const d = Math.min(...backdrops.map((b) => this.cr(this.bl(fill, b, 0.2), this.hx('#0A1228'))));
    return w > d ? [255, 255, 255] : this.hx('#0A1228');
  }

  fmtLeft(sec) {
    const m = Math.max(0, Math.round(sec / 60));
    if (m >= 2880) return { v: String(Math.floor(m / 1440)), u: 'ימים' };
    if (m >= 60) return { v: Math.floor(m / 60) + ':' + String(m % 60).padStart(2, '0'), u: 'שעות' };
    return { v: String(m), u: "דק'" };
  }

  leftText(sec) {
    const p = this.fmtLeft(sec);
    return p.v + ' ' + p.u;
  }

  appMessages(c, t) {
    const D = this.data();
    const date = this.dayKey();
    const day = D.days[date];
    const shkia = day.z.shkia * 60;
    const out = [];
    const nowDate = t >= 86400 ? this.shiftDate(date, 1) : date;
    const nowMin = (t >= 86400 ? t - 86400 : t) / 60;
    if (c.streak > 0) {
      const goals = [7, 30, 100, 365];
      const goal = goals.find((g) => g > c.streak) || Math.ceil((c.streak + 1) / 365) * 365;
      const rem = goal - c.streak;
      out.push({ id: 'streak', ic: 'isStar', title: c.streak === 1 ? 'יום אחד ברצף' : c.streak + ' ימים ברצף', caption: rem === 1 ? 'עוד יום אחד ליעד ' + goal : 'עוד ' + rem + ' ימים ליעד ' + goal, href: 'history' });
    }
    const block = D.blocks.find((b) => b.erev > nowDate || (b.erev === nowDate && b.startMin > nowMin));
    if (block) {
      const ahead = this.daysBetween(date, block.erev);
      if (ahead <= 8) {
        const when = ahead === 0 ? 'היום' : ahead === 1 ? 'מחר' : D.days[block.erev] ? D.days[block.erev].weekday : '';
        out.push({ id: 'holyBlock', ic: 'isCandles', title: 'שבת', caption: when + ' · הדלקת נרות ' + this.clock(block.candle * 60) + ' · צאת השבת ' + this.clock(block.exit * 60), href: null });
      }
    }
    const rc = D.events.filter((e) => e.rc && e.d >= date);
    if (rc.length) {
      const first = rc[0];
      const month = first.title.replace(/^ראש חודש /, '');
      const days = rc.filter((e) => e.title === first.title).map((e) => e.d);
      const n = this.daysBetween(date, first.d);
      const afterShkia = t >= shkia;
      const inWords = ['', 'מחר', 'בעוד יומיים', 'בעוד שלושה ימים', 'בעוד ארבעה ימים', 'בעוד חמישה ימים', 'בעוד שישה ימים', 'בעוד שבעה ימים'];
      if (n <= 0) {
        const lastDay = days[days.length - 1] === date;
        if (!(lastDay && afterShkia)) out.push({ id: 'roshChodesh', ic: 'isMoon', title: 'היום ראש חודש ' + month, caption: 'יעלה ויבוא, הלל ומוסף בשחרית.', href: 'rc' });
      } else if (n === 1) {
        if (afterShkia) out.push({ id: 'roshChodesh', ic: 'isMoon', title: 'היום ראש חודש ' + month, caption: 'נכנס היום בשקיעה. יעלה ויבוא בתפילה ובברכת המזון.', href: 'rc' });
        else out.push({ id: 'roshChodesh', ic: 'isMoon', title: 'ראש חודש ' + month + ' מחר', caption: 'נכנס הערב בשקיעה.', href: 'rc' });
      } else if (n <= 7) {
        const eve = this.shiftDate(date, n - 1);
        out.push({ id: 'roshChodesh', ic: 'isMoon', title: 'ראש חודש ' + month + ' ' + inWords[n], caption: 'נכנס ב' + D.days[eve].weekday + ' בשקיעה.', href: 'rc' });
      }
    }
    const tonight = day.hilulaTonight;
    const today = day.hilulaToday;
    if (t >= shkia && tonight.length) out.push({ id: 'hilula', ic: 'isHilula', title: 'הלילה: הילולת ' + tonight.join(', '), caption: 'יום ההילולה, ' + day.hebNightLbl + ', נכנס היום בשקיעה.', href: 'hilula' });
    else if (t < shkia && today.length) out.push({ id: 'hilula', ic: 'isHilula', title: 'היום: הילולת ' + today.join(', '), caption: day.hebLbl, href: 'hilula' });
    else if (t < shkia && tonight.length) out.push({ id: 'hilula', ic: 'isHilula', title: 'הערב: הילולת ' + tonight.join(', '), caption: 'יום ההילולה, ' + day.hebNightLbl + ', נכנס הערב בשקיעה.', href: 'hilula' });
    return out;
  }

  renderVals() {
    const c = this.coreVals();
    const s = this.state;
    const t = this.now();
    const A0 = this.dayStart();
    const A1 = this.zmanSec('tzeit');
    const E = this.dayEnd();
    const NIGHT = E - A1;
    const g = this.geo();
    const { CX, CY, RX, RY, NRX, NRY } = g;
    const cl = (f) => Math.max(0, Math.min(1, f));
    const px = (n) => (n * K).toFixed(1);
    const th = TH[c.theme];
    const surfaceA = this.hx(th.surface);
    const goldLightA = this.hx(th.goldLight);

    const dayP = (f) => ({ x: CX + RX * Math.cos(Math.PI * cl(f)), y: CY - RY * Math.sin(Math.PI * cl(f)) });
    const nightP = (f) => ({ x: CX - NRX * Math.cos(Math.PI * cl(f)), y: CY + NRY * Math.sin(Math.PI * cl(f)) });
    const posOf = (S) => (S <= A1 ? dayP((S - A0) / (A1 - A0)) : nightP((S - A1) / NIGHT));
    const night = t >= A1;
    const fraction = night ? cl((t - A1) / NIGHT) : cl((t - A0) / (A1 - A0));
    if (!this.lens) this.lens = { day: this.ellipseLen(RX, RY, 1), night: this.ellipseLen(NRX, NRY, 1) };
    const dayLen = this.lens.day;
    const nightLen = this.lens.night;
    const dayShown = night && ELLIPSE ? 1 : fraction;
    const dayDash = dayLen - this.ellipseLen(RX, RY, dayShown);
    const nightDash = nightLen - this.ellipseLen(NRX, NRY, fraction);
    const orb = this.orbPoint();

    const sk = this.skyAt(t);
    const ik = this.inkFor(sk);
    const gr = this.ground(sk);
    const rgba = (a, al) => 'rgba(' + a.map((v) => Math.round(v)).join(',') + ',' + al + ')';
    const inkHex = this.st(ik.ink);
    const dayFrac = cl((t - A0) / (A1 - A0));
    const hgt = cl(Math.sin(Math.PI * dayFrac) / 0.55);
    const sunCore = this.st(this.bl(this.hx('#FFE27A'), this.hx('#FF8A3D'), hgt));
    const sunEdge = this.st(this.bl(this.hx('#FFB347'), this.hx('#E8531F'), hgt));
    const zl = this.zmanimList();
    const zS = Object.fromEntries(zl.map((z) => [z.id, z.S]));
    const nz = zS.tzeit - zS.shkia || 1200;
    let share = 0;
    if (t >= zS.shkia) share = cl((t - zS.shkia) / (2 * nz));
    else if (t <= zS.netz) share = cl((zS.netz - t) / (zS.netz - A0 || 1200));
    share = share * share * (3 - 2 * share);

    const nextId = (c.zmanim.find((z) => z.isNext) || {}).id || null;
    const selId = (c.isScrub && s.zSel) || null;
    const markedId = selId || nextId;
    this.chipKey = markedId;
    const stripBd = [0.43, 0.67, 0.91].map((sh) => this.backdrop(sk, sh));
    const edgeBd = [0.05, 0.18, 0.32].map((sh) => this.backdrop(sk, sh));
    const inkPlain = this.glassInk(stripBd, surfaceA);
    const inkNext = this.glassInk(stripBd, goldLightA);
    const inkEdge = this.glassInk(edgeBd, surfaceA);
    const zchips = c.zmanim.map((z) => {
      const selected = z.id === selId;
      const isNext = z.id === nextId;
      const past = zS[z.id] <= t && !isNext;
      const ink = selected ? th.bg : this.st(isNext ? inkNext : inkPlain);
      return {
        id: z.id,
        label: isNext ? 'הבא · ' + z.short : z.short,
        time: z.time,
        cls: z.id === markedId ? 'mk' : '',
        tcls: past ? '' : 'b',
        pressed: selected,
        ink,
        aria: z.name + ', ' + z.time,
        style: 'background: ' + (selected ? th.text : rgba(isNext ? goldLightA : surfaceA, 0.2)),
        pick: () => {
          if (selected) {
            this.setState({ zSel: null });
            this.goLive();
          } else {
            this.setState({ zSel: z.id, touched: true });
            this.scrub(zS[z.id]);
          }
        },
      };
    });

    const ticks = c.zmanim.map((z, i) => {
      const p = posOf(zl[i].S);
      const past = zS[z.id] <= t && !z.isNext;
      const sel = z.id === selId;
      return { x: p.x.toFixed(1), y: p.y.toFixed(1), r: sel ? 9 : 6, fill: past ? th.gold : '#FFFFFF', stroke: sel ? '#1D2240' : past || z.isNext ? th.gold : '#5B6584' };
    });
    const live = this.liveSec();
    const showGhost = c.isScrub && Math.abs(live - t) > 240;
    const gp = posOf(live);

    const stars = [[46, 40, 2.6], [92, 20, 2], [128, 62, 2], [224, 28, 3], [262, 60, 2], [302, 34, 2.6], [22, 94, 2], [330, 92, 2], [64, 122, 1.8], [288, 122, 1.8], [20, 18, 1.8], [172, 10, 1.8], [200, 52, 1.6], [334, 20, 1.8], [112, 34, 1.6], [48, 70, 1.6], [308, 76, 1.6], [14, 140, 1.6], [338, 140, 1.6]].map(([x, y, sz]) => ({ x, y, r: sz / 2 }));
    const clouds = [[20, 34, 84, 0.85], [196, 84, 120, 0.8], [268, 122, 70, 0.7]].map(([x, y, w, op]) => ({ tf: 'translate(' + x + ' ' + y + ') scale(' + (w / 120).toFixed(4) + ')', op }));

    const APP = { tefillin: ['הנחת תפילין', 'isTefillin', 'tefillin'], shma: ['קריאת שמע שחרית', 'isShema', 'krias_shma_shacharit'], shacharit: ['תפילת שחרית', 'isShacharit', 'shacharit'], mincha: ['תפילת מנחה', 'isMincha', 'mincha'], maariv: ['תפילת ערבית', 'isMaariv', 'maariv'], shmaNight: ['קריאת שמע על המיטה', 'isNight', 'krias_shma_al_hamita'] };
    const raw = this.items();
    const made = raw.map((x) => {
      const d = this.doneAt(x.id);
      const stt = d != null ? (d >= x.E ? 'late' : 'done') : t >= x.E ? 'missed' : t >= x.S ? 'active' : 'upcoming';
      const [name, flag, appId] = APP[x.id];
      const span = x.E - x.S;

      const statusText = stt === 'active' ? 'פתוח · נשארו ' + this.leftText(x.E - t) : stt === 'upcoming' ? 'נפתח ב-' + this.clock(x.S) : stt === 'done' ? 'בוצע ב-' + this.clock(d) : stt === 'late' ? 'באיחור · סומן ב-' + this.clock(d) : 'פוספס · נגמר ב-' + this.clock(x.E);
      const range = this.clock(x.S) + (x.E >= 86400 ? ' עד ' + this.clock(x.E) + ' למחרת' : ' עד ' + this.clock(x.E));
      const marking = s.marking === x.id;
      return {
        id: x.id,
        appId,
        name,
        st: stt,
        S: x.S,
        E: x.E,
        d,
        [flag]: true,
        statusText,
        range,
        startLabel: this.clock(x.S),
        endLabel: this.clock(x.E),
        startLine: this.clock(x.S) + ' - התחלה',
        endLine: this.clock(x.E) + ' - סוף',
        cardCls: 'st-' + stt,
        cls: marking ? 'marking' : '',
        tileCls: stt === 'active' ? 'accent' : '',
        nodeCheck: stt === 'done' || stt === 'late',
        isMissed: stt === 'missed',
        hasUndo: stt === 'done' || stt === 'late',
        ringOff: (157.08 * (1 - cl((x.E - t) / span))).toFixed(2),
        ringCls: x.E - t <= 2700 ? 'urgent' : '',
        leftNum: left.v,
        leftUnit: left.u,
        urgentCard: x.E - t <= 2700,
        showItem: stt === 'active' || stt === 'upcoming',
        isCheck: stt === 'done' || stt === 'late',
        isWarn: stt === 'missed',
        aria: name + ', ' + statusText,
        markLabel: 'עשיתי - סימון ' + name,
        undoLabel: 'ביטול סימון - ' + name,
        openLabel: 'נוסח - ' + name,
        pick: () => this.showToast({ text: 'פותח את ' + name + '…' }),
        mark: () => this.mark(x.id),
        undo: () => this.undo(x.id),
        open: () => this.showToast({ text: 'פותח את נוסח ' + name + '…' }),
      };
    });
    const mini = (e) => {
      const x = raw.find((r) => r.id === e.id);
      const f = e.st === 'upcoming' ? 0 : e.st !== 'active' ? 1 : Math.min(1, Math.max(0.03, (t - x.S) / (x.E - x.S)));
      return { ringOff: (163.36 * (1 - f)).toFixed(2), ringOp: f > 0 ? 1 : 0 };
    };
    const rank = { active: 0, upcoming: 1, done: 2, late: 2, missed: 3 };
    const sortKey = (e) => (e.st === 'done' || e.st === 'late' ? e.d : e.S);
    const ordered = made
      .map((e) => ({ ...e, ...mini(e) }))
      .sort((a, b) => rank[a.st] - rank[b.st] || sortKey(a) - sortKey(b) || (a.appId < b.appId ? -1 : a.appId > b.appId ? 1 : 0));

    const actives = made
      .filter((e) => e.st === 'active')
      .sort((a, b) => a.E - b.E)
      .map((e) => ({ ...e, cardCls: e.urgentCard ? 'urgent' : '' }));
    const activeN = actives.length;
    const doneCount = made.filter((e) => e.st === 'done' || e.st === 'late').length;
    const totalActive = made.length;
    const emptyLine = doneCount >= totalActive && totalActive > 0 ? 'כל המצוות של היום בוצעו' : 'אין מצווה פתוחה ברגע זה';
    const nextU = made.filter((e) => e.st === 'upcoming').sort((a, b) => a.S - b.S)[0] || null;
    const allMarked = doneCount > 0 && !made.some((e) => e.st === 'missed');
    const midCaption = c.isScrub ? 'תצוגה בלבד' : actives[0] ? actives[0].name + ' · עוד ' + this.leftText(actives[0].E - t) : nextU ? 'הבא: ' + nextU.name + ' ב-' + nextU.startLabel : allMarked ? 'הכול סומן להיום' : '';

    const msgs = this.appMessages(c, t).map((m) => ({
      ...m,
      [m.ic]: true,
      hasHref: Boolean(m.href),
      noHref: !m.href,
      act: () => this.showToast({ text: 'פותח את ' + m.title + '…' }),
    }));

    const look = s.look;
    const nowIdx = ordered.some((e) => e.st === 'active' || e.st === 'upcoming') ? (ordered.findIndex((e) => e.st !== 'active') === -1 ? ordered.length : ordered.findIndex((e) => e.st !== 'active')) : null;
    const nowLabel = (c.isScrub ? 'בתצוגה ' : 'עכשיו ') + c.nowT;
    const rail = [];
    ordered.forEach((e, i) => {
      if (nowIdx === i) rail.push({ isNow: true, isItem: false, label: nowLabel });
      rail.push({ ...e, isNow: false, isItem: true });
    });
    if (nowIdx === ordered.length) rail.push({ isNow: true, isItem: false, label: nowLabel });

    const gridRows = [];
    for (let i = 0; i < ordered.length; i += 2) {
      const a = { ...ordered[i], filled: true };
      const b = ordered[i + 1] ? { ...ordered[i + 1], filled: true } : { filled: false };
      gridRows.push({ cells: [a, b] });
    }

    const cnt = { done: doneCount, open: made.filter((e) => e.st === 'active' || e.st === 'upcoming').length, missed: made.filter((e) => e.st === 'missed').length };
    const tot = cnt.done + cnt.open + cnt.missed;
    const figRings = [
      { cls: 'd', r: 58, n: cnt.done },
      { cls: 'o', r: 46, n: cnt.open },
      { cls: 'm', r: 34, n: cnt.missed },
    ].map((h) => {
      const len = 2 * Math.PI * h.r;
      const f = tot ? h.n / tot : 0;
      return { cls: h.cls, r: h.r, len: len.toFixed(2), off: (len * (1 - f)).toFixed(2), op: h.n === 0 ? 0 : 1 };
    });
    const legend = [
      { cls: 'd', label: 'בוצעו', n: cnt.done },
      { cls: 'o', label: 'פתוחות', n: cnt.open },
      { cls: 'm', label: 'פוספסו', n: cnt.missed },
    ];

    const dayPath = 'M' + (CX + RX) + ' ' + CY + 'A' + RX + ' ' + RY + ' 0 0 0 ' + (CX - RX) + ' ' + CY;
    const nightPath = 'M' + (CX - NRX) + ' ' + CY + 'A' + NRX + ' ' + NRY + ' 0 0 0 ' + (CX + NRX) + ' ' + CY;
    const stageLeft = (390 - g.W * K) / 2;
    const stageStyle = 'left: ' + stageLeft.toFixed(2) + 'px; width: ' + px(g.W) + 'px; height: ' + px(g.H) + 'px';
    const moonD = 28 * K;
    const edgeX = ELLIPSE ? 8 : 8 * K;
    const grabR = 30 * K;
    const orbNight = night;

    return {
      ...c,
      skyStyle: ['--sk1:' + this.st(sk.top), '--sk2:' + this.st(sk.mid), '--sk3:' + this.st(sk.bot), '--ink:' + inkHex, '--inkchip:' + rgba(ik.opp, ik.alpha), '--edgebg:' + rgba(surfaceA, 0.2)].join(';'),
      landStyle: 'top: ' + (17 + 158 * K).toFixed(1) + 'px; background: linear-gradient(180deg, ' + rgba(gr.shadeTop, 0.55) + ', ' + rgba(gr.shadeBottom, 0.92) + ')',
      sceneStyle: 'height: ' + px(g.H) + 'px',
      stageStyle,
      sw: px(g.W),
      sh: px(g.H),
      vb: '0 0 ' + g.W.toFixed(2) + ' ' + g.H,
      gx1: CX + RX,
      gx2: CX - RX,
      decoTf: 'translate(' + ((g.W - 350) / 2).toFixed(2) + ' 0)',
      sunCore,
      sunEdge,
      sunOp: night ? 0 : 1,
      sunX: orb.x.toFixed(2),
      sunY: orb.y.toFixed(2),
      starsOp: (share * 0.6).toFixed(3),
      cloudOp: ((1 - share) * 0.9).toFixed(3),
      cloudC: this.st(sk.cloud),
      stars,
      clouds,
      dayPath,
      nightPath,
      dayLen: dayLen.toFixed(2),
      nightLen: nightLen.toFixed(2),
      dayDash: dayDash.toFixed(2),
      nightDash: nightDash.toFixed(2),
      dayProgOp: !night || fraction > 0 ? 1 : 0,
      nightProgOp: night ? 1 : 0,
      trackInk: inkHex,
      nightTrackInk: ELLIPSE ? '#F6E7BF' : inkHex,
      moonStyle: 'width: ' + moonD.toFixed(1) + 'px; height: ' + moonD.toFixed(1) + 'px; left: ' + ((orb.x - 14) * K).toFixed(1) + 'px; top: ' + ((orb.y - 14) * K).toFixed(1) + 'px; box-shadow: inset ' + (9 * K).toFixed(1) + 'px ' + (-4 * K).toFixed(1) + 'px 0 0 #F6E7BF; opacity: ' + (orbNight ? 1 : 0),
      hillsStyle: 'height: ' + px(216) + 'px',
      hillBackC: this.st(gr.back),
      hillFrontC: this.st(gr.front),
      ticks,
      ghostX: (gp.x - 5).toFixed(1),
      ghostY: (gp.y - 5).toFixed(1),
      ghostTf: 'rotate(45 ' + gp.x.toFixed(1) + ' ' + gp.y.toFixed(1) + ')',
      ghostOp: showGhost ? 1 : 0,
      inkHex,
      inkchipHex: this.st(ik.opp),
      plateTop: px(66),
      hintTop: px(172),
      hintCls: s.touched || c.isScrub ? 'gone' : '',
      hintText: night ? 'גררו את הירח' : 'גררו את השמש',
      edgeX: edgeX.toFixed(1),
      edgeTop: px(166),
      edgeInk: this.st(inkEdge),
      edgeStart: c.zmanim.find((z) => z.id === 'alot').time,
      edgeEnd: c.zmanim.find((z) => z.id === 'tzeit').time,
      grabStyle: 'width: ' + (grabR * 2).toFixed(1) + 'px; height: ' + (grabR * 2).toFixed(1) + 'px; left: ' + ((orb.x - 30) * K).toFixed(1) + 'px; top: ' + ((orb.y - 30) * K).toFixed(1) + 'px',
      sceneCls: (s.drag ? 'drag ' : '') + (c.isScrub ? 'scr ' : ''),
      liveMode: s.drag ? 'off' : 'polite',
      gDown: (e) => this.gDown(e),
      gMove: (e) => this.gMove(e),
      gUp: (e) => this.gUp(e),
      gKey: (e) => this.gKey(e),
      sliderMin: Math.round(A0),
      sliderMax: Math.round(E - 60),
      sliderNow: Math.round(t),
      sliderText: c.nowT + ', הבא: ' + c.nextZ.name + ' ' + c.nextZ.left,
      midCaption,
      zchips,
      dateLine: c.weekday + ' · ' + (t >= zS.shkia ? this.day().hebNightFull : this.day().hebFull) + ' · ' + c.city,
      openLabel: 'פתוח עכשיו (' + activeN + ')',
      hasActive: activeN > 0,
      noActive: activeN === 0,
      actives,
      emptyLine,
      hasNext: Boolean(nextU),
      nextCaption: nextU ? 'הבאה: ' + nextU.name + ' ב-' + nextU.startLabel : '',
      msgs,
      hasMsgs: msgs.length > 0,
      msgLabel: 'הודעות (' + msgs.length + ')',
      hasEntries: ordered.length > 0,
      lkRail: { pressed: look === 'rail', pick: () => this.setState({ look: 'rail' }) },
      lkCards: { pressed: look === 'cards', pick: () => this.setState({ look: 'cards' }) },
      lkRings: { pressed: look === 'rings', pick: () => this.setState({ look: 'rings' }) },
      isRail: look === 'rail',
      isCards: look === 'cards',
      isRings: look === 'rings',
      lkEnter: 'lk-' + this.flip('look', look),
      rail,
      gridRows,
      figRings,
      legend,
      doneCount: String(cnt.done),
      ofTotal: 'מתוך ' + tot,
      ringsAria: 'בוצעו ' + cnt.done + ', פתוחות ' + cnt.open + ', פוספסו ' + cnt.missed + ', מתוך ' + tot,
    };
  }
}
</script>
