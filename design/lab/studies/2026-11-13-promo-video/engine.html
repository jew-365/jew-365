<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>Promo Engine</title>
<style>
  @font-face { font-family: Rubik; font-weight: 400; src: url(fonts/Rubik_400Regular.ttf); }
  @font-face { font-family: Rubik; font-weight: 500; src: url(fonts/Rubik_500Medium.ttf); }
  @font-face { font-family: Rubik; font-weight: 600; src: url(fonts/Rubik_600SemiBold.ttf); }
  @font-face { font-family: Rubik; font-weight: 700; src: url(fonts/Rubik_700Bold.ttf); }
  @font-face { font-family: Rubik; font-weight: 800; src: url(fonts/Rubik_800ExtraBold.ttf); }
  :root { --bg: #F6F1E8; --surface: #FFFDF9; --text: #1D2240; --sub: #69645D; --gold: #F08A3C; --goldText: #A04A0C; }
  html, body { margin: 0; background: #000; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--bg);
    font-family: Rubik, 'Noto Color Emoji', sans-serif; color: var(--text); direction: rtl; }
  .scene { position: absolute; inset: 0; visibility: hidden; transform-origin: 50% 50%; }
  .scene > svg.bg, .scene > svg.fg { position: absolute; inset: 0; width: 1080px; height: 1920px; }
  .notif { position: absolute; width: 960px; left: 60px; top: 150px; box-sizing: border-box; padding: 32px 40px 26px;
    background: rgba(255, 253, 249, 0.97); border-radius: 44px; box-shadow: 0 24px 60px rgba(29, 34, 64, .3); z-index: 20; }
  .notif .app { display: flex; align-items: center; gap: 14px; font-size: 30px; color: var(--sub); font-weight: 500; }
  .notif .app img { width: 46px; height: 46px; border-radius: 12px; background: #fff; }
  .notif .title { margin-top: 12px; font-size: 46px; font-weight: 700; }
  .notif .line { margin-top: 6px; font-size: 40px; font-weight: 600; }
  .notif .line.orange { color: #B3560F; } .notif .line.red { color: #C0392B; } .notif .line.green { color: #2C7A55; }
  .notif .body { margin-top: 4px; font-size: 40px; }
  .notif .buttons { display: flex; gap: 70px; margin-top: 20px; font-size: 36px; font-weight: 600; color: var(--goldText); }
  .phone { position: absolute; background: #12162B; border-radius: 78px; padding: 18px; box-sizing: border-box;
    box-shadow: 0 50px 110px rgba(29, 34, 64, .35), 0 0 0 3px #2B3150 inset; }
  .phone .screen { position: relative; width: 100%; height: 100%; border-radius: 62px; overflow: hidden; background: var(--bg); }
  .phone .screen img { position: absolute; left: 0; top: 0; width: 100%; }
  .phone .island { position: absolute; top: 34px; left: 50%; width: 120px; height: 34px; margin-left: -60px; border-radius: 20px; background: #0B0E1C; z-index: 3; }
  .clock { position: absolute; top: 56px; right: 60px; padding: 10px 26px; border-radius: 999px; background: rgba(29,34,64,.82);
    color: #FFFDF9; font-size: 40px; font-weight: 700; font-variant-numeric: tabular-nums; z-index: 30; direction: ltr; }
  #sub { position: absolute; left: 60px; right: 60px; bottom: 250px; text-align: center; z-index: 50; }
  #sub .box { display: inline-block; padding: 20px 40px 24px; border-radius: 36px; background: rgba(29, 34, 64, .9);
    color: #FFFDF9; box-shadow: 0 18px 40px rgba(0,0,0,.18); max-width: 960px; }
  #sub .tag { display: block; font-size: 30px; font-weight: 700; color: #FFB774; margin-bottom: 4px; }
  #sub .txt { display: block; font-size: 44px; line-height: 1.32; font-weight: 600; }
  .chip { position: absolute; padding: 18px 34px; border-radius: 999px; background: var(--surface); color: var(--text);
    font-size: 42px; font-weight: 700; white-space: nowrap; box-shadow: 0 14px 34px rgba(160, 74, 12, .2); z-index: 25; }
  .badge { position: absolute; width: 120px; height: 120px; border-radius: 50%; background: var(--gold); color: #1D2240;
    display: grid; place-items: center; font-size: 56px; font-weight: 800; z-index: 26; }
  .ripple { position: absolute; width: 140px; height: 140px; margin: -70px 0 0 -70px; border-radius: 50%;
    border: 10px solid var(--gold); box-sizing: border-box; z-index: 22; }
  .bigtext { position: absolute; left: 0; right: 0; text-align: center; font-weight: 800; z-index: 24; }
</style>
</head>
<body>
<div id="stage"><div id="sub"><span class="box"><span class="tag"></span><span class="txt"></span></span></div></div>
<script src="characters.js"></script>
<script src="plan.js"></script>
<script>
// ---------- helpers ----------
const NS = 'http://www.w3.org/2000/svg';
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, p) => a + (b - a) * p;
const ease = (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2);
const easeOut = (p) => 1 - Math.pow(1 - p, 3);
const easeIn = (p) => p * p * p;
const back = (p) => { const c = 1.7; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); };
const seg = (t, a, b, f = ease) => f(clamp((t - a) / (b - a)));
const win = (t, a, b, fade = 0.3) => Math.min(seg(t, a, a + fade, easeOut), 1 - seg(t, b - fade, b, easeIn));
const lp = (A, B, p) => [lerp(A[0], B[0], p), lerp(A[1], B[1], p)];
const mixPose = (A, B, p) => A.map((pt, i) => lp(pt, B[i], p));
const KEY = 'dati';
const C = CHARACTERS[KEY];
const stage = document.getElementById('stage');
const el = (tag, cls, html, parent) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; (parent || stage).appendChild(e); return e; };
const $ = (id) => document.getElementById(id);

function notifHTML(n, compact) {
  const buttons = n.stage === 'plain' ? '' : '<div class="buttons"><span>פתח נוסח</span><span>עשיתי</span></div>';
  return `<div class="app"><img src="logo.svg" alt=""><span>יהודי 365 · ${n.clock ? n.clock : 'עכשיו'}</span></div>
    <div class="title">${n.title}</div>${n.line ? `<div class="line ${n.stage}">${n.line}</div>` : ''}
    <div class="body">${n.body}</div>${compact ? '' : buttons}`;
}
function phoneHTML(src, w, extra = '') {
  return `<div class="island"></div><div class="screen"><img src="screens/${src}.png" alt="">${extra}</div>`;
}

// ---------- poses (character coordinates) ----------
const P = {
  typeR: [[-212, 1060], [-286, 1290], [-150, 1372]], typeL: [[212, 1060], [286, 1290], [150, 1372]],
  reachR: [[-212, 1060], [-330, 1250], [-372, 1392]],
  holdR: [[-212, 1060], [-270, 1270], [-92, 1150]], holdL: [[212, 1060], [262, 1280], [70, 1168]],
  restR: [[-212, 1060], [-280, 1300], [-130, 1385]], restL: [[212, 1060], [280, 1300], [130, 1385]],
  sideR: [[-212, 1060], [-250, 1290], [-238, 1500]], sideL: [[212, 1060], [250, 1290], [238, 1500]],
  upR: [[-212, 1060], [-330, 860], [-300, 640]], upL: [[212, 1060], [330, 860], [300, 640]],
  pointL: [[212, 1060], [400, 1040], [580, 960]], waveL: [[212, 1060], [360, 900], [330, 700]],
  thumbL: [[212, 1060], [330, 1200], [250, 1020]], watchL: [[212, 1060], [300, 1240], [110, 1110]],
  flowersL: [[212, 1060], [270, 1270], [180, 1330]],
};

// A character instance: an SVG group with the figure, its props layer and a hands layer above them.
let charCount = 0;
function makeChar(svg, { shabbat = false } = {}) {
  const prefix = 'c' + charCount++;
  const g = document.createElementNS(NS, 'g');
  g.innerHTML = characterSVG(KEY, prefix, { shabbat }) + `<g id="${prefix}Prop"></g><g id="${prefix}Hands"></g>`;
  svg.appendChild(g);
  return { prefix, g, shabbat };
}
// state: { x, y, s (scale), R, L, legs: {lift}|null, face: {...}, head: {dx, dy, rot}, prop: svg string, handsFront }
function pose(ch, st) {
  const { prefix } = ch;
  ch.g.setAttribute('transform', `translate(${st.x} ${st.y}) scale(${st.s}) translate(0 ${-(st.anchor ?? 2290)})`);
  characterArm($(prefix + 'ArmR'), KEY, ...st.R, { shabbat: ch.shabbat });
  characterArm($(prefix + 'ArmL'), KEY, ...st.L, { shabbat: ch.shabbat });
  if (st.legs) characterLegs($(prefix + 'Legs'), KEY, { ...st.legs, shabbat: ch.shabbat });
  else $(prefix + 'Legs').innerHTML = '';
  characterFace(prefix, st.face || {});
  const h = st.head || {};
  $(prefix + 'Head').setAttribute('transform', `translate(${h.dx || 0} ${h.dy || 0}) rotate(${h.rot || 0} 0 900)`);
  $(prefix + 'Prop').innerHTML = st.prop || '';
  const skin = `fill="${C.skin}" stroke="${C.shade}" stroke-width="4"`;
  $(prefix + 'Hands').innerHTML = (st.handsFront || []).map((H) => `<circle cx="${H[0]}" cy="${H[1]}" r="38" ${skin}/>`).join('');
}
const BLINKS = [];
const blinkAt = (t) => { const c = (t + 0.7) % 3.7; return Math.max(0, 1 - Math.abs(c - 3.55) / 0.08); };

// props in character coordinates
const heldPhone = (H, lit = 0) => `<g transform="translate(${H[0] + 40} ${H[1] - 70}) rotate(-6)">
  <rect x="-78" y="-148" width="156" height="296" rx="30" fill="#12162B" stroke="#3A4166" stroke-width="5"/>
  <rect x="-54" y="-126" width="52" height="64" rx="15" fill="#2B3150"/><circle cx="-36" cy="-108" r="9" fill="#0B0E1C"/><circle cx="-18" cy="-82" r="9" fill="#0B0E1C"/>
  ${lit ? `<circle r="150" fill="#FFF3D6" opacity="${0.18 * lit}"/>` : ''}</g>`;
const buzzArcs = (x, y, k) => k <= 0 ? '' : [0, 1].map((i) => `<path d="M${x + 40 + i * 26},${y - 40 - i * 12} q20,40 0,80" fill="none" stroke="#F08A3C" stroke-width="10" stroke-linecap="round" opacity="${k}"/>
  <path d="M${x - 40 - i * 26},${y - 40 - i * 12} q-20,40 0,80" fill="none" stroke="#F08A3C" stroke-width="10" stroke-linecap="round" opacity="${k}"/>`).join('');
const bouquet = (H) => `<g transform="translate(${H[0]} ${H[1]})">
  <path d="M-10,-10 L-60,-210 M0,-10 L-10,-230 M10,-10 L50,-200 M0,-10 L30,-240" stroke="#4E8A5C" stroke-width="10" stroke-linecap="round"/>
  ${[[-60, -220, '#E85D75'], [-12, -244, '#FFD25A'], [52, -212, '#F08A3C'], [30, -256, '#E85D75'], [-36, -262, '#FFFFFF'], [8, -200, '#FFFFFF']].map(([x, y, c]) => `<circle cx="${x}" cy="${y}" r="26" fill="${c}"/><circle cx="${x}" cy="${y}" r="9" fill="#F7C548"/>`).join('')}
  <path d="M-40,-60 L40,-60 L20,40 L-20,40 Z" fill="#F3E3C3" stroke="#D9C49C" stroke-width="5"/></g>`;
const challahBag = (H) => `<g transform="translate(${H[0]} ${H[1]})"><path d="M-70,0 L70,0 L60,170 L-60,170 Z" fill="#E9D8B8" stroke="#C9B58E" stroke-width="5"/>
  <path d="M-40,0 C-40,-60 40,-60 40,0" fill="none" stroke="#C9B58E" stroke-width="10"/><ellipse cx="0" cy="10" rx="60" ry="26" fill="#D9963F"/><path d="M-40,8 q20,-18 40,0 q20,-18 40,0" stroke="#B57425" stroke-width="5" fill="none"/></g>`;
const wristwatch = (H) => `<g transform="translate(${H[0] + 22} ${H[1] + 34})"><rect x="-26" y="-14" width="52" height="28" rx="8" fill="#3A3F55"/><circle r="24" fill="#FFFDF9" stroke="#3A3F55" stroke-width="7"/><path d="M0,0 L0,-14 M0,0 L10,6" stroke="#1D2240" stroke-width="4" stroke-linecap="round"/></g>`;

// ---------- backgrounds ----------
const SKY = {
  dawn: ['#2C3566', '#7B6AA0', '#F2A65A'], morning: ['#9FD0F2', '#CFE6F5', '#FDEFD6'], noon: ['#8CC8F0', '#BFE0F5', '#F4F0E4'],
  sunset: ['#4B4C8C', '#E2876A', '#FFC27A'], golden: ['#7FB2E0', '#F5C98E', '#FFDDA0'], night: ['#121633', '#1F2550', '#3A3F75'],
};
function skyDefs(id, name) {
  const [a, b, c] = SKY[name];
  return `<linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${a}"/><stop offset=".55" stop-color="${b}"/><stop offset="1" stop-color="${c}"/></linearGradient>`;
}
function jerusalemStreet(id, sky) {
  const stone = sky === 'sunset' ? '#E9B98E' : sky === 'golden' ? '#F0CFA0' : '#EAD9B6';
  const stoneD = sky === 'sunset' ? '#C98F68' : '#CDB58C';
  const block = (x, y, w, h, flip) => {
    let rows = '';
    for (let yy = y + 40; yy < y + h; yy += 44) rows += `<line x1="${x}" y1="${yy}" x2="${x + w}" y2="${yy}" stroke="${stoneD}" stroke-width="3" opacity=".5"/>`;
    let wins = '';
    for (let yy = y + 90; yy < y + h - 120; yy += 210) for (let xx = x + 50; xx < x + w - 90; xx += 150)
      wins += `<path d="M${xx},${yy + 110} L${xx},${yy + 30} Q${xx + 40},${yy - 14} ${xx + 80},${yy + 30} L${xx + 80},${yy + 110} Z" fill="#5C6E8A" opacity=".75"/><rect x="${xx - 8}" y="${yy + 108}" width="96" height="12" fill="${stoneD}"/>`;
    return `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${stone}"/>${rows}${wins}`;
  };
  return `<defs>${skyDefs(id, sky)}</defs><rect width="1080" height="1920" fill="url(#${id})"/>
    ${sky === 'sunset' || sky === 'golden' ? `<circle cx="540" cy="760" r="120" fill="#FFE2A0" opacity=".8"/>` : `<circle cx="760" cy="300" r="70" fill="#FFF3C4" opacity=".9"/>`}
    <path d="M0,820 L120,800 L120,700 L260,690 L300,760 L420,740 L420,690 L560,700 L660,660 L760,700 L880,690 L1080,740 L1080,1000 L0,1000 Z" fill="${stoneD}" opacity=".55"/>
    ${block(-40, 360, 380, 1100)}${block(740, 300, 380, 1160)}
    <path d="M340,1000 L740,1000 L740,1460 L340,1460 Z" fill="${stone}" opacity=".7"/>
    <path d="M0,1460 L1080,1460 L1080,1920 L0,1920 Z" fill="#CBBFA8"/>
    <path d="M330,1460 L750,1460 L1080,1920 L0,1920 Z" fill="#BDB09A"/>
    ${[0, 1, 2, 3, 4, 5].map((i) => `<line x1="${330 - i * 64}" y1="${1460 + i * 90}" x2="${750 + i * 64}" y2="${1460 + i * 90}" stroke="#A99C86" stroke-width="3" opacity=".5"/>`).join('')}
    <g transform="translate(150 1460)"><rect x="-14" y="-430" width="28" height="430" fill="#6B4E37"/><circle cx="0" cy="-470" r="130" fill="#5E9C6B"/><circle cx="-80" cy="-410" r="90" fill="#6FB27C"/><circle cx="80" cy="-420" r="96" fill="#4E8A5C"/></g>
    <g transform="translate(930 1470)"><rect x="-8" y="-380" width="16" height="380" fill="#6B7180"/><rect x="-70" y="-420" width="140" height="70" rx="12" fill="#2F6D3A"/><text x="0" y="-372" text-anchor="middle" font-family="Rubik" font-weight="700" font-size="34" fill="#FFFFFF">תחנה</text></g>`;
}

// ---------- scenes ----------
const SCENES = {};

SCENES.bedroom = (root, beat) => {
  const svg = svgIn(root, 'bg');
  svg.innerHTML = `<defs>${skyDefs('bd' + beat.i, 'dawn')}</defs>
    <rect width="1080" height="1920" fill="#3E4677"/><rect width="1080" height="1920" fill="#F2A65A" opacity=".08"/>
    <g transform="translate(640 260)"><rect width="380" height="560" rx="24" fill="#2A3058"/><rect x="18" y="18" width="344" height="524" rx="10" fill="url(#bd${beat.i})"/>
      <circle cx="250" cy="120" r="30" fill="#FFF6DA" opacity=".7"/><rect x="182" y="18" width="16" height="524" fill="#2A3058"/></g>
    <rect x="160" y="960" width="760" height="560" rx="40" fill="#8A5A3B"/><rect x="190" y="990" width="700" height="500" rx="28" fill="#9E6B49"/>
    <rect x="250" y="1010" width="580" height="200" rx="90" fill="#F4F1EA"/><rect x="250" y="1010" width="580" height="200" rx="90" fill="none" stroke="#E2DCCF" stroke-width="6"/>`;
  const ch = makeChar(svg);
  const fg = svgIn(root, 'fg');
  fg.innerHTML = `<path d="M60,1420 C200,1350 880,1350 1020,1420 L1080,1920 L0,1920 Z" fill="#9FB8DE"/>
    ${[0, 1, 2, 3].map((i) => `<path d="M${40 + i * 10},${1500 + i * 110} C300,${1440 + i * 110} 780,${1440 + i * 110} ${1040 - i * 10},${1500 + i * 110}" stroke="#86A2CC" stroke-width="10" fill="none"/>`).join('')}
    <rect x="0" y="1300" width="230" height="620" fill="#7A4F35"/><rect x="0" y="1290" width="250" height="30" rx="8" fill="#8E5E40"/>
    <path d="M90,1290 L110,1150 L150,1150 L170,1290 Z" fill="#F3E3C3"/><rect x="118" y="1060" width="24" height="90" fill="#C9B58E"/>
    <g id="bdPhone${beat.i}"></g>`;
  return (lt, dur) => {
    const wake = seg(lt, 0.8, 1.2), stretch = win(lt, 1.3, 2.4, 0.35), reach = seg(lt, 2.4, 3.1);
    const R = reach > 0 ? mixPose(P.upR, P.holdR, reach) : mixPose(P.restR, P.upR, stretch);
    const L = reach > 0 ? mixPose(P.upL, P.holdL, reach) : mixPose(P.restL, P.upL, stretch);
    const held = reach > 0.5;
    pose(ch, {
      x: 540, y: 300, s: 0.9, anchor: 0, R, L,
      face: { closed: 1 - wake, blink: blinkAt(lt), open: stretch * 0.8, smile: held ? 0.6 : 0.3, gaze: held ? [0, 7] : [-6, 0], glow: held ? 0.1 : 0 },
      head: { rot: lerp(-8, 0, wake), dy: held ? 12 : 0 },
      prop: held ? heldPhone(P.holdR[2], 1) : '', handsFront: held ? [P.holdR[2], P.holdL[2]] : [],
    });
    const buzz = win(lt, 0.4, 2.0, 0.05);
    const shake = Math.sin(lt * 90) * 6 * buzz;
    $('bdPhone' + beat.i).innerHTML = held ? '' : `<g transform="translate(${140 + shake} 1270)"><circle r="140" fill="#FFF1D6" opacity="${0.35 * buzz}"/>
      <path d="M-70,-18 L70,-18 L84,18 L-84,18 Z" fill="#12162B"/><path d="M-62,-12 L62,-12 L74,12 L-74,12 Z" fill="${buzz > 0 ? '#FFF1D6' : '#2B3150'}"/></g>${buzzArcs(140, 1230, buzz)}`;
  };
};

function streetScene(root, beat, { flowers = false, gray = false, stopAt = 0.42 } = {}) {
  const svg = svgIn(root, 'bg');
  svg.innerHTML = jerusalemStreet('st' + beat.i, beat.sky || 'morning');
  const ch = makeChar(svg);
  if (gray) svg.style.filter = 'grayscale(0.85) contrast(0.95)';
  return (lt, dur) => {
    const stopT = dur * stopAt;
    const walkAmt = 1 - seg(lt, stopT - 0.3, stopT + 0.2);
    const phase = lt * 7.5;
    const w = walkPose(phase);
    const progress = Math.min(lt, stopT + 0.2) / dur;
    const raise = seg(lt, stopT + 0.25, stopT + 0.95);
    const baseR = flowers ? P.sideR : w.R.map((pt, i) => lp(P.sideR[i], pt, walkAmt));
    const baseL = flowers ? P.flowersL : w.L.map((pt, i) => lp(P.sideL[i], pt, walkAmt));
    const R = gray ? baseR : mixPose(baseR, P.holdR, raise);
    const L = flowers ? P.flowersL : mixPose(baseL, gray ? P.watchL : P.holdL, raise);
    const held = raise > 0.5 && !gray;
    const buzz = beat.notif ? win(lt, stopT - 0.4, stopT + 0.5, 0.05) : 0;
    const look = raise;
    let prop = held ? heldPhone(P.holdR[2], 1) : gray ? wristwatch(L[2]) : '';
    if (flowers) prop += bouquet(P.flowersL[2]);
    prop += buzzArcs(-150, 1440, buzz);
    pose(ch, {
      x: 540, y: lerp(1620, 1760, progress) + w.bob * walkAmt * 0.6, s: lerp(0.5, 0.6, progress), R, L,
      legs: { lift: w.lift.map((v) => v * walkAmt) },
      face: { blink: blinkAt(lt), gaze: gray ? [look * 8, look * 6] : [0, look * 7], smile: gray ? lerp(0.3, -0.2, seg(lt, dur * 0.7, dur * 0.85)) : 0.45 + 0.4 * seg(lt, stopT + 1.4, stopT + 1.9), brow: gray ? seg(lt, dur * 0.7, dur * 0.85) : buzz * 0.6 },
      head: { dy: look * 12, rot: Math.sin(phase) * 1.5 * walkAmt },
      prop, handsFront: held ? [P.holdR[2], ...(flowers ? [] : [P.holdL[2]])] : [],
    });
  };
}
SCENES.street = (root, beat) => streetScene(root, beat);
SCENES.nag = (root, beat) => streetScene(root, { ...beat, notif: beat.notifs[0] }, { stopAt: 0.12 });

SCENES.office = (root, beat) => {
  const svg = svgIn(root, 'bg');
  svg.innerHTML = `<defs>${skyDefs('of' + beat.i, 'noon')}</defs><rect width="1080" height="1920" fill="#F3E8D6"/>
    <g transform="translate(70 230)"><rect width="430" height="600" rx="26" fill="#FFFDF9"/><rect x="22" y="22" width="386" height="556" rx="12" fill="url(#of${beat.i})"/>
      <circle cx="300" cy="150" r="58" fill="#FFD574"/><path d="M22,470 L70,440 L70,400 L120,400 L120,430 L170,410 L210,430 L210,380 L250,360 L290,380 L290,420 L340,410 L408,440 L408,578 L22,578 Z" fill="#E7D3AE"/>
      <rect x="205" y="22" width="18" height="556" fill="#FFFDF9"/></g>
    <g transform="translate(860 1060)"><path d="M-60,180 L-46,90 L46,90 L60,180 Z" fill="#C86E3A"/><path d="M0,95 C-60,40 -110,-10 -90,-90 C-40,-60 -10,0 0,95 Z" fill="#5E9C6B"/><path d="M0,95 C40,20 80,-60 40,-150 C0,-90 -10,0 0,95 Z" fill="#6FB27C"/></g>`;
  const ch = makeChar(svg);
  const fg = svgIn(root, 'fg');
  fg.innerHTML = `<rect x="0" y="1370" width="1080" height="550" fill="#C98F5B"/><rect x="0" y="1356" width="1080" height="30" fill="#DDA571"/>

// The prayer compass, drawn as the app's sonar radar: the Kotel 65° from north, 2.2 km away (the app's own
// figures for the seed's place in Jerusalem).
function radar(root, i) {
  const wrap = el('div', '', `<svg viewBox="0 0 900 900" width="900" height="900"><circle cx="450" cy="450" r="430" fill="#14193A"/>
    ${[110, 220, 330, 420].map((r) => `<circle cx="450" cy="450" r="${r}" fill="none" stroke="#2C3A6E" stroke-width="4"/>`).join('')}
    <g id="rdSweep${i}"><path d="M450,450 L450,30 A420,420 0 0 1 760,170 Z" fill="url(#rdg${i})"/></g>
    <defs><linearGradient id="rdg${i}" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2FD08A" stop-opacity="0"/><stop offset="1" stop-color="#2FD08A" stop-opacity=".45"/></linearGradient></defs>
    <text x="450" y="80" text-anchor="middle" font-family="Rubik" font-weight="700" font-size="44" fill="#9AA6D6">צ</text>
    <g id="rdDot${i}"><circle r="34" fill="#F08A3C"/><circle r="60" fill="#F08A3C" opacity=".25"/></g>
    <g id="rdArrow${i}"><path d="M450,450 L450,140" stroke="#FFFDF9" stroke-width="14" stroke-linecap="round"/><path d="M420,170 L450,120 L480,170 Z" fill="#FFFDF9"/></g>
    <circle cx="450" cy="450" r="18" fill="#FFFDF9"/></svg>
    <div style="margin-top:26px;text-align:center;font-size:44px;font-weight:700;color:#FFFDF9" id="rdText${i}"></div>
    <div style="text-align:center;font-size:36px;color:#B9C2E6">2.2 ק״מ עד הכותל · 65° מהצפון</div>`, root);
  wrap.style.cssText = 'position:absolute;left:90px;top:330px;width:900px;padding:40px 0 50px;border-radius:60px;background:#1D2240;box-shadow:0 40px 90px rgba(0,0,0,.35);z-index:21;opacity:0';
  return (t) => {
    const show = seg(t, 0, 0.45, back);
    wrap.style.opacity = clamp(show * 2);
    wrap.style.transform = `translateY(${lerp(500, 0, show)}px) scale(${lerp(0.85, 1, show)})`;
    const turn = seg(t, 0.4, 2.2);
    const heading = lerp(-50, 65, turn);
    $('rdSweep' + i).setAttribute('transform', `rotate(${t * 140} 450 450)`);
    const rel = (65 - heading) * Math.PI / 180;
    $('rdDot' + i).setAttribute('transform', `translate(${450 + Math.sin(rel) * 330} ${450 - Math.cos(rel) * 330})`);
    const facing = turn > 0.97;
    $('rdDot' + i).querySelector('circle').setAttribute('fill', facing ? '#2FD08A' : '#F08A3C');
    $('rdText' + i).textContent = facing ? 'פונה לכותל ✓' : `סובב ${Math.round(65 - heading)}° ימינה`;
    $('rdText' + i).style.color = facing ? '#2FD08A' : '#FFFDF9';
  };
}

    const step = dur / 3;
    ps.forEach(([p, c], k) => {
      const a = seg(lt, k * step, k * step + 0.45, back), b = k < 2 ? seg(lt, (k + 1) * step, (k + 1) * step + 0.35) : 0;
      p.style.opacity = clamp(a * 2) * (1 - b); p.style.transform = `translateX(${lerp(-700, 0, a) + 700 * b}px) rotate(${lerp(-10, 0, a)}deg)`;
      c.style.opacity = clamp(a * 2) * (1 - b); c.style.transform = `translateX(-50%) scale(${a})`;
    });
  };
};
SCENES.streak = (root, beat) => {
  featureBg(root);
  const svg = svgIn(root, 'fg');
  svg.innerHTML = `<circle cx="540" cy="820" r="300" fill="none" stroke="#EADFCB" stroke-width="54"/><circle id="stRing" cx="540" cy="820" r="300" fill="none" stroke="#F08A3C" stroke-width="54" stroke-linecap="round" transform="rotate(-90 540 820)" stroke-dasharray="1885" stroke-dashoffset="1885"/>
    <text id="stNum" x="540" y="860" text-anchor="middle" font-family="Rubik" font-weight="800" font-size="200" fill="#1D2240">1</text>
    <text x="540" y="960" text-anchor="middle" font-family="Rubik" font-weight="700" font-size="60" fill="#1D2240">ימים ברצף</text>
    <text x="540" y="1230" text-anchor="middle" font-family="Rubik" font-weight="600" font-size="48" fill="#A04A0C">עוד 15 ימים ליעד 30</text>`;
  return (lt, dur) => {
    const p = seg(lt, 0.1, dur - 0.8, easeOut), n = Math.max(1, Math.round(p * 15));
    svg.querySelector('#stNum').textContent = n;
    svg.querySelector('#stRing').setAttribute('stroke-dashoffset', 1885 * (1 - n / 30));
  };
};

SCENES.end = (root) => {
  const svg = svgIn(root, 'bg');
  svg.innerHTML = `<defs><radialGradient id="eg" cx=".5" cy=".36" r=".7"><stop offset="0" stop-color="#FFFDF9"/><stop offset="1" stop-color="#F3E6D2"/></radialGradient></defs><rect width="1080" height="1920" fill="url(#eg)"/>`;
  const logo = el('img', '', null, root); logo.src = 'logo.svg'; logo.style.cssText = 'position:absolute;left:340px;top:380px;width:400px;height:400px';
  const t1 = el('div', 'bigtext', 'יהודי 365', root); t1.style.cssText += ';top:880px;font-size:150px';
  const t2 = el('div', 'bigtext', 'כל מצווה – בזמנה', root); t2.style.cssText += ';top:1080px;font-size:76px;color:#A04A0C;font-weight:700';
  const t3 = el('div', 'bigtext', 'בלי חשבון · הכול נשמר אצלך בטלפון', root); t3.style.cssText += ';top:1200px;font-size:40px;color:#69645D;font-weight:500';
  const t4 = el('div', 'bigtext', '<span style="display:inline-block;padding:26px 56px;border-radius:999px;background:#1D2240;color:#FFFDF9;font-size:48px">זמין ב־Google Play</span>', root); t4.style.cssText += ';top:1320px';
  return (lt) => {
    const a = seg(lt, 0.1, 0.8, back); logo.style.transform = `scale(${lerp(0.3, 1, a)}) rotate(${lerp(-20, 0, a)}deg)`; logo.style.opacity = clamp(a * 2);
    [t1, t2, t3, t4].forEach((t, k) => { const p = seg(lt, 0.6 + k * 0.35, 1.1 + k * 0.35, easeOut); t.style.opacity = p; t.style.transform = `translateY(${lerp(40, 0, p)}px)`; });
  };
};

function svgIn(root, cls) {
  const s = document.createElementNS(NS, 'svg'); s.setAttribute('viewBox', '0 0 1080 1920'); s.setAttribute('class', cls); root.appendChild(s); return s;
}

// ---------- build the plan ----------
const beats = PLAN.beats.map((beat, i) => {
  const root = el('div', 'scene');
  const b = { ...beat, i };
  const draw = SCENES[beat.scene](root, b);
  let notif = null;
  const list = beat.notifs || (beat.notif && !['feature'].includes(beat.scene) ? [{ ...beat.notif, at: beat.scene === 'street' ? b.dur * 0.42 - 0.2 : beat.scene === 'friday' ? b.dur * 0.2 - 0.2 : 0.7 }] : []);
  const notifs = list.map((n) => { const e = el('div', 'notif', notifHTML(n), root); e.style.zIndex = 20; return { n, e }; });
  const clock = beat.time && !['beforeMiss'].includes(beat.scene) ? el('div', 'clock', beat.time, root) : null;
  return { ...b, root, draw, notifs, clock };
});
const presenterBeats = beats.filter((b) => b.scene.startsWith('feature'));

function render(t) {
  for (const b of beats) {
    const lt = t - b.start;
    const visible = lt > -0.001 && lt < b.dur + 0.4;
    b.root.style.visibility = visible ? 'visible' : 'hidden';
    if (!visible) continue;
    const fadeIn = b.i === 0 ? 1 : seg(lt, 0, 0.35, easeOut);
    b.root.style.opacity = fadeIn;
    b.root.style.zIndex = 1 + b.i;
    b.root.style.transform = `scale(${lerp(1.04, 1, fadeIn)})`;
    b.draw(lt, b.dur);
    b.notifs.forEach(({ n, e }, k) => {
      const inn = seg(lt, n.at, n.at + 0.5, back);
      const stack = b.notifs.length > 1 && k === 0 ? seg(lt, b.notifs[1].n.at, b.notifs[1].n.at + 0.4) : 0;
      e.style.transform = `translateY(${lerp(-520, 0, inn) + 400 * stack}px) scale(${1 - 0.1 * stack})`;
      if (!b.compass) e.style.opacity = 1 - 0.3 * stack;
      if (b.clock && n.clock) b.clock.textContent = lt > n.at ? n.clock : b.time;
    });
  }
  // the presenter of the rapid variant
  if (presenterBeats.length) {
    const pr = presenterLayer();
    const cur = presenterBeats.find((b) => t >= b.start && t < b.start + b.dur);
    const first = presenterBeats[0], last = presenterBeats[presenterBeats.length - 1];
    const on = seg(t, first.start, first.start + 0.5) * (1 - seg(t, last.start + last.dur - 0.2, last.start + last.dur + 0.3));
    pr.layer.style.visibility = on > 0 ? 'visible' : 'hidden';
    pr.layer.style.opacity = on;
    if (cur || on > 0) {
      const b = cur || last, lt = t - b.start;
      const gesture = b.n % 3 === 0 ? P.thumbL : P.pointL;
      const g = seg(lt, 0.15, 0.5, back);
      const L = mixPose(P.sideL, gesture, g);
      pose(pr.ch, { x: 230, y: 1840, s: 0.52, R: P.sideR, L, legs: { lift: [0, 0] },
        face: { blink: blinkAt(t), smile: 0.75 + 0.2 * Math.sin(t * 2), gaze: [6, -2], open: 0.35 * Math.max(0, Math.sin(t * 11)) },
        head: { rot: 3 * Math.sin(t * 1.4) } });
    }
  }
  // subtitles
  const sub = document.getElementById('sub');
  const cur = PLAN.beats.find((b) => b.vo && t >= b.voStart && t <= b.voStart + b.voLen + 0.25);
  if (cur && cur.scene !== 'end') {
    sub.style.opacity = win(t, cur.voStart, cur.voStart + cur.voLen + 0.25, 0.2);
    sub.querySelector('.txt').textContent = cur.vo.replace('יהודי שלוש מאות שישים וחמש', 'יהודי 365');
    const tag = sub.querySelector('.tag'); tag.textContent = cur.caption || ''; tag.style.display = cur.caption ? 'block' : 'none';
  } else sub.style.opacity = 0;
}
window.render = render;
window.DURATION = PLAN.duration;
render(0);
</script>
