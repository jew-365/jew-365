  }

  boardMount() {
    this.dead = false;
    this.vt = null;
    this.vtDay = null;
    this.easing = false;
    this.glide = null;
    this.drag = null;
    this.lastTs = 0;
    this.reduce = typeof matchMedia === 'function' && matchMedia('(prefers-reduced-motion: reduce)').matches;
    const step = (ts) => {
      if (this.dead) return;
      this.raf = requestAnimationFrame(step);
      const dt = this.lastTs ? Math.min(0.05, (ts - this.lastTs) / 1000) : 0.016;
      this.lastTs = ts;
      this.frame(dt);
    };
    this.raf = requestAnimationFrame(step);
  }

  boardUnmount() {
    this.dead = true;
    cancelAnimationFrame(this.raf);
  }

  frame(dt) {
    const d = this.drag;
    if (d && d.moved && d.pend != null) {
      this.scrub(d.pend);
      d.pend = null;
    } else if (this.glide) {
      const g = this.glide;
      g.vel *= Math.exp(-dt * 3.2);
      const lo = this.dayStart();
      const hi = this.dayEnd() - 60;
      g.sec = Math.max(lo, Math.min(hi, g.sec + g.vel * dt));
      this.scrub(g.sec);
      if (Math.abs(g.vel) < 90 || g.sec <= lo || g.sec >= hi) this.glide = null;
    }
    const target = this.now();
    const key = this.dayKey();
    if (this.vt == null || this.vtDay !== key) {
      this.vt = target;
      this.vtDay = key;
      this.easing = false;
      this.forceUpdate();
      return;
    }
    const diff = target - this.vt;
    if (this.reduce) {
      this.vt = target;
      if (Math.abs(diff) > 0.5) this.forceUpdate();
      return;
    }
    if (!this.easing && Math.abs(diff) <= 1.5) {
      this.vt = target;
      return;
    }
    this.easing = true;
    if (Math.abs(diff) < 0.4) {
      this.vt = target;
      this.easing = false;
    } else {
      this.vt += diff * (1 - Math.exp(-dt * 8));
    }
    this.forceUpdate();
  }

  sceneAngle(e) {
    const r = e.currentTarget.getBoundingClientRect();
    const x = ((e.clientX - r.left) * 390) / r.width - 195;
    const y = ((e.clientY - r.top) * 396) / r.height - 216;
    return { a: Math.atan2(y / 0.7, x), r: Math.hypot(x, y) };
  }

  hintOff() {
    if (!this.state.hinted) this.setState({ hinted: true });
  }

  dragDown(e) {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    const g = this.glide;
    this.glide = null;
    const p = this.sceneAngle(e);
    this.drag = { id: e.pointerId, x0: e.clientX, y0: e.clientY, moved: false, a: p.r > 18 ? p.a : null, sec: g ? g.sec : this.now(), lastT: performance.now(), vel: 0, pend: null, el: e.currentTarget };
  }

  dragMove(e) {
    const d = this.drag;
    if (!d || d.id !== e.pointerId) return;
    if (e.pointerType === 'mouse' && e.buttons === 0) {
      this.dragUp(e);
      return;
    }
    if (!d.moved) {
      if (Math.hypot(e.clientX - d.x0, e.clientY - d.y0) < 6) return;
      d.moved = true;
      try {
        d.el.setPointerCapture(e.pointerId);
      } catch (err) {}
      this.setState({ dragging: true, hinted: true });
    }
    const p = this.sceneAngle(e);
    if (p.r < 18) return;
    const t = performance.now();
    if (d.a != null) {
      let da = p.a - d.a;
      if (da > Math.PI) da -= 2 * Math.PI;
      else if (da < -Math.PI) da += 2 * Math.PI;
      const span = this.dayEnd() - this.dayStart();
      const ds = (da / (2 * Math.PI)) * span;
      d.sec = Math.max(this.dayStart(), Math.min(this.dayEnd() - 60, d.sec + ds));
      d.pend = d.sec;
      d.vel = d.vel * 0.6 + (ds / Math.max(0.008, (t - d.lastT) / 1000)) * 0.4;
    }
    d.a = p.a;
    d.lastT = t;
  }

  dragUp(e) {
    const d = this.drag;
    if (!d || d.id !== e.pointerId) return;
    this.drag = null;
    try {
      d.el.releasePointerCapture(e.pointerId);
    } catch (err) {}
    if (d.moved) {
      if (d.pend != null) this.scrub(d.pend);
      this.setState({ dragging: false });
      if (performance.now() - d.lastT < 90 && Math.abs(d.vel) > 120) this.glide = { sec: d.sec, vel: Math.max(-9000, Math.min(9000, d.vel)) };
    } else if (e.type === 'pointerup' && !(e.target && e.target.closest && e.target.closest('button')) && this.state.sel) {
      this.setState({ sel: null });
    }
  }

  keyScrub(e) {
    const k = e.key;
    const lo = this.dayStart();
    const hi = this.dayEnd() - 60;
    let to = null;
    if (k === 'ArrowLeft' || k === 'ArrowUp') to = this.now() + 300;
    else if (k === 'ArrowRight' || k === 'ArrowDown') to = this.now() - 300;
    else if (k === 'PageUp') to = this.now() + 3600;
    else if (k === 'PageDown') to = this.now() - 3600;
    else if (k === 'Home') to = lo;
    else if (k === 'End') to = hi;
    else if (k === 'Escape' && this.state.sel) {
      this.setState({ sel: null });
      e.preventDefault();
      return;
    }
    if (to == null) return;
    e.preventDefault();
    this.glide = null;
    this.hintOff();
    this.scrub(to);
  }

  rnd(seed) {
    let s = seed;
    return () => {
      s = (s + 0x6d2b79f5) | 0;
      let t = Math.imul(s ^ (s >>> 15), 1 | s);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  starBg(seed, n, rMin, rMax, alpha, cols) {
    const r = this.rnd(seed);
    const out = [];
    for (let i = 0; i < n; i++) {
      const x = (r() * 100).toFixed(1);
      const y = (r() * 100).toFixed(1);
      const s = (rMin + r() * (rMax - rMin)).toFixed(2);
      const a = (alpha * (0.55 + r() * 0.45)).toFixed(2);
      const col = cols[Math.floor(r() * cols.length)];
      out.push('radial-gradient(' + s + 'px ' + s + 'px at ' + x + '% ' + y + '%, rgba(' + col + ',' + a + ') 50%, transparent 51%)');
    }
    return out.join(', ');
  }

  renderVals() {
    const c = this.coreVals();
    const st = this.state;
    const tNow = this.now();
    const vt = this.vt == null ? tNow : this.vt;
    const f1 = (v) => v.toFixed(1);
    const pad = (n) => String(n).padStart(2, '0');
    const cl = (v) => Math.max(0, Math.min(1, v));
    const D2R = Math.PI / 180;
    const CX = 195;
    const CY = 216;
    const K = 0.7;
    const RO = 185;
    const lo = c.dayStartSec;
    const hi = c.dayEndSec;
    const span = hi - lo;
    const alpha = (s) => (2 * Math.PI * (s - lo)) / span;
    const th0 = 1.5 * Math.PI - (2 * Math.PI * (86400 - lo)) / span;
    const P = (rx, th) => ({ x: CX + rx * Math.cos(th), y: CY + K * rx * Math.sin(th) });
    const arc = (rx, a, b) => {
      const A = P(rx, a);
      const B = P(rx, Math.max(b, a + 0.002));
      return 'M' + f1(A.x) + ' ' + f1(A.y) + 'A' + f1(rx) + ' ' + f1(K * rx) + ' 0 ' + (b - a > Math.PI ? 1 : 0) + ' 1 ' + f1(B.x) + ' ' + f1(B.y);
    };

    if (!this._stars) {
      this._stars = {
        dust: this.starBg(7, 16, 7, 15, 0.1, ['150,170,255', '255,190,150']),
        s1: this.starBg(11, 56, 0.6, 1.0, 0.85, ['255,255,255', '200,214,255']),
        s2: this.starBg(23, 26, 1.0, 1.5, 0.95, ['255,255,255', '190,206,255']),
        s3: this.starBg(41, 16, 1.2, 1.9, 0.95, ['255,226,190', '255,255,255']),
      };
    }
    if (this.sparkD == null) this.sparkD = -(c.nowSec % 60);

    const its = this.items().slice().sort((a, b) => a.S - b.S || a.E - b.E);
    const itBy = Object.fromEntries(its.map((x) => [x.id, x]));
    const tlBy = Object.fromEntries(c.timeline.map((x) => [x.id, x]));
    const zl = this.zmanimList();
    const zBy = Object.fromEntries(zl.map((z) => [z.id, z]));
    const n = its.length;
    const SPAN = 300 * D2R;
    const psi = alpha(vt);
    const GRAD = { upcoming: 'rgW', active: 'rgA', done: 'rgG', missed: 'rgR' };

    const rings = [];
    const tracks = [];
    const lits = [];
    const trails = [];
    const ticks = [];
    const planets = [];
    its.forEach((x, i) => {
      const rx = n > 1 ? 108 + (i * 64) / (n - 1) : 140;
      const tl = tlBy[x.id];
      const s = tl.status;
      const p = cl((vt - x.S) / (x.E - x.S));
      const a0 = (-60 + 67 * i) * D2R + psi;
      const a1 = a0 + SPAN;
      const ap = a0 + p * SPAN;
      const cls = 's-' + s;
      rings.push({ rx: f1(rx), ry: f1(K * rx), grad: GRAD[s], cls, delay: (0.1 + i * 0.12).toFixed(2) });
      tracks.push({ d: arc(rx, a0, a1), cls });
      if (s === 'missed') lits.push({ d: arc(rx, a0, a1), cls });
      else if ((s === 'active' || s === 'done') && p > 0.004) lits.push({ d: arc(rx, a0, ap), cls });
      if (s === 'done') {
        for (let k = 0; k < 4; k++) {
          const hiA = ap - k * 10 * D2R;
          const loA = Math.max(a0, ap - (k + 1) * 10 * D2R);
          if (hiA - loA > 0.004) trails.push({ d: arc(rx, loA, hiA), op: [0.75, 0.5, 0.3, 0.15][k], w: [5.4, 4.6, 3.8, 3][k] });
        }
      }
      const A0 = P(rx, a0);
      const A1 = P(rx, a1);
      ticks.push({ x: f1(A0.x), y: f1(A0.y), r: 2.7, cls: 'tk0 ' + cls });
      ticks.push({ x: f1(A1.x), y: f1(A1.y), r: 2.5, cls: 'tk1 ' + cls });
      const pt = P(rx, ap);
      const sn = Math.sin(ap);
      const foc = (st.sel && st.sel === x.id) || (!st.sel && c.hasHero && c.hero.id === x.id);
      planets.push({
        ...tl,
        id: x.id,
        x: f1(pt.x),
        y: f1(pt.y),
        z: sn < 0 ? 2 + Math.round((sn + 1) * 2) : 9 + Math.round(sn * 3),
        depth: (1 + 0.17 * sn).toFixed(3),
        op: (0.8 + 0.2 * ((sn + 1) / 2)).toFixed(2),
        delay: (0.25 + i * 0.1).toFixed(2),
        cls: cls + (foc ? ' foc' : '') + (tl.isMarking ? ' marking' : ''),
        popCls: 'p' + this.flip('pl-' + x.id, s),
        pressed: st.sel === x.id,
        label: x.name + ' · ' + tl.statusText + ' · ' + tl.startT + ' עד ' + tl.endT + ' · הצגה במוקד',
        pick: () => this.setState((q) => ({ sel: q.sel === x.id ? null : x.id })),
      });
    });

    const HUE = { dawn: '#A9BEFF', rise: '#FFD08A', day: '#FFF1C2', set: '#FF9E6B', night: '#BBA6FF' };
    const moons = c.zmanim.map((z) => {
      const th = th0 + alpha(zBy[z.id].S);
      const pt = P(RO, th);
      const kind = z.isDawn ? 'dawn' : z.isRise ? 'rise' : z.isDay ? 'day' : z.isSet ? 'set' : 'night';
      return { x: f1(pt.x), y: f1(pt.y), r: (3.9 * (1 + 0.16 * Math.sin(th)) * (z.isNext ? 1.4 : 1)).toFixed(2), cls: z.isNext ? 'next' : z.past ? 'past' : 'fut', isNext: z.isNext, fill: HUE[kind] };
    });
    const thB = th0 + alpha(vt);
    const bp = P(RO, thB);
    const inward = Math.hypot(CX - bp.x, CY - bp.y) || 1;
    const bt = { x: f1(bp.x + ((CX - bp.x) / inward) * 30), y: f1(bp.y + ((CY - bp.y) / inward) * 30) };
    const outerArc = alpha(vt) > 0.01 ? arc(RO, th0, thB) : '';

    const sel = st.sel && tlBy[st.sel] ? tlBy[st.sel] : null;
    const lensTl = sel || (c.hasHero ? tlBy[c.hero.id] : null);
    let lens = { has: false, none: true };
    let lensKind = 'none';
    if (lensTl) {
      const x = itBy[lensTl.id];
      const s = lensTl.status;
      const a = c.active.find((q) => q.id === x.id);
      const d = c.done.find((q) => q.id === x.id);
      lens = { has: true, none: false, short: x.short, btn: s !== 'upcoming' };
      lensKind = s === 'active' && a && a.urgent ? 'urgent' : s;
      if (s === 'active') {
        Object.assign(lens, { line: 'נשארו ' + a.left, lineCls: a.urgent ? 'u-bad' : 'u-gold', btnLabel: x.cta, btnCls: 'primary', btnAria: lensTl.markLabel, btnClick: lensTl.mark, icCheck: true, icUndo: false });
      } else if (s === 'done') {
        Object.assign(lens, { line: 'בוצע ב-' + d.at + (d.late ? ' · באיחור' : ''), lineCls: 'u-ok', btnLabel: 'ביטול סימון', btnCls: 'ghost', btnAria: d.undoLabel, btnClick: d.undo, icCheck: false, icUndo: true });
      } else if (s === 'missed') {
        Object.assign(lens, { line: 'הזמן עבר ב-' + lensTl.endT, lineCls: 'u-bad', btnLabel: 'בכל זאת עשיתי', btnCls: 'warn', btnAria: 'בכל זאת עשיתי — סימון ' + x.name, btnClick: lensTl.mark, icCheck: true, icUndo: false });
      } else {
        Object.assign(lens, { line: 'נפתח בעוד ' + this.left(x.S - tNow), lineCls: 'u-ice', btnLabel: '', btnCls: '', btnAria: '', btnClick: () => {}, icCheck: false, icUndo: false });
      }
    }
    const lensLive = lensTl ? itBy[lensTl.id].name + ': ' + lensTl.statusShort : c.activeEmptyTitle;

    const nzObj = c.zmanim.find((z) => z.isNext) || { isDay: false, isDawn: false, isRise: false, isSet: false, isNight: true };
    const zrows = c.zmanim.map((z) => ({
      ...z,
      go: () => {
        this.glide = null;
        this.hintOff();
        this.scrub(zBy[z.id].S);
        this.jump('orbTop');
      },
      goLabel: 'מעבר אל ' + z.name + ' ב-' + z.time,
    }));
    const rticks = c.zmanim.map((z) => ({ left: 'calc(12px + (100% - 24px) * ' + (1 - cl((zBy[z.id].S - lo) / (hi - 60 - lo))).toFixed(4) + ')' }));

    const msgNext = c.messages.find((m) => m.id === 'next') || { act: () => {} };
    const msgRest = c.messages.filter((m) => m.id !== 'next').map((m, i) => ({ ...m, delay: (i * 0.05).toFixed(2), body: m.body.replace(/(\d)–(\d)/g, '$1⁠–⁠$2') }));
    const nowRows = c.active.map((a, i) => ({ ...a, delay: (i * 0.06).toFixed(2), leftAria: 'נשארו ' + a.left }));
    const missedRows = c.missed.map((m) => ({ ...m }));
    const vNow = Math.round(tNow);

    return {
      ...c,
      sceneCls: (c.isNight ? 'night ' : '') + (c.isScrub ? 'scrub ' : '') + (st.dragging ? 'dragging' : ''),
      starRot: f1(psi / D2R * 0.25),
      stars1: this._stars.s1,
      stars2: this._stars.s2,
      stars3: this._stars.s3,
      starsDust: this._stars.dust,
      bead: { x: f1(bp.x), y: f1(bp.y) },
      btime: bt,
      outerArc,
      rings,
      tracks,
      lits,
      trails,
      ticks,
      moons,
      planets,
      sparkDelay: this.sparkD.toFixed(2),
      lens,
      lensCls: 'l-' + lensKind + (lensTl && lensTl.isMarking ? ' marking' : ''),
      lensAnim: 'cf-' + this.flip('lens', lensTl ? lensTl.id + ':' + lensTl.status : 'none'),
      lensAria: 'במרכז: השעה ' + c.nowT + (lensTl ? ', ' + itBy[lensTl.id].name + ', ' + lensTl.statusShort : ''),
      lensLive,
      showSec: !c.isScrub,
      secT: pad(Math.floor(c.nowSec) % 60),
      nzObj,
      streakLabel: c.streak + ' ימים ברצף',
      vMin: Math.round(lo),
      vMax: Math.round(hi - 60),
      vNow,
      vText: 'השעה ' + c.nowT + (c.isScrub ? ' · תצוגה' : ''),
      rangePct: f1(cl((tNow - lo) / (hi - 60 - lo)) * 100),
      startLbl: this.clock(lo),
      endLbl: this.clock(hi),
      rticks,
      showHint: !st.hinted && !c.isScrub,
      onDown: (e) => this.dragDown(e),
      onMove: (e) => this.dragMove(e),
      onUp: (e) => this.dragUp(e),
      onCancel: (e) => this.dragUp(e),
      onKey: (e) => this.keyScrub(e),
      onRange: (e) => {
        this.glide = null;
        this.hintOff();
        this.scrub(Number(e.target.value));
      },
      msgNext,
      msgRest,
      hasRest: msgRest.length > 0,
      noRest: msgRest.length === 0,
      nowRows,
      doneRows: c.done,
      missedRows,
      noUpcoming: c.upcoming.length === 0,
      zrows,
    };
  }
}
</script>
