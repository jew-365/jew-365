<script>
class Component extends DCLogic {
/*CORE*/

  boardState() {
    return { sel: null, filt: null, dragOn: false, hinted: false };
  }

  boardUnmount() {
    clearTimeout(this.selTimer);
    cancelAnimationFrame(this.dragRaf);
    this.dragOff();
  }

  dragOff() {
    window.removeEventListener('pointermove', this.winMove);
    window.removeEventListener('pointerup', this.winUp);
    window.removeEventListener('pointercancel', this.winUp);
  }

  pick(id) {
    this.setState((s) => ({ sel: s.sel === id ? null : id }));
  }

  markSel(id) {
    this.mark(id);
    clearTimeout(this.selTimer);
    this.selTimer = setTimeout(() => {
      if (this.state.sel === id) this.setState({ sel: null });
    }, 1150);
  }

  fracAt(el, x, y) {
    const r = el.getBoundingClientRect();
    const dx = x - (r.left + (r.width * 195) / 390);
    const dy = y - (r.top + (r.height * 178) / 356);
    if (Math.hypot(dx, dy) < 24) return null;
    const f = Math.atan2(dx, -dy) / (2 * Math.PI);
    return f < 0 ? f + 1 : f;
  }

  dragTo(el, x, y, first) {
    const f = this.fracAt(el, x, y);
    if (f == null || !this.drag) return;
    const S = this.dayStart();
    const L = this.dayEnd() - S;
    const prev = this.drag.f;
    let cand = f;
    if (!first && prev != null) cand = [f - 1, f, f + 1].reduce((a, b) => (Math.abs(b - prev) < Math.abs(a - prev) ? b : a));
    const fc = Math.max(0, Math.min((L - 60) / L, cand));
    this.drag.f = fc;
    this.scrub(S + Math.round((fc * L) / 60) * 60);
  }

  onDown(e) {
    const el = e.currentTarget;
    try {
      el.setPointerCapture(e.pointerId);
    } catch (err) {}
    this.drag = { id: e.pointerId, f: null, el };
    this.dragOff();
    this.winMove = (ev) => this.onMove(ev);
    this.winUp = (ev) => this.onUp(ev);
    window.addEventListener('pointermove', this.winMove);
    window.addEventListener('pointerup', this.winUp);
    window.addEventListener('pointercancel', this.winUp);
    this.setState({ dragOn: true, hinted: true });
    this.dragTo(el, e.clientX, e.clientY, true);
  }

  onMove(e) {
    if (!this.drag || this.drag.id !== e.pointerId) return;
    this.dragPt = { x: e.clientX, y: e.clientY };
    if (this.dragRaf) return;
    this.dragRaf = requestAnimationFrame(() => {
      this.dragRaf = 0;
      if (this.drag && this.dragPt) this.dragTo(this.drag.el, this.dragPt.x, this.dragPt.y, false);
    });
  }

  onUp(e) {
    if (!this.drag || this.drag.id !== e.pointerId) return;
    this.dragOff();
    cancelAnimationFrame(this.dragRaf);
    this.dragRaf = 0;
    if (this.dragPt && e.type === 'pointerup') this.dragTo(this.drag.el, e.clientX, e.clientY, false);
    this.drag = null;
    this.dragPt = null;
    this.setState({ dragOn: false });
  }

  onKey(e) {
    const step = { ArrowRight: 300, ArrowUp: 300, ArrowLeft: -300, ArrowDown: -300, PageUp: 3600, PageDown: -3600 }[e.key];
    let target;
    if (step !== undefined) target = Math.round(this.now() / 60) * 60 + step;
    else if (e.key === 'Home') target = this.dayStart();
    else if (e.key === 'End') target = this.dayEnd();
    else return;
    e.preventDefault();
    this.setState({ hinted: true });
    this.scrub(target);
  }

  renderVals() {
    const c = this.coreVals();
    const t = this.now();
    const st = this.state;
    const S = this.dayStart();
    const L = this.dayEnd() - S;
    const CX = 195;
    const CY = 178;
    const LANES = [126, 116, 106];
    const pad = (n) => String(n).padStart(2, '0');
    const fr = (sec) => Math.max(0, Math.min(1, (sec - S) / L));
    const hourF = (sec) => ((((sec - S) % 86400) + 86400) % 86400) / L;
    const P = (f, r) => {
      const a = f * 2 * Math.PI;
      return [CX + r * Math.sin(a), CY - r * Math.cos(a)];
    };
    const q = (v) => Number(v.toFixed(1));
    const pt = (f, r) => {
      const [x, y] = P(f, r);
      return q(x) + ' ' + q(y);
    };
    const arc = (f0, f1, r) => 'M' + pt(f0, r) + ' A' + r + ' ' + r + ' 0 ' + (f1 - f0 > 0.5 ? 1 : 0) + ' 1 ' + pt(f1, r);
    const band = (f0, f1, r, w) => {
      const ro = r + w / 2;
      const ri = r - w / 2;
      const lg = f1 - f0 > 0.5 ? 1 : 0;
      return 'M' + pt(f0, ro) + ' A' + ro + ' ' + ro + ' 0 ' + lg + ' 1 ' + pt(f1, ro) + ' L' + pt(f1, ri) + ' A' + ri + ' ' + ri + ' 0 ' + lg + ' 0 ' + pt(f0, ri) + ' Z';
    };
    const line = (f, r0, r1) => 'M' + pt(f, r0) + ' L' + pt(f, r1);

    const its = this.items();
    const zl = this.zmanimList();
    const zBy = Object.fromEntries(zl.map((z) => [z.id, z]));
    const tlBy = Object.fromEntries(c.timeline.map((x) => [x.id, x]));
    const itBy = Object.fromEntries(its.map((x) => [x.id, x]));

    const th = fr(t) * 360;
    let ms = 1000;
    let ease = 'linear';
    if (st.dragOn) ms = 80;
    else if (this.prevTh != null && Math.abs(th - this.prevTh) > 0.25) {
      ms = Math.round(Math.max(320, Math.min(900, 280 + Math.abs(th - this.prevTh) * 2.4)));
      ease = 'cubic-bezier(.22,.8,.22,1)';
    }
    this.prevTh = th;

    const overlap = (a, b) => [-86400, 0, 86400].some((k) => a.S < b.E + k && b.S + k < a.E);
    const lanes = [];
    const laneOf = {};
    its
      .slice()
      .sort((a, b) => b.E - b.S - (a.E - a.S) || a.S - b.S)
      .forEach((x) => {
        let i = 0;
        while (lanes[i] && lanes[i].some((y) => overlap(x, y))) i += 1;
        (lanes[i] = lanes[i] || []).push(x);
        laneOf[x.id] = i;
      });

    const selId = st.sel && itBy[st.sel] ? st.sel : null;
    const fTl = selId ? tlBy[selId] : c.hasHero ? tlBy[c.hero.id] : null;
    const focusId = fTl ? fTl.id : null;
    const fn = fr(t);

    const bands = its.map((x) => {
      const tl = tlBy[x.id];
      const r = LANES[Math.min(laneOf[x.id], LANES.length - 1)];
      const f0 = fr(x.S);
      const f1 = fr(x.E);
      const a0 = f0 + 0.0016;
      const a1 = Math.max(a0 + 0.002, f1 - 0.0016);
      const mid = Math.min(Math.max(fn, a0), a1);
      const doneSec = this.doneAt(x.id);
      const nf = doneSec != null ? fr(doneSec) : 0;
      const [nx, ny] = P(nf, r);
      const act = c.active.find((a) => a.id === x.id);
      const w = tl.status === 'active' ? 9 : tl.status === 'done' ? 6 : 7;
      const late = doneSec != null && doneSec >= x.E;
      return {
        id: x.id,
        status: tl.status,
        dim: st.filt && st.filt !== tl.status ? 'dim' : '',
        dBand: band(a0, a1, r, w),
        dGone: band(a0, mid, r, 9),
        dRem: band(mid, a1, r, 9),
        dMid: arc(mid, a1, r),
        dHit: arc(f0, f1, r),
        dOut: band(a0 - 0.004, a1 + 0.004, r, 15),
        dX: line(a1, r - 6, r + 6),
        nx: q(nx),
        ny: q(ny),
        dCheck: 'M' + q(nx - 2.2) + ' ' + q(ny + 0.1) + ' L' + q(nx - 0.6) + ' ' + q(ny + 1.7) + ' L' + q(nx + 2.4) + ' ' + q(ny - 1.7),
        lateCls: late ? 'late' : '',
        urg: act && act.urgent ? 'urg' : '',
        guides: line(f0, r + 8, 131) + line(f0, 147, 161) + line(f1, r + 8, 131) + line(f1, 147, 161),
        f0,
        f1,
        pressed: focusId === x.id && Boolean(selId),
        label: x.name + ' · ' + tl.statusText + ' · ' + tl.startT + ' עד ' + tl.endT + ' · הצגה במרכז הרדאר',
        pick: () => this.pick(x.id),
        key: (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            this.pick(x.id);
          }
        },
      };
    });
    const selB = focusId ? bands.find((b) => b.id === focusId) : null;

    let hourLines = '';
    let hourLinesS = '';
    let ticksHour = '';
    let ticksMinor = '';
    for (let h = 0; h < 24; h++) {
      const f = hourF(h * 3600);
      if (f >= 0.998) continue;
      if (h % 6 === 0) hourLinesS += line(f, 103, 131) + line(f, 147, 161);
      else if (h % 3 === 0) hourLines += line(f, 103, 131) + line(f, 147, 161);
      else hourLines += line(f, 103, 161);
      ticksHour += line(f, 166, h % 3 === 0 ? 156 : 160);
      for (let m = 1; m < 4; m++) {
        const fm = hourF(h * 3600 + m * 900);
        if (fm < 0.998) ticksMinor += line(fm, 166, 163);
      }
    }

    const nums = [];
    for (let h = 0; h < 24; h += 3) {
      const f = hourF(h * 3600);
      if (f >= 0.995) continue;
      const [x, y] = P(f, 139);
      nums.push({ f, t: pad(h), x: q(x), y: q(y), cls: h % 6 === 0 ? 'cd' : '' });
    }
    const tags = selB
      ? [
          { f: selB.f0, t: fTl.startT },
          { f: selB.f1, t: fTl.endT },
        ].map((g) => {
          const [x, y] = P(g.f, 139);
          return { f: g.f, t: g.t, x: q(x), y: q(y) };
        })
      : [];
    nums.forEach((n) => {
      n.cls += tags.some((g) => Math.min(Math.abs(g.f - n.f), 1 - Math.abs(g.f - n.f)) * 2 * Math.PI * 139 < 30) ? ' hid' : '';
    });

    const nextZl = zl.find((z) => z.S > t) || null;
    const blips = zl.map((z) => {
      const f = fr(z.S);
      const d = th - f * 360;
      const isNext = Boolean(nextZl && nextZl.id === z.id);
      const passed = d >= 0;
      const g = passed ? 0.3 + 0.7 * Math.exp(-d / 30) : 0;
      const flare = Math.exp(-Math.abs(d) / 4.5);
      const [x, y] = P(f, 152);
      return { x: q(x), y: q(y), r: (3.1 + flare * 2.6 + (isNext ? 1.2 : 0)).toFixed(2), g: g.toFixed(3), cls: isNext ? 'nx' : passed ? 'lit' : '' };
    });
    const nd = nextZl ? P(fr(nextZl.S), 152) : null;

    const CW = 66;
    const CH = 44;
    const corners = [
      { x: 316, y: 8 },
      { x: 316, y: 304 },
      { x: 8, y: 304 },
      { x: 8, y: 8 },
    ];
    const keyNames = { netz: 'הנץ', chatzot: 'חצות', shkia: 'שקיעה', chatzotL: 'חצות לילה' };
    const chips = [];
    let leaders = '';
    ['netz', 'chatzot', 'shkia', 'chatzotL']
      .map((id) => zBy[id])
      .sort((a, b) => a.S - b.S)
      .forEach((z, i) => {
        const k = corners[i];
        const f = fr(z.S);
        const [bx, by] = P(f, 157);
        const [rx, ry] = P(f, 175);
        const ax = Math.max(k.x, Math.min(k.x + CW, rx));
        const ay = Math.max(k.y, Math.min(k.y + CH, ry));
        leaders += 'M' + q(bx) + ' ' + q(by) + ' L' + q(rx) + ' ' + q(ry) + ' L' + q(ax) + ' ' + q(ay);
        const isNext = Boolean(nextZl && nextZl.id === z.id);
        chips.push({ x: k.x, y: k.y, name: keyNames[z.id], time: z.t, cls: isNext ? 'nx' : z.S <= t ? 'past' : '' });
      });

    const pctOf = (n) => Math.round(n);
    const statusWord = { active: 'פתוח עכשיו', done: 'בוצע', missed: 'פוספס', upcoming: 'בהמשך' };
    const fmt = (secs) => this.left(secs);

    let f = null;
    if (fTl) {
      const x = itBy[fTl.id];
      const s = fTl.status;
      const d = this.doneAt(x.id);
      const urgentF = s === 'active' && Math.ceil((x.E - t) / 60) <= 45;
      f = {
        short: x.short,
        hasBtn: s !== 'upcoming',
        icCheck: s !== 'done',
        icUndo: s === 'done',
        stCls: 's-' + (urgentF ? 'urgent' : s),
        status: '',
        btnLabel: '',
        btnCls: '',
        btnAria: '',
        btnClick: () => {},
      };
      if (s === 'active') {
        Object.assign(f, { status: 'פתוח · נשארו ' + fmt(x.E - t), btnLabel: x.cta, btnCls: 'primary', btnAria: fTl.markLabel, btnClick: () => this.markSel(x.id) });
      } else if (s === 'done') {
        Object.assign(f, { status: 'בוצע ב-' + this.clock(d) + (d >= x.E ? ' · באיחור' : ''), btnLabel: 'ביטול סימון', btnCls: 'ghost', btnAria: 'ביטול הסימון של ' + x.name, btnClick: () => this.undo(x.id) });
      } else if (s === 'missed') {
        Object.assign(f, { status: 'פוספס · נגמר ב-' + this.clock(x.E), btnLabel: 'בכל זאת עשיתי', btnCls: 'warn', btnAria: 'בכל זאת עשיתי — סימון ' + x.name, btnClick: () => this.markSel(x.id) });
      } else {
        Object.assign(f, { status: 'נפתח ב-' + fTl.startT + ' · בעוד ' + fmt(x.S - t) });
      }
    }

    const legend = [
      { key: 'active', label: 'פתוח', n: c.activeN, sgCls: 'sg-open' },
      { key: 'done', label: 'בוצע', n: c.doneN, sgCls: 'sg-done' },
      { key: 'missed', label: 'פוספס', n: c.missedN, sgCls: 'sg-miss' },
      { key: 'upcoming', label: 'בהמשך', n: c.upcomingN, sgCls: 'sg-ahead' },
    ].map((g) => ({
      ...g,
      on: st.filt === g.key,
      cls: g.n === 0 ? 'zero' : '',
      bump: 'enter-' + this.flip('n-' + g.key, g.n),
      aria: g.label + ': ' + g.n + (st.filt === g.key ? ' · מודגש ברדאר, לחיצה לניקוי' : ' · הדגשה ברדאר'),
      toggle: () => this.setState((s) => ({ filt: s.filt === g.key ? null : g.key })),
    }));

    const focusRow = (x) => () => {
      this.setState({ sel: x.id });
      this.jump('rdr');
    };
    const nowRows = c.active.map((a, i) => ({
      ...a,
      delay: (i * 0.05).toFixed(2),
      rowCls: (a.id === focusId ? 'foc ' : '') + a.cls,
      urgCls: a.urgent ? 'urg' : '',
      subText: a.urgent ? 'הזמן אוזל · נשארו ' + a.left : 'פתוח עכשיו',
      plAria: 'נשארו ' + a.left + ', ' + a.pctLeft + ' אחוז מהחלון',
      markRow: () => this.markSel(a.id),
      focusRow: focusRow(a),
      focusAria: 'הצגה ברדאר: ' + a.name,
    }));
    const upRows = c.upcoming.map((u, i) => ({ ...u, delay: (i * 0.05).toFixed(2), focusRow: focusRow(u), focusAria: 'הצגה ברדאר: ' + u.name }));
    const doneRows = c.done.map((d, i) => ({ ...d, delay: (i * 0.05).toFixed(2) }));
    const missRows = c.missed.map((x, i) => ({ ...x, delay: (i * 0.05).toFixed(2), markRow: () => this.markSel(x.id) }));

    const centerAria = fTl ? 'במרכז הרדאר: ' + fTl.name + ', ' + statusWord[fTl.status] : 'במרכז הרדאר: ' + c.activeEmptyTitle;

    return {
      ...c,
      streakLabel: c.streak + ' ימים ברצף',
      thDeg: th.toFixed(2),
      trT: 'transform ' + ms + 'ms ' + ease,
      trTh: '--th ' + ms + 'ms ' + ease,
      cometDeg: (st.e * 6).toFixed(0),
      nowSS: pad(((t % 60) + 60) % 60),
      dotCls: c.isScrub ? 'off' : '',
      lanes: lanes.map((_, i) => ({ r: LANES[Math.min(i, LANES.length - 1)] })),
      hourLines,
      hourLinesS,
      ticksHour,
      ticksMinor,
      bands,
      bandsAhead: bands.filter((b) => b.status === 'upcoming'),
      bandsMiss: bands.filter((b) => b.status === 'missed'),
      bandsDone: bands.filter((b) => b.status === 'done'),
      bandsAct: bands.filter((b) => b.status === 'active'),
      hasSel: Boolean(selB),
      sel: selB || {},
      nums,
      tags,
      chips,
      leaders,
      blips,
      hasNextDot: Boolean(nd),
      nextDot: nd ? { x: q(nd[0]), y: q(nd[1]) } : { x: 0, y: 0 },
      hasFocus: Boolean(f),
      noFocus: !f,
      f: f || {},
      centerCls: fTl && fTl.isMarking ? 'marking' : '',
      centerAnim: 'rf-' + this.flip('center', fTl ? fTl.id + ':' + fTl.status : 'none'),
      centerAria,
      grabCls: st.dragOn ? 'drag' : '',
      sliderMin: S,
      sliderMax: S + L - 60,
      sliderNow: t,
      sliderText: c.nowT + '. הבא: ' + c.nextZ.name + ' ב-' + c.nextZ.time + ', ' + c.nextZ.left,
      onDown: (e) => this.onDown(e),
      onKey: (e) => this.onKey(e),
      showHint: !st.hinted && !c.isScrub,
      legend,
      nowRows,
      upRows,
      doneRows,
      missRows,
      noUpcoming: c.upcomingN === 0,
      msgs: c.messages.map((m, i) => ({ ...m, delay: (i * 0.05).toFixed(2) })),
      noMessages: !c.hasMessages,
    };
  }
}
</script>
