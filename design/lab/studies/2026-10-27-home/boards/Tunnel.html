<style>
.ph{--hair:color-mix(in srgb,var(--text) 11%,transparent);--csub:color-mix(in srgb,var(--sub) 82%,var(--text));--cacc:color-mix(in srgb,var(--accentText) 84%,var(--text));--curg:color-mix(in srgb,var(--urgent) 84%,var(--text));--csafe:color-mix(in srgb,var(--safe) 82%,var(--text))}

.tn{position:relative;height:456px;margin:14px -12px 0;border-radius:34px;overflow:hidden;background:linear-gradient(180deg,var(--t1),var(--t2) 56%,var(--t3));box-shadow:inset 0 0 0 1px rgba(255,255,255,.16),var(--shadow);touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;color:#fff;isolation:isolate}

.rl{fill:none;stroke:rgba(255,255,255,.075);stroke-width:1}

.rb.a{stroke:rgba(255,255,255,.24);stroke-width:1.3}

.tn-vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 92% at 50% 36%,transparent 34%,rgba(3,5,16,.62) 100%)}

@keyframes waveOut{0%{transform:scale(.1);opacity:0}12%{opacity:.5}100%{transform:scale(1.45);opacity:0}}
.amb{position:absolute;left:187px;top:140px;width:2px;height:70px;transform-origin:50% 0;background:linear-gradient(to bottom,transparent,rgba(255,255,255,.8));opacity:0;animation:ambFlow var(--d) linear infinite;animation-delay:var(--l);pointer-events:none}
@keyframes ambFlow{0%{transform:rotate(var(--a)) translateY(40px) scaleY(.2);opacity:0}18%{opacity:.5}100%{transform:rotate(var(--a)) translateY(340px) scaleY(1);opacity:0}}

.tn-cam{position:absolute;inset:0;perspective:800px;perspective-origin:187px 140px;pointer-events:none}
.tn-world{position:absolute;inset:0;transform-style:preserve-3d}
.tn-list{position:absolute;inset:0;transform-style:preserve-3d}
.gate{position:absolute;left:calc(50% - 173px);top:-33px;width:346px;height:346px;border-radius:64px;border:2.5px solid color-mix(in srgb,var(--gc) 88%,transparent);box-shadow:0 0 16px color-mix(in srgb,var(--gc) 50%,transparent),inset 0 0 22px color-mix(in srgb,var(--gc) 28%,transparent);will-change:transform,opacity;transition:transform .4s ease-out,opacity .3s ease-out;pointer-events:none}

.tcard{position:absolute;left:calc(50% - 8.6em);top:140px;width:17.2em;will-change:transform,opacity;transition:transform .5s cubic-bezier(.2,.85,.25,1.06),opacity .4s ease;pointer-events:auto}

.st-up{--cbg:linear-gradient(rgba(14,20,46,.76),rgba(14,20,46,.76));--cbd:rgba(255,255,255,.36);--cglow:rgba(255,255,255,.08);--kc:#fff}

.tc-rn{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;text-align:center}

.tbtn{flex:1;min-height:2.9em;border-radius:1em;display:inline-flex;align-items:center;justify-content:center;gap:.45em;font-weight:800;font-size:1em;background:rgba(255,255,255,.16);color:#fff;transition:transform .15s}

.tn-slider{position:absolute;inset:0;z-index:3;border-radius:34px;pointer-events:none}

.nowl{display:flex;flex-direction:column;gap:10px}
.nowc{position:relative;padding:14px}

.tile{width:44px;height:44px;border-radius:15px;background:var(--soft);color:var(--cacc);display:flex;align-items:center;justify-content:center;flex:none}
.nt{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.nn{font-size:1.0625em;font-weight:700;line-height:1.25}

.nl{display:flex;flex-direction:column;align-items:center;line-height:1.05;flex:none;min-width:58px;color:var(--text)}
.nl .cap{font-size:.75em;color:var(--csub)}

.nrow{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;margin-top:10px;font-size:.8125em;color:var(--csub);line-height:1.2}
.nrow b{display:block;font-size:1.2em;font-weight:800;color:var(--text);font-variant-numeric:tabular-nums}
.nrow>span:last-child{text-align:left}
.nrow .warn{align-self:center;display:inline-flex;align-items:center;gap:6px;font-size:.9em;font-weight:700;color:var(--curg)}
.nrow .warn i{width:7px;height:7px;border-radius:50%;background:var(--urgent);animation:pulse 1.6s ease-in-out infinite}
.nbar{height:6px;border-radius:6px;background:var(--surface2);overflow:hidden;margin-top:8px}
.nbar i{display:block;height:100%;border-radius:6px;background:var(--accent);transition:width .9s cubic-bezier(.2,.8,.2,1)}
.nowc.urgent .nbar i{background:var(--urgent)}
.acts{display:flex;gap:10px;margin-top:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;border-radius:17px;font-weight:700;font-size:1.0625em;transition:transform .15s ease,background .25s,color .25s}
.btn:active{transform:scale(.97)}
.btn .ic{width:21px;height:21px;stroke-width:2.2}
.btn.primary{flex:2;background:var(--accent);color:var(--onAccent)}
.btn.ghost{flex:1;background:var(--surface2);color:var(--text)}
.nowc.marking{animation:nowOut .6s .3s cubic-bezier(.6,0,.2,1) forwards}
.nowc.marking .btn.primary{background:var(--safe);color:var(--onSafe)}
@keyframes nowOut{to{opacity:0;transform:translateX(-30px)}}
.calm{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:24px 20px}
.halo{width:64px;height:64px;border-radius:50%;background:var(--safeSoft);color:var(--csafe);display:flex;align-items:center;justify-content:center;animation:tnFloat 3.2s ease-in-out infinite;box-shadow:0 0 0 8px color-mix(in srgb,var(--safe) 10%,transparent)}
.halo .ic{width:30px;height:30px}

.duo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:24px}

.mrow{padding:6px 0 4px;display:flex;flex-direction:column;gap:1px}

.mrow.marking{animation:nowOut .6s .3s cubic-bezier(.6,0,.2,1) forwards}
.drow{display:flex;align-items:center;gap:6px;padding:5px 0}
.drow>div{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}

.lateTag{display:inline-block;margin-inline-start:5px;padding:0 6px;border-radius:6px;background:var(--urgentSoft);color:var(--curg);font-size:1em;font-weight:700}
.undo{flex:none;min-width:44px;min-height:44px;padding:0 6px;border-radius:12px;font-weight:700;font-size:.75em;color:var(--cacc);display:flex;align-items:center;justify-content:center}
.dempty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:10px 4px 14px;font-size:.8125em;font-weight:500;color:var(--csub);line-height:1.4}
.dempty .halo2{width:44px;height:44px;border-radius:50%;background:var(--safeSoft);color:var(--csafe);display:flex;align-items:center;justify-content:center;animation:tnFloat 3.6s ease-in-out infinite}
.dempty .halo2 .ic{width:22px;height:22px}

.up{display:flex;align-items:center;gap:10px;margin-top:10px;min-height:52px;padding:6px 14px}

.up-l .ic{width:17px;height:17px;color:var(--cacc)}
.up-items{flex:1;min-width:0;display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px;padding-block:4px}

.up-i span{color:var(--csub);font-variant-numeric:tabular-nums}
.up-none{font-size:.875em;font-weight:600;color:var(--csub)}

.zl{padding:12px 0 6px;overflow:hidden}

.zl-head .ic{width:18px;height:18px;color:var(--cacc);flex:none}
.zl-n{flex:1;min-width:0}

.zl-in{flex:none;padding:3px 10px;border-radius:999px;background:var(--soft);color:var(--cacc);font-size:.9em;font-weight:700}
.zr+.zr{border-top:1px solid var(--hair)}
.zr-b{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:6px 16px;text-align:start}
.zr-i{width:36px;height:36px;border-radius:50%;background:var(--surface2);color:var(--csub);display:flex;align-items:center;justify-content:center;flex:none}

.zr-n{flex:1;min-width:0;font-weight:600;line-height:1.25}
.zr-s{font-size:.75em;font-weight:700;color:var(--cacc)}
.zr-t{font-weight:800;font-variant-numeric:tabular-nums;min-width:3.2em;text-align:end}
.zr.past .zr-n,.zr.past .zr-t{color:var(--csub);font-weight:500}
.zr.past .zr-i{opacity:.7}
.zr.next{background:var(--soft)}
.zr.next .zr-i{background:var(--accent);color:var(--onAccent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 26%,transparent)}

</style>

<button class="late" onClick="{{it.mark}}" aria-label="{{it.markLabel}}">בכל זאת עשיתי</button>
</div>
</sc-for>
</div>
</sc-if>
<sc-if value="{{noMissed}}" hint-placeholder-val="{{ false }}"><div class="dempty"><span class="halo2" aria-hidden="true">[[ic:sparkle]]</span><span>{{missedEmpty}}</span></div></sc-if>
</section>
</div>

<div class="glass up rise" role="list" aria-label="בהמשך היום" style="--d: .4s">
<span class="up-l">[[ic:clock]]בהמשך היום</span>
<div class="up-items">
<sc-if value="{{hasUpcoming}}" hint-placeholder-val="{{ true }}">
<sc-for list="{{upGroups}}" as="l" hint-placeholder-count="1">
<span class="up-i" role="listitem">[[icItem:l]]<b>{{l.name}}</b><span>{{l.time}}</span></span>
</sc-for>
</sc-if>
<sc-if value="{{noUpcoming}}" hint-placeholder-val="{{ false }}"><span class="up-none" role="listitem">אין עוד מצוות להיום</span></sc-if>
</div>
</div>

<h2 class="hd rise" style="--d: .44s"><span class="hd-t"><span class="hd-i">[[ic:clock]]</span><span>זמני היום</span></span><span class="hd-n"><span>{{hebDay}}</span></span></h2>
<section class="glass zl rise" aria-label="זמני היום" style="--d: .48s">
<p class="zl-head">[[icZ:nextIc]]<span class="zl-n">הבא: <b>{{nextZ.name}} · {{nextZ.time}}</b></span><span class="zl-in">{{nextZ.left}}</span></p>
<ol>
<sc-for list="{{zrows}}" as="z" hint-placeholder-count="11">
<li class="zr {{z.cls}}"><button class="zr-b" onClick="{{z.go}}" aria-label="{{z.aria}}" aria-current="{{z.cur}}">
<span class="zr-i">[[icZ:z]]</span>
<span class="zr-n">{{z.name}}</span>
<span class="zr-s">{{z.sub}}</span>
<b class="zr-t">{{z.time}}</b>
</button></li>
</sc-for>
</ol>
</section>

</div>
</template>
<script>
class Component extends DCLogic {
/*CORE*/

  boardState() {
    this.tg = { ox: 187, oy: 140, p: 800, spp: 48, half: 173 };
    this.td = null;
    this.tRaf = 0;
    this.tAnim = 0;
    this.tTgt = 0;
    this.tPos = 0;
    return { fx: false, foc: null };
  }

  boardMount() {
    this.rm = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };
  }

  boardUnmount() {
    this.tStop();
  }

  tHex(c) {
    return [1, 3, 5].map((i) => parseInt(c.slice(i, i + 2), 16));
  }

  tStr(a) {
    return '#' + a.map((v) => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0')).join('');
  }

  tMix(a, b, k) {
    return a.map((v, i) => v + (b[i] - v) * k);
  }

  tClamp(v, lo, hi) {
    return Math.max(lo, Math.min(hi, v));
  }

  tSmooth(v) {
    const k = this.tClamp(v, 0, 1);
    return k * k * (3 - 2 * k);
  }

  tDepth(d) {
    return d >= 0 ? 1400 * (1 - Math.exp(-d / 12240)) : -320 * (1 - Math.exp(d / 2520));
  }

  tKeys() {
    const z = {};
    this.zmanimList().forEach((x) => (z[x.id] = x.S));
    const end = this.dayEnd();
    const K = (t, top, mid, bot, name) => ({ t, top: this.tHex(top), mid: this.tHex(mid), bot: this.tHex(bot), name });
    const dawnLen = z.netz - z.alot;
    const a = K(z.alot, '#18215F', '#4B3D8E', '#9B6BA8', 'עלות השחר');
    return [
      a,
      K(z.netz, '#8DA3E0', '#F2B7B4', '#FFD9AE', 'הנץ החמה'),
      K(z.netz + (z.chatzot - z.netz) * 0.3, '#76B6F2', '#A8D4F6', '#D8EDFA', 'בוקר'),
      K(z.chatzot, '#4B9DEB', '#6DB4F1', '#A8D5F8', 'צהריים'),
      K(z.plag, '#5E9FE0', '#9CC5E8', '#F5D9A2', 'אחר הצהריים'),
      K(z.shkia, '#5C5AA8', '#E4708C', '#FFB05C', 'שקיעה'),
      K(z.tzeit, '#161D58', '#2E3382', '#6C5BA8', 'צאת הכוכבים'),
      K(z.tzeit + (z.chatzotL - z.tzeit) * 0.25, '#070C1F', '#0F1A3E', '#1B2A58', 'לילה'),
      K(end - dawnLen * 0.7, '#060A19', '#0D1533', '#18224D', 'לפני עלות השחר'),
      { ...a, t: end },
    ];
  }

  tAt(t) {
    const K = this.tKeys();
    let i = 0;
    while (i < K.length - 2 && t >= K[i + 1].t) i++;
    const a = K[i];
    const b = K[i + 1];
    const e = this.tSmooth((t - a.t) / (b.t - a.t));
    const m = (p) => this.tMix(a[p], b[p], e);
    return { top: m('top'), mid: m('mid'), bot: m('bot'), name: a.name };
  }

  tBounds() {
    return [this.dayStart(), this.dayEnd() - 60];
  }

  tSeek(sec) {
    this.tTgt = sec;
    if (this.tRaf) return;
    this.tRaf = requestAnimationFrame(() => {
      this.tRaf = 0;
      this.scrub(this.tTgt);
    });
  }

  tStop() {
    cancelAnimationFrame(this.tRaf);
    cancelAnimationFrame(this.tAnim);
    this.tRaf = 0;
    this.tAnim = 0;
  }

  tEnd() {
    this.setState({ fx: false });
  }

  tTween(to, ms, done, from) {
    this.tStop();
    const [lo, hi] = this.tBounds();
    const a = from == null ? this.now() : from;
    const b = Math.max(lo, Math.min(hi, to));
    const dur = ms == null ? Math.max(380, Math.min(1100, 380 + Math.abs(b - a) / 40)) : ms;
    if (this.rm.matches || Math.abs(b - a) < 1) {
      this.tPos = b;
      this.scrub(b);
      if (done) done();
      return;
    }
    const t0 = performance.now();
    const step = (ts) => {
      const k = Math.min(1, (ts - t0) / dur);
      this.tPos = a + (b - a) * (k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2);
      this.scrub(this.tPos);
      if (k < 1) this.tAnim = requestAnimationFrame(step);
      else {
        this.tAnim = 0;
        if (done) done();
      }
    };
    this.tAnim = requestAnimationFrame(step);
  }

  tGoTo(sec) {
    this.setState({ fx: true, foc: null });
    this.tTween(sec, null, () => this.tEnd());
  }

  tFling(v0) {
    const [lo, hi] = this.tBounds();
    let v = Math.max(-2400, Math.min(2400, v0));
    let last = performance.now();
    const step = (ts) => {
      const dt = Math.min(0.05, (ts - last) / 1000);
      last = ts;
      v *= Math.exp(-dt / 0.32);
      this.tPos = Math.max(lo, Math.min(hi, this.tPos - v * dt * this.tg.spp));
      this.scrub(this.tPos);
      if (Math.abs(v) > 28 && this.tPos > lo && this.tPos < hi) this.tAnim = requestAnimationFrame(step);
      else {
        this.tAnim = 0;
        this.tEnd();
      }
    };
    this.tAnim = requestAnimationFrame(step);
  }

  tDown(e) {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    this.tStop();
    this.tPos = this.now();
    this.td = { id: e.pointerId, el: e.currentTarget, tgt: e.target, y0: e.clientY, y: e.clientY, ts: performance.now(), v: 0, moved: false };
  }

  tMove(e) {
    const d = this.td;
    if (!d || d.id !== e.pointerId) return;
    if (!d.moved) {
      if (Math.abs(e.clientY - d.y0) < 6) return;
      d.moved = true;
      d.y = e.clientY;
      d.ts = performance.now();
      try {
        d.el.setPointerCapture(e.pointerId);
      } catch (err) {}
      this.setState({ fx: true, foc: null });
      return;
    }
    const ts = performance.now();
    const dy = e.clientY - d.y;
    d.v = d.v * 0.6 + ((dy / Math.max(1, ts - d.ts)) * 1000) * 0.4;
    d.y = e.clientY;
    d.ts = ts;
    const [lo, hi] = this.tBounds();
    this.tPos = Math.max(lo, Math.min(hi, this.tPos - dy * this.tg.spp));
    this.tSeek(this.tPos);
  }

  tUp(e) {
    const d = this.td;
    if (!d || d.id !== e.pointerId) return;
    this.td = null;
    if (!d.moved) {
      const hit = d.tgt && d.tgt.closest ? d.tgt.closest('button,li') : null;
      if (this.state.fx || (!hit && this.state.foc)) this.setState({ fx: false, foc: hit ? this.state.foc : null });
      return;
    }
    try {
      d.el.releasePointerCapture(e.pointerId);
    } catch (err) {}
    const v = performance.now() - d.ts > 90 ? 0 : d.v;
    if (this.rm.matches || Math.abs(v) < 90) {
      this.scrub(this.tPos);
      this.tEnd();
    } else this.tFling(v);
  }

  tKey(e) {
    const [lo, hi] = this.tBounds();
    const cur = this.now();
    const k = e.key;
    const step = e.shiftKey ? 900 : 60;
    const to = k === 'ArrowUp' || k === 'ArrowLeft' ? cur + step : k === 'ArrowDown' || k === 'ArrowRight' ? cur - step : k === 'PageUp' ? cur + 3600 : k === 'PageDown' ? cur - 3600 : k === 'Home' ? lo : k === 'End' ? hi : null;
    if (to == null) return;
    e.preventDefault();
    this.tStop();
    if (this.state.foc) this.setState({ foc: null });
    this.scrub(to);
  }

  tRib(half, r, g) {
    const x0 = g.ox - half;
    const x1 = g.ox + half;
    const y0 = g.oy - half;
    const y1 = g.oy + half;
    const f = (v) => v.toFixed(1);
    return 'M' + f(x0 + r) + ' ' + f(y0) + 'H' + f(x1 - r) + 'A' + f(r) + ' ' + f(r) + ' 0 0 1 ' + f(x1) + ' ' + f(y0 + r) + 'V' + f(y1 - r) + 'A' + f(r) + ' ' + f(r) + ' 0 0 1 ' + f(x1 - r) + ' ' + f(y1) + 'H' + f(x0 + r) + 'A' + f(r) + ' ' + f(r) + ' 0 0 1 ' + f(x0) + ' ' + f(y1 - r) + 'V' + f(y0 + r) + 'A' + f(r) + ' ' + f(r) + ' 0 0 1 ' + f(x0 + r) + ' ' + f(y0) + 'Z';
  }

  renderVals() {
    const c = this.coreVals();
    const s = this.state;
    const t = c.nowSec;
    const g = this.tg;
    const Z = this.zmanimList();
    const its = this.items();
    const tl = c.timeline;
    const sky = this.tAt(t);
    const zs = {};
    Z.forEach((z) => (zs[z.id] = z.S));
    const noop = () => {};
    const SIDE = { tefillin: 1, shma: -1, shacharit: 1, mincha: -1, maariv: 1, shmaNight: -1 };

    const dk = [7, 11, 28];
    const stageTop = this.tMix(sky.top, dk, 0.5);
    const stageMid = this.tMix(sky.mid, dk, 0.5);
    const stageBot = this.tMix(sky.bot, dk, 0.36);
    const glowCol = this.tMix(sky.bot, [255, 255, 255], 0.22);
    const isDayNow = t >= zs.netz && t < zs.shkia;
    const coreCol = isDayNow ? this.tMix(sky.bot, [255, 236, 170], 0.55) : this.tMix(sky.bot, [226, 232, 255], 0.7);
    const tw = Math.max(600, zs.tzeit - zs.shkia);
    const dw = Math.max(600, zs.netz - zs.alot);
    const starsOp = Math.max(this.tSmooth((t - (zs.tzeit - tw * 0.5)) / (tw * 1.5)), 1 - this.tSmooth((t - zs.alot) / (dw * 0.9)));
    const stageStyle = [
      '--t1:' + this.tStr(stageTop),
      '--t2:' + this.tStr(stageMid),
      '--t3:' + this.tStr(stageBot),
      '--tg:rgba(' + glowCol.map((v) => Math.round(v)).join(',') + ',.55)',
      '--tc:' + this.tStr(coreCol),
      '--so:' + starsOp.toFixed(2),
    ].join(';');
    const pageStyle = '--pt:' + this.tStr(this.tMix(sky.mid, [150, 190, 255], 0.45));

    const validFoc = s.foc && tl.some((x) => x.id === s.foc) ? s.foc : null;
    const frontId = validFoc || (c.active[0] ? c.active[0].id : null);
    const openOthers = c.active.filter((x) => x.id !== frontId);
    const stackN = (frontId ? 1 : 0) + openOthers.length;
    const base = stackN ? 150 + 60 * (stackN - 1) : 40;

    const cards = its.map((x, i) => {
      const m = tl[i];
      const a = c.active.find((q) => q.id === x.id);
      const dn = c.done.find((q) => q.id === x.id);
      const ms = c.missed.find((q) => q.id === x.id);
      const side = SIDE[x.id] || 1;
      const isFront = x.id === frontId;
      let D;
      let lx;
      let ly;
      let op;
      if (isFront) {
        D = -30;
        lx = 0;
        ly = 152;
        op = 1;
      } else if (m.isActive) {
        const r = openOthers.findIndex((o) => o.id === x.id) + 1;
        D = 70 + 80 * (r - 1) + i;
        lx = side * 54 * r;
        ly = 152 - 28 * r;
        op = 0.95 - 0.12 * (r - 1);
      } else if (m.isUpcoming) {
        D = base + this.tDepth(x.S - t) + i * 3;
        lx = (side * 84 * (g.p + D)) / g.p;
        ly = 104 + side * 8;
        op = 0.92 - D / 2300;
      } else {
        const age = m.isDone ? t - this.doneAt(x.id) : t - x.E;
        D = -70 - 140 * (1 - Math.exp(-age / 3600)) - i * 2;
        const sg = g.p / (g.p + D);
        lx = (side * 40) / sg;
        ly = (470 + 90 * (1 - Math.exp(-age / 7200)) - g.oy) / sg;
        op = 0.94 * Math.exp(-age / 5400);
      }
      const off = !isFront && op < (m.isDone || m.isMissed ? 0.12 : 0.04);
      const st = m.isActive ? 'open' : m.isDone ? 'done' : m.isMissed ? 'missed' : 'up';
      let act = null;
      if (isFront) {
        if (m.isActive) act = { text: a.cta, aria: a.markLabel, fn: () => { this.setState({ foc: null }); a.mark(); } };
        else if (m.isDone) act = { text: 'ביטול', aria: dn.undoLabel, fn: () => { this.setState({ foc: null }); dn.undo(); } };
        else if (m.isMissed) act = { text: 'בכל זאת עשיתי', aria: ms.markLabel, fn: () => { this.setState({ foc: null }); ms.mark(); } };
        else act = { text: 'נסיעה ל-' + m.startT, aria: 'נסיעה בזמן אל פתיחת ' + m.name, fn: () => this.tGoTo(x.S) };
      }
      const rem = a ? a.pctLeft : 0;
      return {
        ...m,
        isLive: !m.isDone && !m.isMissed,
        cls: ['st-' + st, isFront ? 'front' : '', off ? 'off' : '', m.isMarking ? 'marking' : '', a && a.urgent ? 'urg' : ''].filter(Boolean).join(' '),
        style: 'transform: translate3d(' + lx.toFixed(1) + 'px, calc(-50% + ' + ly.toFixed(1) + 'px), ' + (-D).toFixed(1) + 'px); opacity: ' + Math.max(0, op).toFixed(3),
        rangeTxt: 'מ-\u2066' + m.startT + '\u2069 · ' + m.endWord + ' \u2066' + m.endT + '\u2069',
        left: a ? a.left : '',
        leftNum: a ? a.leftNum : '',
        leftUnit: a ? a.leftUnit : '',
        urgent: Boolean(a && a.urgent),
        rOff: (169.65 * (1 - rem / 100)).toFixed(1),
        late: Boolean(dn && dn.late),
        inText: 'בעוד ' + this.left(x.S - t),
        showHit: !isFront,
        focus: () => {
          this.setState({ foc: x.id });
          setTimeout(() => {
            const el = document.querySelector('.tcard.front .tbtn.pri');
            if (el) el.focus();
          }, 80);
        },
        focusLabel: 'הבאה לקדמת המנהרה: ' + m.name + ', ' + m.statusShort,
        hasAct: Boolean(act),
        actText: act ? act.text : '',
        actAria: act ? act.aria : '',
        act: act ? act.fn : noop,
        hasBook: Boolean(isFront && m.isActive),
        bookAria: 'פתיחת הנוסח: ' + m.name,
        open: a ? a.open : noop,
      };
    });

    const nextI = Z.findIndex((z) => z.S > t);
    const KIND = { dawn: '#B79CFF', rise: '#FFB46B', day: '#9ED2FF', set: '#FF9A7A', night: '#8FA2FF' };
    const gDepth = Z.map((z) => this.tDepth(z.S - t));
    const gScale = gDepth.map((D) => g.p / (g.p + D));
    const gates = Z.map((z, i) => {
      const d0 = z.S - t;
      let op = d0 <= 0 ? 0.85 * Math.exp(d0 / 1500) : 0.16 + 0.62 * (1 - gDepth[i] / 1450);
      if (i === nextI) op = Math.max(op, 0.92);
      const col = KIND[c.zmanim[i].isDawn ? 'dawn' : c.zmanim[i].isRise ? 'rise' : c.zmanim[i].isSet ? 'set' : c.zmanim[i].isNight ? 'night' : 'day'];
      return {
        cls: [d0 <= 0 ? 'past' : '', i === nextI ? 'next' : '', op < 0.03 ? 'off' : ''].filter(Boolean).join(' '),
        style: '--gc: ' + col + '; transform: translate3d(0px, 0px, ' + (-gDepth[i]).toFixed(1) + 'px); opacity: ' + Math.max(0, op).toFixed(3),
        col,
        op: Math.max(0, op),
      };
    });

    const prio = Z.map((z, i) => i)
      .filter((i) => Z[i].S - t > -90 && gDepth[i] < 1500)
      .sort((a, b) => (a === nextI ? -1 : b === nextI ? 1 : Z[a].S - Z[b].S));
    const placed = [];
    const lab = Z.map(() => null);
    prio.forEach((i, n) => {
      const y = Math.max(g.oy - g.half * gScale[i] - 4, 22);
      const x = i === nextI ? g.ox : g.ox + (n % 2 ? 72 : -72);
      if (placed.some((p) => Math.abs(p.y - y) < 28 && Math.abs(p.x - x) < 128)) return;
      placed.push({ x, y });
      lab[i] = { x, y };
    });
    const labels = Z.map((z, i) => {
      const L = lab[i];
      const zz = c.zmanim[i];
      return {
        ...zz,
        cls: [i === nextI ? 'next' : '', L ? '' : 'off'].filter(Boolean).join(' '),
        col: gates[i].col,
        tf: 'translate(' + (L ? L.x : g.ox).toFixed(1) + 'px, ' + (L ? L.y : 0).toFixed(1) + 'px) translate(-50%, -50%)',
        op: L ? Math.min(1, gates[i].op + 0.1).toFixed(2) : '0',
        aria: 'נסיעה אל ' + z.name + ' ב-' + z.t,
        go: () => this.tGoTo(z.S),
      };
    });

    const ribs = { a: '', b: '', c: '' };
    const first = Math.floor((t - 2700) / 1800);
    for (let k = first; k <= first + 32; k++) {
      const d0 = k * 1800 - t;
      if (d0 < -2700) continue;
      if (d0 > 11 * 3600) break;
      const D = this.tDepth(d0);
      const sc = g.p / (g.p + D);
      if (sc > 1.7) continue;
      ribs[D < 500 ? 'a' : D < 1100 ? 'b' : 'c'] += this.tRib(g.half * sc, 64 * sc, g);
    }

    const streaks = Array.from({ length: 12 }, (_, i) => {
      const f = (((i / 12 + t / 2400) % 1) + 1) % 1;
      const r = 44 + Math.pow(f, 1.6) * 380;
      return { tf: 'rotate(' + ((i * 137.5) % 360).toFixed(1) + 'deg) translateY(' + r.toFixed(1) + 'px)', h: (10 + 120 * f).toFixed(1), o: Math.min(1, Math.sin(Math.PI * f) * 1.25).toFixed(2) };
    });

    const nz = nextI >= 0 ? c.zmanim[nextI] : c.zmanim[0];
    const pastZ = c.zmanim.filter((z) => z.past);
    const lastZ = pastZ[pastZ.length - 1];
    const sliderText = c.nowT + ' · ' + sky.name + (lastZ ? ', אחרי ' + lastZ.name : '') + ', הבא: ' + c.nextZ.name + ' ' + c.nextZ.left;

    const d0s = c.dayStartSec;
    const d1s = c.dayEndSec;
    const pc = (sec) => (((sec - d0s) / (d1s - d0s)) * 100).toFixed(2);
    const railBg = 'linear-gradient(to left, ' + Z.map((z) => this.tStr(this.tMix(this.tAt(z.S).mid, [255, 255, 255], 0.12)) + ' ' + pc(z.S) + '%').join(', ') + ')';

    const actives = c.active.map((it, i) => ({ ...it, delay: 0.24 + i * 0.07 + 's' }));
    const upGroups = [];
    c.upcoming.forEach((x) => {
      let q = upGroups.find((u) => u.time === x.startT);
      if (!q) {
        q = { time: x.startT, names: [], isSun: x.isSun, isBox: x.isBox, isBook: x.isBook, isMoon: x.isMoon };
        upGroups.push(q);
      }
      q.names.push(x.short);
    });
    upGroups.forEach((q) => (q.name = q.names.join(' · ')));

    const zrows = c.zmanim.map((z, i) => ({
      ...z,
      cls: z.isNext ? 'next' : z.past ? 'past' : '',
      cur: z.isNext ? 'true' : 'false',
      sub: z.isNext ? c.nextZ.left : '',
      aria: 'נסיעה אל ' + z.name + ' ב-' + z.time,
      go: () => {
        this.tGoTo(Z[i].S);
        this.jump('tn-stage');
      },
    }));

    return {
      ...c,
      cards,
      gates,
      labels,
      streaks,
      actives,
      upGroups,
      zrows,
      railBg,
      stageStyle,
      pageStyle,
      sliderText,
      ribA: ribs.a,
      ribB: ribs.b,
      ribC: ribs.c,
      nextIc: { isDay: nz.isDay, isDawn: nz.isDawn, isRise: nz.isRise, isSet: nz.isSet, isNight: nz.isNight },
      stCls: c.isScrub ? 'view' : '',
      stText: c.isScrub ? 'תצוגה' : 'עכשיו',
      fxCls: s.fx ? 'drag' : '',
      showEmpty: c.noActive && !frontId,
      activeCount: c.activeN === 0 ? 'אין פתוחות' : c.activeN === 1 ? 'פתוחה אחת' : c.activeN === 2 ? 'שתיים פתוחות' : c.activeN + ' פתוחות',
      noGeneral: !c.hasMsgGeneral,
      noUpcoming: !c.hasUpcoming,
      railDots: c.zmanim.map((z) => ({ p: z.p })),
      onRail: (e) => {
        this.tStop();
        if (this.state.foc) this.setState({ foc: null });
        this.scrub(Number(e.target.value));
      },
      tDown: (e) => this.tDown(e),
      tMove: (e) => this.tMove(e),
      tUp: (e) => this.tUp(e),
      tKey: (e) => this.tKey(e),
      missed: c.missed,
      done: c.done,
    };
  }
}
</script>
