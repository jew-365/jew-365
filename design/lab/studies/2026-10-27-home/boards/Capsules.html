<h2 class="sh rise" style="--d: .38s"><span class="sh-t"><span class="sh-i">[[ic:sunrise]]</span>זמני היום</span><span class="sh-n"><span>{{hebDay}}</span></span></h2>
<p class="sh-cap">הקשה על זמן מציגה את היום באותה שעה.</p>
<section class="glass zl rise" aria-label="זמני היום" style="--d: .42s">
<p class="zl-head">[[ic:clock]]<span>הבא: <b>{{nextZ.name}} · {{nextZ.time}}</b></span><span class="zl-in num">{{nextZ.left}}</span></p>
<ul class="zrs" role="list">
<sc-for list="{{zrows}}" as="z" hint-placeholder-count="11">
<li class="zr {{z.cls}}">
<button class="zr-b" onClick="{{z.go}}" aria-label="{{z.aria}}">
<i class="zr-dot" aria-hidden="true"></i>
<span class="zr-i">[[icZ:z]]</span>
<span class="zr-nw"><span class="zr-n">{{z.name}}</span><sc-if value="{{z.isNext}}" hint-placeholder-val="{{ false }}"><span class="zr-in num">{{z.inS}}</span></sc-if></span>
<b class="zr-t num">{{z.time}}</b>
</button>
</li>
</sc-for>
</ul>
</section>

</div>

<sc-if value="{{detOn}}" hint-placeholder-val="{{ false }}">
<div class="cdw">
<button class="cd-scrim {{detCls}}" onClick="{{detClose}}" aria-label="סגירת הפרטים" tabindex="-1"></button>
<section class="cd glass {{detCls}} {{det.stCls}}" role="dialog" aria-modal="true" aria-labelledby="cd-t">
<span class="cd-grab" aria-hidden="true"></span>
<header class="cd-h">
<span class="cd-ic">[[icItem:det]]</span>
<div class="cd-tt"><h2 class="cd-n" id="cd-t">{{det.name}}</h2><p class="cd-st">{{det.statusText}}</p></div>
<button class="cd-x" onClick="{{detClose}}" aria-label="סגירה">[[ic:close]]</button>
</header>
<div class="cd-win">
<div class="cd-pt"><span class="cap">{{det.startCap}}</span><b class="num">{{det.startT}}</b></div>
<div class="cd-bar" aria-hidden="true"><i class="cd-liq" style="width: {{det.barFill}}%"></i><i class="cd-mk" style="inset-inline-start: {{det.elapsed}}%"></i></div>
<div class="cd-pt end"><span class="cap">{{det.endCap}}</span><b class="num">{{det.endT}}</b></div>
</div>
<p class="cd-note num">{{det.note}}</p>
<div class="cd-acts">
<sc-if value="{{det.canMark}}" hint-placeholder-val="{{ true }}"><button class="btn primary" onClick="{{det.doMark}}" aria-label="{{det.markLabel}}">[[ic:check]]<span>{{det.markText}}</span></button></sc-if>
<sc-if value="{{det.canUndo}}" hint-placeholder-val="{{ false }}"><button class="btn safe" onClick="{{det.doUndo}}" aria-label="{{det.undoLabel}}">[[ic:undo]]<span>ביטול סימון</span></button></sc-if>
<button class="btn ghost" onClick="{{det.open}}">[[ic:book]]<span>נוסח</span></button>
</div>
</section>
</div>
</sc-if>

</div>
</template>
<script>
class Component extends DCLogic {
/*CORE*/

  boardState() {
    this.rk = null;
    this.lv = null;
    this.anim = 0;
    this.raf = 0;
    this.pend = null;
    this.dead = false;
    this.lastId = null;
    return { sel: null, selClosing: false, drag: false };
  }

  boardMount() {
    this.onKey = (e) => {
      if (e.key === 'Escape' && this.state.sel) this.closeDet();
    };
    document.addEventListener('keydown', this.onKey);
  }

  boardUnmount() {
    this.dead = true;
    this.stopAnim();
    cancelAnimationFrame(this.raf);
    [this.selT, this.mkT, this.focT].forEach((x) => clearTimeout(x));
    document.removeEventListener('keydown', this.onKey);
  }

  cpClamp(v, lo, hi) {
    return Math.max(lo, Math.min(hi, v));
  }

  cpCompact(sec) {
    const m = Math.max(0, Math.ceil(sec / 60));
    if (m < 60) return m + ' דק׳';
    const h = Math.floor(m / 60);
    const r = m % 60;
    return h + ' שע׳' + (r ? ' ו-' + r + ' דק׳' : '');
  }

  cpHM(sec) {
    const m = Math.max(0, Math.ceil(sec / 60));
    return m < 60 ? m + ' דק׳' : Math.floor(m / 60) + ':' + String(m % 60).padStart(2, '0') + ' שע׳';
  }

  stopAnim() {
    if (this.anim) {
      cancelAnimationFrame(this.anim);
      this.anim = 0;
    }
  }

  bounds() {
    return [this.dayStart(), this.dayEnd() - 60];
  }

  glide(to, ms) {
    this.stopAnim();
    const [lo, hi] = this.bounds();
    const from = this.now();
    const target = this.cpClamp(to, lo, hi);
    const t0 = performance.now();
    const ease = (k) => 1 - Math.pow(1 - k, 3);
    const step = (ts) => {
      if (this.dead) return;
      const k = this.cpClamp((ts - t0) / ms, 0, 1);
      this.scrub(from + (target - from) * ease(k));
      this.anim = k < 1 ? requestAnimationFrame(step) : 0;
    };
    this.anim = requestAnimationFrame(step);
  }

  fling(v) {
    v *= 0.55;
    if (Math.abs(v) < 6) return;
    this.stopAnim();
    const [lo, hi] = this.bounds();
    let sec = this.now();
    let last = performance.now();
    const step = (ts) => {
      if (this.dead) return;
      const dt = this.cpClamp(ts - last, 1, 34);
      last = ts;
      sec += v * dt;
      v *= Math.exp(-dt / 200);
      if (sec <= lo || sec >= hi) {
        sec = this.cpClamp(sec, lo, hi);
        v = 0;
      }
      this.scrub(sec);
      this.anim = Math.abs(v) > 1.2 ? requestAnimationFrame(step) : 0;
    };
    this.anim = requestAnimationFrame(step);
  }

  queueScrub(sec) {
    this.pend = sec;
    if (this.raf) return;
    this.raf = requestAnimationFrame(() => {
      this.raf = 0;
      if (this.dead || this.pend == null) return;
      const v = this.pend;
      this.pend = null;
      this.scrub(v);
    });
  }

  flush() {
    if (this.raf) {
      cancelAnimationFrame(this.raf);
      this.raf = 0;
    }
    if (this.pend != null && !this.dead) {
      const v = this.pend;
      this.pend = null;
      this.scrub(v);
    }
  }

  sample(d, sec, ts) {
    d.s.push([ts, sec]);
    if (d.s.length > 5) d.s.shift();
  }

  velocity(d, ts) {
    const s = d.s;
    if (s.length < 2) return 0;
    const a = s[0];
    const b = s[s.length - 1];
    if (ts - b[0] > 90 || b[0] - a[0] < 8) return 0;
    return (b[1] - a[1]) / (b[0] - a[0]);
  }

  trackRect() {
    const el = document.querySelector('.lev-track');
    return el ? el.getBoundingClientRect() : { top: 0, height: 224 };
  }

  rackDown(e) {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    this.stopAnim();
    this.rk = { id: e.pointerId, x: e.clientX, y: e.clientY, cap: false, s: [], t0: 0, y0: 0 };
  }

  rackMove(e) {
    const d = this.rk;
    if (!d || e.pointerId !== d.id) return;
    if (!d.cap) {
      const dy = e.clientY - d.y;
      const dx = e.clientX - d.x;
      if (Math.abs(dy) < 8 || Math.abs(dy) < Math.abs(dx)) return;
      d.cap = true;
      d.t0 = this.now();
      d.y0 = e.clientY;
      try {
        e.currentTarget.setPointerCapture(e.pointerId);
      } catch (x) {}
      this.setState({ drag: true });
    }
    const [lo, hi] = this.bounds();
    const per = (this.dayEnd() - this.dayStart()) / Math.max(1, this.trackRect().height);
    const sec = this.cpClamp(d.t0 + (e.clientY - d.y0) * per, lo, hi);
    this.sample(d, sec, e.timeStamp);
    this.queueScrub(sec);
  }

  rackUp(e) {
    const d = this.rk;
    if (!d || e.pointerId !== d.id) return;
    this.rk = null;
    if (!d.cap) return;
    this.flush();
    this.setState({ drag: false });
    this.fling(this.velocity(d, e.timeStamp));
  }

  rackCancel(e) {
    const d = this.rk;
    if (!d || e.pointerId !== d.id) return;
    this.rk = null;
    if (!d.cap) return;
    this.flush();
    this.setState({ drag: false });
  }

  levSec(e, off) {
    const r = e.currentTarget.getBoundingClientRect();
    const f = this.cpClamp((e.clientY + off - r.top) / Math.max(1, r.height), 0, 1);
    return this.dayStart() + f * (this.dayEnd() - this.dayStart());
  }

  levDown(e) {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    e.currentTarget.setPointerCapture(e.pointerId);
    this.stopAnim();
    const r = e.currentTarget.getBoundingClientRect();
    const f = (this.now() - this.dayStart()) / (this.dayEnd() - this.dayStart());
    const hy = r.top + r.height * this.cpClamp(f, 0, 1);
    const grab = Math.abs(hy - e.clientY) <= 26;
    this.lv = { id: e.pointerId, off: grab ? hy - e.clientY : 0, y0: e.clientY, moved: false, s: [], glide: !grab };
    if (!grab) this.glide(this.levSec(e, 0), 320);
    this.setState({ drag: true });
  }

  levMove(e) {
    const d = this.lv;
    if (!d || e.pointerId !== d.id) return;
    if (!d.moved && Math.abs(e.clientY - d.y0) < 3) return;
    d.moved = true;
    if (d.glide) {
      this.stopAnim();
      d.glide = false;
    }
    const sec = this.levSec(e, d.off);
    this.sample(d, sec, e.timeStamp);
    this.queueScrub(sec);
  }

  levUp(e) {
    const d = this.lv;
    if (!d || e.pointerId !== d.id) return;
    this.lv = null;
    this.setState({ drag: false });
    if (!d.moved) return;
    this.flush();
    this.fling(this.velocity(d, e.timeStamp));
  }

  levCancel(e) {
    const d = this.lv;
    if (!d || e.pointerId !== d.id) return;
    this.lv = null;
    this.flush();
    this.setState({ drag: false });
  }

  levKey(e) {
    let d = 0;
    const step = e.shiftKey ? 1800 : 300;
    if (e.key === 'ArrowDown' || e.key === 'ArrowLeft') d = step;
    else if (e.key === 'ArrowUp' || e.key === 'ArrowRight') d = -step;
    else if (e.key === 'PageDown') d = 3600;
    else if (e.key === 'PageUp') d = -3600;
    else if (e.key === 'Home' || e.key === 'End') {
      e.preventDefault();
      this.stopAnim();
      this.scrub(e.key === 'Home' ? this.dayStart() : this.dayEnd() - 60);
      return;
    } else return;
    e.preventDefault();
    this.stopAnim();
    this.scrub(this.now() + d);
  }

  openDet(id) {
    clearTimeout(this.selT);
    clearTimeout(this.focT);
    this.lastId = id;
    this.setState({ sel: id, selClosing: false });
    this.focT = setTimeout(() => {
      const b = document.querySelector('.cd-x');
      if (b) b.focus();
    }, 90);
  }

  closeDet() {
    if (!this.state.sel) return;
    clearTimeout(this.selT);
    this.setState({ selClosing: true });
    this.selT = setTimeout(() => {
      this.setState({ sel: null, selClosing: false });
      const b = this.lastId && document.getElementById('cp-' + this.lastId);
      if (b) b.focus();
    }, 240);
  }

  renderVals() {
    const c = this.coreVals();
    const s = this.state;
    const t = c.nowSec;
    const VH = 224;
    const raw = {};
    this.items().forEach((x) => (raw[x.id] = x));
    const act = {};
    c.active.forEach((x) => (act[x.id] = x));
    const upc = {};
    c.upcoming.forEach((x) => (upc[x.id] = x));

    const caps = c.timeline
      .slice()
      .sort((a, b) => raw[a.id].S - raw[b.id].S || raw[a.id].E - raw[b.id].E)
      .map((x) => {
        const r = raw[x.id];
        const a = act[x.id];
        const u = upc[x.id];
        const state = x.isDone ? 'done' : x.isActive ? 'open' : x.isMissed ? 'missed' : 'up';
        const urgent = Boolean(a && a.urgent);
        let fill = 0;
        let lines = [];
        if (state === 'open') {
          fill = Math.max(2, a.pctLeft);
          lines = [
            { t: 'נפתח ' + x.startT, cls: '' },
            { t: x.endWord + ' ' + x.endT, cls: '' },
            { t: 'נשארו ' + a.leftNum + ' ' + a.leftUnit, cls: urgent ? 'left urg' : 'left' },
          ];
        } else if (state === 'done') {
          fill = 100;
          lines = [{ t: 'בוצע ' + x.at, cls: 'ok' }];
          const d = this.doneAt(x.id);
          if (d != null && d >= r.E) lines.push({ t: 'באיחור', cls: 'late' });
        } else if (state === 'missed') {
          fill = 4;
          lines = [
            { t: 'פוספס', cls: 'miss' },
            { t: 'נגמר ' + x.endT, cls: '' },
          ];
        } else {
          lines = [
            { t: 'נפתח ב-' + x.startT, cls: '' },
            { t: 'בעוד ' + this.cpHM(r.S - t), cls: 'dim' },
          ];
        }
        const cls = ['st-' + state, urgent ? 'urgent' : '', x.cls, s.sel === x.id ? 'sel' : ''].filter(Boolean).join(' ');
        const id = x.id;
        return {
          ...x,
          state,
          cls,
          fill,
          fillPx: Math.round((fill / 100) * VH),
          lines,
          aria: 'פרטי ' + x.name + ': ' + x.statusText + '. ' + x.range,
          pick: () => this.openDet(id),
          urgent,
        };
      });

    const sel = s.sel ? caps.find((q) => q.id === s.sel) : null;
    let det = {};
    if (sel) {
      const r = raw[sel.id];
      const a = act[sel.id];
      const span = Math.max(1, r.E - r.S);
      const dn = this.doneAt(sel.id);
      let elapsed = 0;
      let barFill = 0;
      let note = '';
      if (sel.state === 'open') {
        elapsed = this.cpClamp(((t - r.S) / span) * 100, 0, 100);
        barFill = a.pctLeft;
        note = 'נשארו ' + a.left + ' עד ' + sel.endT + (sel.endsTomorrow ? ' מחר' : '') + '.';
      } else if (sel.state === 'done') {
        elapsed = this.cpClamp((((dn == null ? t : dn) - r.S) / span) * 100, 0, 100);
        barFill = 100;
        note = 'סומן ב-' + sel.at + (dn != null && dn >= r.E ? ' · באיחור' : ' · בזמן') + '.';
      } else if (sel.state === 'missed') {
        elapsed = 100;
        note = 'הזמן עבר ב-' + sel.endT + '. עדיין אפשר לסמן שעשית.';
      } else {
        note = 'נפתח ב-' + sel.startT + ', בעוד ' + this.cpCompact(r.S - t) + '.';
      }
      det = {
        ...sel,
        stCls: 'st-' + sel.state,
        startCap: 'נפתח · ' + sel.fromName,
        endCap: sel.endWord + ' · ' + sel.toName,
        elapsed: elapsed.toFixed(1),
        barFill,
        note,
        canMark: sel.state === 'open' || sel.state === 'missed',
        markText: sel.state === 'open' ? sel.cta : 'בכל זאת עשיתי',
        markLabel: sel.state === 'open' ? sel.markLabel : 'בכל זאת עשיתי — סימון ' + sel.name,
        canUndo: sel.state === 'done',
        doMark: () => {
          this.closeDet();
          clearTimeout(this.mkT);
          this.mkT = setTimeout(() => sel.mark(), 250);
        },
        doUndo: () => {
          sel.undo();
          this.closeDet();
        },
      };
    }

    const Z = c.zmanim;
    const rawZ = this.zmanimList();
    const P = (id) => Z.find((z) => z.id === id).p;
    const prev = Z.filter((z) => z.past).pop();
    const next = Z.find((z) => z.isNext);
    const phaseText = next && prev ? 'בין ' + prev.name + ' ל' + next.name : prev ? 'אחרי ' + prev.name : '';
    const ticks = Z.map((z) => {
      const d = Math.abs(z.p - c.nowPos);
      return { cls: z.isNext ? 'next' : z.past ? 'past' : '', p: z.p, w: z.isNext ? 20 : Math.round(7 + 11 * Math.exp(-(d * d) / 18)) };
    });
    const slotBg =
      'linear-gradient(180deg,#4a3d8f 0%,#b9738e ' + P('misheyakir') + '%,#f4a76f ' + P('netz') + '%,#8cc0ee ' + P('sofTfila') + '%,#7fb4e8 ' + P('minchaG') + '%,#f0c27f ' + P('plag') + '%,#e4708c ' + P('shkia') + '%,#2a2f78 ' + P('tzeit') + '%,#0f1a3e 100%)';

    const zrows = Z.map((z, i) => ({
      ...z,
      inS: z.isNext ? 'בעוד ' + this.cpCompact(rawZ[i].S - t) : '',
      aria: 'הצגת היום ב-' + z.time + ': ' + z.name,
      go: () => {
        this.glide(rawZ[i].S, 700);
        this.jump('rack');
      },
    }));

    const upGroups = [];
    c.upcoming.forEach((x) => {
      let g = upGroups.find((q) => q.time === x.startT);
      if (!g) {
        g = { time: x.startT, names: [], isSun: x.isSun, isBox: x.isBox, isBook: x.isBook, isMoon: x.isMoon };
        upGroups.push(g);
      }
      g.names.push(x.short);
    });
    upGroups.forEach((g) => (g.name = g.names.join(' · ')));

    const opens = c.active.map((x) => ({
      ...x,
      openLine: 'נפתח ' + x.startT + ' · ' + x.endWord + ' ' + x.endT,
      leftLine: 'נשארו ' + x.left,
    }));

    const nowParts = c.nowT.split(':');
    const f = this.cpClamp(c.nowPos / 100, 0, 1);

    return {
      ...c,
      caps,
      det,
      detOn: Boolean(sel),
      detCls: s.selClosing ? 'closing' : '',
      detClose: () => this.closeDet(),
      msgs: c.messages.map((m) => ({ ...m, wcls: m.id === 'next' ? 'first' : '' })),
      noMessages: !c.hasMessages,
      opens,
      upGroups,
      noUpcoming: c.upcoming.length === 0,
      zrows,
      ticks,
      slotBg,
      phaseText,
      leverText: c.nowT + ' · ' + phaseText,
      dayStartT: this.clock(c.dayStartSec),
      dayEndT: this.clock(c.dayEndSec),
      nowH: nowParts[0],
      nowM: nowParts[1],
      nextIn: this.cpCompact(next ? rawZ[Z.indexOf(next)].S - t : c.dayEndSec - t),
      ambX: (88 - 76 * f).toFixed(1),
      ambDay: c.isNight ? '0' : '0.55',
      ambNight: c.isNight ? '0.55' : '0',
      dragCls: s.drag ? 'drag' : '',
      rackDown: (e) => this.rackDown(e),
      rackMove: (e) => this.rackMove(e),
      rackUp: (e) => this.rackUp(e),
      rackCancel: (e) => this.rackCancel(e),
      levDown: (e) => this.levDown(e),
      levMove: (e) => this.levMove(e),
      levUp: (e) => this.levUp(e),
      levCancel: (e) => this.levCancel(e),
      levKey: (e) => this.levKey(e),
    };
  }
}
</script>
