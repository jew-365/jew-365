<script>
class Component extends DCLogic {
/*CORE*/

  boardState() {
    return { sel: null, filt: null, drag: false, touched: false, vf: 0 };
  }

  boardMount() {
    this.guard = (e) => {
      if (e.target && e.target.closest && e.target.closest('[data-g]')) e.preventDefault();
    };
    this.box = document.getElementById('dialBox');
    if (this.box) this.box.addEventListener('touchstart', this.guard, { passive: false });
    this.orbitDelay = '-' + ((Date.now() / 1000) % 60).toFixed(2) + 's';
  }

  boardUnmount() {
    clearTimeout(this.selTimer);
    cancelAnimationFrame(this.vRaf);
    cancelAnimationFrame(this.dRaf);
    cancelAnimationFrame(this.cRaf);
    if (this.box) this.box.removeEventListener('touchstart', this.guard);
  }

  eased(t, key) {
    const now = performance.now();
    const dt = Math.min(100, now - (this.vAt || now - 16));
    this.vAt = now;
    const calm = typeof matchMedia === 'function' && matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (this.vis == null || this.visKey !== key || calm) {
      this.vis = t;
    } else {
      const d = t - this.vis;
      const tau = this.state.drag ? 40 : 130;
      this.vis = Math.abs(d) < 45 ? t : this.vis + d * (1 - Math.exp(-dt / tau));
    }
    this.visKey = key;
    if (this.vis !== t) this.kick();
    return this.vis;
  }

  kick() {
    if (this.vRaf) return;
    this.vRaf = requestAnimationFrame(() => {
      this.vRaf = 0;
      this.setState((st) => ({ vf: st.vf + 1 }));
    });
  }

  dPoint(e) {
    const r = document.getElementById('dialBox').getBoundingClientRect();
    return { x: ((e.clientX - r.left) * 350) / r.width, y: ((e.clientY - r.top) * 372) / r.height };
  }

  dRaw(p) {
    const dx = p.x - 175;
    const dy = p.y - 186;
    if (Math.hypot(dx, dy) < 30) return null;
    let a = Math.atan2(-dx, dy);
    if (a < 0) a += 2 * Math.PI;
    return (a / (2 * Math.PI)) * 86400;
  }

  dSet(sec) {
    this.dPend = sec;
    if (this.dRaf) return;
    this.dRaf = requestAnimationFrame(() => {
      this.dRaf = 0;
      this.dFlush();
    });
  }

  dFlush() {
    if (this.dPend == null) return;
    const v = this.dPend;
    this.dPend = null;
    this.scrub(v);
  }

  dApply(fv, ts) {
    const g = this.dg;
    const lo = this.dayStart();
    const hi = this.dayEnd() - 60;
    const vt = Math.max(lo - 43200, Math.min(hi + 43200, fv - g.off));
    g.off *= 0.92;
    const sec = Math.max(lo, Math.min(hi, vt));
    g.hist.push([ts, sec]);
    while (g.hist.length > 2 && ts - g.hist[0][0] > 110) g.hist.shift();
    this.dSet(sec);
  }

  dDown(e) {
    if (e.button > 0) return;
    const raw = this.dRaw(this.dPoint(e));
    if (raw == null) return;
    this.cStop();
    try {
      e.currentTarget.setPointerCapture(e.pointerId);
    } catch (err) {}
    const t = this.now();
    const onHand = e.currentTarget.getAttribute('data-g') === 'hand';
    const fv = raw + 86400 * Math.round((t - raw) / 86400);
    this.dg = { id: e.pointerId, fv, off: onHand ? fv - t : 0, hist: [] };
    this.setState({ drag: true, touched: true });
    if (!onHand) this.dApply(fv, e.timeStamp);
  }

  dMove(e) {
    const g = this.dg;
    if (!g || e.pointerId !== g.id) return;
    const raw = this.dRaw(this.dPoint(e));
    if (raw == null) return;
    g.fv = raw + 86400 * Math.round((g.fv - raw) / 86400);
    this.dApply(g.fv, e.timeStamp);
  }

  dUp(e) {
    const g = this.dg;
    if (!g || e.pointerId !== g.id) return;
    this.dg = null;
    try {
      e.currentTarget.releasePointerCapture(e.pointerId);
    } catch (err) {}
    this.dFlush();
    this.setState({ drag: false });
    const h = g.hist;
    const last = h[h.length - 1];
    const calm = typeof matchMedia === 'function' && matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (!calm && h.length > 1 && last && e.timeStamp - last[0] < 90) {
      const v = (last[1] - h[0][1]) / Math.max(16, last[0] - h[0][0]);
      if (Math.abs(v) > 1.2) this.cStart(Math.max(-36, Math.min(36, v)), last[1]);
    }
  }

  cStart(v, t) {
    this.cs = { v, t, at: performance.now() };
    this.cRaf = requestAnimationFrame((ts) => this.cStep(ts));
  }

  cStep(ts) {
    const c = this.cs;
    if (!c) return;
    const dt = Math.max(0, Math.min(48, ts - c.at));
    c.at = ts;
    const lo = this.dayStart();
    const hi = this.dayEnd() - 60;
    c.t += c.v * dt;
    c.v *= Math.exp(-dt / 330);
    if (c.t <= lo || c.t >= hi) {
      c.t = Math.max(lo, Math.min(hi, c.t));
      c.v = 0;
    }
    this.scrub(c.t);
    if (Math.abs(c.v) < 0.35) {
      this.cs = null;
      return;
    }
    this.cRaf = requestAnimationFrame((x) => this.cStep(x));
  }

  cStop() {
    cancelAnimationFrame(this.cRaf);
    this.cs = null;
  }

  dKey(e) {
    const t = this.now();
    const keys = { ArrowRight: 300, ArrowUp: 300, ArrowLeft: -300, ArrowDown: -300, PageUp: 3600, PageDown: -3600 };
    let to = null;
    if (e.key in keys) to = t + keys[e.key];
    else if (e.key === 'Home') to = this.dayStart();
    else if (e.key === 'End') to = this.dayEnd() - 60;
    if (to == null) return;
    e.preventDefault();
    this.cStop();
    this.setState({ touched: true });
    this.scrub(to);
  }

  polar(sec, r) {
    const a = ((sec % 86400) / 86400) * 2 * Math.PI;
    return { x: 175 - r * Math.sin(a), y: 186 + r * Math.cos(a) };
  }

  arcD(s, e, r) {
    const span = Math.max(0.01, Math.min(e - s, 86399));
    const p0 = this.polar(s, r);
    const p1 = this.polar(s + span, r);
    const n = (v) => v.toFixed(2);
    return 'M' + n(p0.x) + ' ' + n(p0.y) + ' A' + r + ' ' + r + ' 0 ' + (span > 43200 ? 1 : 0) + ' 1 ' + n(p1.x) + ' ' + n(p1.y);
  }

  pick(id) {
    this.setState((s) => ({ sel: s.sel === id ? null : id }));
  }

  markSel(id) {
    this.mark(id);
    clearTimeout(this.selTimer);
    this.selTimer = setTimeout(() => {
      if (this.state.sel === id) this.setState({ sel: null });
    }, 1150);
  }

  renderVals() {
    const c = this.coreVals();
    const t = this.now();
    const vis = this.eased(t, c.dateKey);
    const st = this.state;
    const RF = 144;
    const TR = [120, 110, 100, 90];
    const its = this.items();
    const zl = this.zmanimList();
    const zBy = Object.fromEntries(zl.map((z) => [z.id, z]));
    const tlBy = Object.fromEntries(c.timeline.map((x) => [x.id, x]));
    const itBy = Object.fromEntries(its.map((x) => [x.id, x]));
    const pad = (n) => String(n).padStart(2, '0');

    const overlap = (a, b) => [-86400, 0, 86400].some((k) => a.S < b.E + k && b.S + k < a.E);
    const lanes = [];
    const laneOf = {};
    its
      .slice()
      .sort((a, b) => b.E - b.S - (a.E - a.S) || a.S - b.S)
      .forEach((x) => {
        let i = 0;
        while (lanes[i] && lanes[i].some((y) => overlap(x, y))) i += 1;
        (lanes[i] = lanes[i] || []).push(x);
        laneOf[x.id] = i;
      });
    const radiusOf = (id) => TR[Math.min(laneOf[id], TR.length - 1)];

    const selTl = st.sel ? tlBy[st.sel] : null;
    const fTl = selTl || (c.hasHero ? tlBy[c.hero.id] : null);
    const focusId = fTl ? fTl.id : null;

    const arcs = its.map((x, i) => {
      const r = radiusOf(x.id);
      const tl = tlBy[x.id];
      const ins = (4 / r) * (86400 / (2 * Math.PI));
      const doneSec = this.doneAt(x.id);
      const mk = doneSec != null ? this.polar(doneSec, r) : { x: 0, y: 0 };
      const rem = Math.max(vis, x.S + ins);
      return {
        id: x.id,
        status: tl.status,
        d: this.arcD(x.S + ins, x.E - ins, r),
        dFull: this.arcD(x.S, x.E, r),
        dRem: this.arcD(rem, Math.max(rem + 1, x.E - ins), r),
        mid: 'm-' + x.id,
        murl: 'url(#m-' + x.id + ')',
        delay: (laneOf[x.id] * 0.14 + i * 0.07).toFixed(2),
        mx: mk.x.toFixed(2),
        my: mk.y.toFixed(2),
        lateCls: doneSec != null && doneSec >= x.E ? 'late' : '',
        pressed: st.sel === x.id,
        label: x.name + ' · ' + tl.statusText + ' · ' + tl.startT + ' עד ' + tl.endT + ' · הצגה במרכז השעון',
        pick: () => this.pick(x.id),
        key: (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            this.pick(x.id);
          }
        },
      };
    });
    const selArc = focusId ? arcs.find((a) => a.id === focusId) : null;
    const lits = its
      .map((x, i) => {
        const r = radiusOf(x.id);
        const status = tlBy[x.id].status;
        const ins = status === 'missed' ? 0 : (4 / r) * (86400 / (2 * Math.PI));
        const from = x.S + ins;
        const to = Math.min(vis, x.E - ins);
        return status === 'upcoming' || to - from < 120 ? null : { cls: 'l-' + status, d: this.arcD(from, to, r) };
      })
      .filter(Boolean);

    const ticks = Array.from({ length: 24 }, (_, h) => {
      const major = h % 6 === 0;
      const a = this.polar(h * 3600, 128);
      const b = this.polar(h * 3600, major ? 135 : 132.5);
      return { x1: a.x.toFixed(2), y1: a.y.toFixed(2), x2: b.x.toFixed(2), y2: b.y.toFixed(2), cls: major ? 'maj' : '' };
    });

    const nextZl = zl.find((z) => z.S > t) || null;
    const dots = zl.map((z) => {
      const isNext = nextZl && z.id === nextZl.id;
      const p = this.polar(z.S, 137);
      return { x: p.x.toFixed(2), y: p.y.toFixed(2), r: isNext ? 6.4 : 4.4, cls: isNext ? 'next' : z.S <= t ? 'past' : '' };
    });
    const nd = nextZl ? this.polar(nextZl.S, 137) : null;

    const place = (sec, w, h, gap) => {
      const a = ((sec % 86400) / 86400) * 2 * Math.PI;
      const ext = Math.abs(Math.sin(a)) * (w / 2) + Math.abs(Math.cos(a)) * (h / 2);
      const p = this.polar(sec, RF + gap + ext);
      return { x: p.x, y: p.y, w, h };
    };
    const hit = (a, b) => !(a.x + a.w / 2 < b.x - b.w / 2 - 3 || a.x - a.w / 2 > b.x + b.w / 2 + 3 || a.y + a.h / 2 < b.y - b.h / 2 - 3 || a.y - a.h / 2 > b.y + b.h / 2 + 3);
    const bubR = place(vis, 46, 24, 6);
    const keys = ['netz', 'chatzot', 'shkia', 'chatzotL'];
    const labels = keys.map((id) => {
      const z = zBy[id];
      const w = Math.max(34, z.short.length * 7 + 8);
      const r = place(z.S, w, 31, 5);
      const isNext = nextZl && nextZl.id === id;
      return { id, rect: r, name: z.short, time: z.t, cls: (isNext ? 'nx ' : z.S <= t ? 'past ' : '') + (hit(r, bubR) ? 'hid' : '') };
    });
    if (nextZl && !keys.includes(nextZl.id)) {
      const w = Math.max(34, nextZl.short.length * 7 + 8);
      const r = place(nextZl.S, w, 31, 5);
      const clash = hit(r, bubR) || labels.some((l) => hit(r, l.rect));
      labels.push({ id: nextZl.id, rect: r, name: nextZl.short, time: nextZl.t, cls: 'nx ' + (clash ? 'hid' : '') });
    }
    const labelVals = labels.map((l) => ({ name: l.name, time: l.time, cls: l.cls, x: l.rect.x.toFixed(1), y: l.rect.y.toFixed(1) }));

    const sec = (id) => zBy[id].S;
    const deg = (s) => (((s - 43200) / 86400) * 360).toFixed(1);
    const stops = [
      [43200, 'High'],
      [sec('plag'), 'Day'],
      [sec('shkia'), 'Dusk'],
      [sec('tzeit'), 'Night'],
      [86400, 'Deep'],
      [86400 + sec('alot'), 'Night'],
      [86400 + sec('netz'), 'Dawn'],
      [86400 + sec('netz') + 3600, 'Day'],
      [129600, 'High'],
    ];
    const skyBg = 'conic-gradient(' + stops.map(([s, k]) => 'var(--sky' + k + ') ' + deg(s) + 'deg').join(', ') + ')';

    let f = null;
    if (fTl) {
      const x = itBy[fTl.id];
      const s = fTl.status;
      const fmt = (secs) => {
        const m = Math.max(0, Math.ceil(secs / 60));
        return m < 60 ? { num: String(m), unit: 'דקות' } : { num: Math.floor(m / 60) + ':' + pad(m % 60), unit: 'שעות' };
      };
      f = {
        short: x.short,
        isUpcoming: s === 'upcoming',
        metaStart: (s === 'upcoming' ? 'מתחיל ב-' : 'התחיל ב-') + fTl.startT,
        metaEnd: 'נגמר ב-' + fTl.endT,
        hasBtn: s !== 'upcoming',
        icCheck: s !== 'done',
        icUndo: s === 'done',
      };
      if (s === 'active') {
        const left = fmt(x.E - t);
        const urgent = Math.ceil((x.E - t) / 60) <= 45;
        Object.assign(f, {
          bigText: left.num,
          bigUnit: left.unit + ' נותרו',
          bigCls: urgent ? 'c-urgent' : 'c-active',
          btnLabel: x.cta,
          btnCls: 'primary',
          btnAria: fTl.markLabel,
          btnClick: () => this.markSel(x.id),
        });
      } else if (s === 'done') {
        const d = this.doneAt(x.id);
        Object.assign(f, {
          bigText: 'בוצע',
          bigUnit: 'סומן ב-' + this.clock(d) + (d >= x.E ? ' · באיחור' : ''),
          bigCls: 'c-done',
          btnLabel: 'ביטול סימון',
          btnCls: 'ghost',
          btnAria: 'ביטול הסימון של ' + x.name,
          btnClick: () => this.undo(x.id),
        });
      } else if (s === 'missed') {
        Object.assign(f, {
          bigText: 'פוספס',
          bigUnit: 'עבר לפני ' + this.left(t - x.E),
          bigCls: 'c-missed',
          btnLabel: 'בכל זאת עשיתי',
          btnCls: 'warn',
          btnAria: 'בכל זאת עשיתי — סימון ' + x.name,
          btnClick: () => this.markSel(x.id),
        });
      } else {
        const wait = fmt(x.S - t);
        Object.assign(f, {
          bigText: wait.num,
          bigUnit: wait.unit + ' לפתיחה',
          bigCls: 'c-ahead',
          btnLabel: '',
          btnCls: '',
          btnAria: '',
          btnClick: () => {},
        });
      }
    }
    const statusWord = { active: 'פתוח עכשיו', done: 'בוצע', missed: 'פוספס', upcoming: 'בהמשך' };

    const legend = [
      { key: 'active', label: 'פתוח', n: c.activeN, swCls: 'sw-open' },
      { key: 'done', label: 'בוצע', n: c.doneN, swCls: 'sw-done' },
      { key: 'missed', label: 'פוספס', n: c.missedN, swCls: 'sw-missed' },
      { key: 'upcoming', label: 'בהמשך', n: c.upcomingN, swCls: 'sw-ahead' },
    ].map((g) => ({
      ...g,
      on: st.filt === g.key,
      cls: g.n === 0 ? 'zero' : '',
      aria: g.label + ': ' + g.n + (st.filt === g.key ? ' · מסנן פעיל, לחיצה לניקוי' : ' · סינון הרשימה'),
      toggle: () => this.setState((s) => ({ filt: s.filt === g.key ? null : g.key })),
    }));

    const filtered = c.timeline.filter((x) => !st.filt || x.status === st.filt);
    const rows = filtered.map((x, i) => {
      const it = itBy[x.id];
      const d = this.doneAt(x.id);
      const stText =
        x.status === 'active'
          ? 'נשארו ' + this.left(it.E - t)
          : x.status === 'done'
            ? 'בוצע ב-' + x.at
            : x.status === 'missed'
              ? 'פוספס · עבר לפני ' + this.left(t - it.E)
              : 'בעוד ' + this.left(it.S - t);
      return {
        ...x,
        delay: (i * 0.05).toFixed(2),
        rowCls: (x.id === focusId ? 'foc ' : '') + x.cls,
        window: (x.status === 'upcoming' ? 'נפתח ב-' : 'התחיל ב-') + x.startT + ' · נגמר ב-' + x.endT,
        stText,
        lateTag: x.status === 'done' && d >= it.E,
        undoLabel: 'ביטול הסימון של ' + x.name,
        markRow: () => this.markSel(x.id),
        focus: () => {
          this.setState({ sel: x.id });
          this.jump('dialTop');
        },
        focusLabel: 'הצגה בשעון: ' + x.name + ' · ' + statusWord[x.status],
      };
    });

    const listTitles = { active: 'פתוחות עכשיו', done: 'מה שעשית', missed: 'מה שפספסת', upcoming: 'בהמשך היום' };
    const emptyBy = {
      active: [c.activeEmptyTitle, c.activeEmptyText],
      done: [c.doneEmpty, 'המצווה הראשונה שתסמן תופיע כאן.'],
      missed: [c.missedEmpty, 'אם משהו יחמוק, אפשר יהיה לסמן אותו כאן אחר כך.'],
      upcoming: ['אין עוד מצוות להיום', 'כל השאר כבר נפתח.'],
    };
    const emp = emptyBy[st.filt] || ['', ''];
    const notes = [];
    if (!st.filt && c.noMissed) notes.push({ text: c.missedEmpty });
    if (!st.filt && c.noDone) notes.push({ text: c.doneEmpty });

    const centerAria = fTl ? 'במרכז השעון: ' + fTl.name + ', ' + statusWord[fTl.status] : 'במרכז השעון: ' + c.activeEmptyTitle;

    return {
      ...c,
      filterKey: st.filt || 'none',
      dialAria: 'שעון של 24 שעות. ' + c.countLabel,
      streakLabel: c.streak + ' ימים ברצף',
      skyBg,
      ticks,
      trackCircles: lanes.map((_, i) => ({ r: TR[Math.min(i, TR.length - 1)] })),
      arcs,
      arcsUp: arcs.filter((a) => a.status === 'upcoming'),
      arcsMiss: arcs.filter((a) => a.status === 'missed'),
      arcsDone: arcs.filter((a) => a.status === 'done'),
      arcsAct: arcs.filter((a) => a.status === 'active'),
      hasSelD: Boolean(selArc),
      selD: selArc ? selArc.dFull : '',
      dots,
      hasNextDot: Boolean(nd),
      nextDot: nd ? { x: nd.x.toFixed(2), y: nd.y.toFixed(2) } : { x: 0, y: 0 },
      handDeg: ((vis / 86400) * 360).toFixed(3),
      sweepBg:
        'conic-gradient(from ' +
        ((((((vis / 86400) * 360 + 180 - 64) % 360) + 360) % 360)).toFixed(1) +
        'deg, transparent 0deg, color-mix(in srgb, var(--accent) 30%, transparent) 64deg, transparent 64.6deg, transparent 360deg)',
      lits,
      dialCls: (st.drag ? 'drag ' : '') + (c.isScrub ? 'scr ' : '') + (st.touched ? '' : 'hintOn'),
      dDown: (e) => this.dDown(e),
      dMove: (e) => this.dMove(e),
      dUp: (e) => this.dUp(e),
      dKey: (e) => this.dKey(e),
      sliderMin: Math.round(this.dayStart()),
      sliderMax: Math.round(this.dayEnd() - 60),
      sliderNow: Math.round(t),
      sliderText: c.nowT + ', הבא: ' + c.nextZ.name + ' ' + c.nextZ.left,
      orbitDelay: this.orbitDelay || '0s',
      handEnd: (186 + Math.hypot(bubR.x - 175, bubR.y - 186)).toFixed(1),
      labels: labelVals,
      bub: { x: bubR.x.toFixed(1), y: bubR.y.toFixed(1) },
      hasFocus: Boolean(f),
      noFocus: !f,
      f: f || {},
      centerCls: fTl && fTl.isMarking ? 'marking' : '',
      centerAnim: 'cf-' + this.flip('center', fTl ? fTl.id + ':' + fTl.status : 'none'),
      centerAria,
      legend,
      hasFilter: Boolean(st.filt),
      clearFilter: () => this.setState({ filt: null }),
      listTitle: listTitles[st.filt] || 'מצוות היום',
      rows,
      rowsN: rows.length,
      hasRows: rows.length > 0,
      noRows: rows.length === 0,
      emptyTitle: emp[0],
      emptyText: emp[1],
      notes,
      hasNotes: notes.length > 0,
      msgs: c.messages.map((m, i) => ({ ...m, delay: (i * 0.05).toFixed(2) })),
    };
  }
}
</script>
