<div class="ur-t"><b>{{l.name}}</b><span>{{l.opensTxt}} · {{l.inText}}</span><span class="ur-bar" aria-hidden="true"><i style="width: {{l.near}}%"></i></span></div>
</li>

</sc-if>

</section>

</div>

<div class="fade-b" aria-hidden="true"></div>

<div class="scr {{scCls}}">
<div class="scr-p">
<div class="scr-hit" role="slider" tabindex="0" aria-label="סרגל הזמן. גררו כדי לנסוע בזמן, חצים מזיזים חמש דקות, Page Up ו-Page Down שעה" aria-orientation="horizontal" aria-valuemin="{{sliderMin}}" aria-valuemax="{{sliderMax}}" aria-valuenow="{{sliderNow}}" aria-valuetext="{{sliderText}}" onPointerDown="{{scDown}}" onPointerMove="{{scMove}}" onPointerUp="{{scUp}}" onPointerCancel="{{scUp}}" onKeyDown="{{scKey}}">
<div class="scr-bub {{bubCls}}" style="right: {{bubP}}%" aria-hidden="true"><b>{{nowT}}</b><span>{{bubName}}</span></div>
<div class="scr-rail" id="scRail">
<i class="scr-fill" style="width: {{nowPos}}%"></i>
<sc-for list="{{marks}}" as="m" hint-placeholder-count="11"><i class="scr-mk {{m.cls}}" style="right: {{m.p}}%"></i></sc-for>
<sc-if value="{{showLive}}" hint-placeholder-val="{{ false }}"><i class="scr-lv" style="right: {{liveP}}%"></i></sc-if>
<i class="scr-thumb" style="right: {{nowPos}}%"></i>
</div>
</div>
<div class="scr-e" aria-hidden="true"><span>{{startClock}}</span><span>{{endClock}}</span></div>
</div>
</div>

<sc-if value="{{islOpen}}" hint-placeholder-val="{{ false }}"><button class="isl-scrim" onClick="{{islClose}}" aria-label="סגירת הפעילות החיה" tabindex="-1"></button></sc-if>
<div class="isl-w" style="transform: translateY({{islDodge}}px)">
<div class="isl {{islCls}} {{isl.urgentCls}}" style="width: {{islW}}; height: {{islH}}; border-radius: {{islR}}">
<button class="isl-c" onClick="{{islToggle}}" aria-expanded="{{islOpen}}" aria-label="{{isl.aria}}">
<span class="isl-ic">
<svg class="isl-rg" viewBox="0 0 30 30" aria-hidden="true"><circle class="isl-tr" cx="15" cy="15" r="13"></circle><sc-if value="{{isl.isOpen}}" hint-placeholder-val="{{ true }}"><circle class="isl-ar" cx="15" cy="15" r="13" pathLength="100" style="stroke-dashoffset: {{isl.ringOff}}"></circle></sc-if></svg>
[[icItem:isl]]<sc-if value="{{isl.isClock}}" hint-placeholder-val="{{ false }}">[[ic:clock]]</sc-if>
</span>

<sc-if value="{{isl.notOpen}}" hint-placeholder-val="{{ false }}"><span class="isl-tx">{{isl.text}}</span></sc-if>

<div class="io-h">
<span class="io-tile">[[icItem:isl]]<sc-if value="{{isl.isClock}}" hint-placeholder-val="{{ false }}">[[ic:clock]]</sc-if></span>
<div class="io-nm"><h3>{{isl.name}}</h3><p>{{isl.caption}}</p></div>
<button class="io-x" onClick="{{islClose}}" aria-label="סגירת הפעילות החיה" tabindex="{{islTab}}">[[ic:close]]</button>
</div>
<div class="io-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="{{isl.pctNow}}" aria-label="{{isl.barLabel}}"><i style="width: {{isl.pct}}%"></i></div>
<div class="io-row">
<span class="io-cd"><span>{{isl.cdLabel}}</span><b><sc-for list="{{isl.cells}}" as="k" hint-placeholder-count="5"><span class="rc {{k.cls}}">{{k.ch}}</span></sc-for></b></span>
<span>{{isl.sideTxt}}</span>
</div>
<div class="io-acts">
<sc-if value="{{isl.canMark}}" hint-placeholder-val="{{ true }}"><button class="io-cta" onClick="{{islMark}}" aria-label="{{isl.markLabel}}" tabindex="{{islTab}}">[[ic:check]]<span>{{isl.cta}}</span></button></sc-if>
<sc-if value="{{isl.hasText}}" hint-placeholder-val="{{ true }}"><button class="io-txt {{isl.txtCls}}" onClick="{{isl.openText}}" aria-label="פתיחת הנוסח: {{isl.name}}" tabindex="{{islTab}}">[[ic:book]]<span>נוסח</span></button></sc-if>
</div>
</div>
</div>
</div>
</template>
<script>
class Component extends DCLogic {
/*CORE*/

  boardState() {
    this.scP = null;
    this.scRaf = 0;
    this.scTgt = 0;
    this.nsd = null;
    this.nsRaf = 0;
    this.nsPend = null;
    this.swipeEnd = -1000;
    this.tw = false;
    this.twRaf = 0;
    this.rl = {};
    this.liveRef = null;
    this.msgById = {};
    return { islOpen: false, zx: false, stk: {}, swipe: null, scDrag: false, scKb: false };
  }

  boardMount() {
    this.rm = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };
    this.onEsc = (e) => {
      if (e.key === 'Escape' && this.state.islOpen) this.setState({ islOpen: false });
    };
    document.addEventListener('keydown', this.onEsc);
  }

  boardUnmount() {
    [this.kbT, this.flyT].forEach((x) => clearTimeout(x));
    cancelAnimationFrame(this.scRaf);
    cancelAnimationFrame(this.nsRaf);
    cancelAnimationFrame(this.twRaf);
    document.removeEventListener('keydown', this.onEsc);
  }

  pad(n) {
    return String(n).padStart(2, '0');
  }

  hms(sec) {
    const s = Math.max(0, Math.ceil(sec));
    const h = Math.floor(s / 3600);
    const m = Math.floor((s % 3600) / 60);
    return h > 0 ? h + ':' + this.pad(m) + ':' + this.pad(s % 60) : this.pad(m) + ':' + this.pad(s % 60);
  }

  roll(key, str, still) {
    const st = this.rl[key] || (this.rl[key] = []);
    return Array.from(str).map((ch, i) => {
      let e = st[i];
      if (!e) e = st[i] = { cur: ch, prev: '', k: 0 };
      if (e.cur !== ch) {
        if (still) {
          e.cur = ch;
          e.prev = '';
        } else {
          e.prev = e.cur;
          e.cur = ch;
          e.k = e.k === 1 ? 2 : 1;
        }
      }
      const cls = e.k === 1 ? 'ro-a' : e.k === 2 ? 'ro-b' : '';
      return { ch: e.cur, prev: e.prev, cls, pcls: e.prev ? cls : '' };
    });
  }

  scBounds() {
    return [this.dayStart(), this.dayEnd() - 60];
  }

  scSeek(sec) {
    this.scTgt = sec;
    if (this.scRaf) return;
    this.scRaf = requestAnimationFrame(() => {
      this.scRaf = 0;
      this.scrub(this.scTgt);
    });
  }

  scSecAt(clientX) {
    const r = document.getElementById('scRail').getBoundingClientRect();
    const d0 = this.dayStart();
    const span = this.dayEnd() - d0;
    const p = Math.max(0, Math.min(1, (r.right - clientX) / r.width));
    const kx = r.width / span;
    let sec = d0 + p * span;
    let best = null;
    this.zmanimList().forEach((z) => {
      const d = Math.abs(z.S - sec) * kx;
      if (d <= 6 && (!best || d < best.d)) best = { S: z.S, d };
    });
    if (best) sec = best.S;
    const [lo, hi] = this.scBounds();
    return Math.max(lo, Math.min(hi, sec));
  }

  scDown(e) {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    this.twStop();
    try {
      e.currentTarget.setPointerCapture(e.pointerId);
    } catch (err) {}
    this.scP = e.pointerId;
    this.setState({ scDrag: true, islOpen: false });
    this.scSeek(this.scSecAt(e.clientX));
  }

  scMove(e) {
    if (this.scP !== e.pointerId) return;
    this.scSeek(this.scSecAt(e.clientX));
  }

  scUp(e) {
    if (this.scP !== e.pointerId) return;
    this.scP = null;
    try {
      e.currentTarget.releasePointerCapture(e.pointerId);
    } catch (err) {}
    cancelAnimationFrame(this.scRaf);
    this.scRaf = 0;
    if (e.type !== 'pointercancel') this.scrub(this.scTgt);
    this.setState({ scDrag: false });
  }

  scKey(e) {
    const t = this.now();
    const [lo, hi] = this.scBounds();
    const step = { ArrowLeft: 300, ArrowUp: 300, ArrowRight: -300, ArrowDown: -300, PageUp: 3600, PageDown: -3600 };
    const to = e.key in step ? t + step[e.key] : e.key === 'Home' ? lo : e.key === 'End' ? hi : null;
    if (to == null) return;
    e.preventDefault();
    this.twStop();
    this.scrub(to);
    clearTimeout(this.kbT);
    this.setState({ scKb: true });
    this.kbT = setTimeout(() => this.setState({ scKb: false }), 1500);
  }

  twStop() {
    cancelAnimationFrame(this.twRaf);
    this.twRaf = 0;
    this.tw = false;
  }

  twTo(sec) {
    this.twStop();
    const [lo, hi] = this.scBounds();
    const a = this.now();
    const b = Math.max(lo, Math.min(hi, sec));
    if (this.rm.matches || Math.abs(b - a) < 1) {
      this.scrub(b);
      return;
    }
    this.tw = true;
    const t0 = performance.now();
    const ms = 520;
    const step = (ts) => {
      const k = Math.min(1, (ts - t0) / ms);
      if (k >= 1) {
        this.tw = false;
        this.twRaf = 0;
        this.scrub(b);
        return;
      }
      this.scrub(a + (b - a) * (1 - Math.pow(1 - k, 3)));
      this.twRaf = requestAnimationFrame(step);
    };
    this.twRaf = requestAnimationFrame(step);
  }

  nsSet(v) {
    this.nsPend = v;
    if (this.nsRaf) return;
    this.nsRaf = requestAnimationFrame(() => {
      this.nsRaf = 0;
      if (this.nsPend) this.setState({ swipe: this.nsPend });
      this.nsPend = null;
    });
  }

  nsDown(e, m) {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    this.nsd = { pid: e.pointerId, el: e.currentTarget, id: m.id, can: m.canDismiss, x0: e.clientX, x: e.clientX, ts: performance.now(), v: 0, dx: 0, moved: false };
  }

  nsMove(e) {
    const d = this.nsd;
    if (!d || d.pid !== e.pointerId) return;
    if (!d.moved) {
      if (Math.abs(e.clientX - d.x0) < 8) return;
      d.moved = true;
      try {
        d.el.setPointerCapture(e.pointerId);
      } catch (err) {}
    }
    const ts = performance.now();
    const raw = e.clientX - d.x0;
    d.v = d.v * 0.6 + ((e.clientX - d.x) / Math.max(1, ts - d.ts)) * 0.4;
    d.x = e.clientX;
    d.ts = ts;
    d.dx = d.can ? raw : Math.sign(raw) * Math.min(64, Math.abs(raw) * 0.3);
    this.nsSet({ id: d.id, dx: d.dx, drag: true });
  }

  nsUp(e) {
    const d = this.nsd;
    if (!d || d.pid !== e.pointerId) return;
    this.nsd = null;
    cancelAnimationFrame(this.nsRaf);
    this.nsRaf = 0;
    this.nsPend = null;
    try {
      d.el.releasePointerCapture(e.pointerId);
    } catch (err) {}
    if (!d.moved) return;
    this.swipeEnd = performance.now();
    const fling = Math.abs(d.v) > 0.7 && Math.abs(d.dx) > 40;
    if (e.type !== 'pointercancel' && d.can && (Math.abs(d.dx) > 96 || fling)) {
      this.setState({ swipe: { id: d.id, dx: (d.dx < 0 ? -1 : 1) * 460, fly: true } });
      clearTimeout(this.flyT);
      this.flyT = setTimeout(() => {
        const m = this.msgById[d.id];
        if (m) m.dismiss();
      }, 240);
    } else {
      this.setState({ swipe: { id: d.id, dx: 0, settle: true } });
    }
  }

  justSwiped() {
    return performance.now() - this.swipeEnd < 400;
  }

  renderVals() {
    const c = this.coreVals();
    const s = this.state;
    const t = c.nowSec;
    const d0 = c.dayStartSec;
    const d1 = c.dayEndSec;
    const span = d1 - d0;
    const still = s.scDrag || this.tw;
    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
    const its = this.items();
    const itBy = Object.fromEntries(its.map((x) => [x.id, x]));
    const Z = this.zmanimList();
    const flags = (x) => ({ isSun: Boolean(x.isSun), isBox: Boolean(x.isBox), isBook: Boolean(x.isBook), isMoon: Boolean(x.isMoon) });

    const sec = ((Math.floor(t) % 60) + 60) % 60;
    const clkCells = this.roll('clk', c.nowT, still).map((k) => ({ ...k, isSep: k.ch === ':', isDig: k.ch !== ':' }));

    const zi = Z.findIndex((z) => z.S > t);
    const nzS = zi >= 0 ? Z[zi].S : d1;
    const prevS = Z.filter((z) => z.S <= t).reduce((a, z) => Math.max(a, z.S), d0);

    const act = c.active[0] || null;
    const nxt = c.upcoming[0] || null;
    let isl;
    if (act) {
      const x = itBy[act.id];
      const rem = x.E - t;
      const frac = clamp(rem / (x.E - x.S), 0, 1);
      isl = {
        ...flags(act),
        isClock: false,
        isOpen: true,
        notOpen: false,
        text: '',
        cells: this.roll('isl', this.hms(rem), still),
        ringOff: (100 * (1 - frac)).toFixed(2),
        name: act.name,
        caption: 'התחיל ' + act.startT + ' · ' + act.endWord + ' ' + act.endT,
        pct: (100 * (1 - frac)).toFixed(2),
        pctNow: Math.round(100 * (1 - frac)),
        barLabel: 'התקדמות: ' + act.name,
        cdLabel: 'נותרו',
        sideTxt: Math.round(100 * (1 - frac)) + '% עבר',
        canMark: true,
        hasText: true,
        txtCls: '',
        cta: act.cta,
        markLabel: act.markLabel,
        openText: act.open,
        markFn: act.mark,
        urgentCls: act.urgent ? 'urgent' : '',
        aria: 'פעילות חיה: ' + act.name + ', נותרו ' + act.left,
        w: '8.4em',
        h: '12.9em',
      };
    } else if (nxt) {
      const x = itBy[nxt.id];
      const frac = clamp((t - prevS) / Math.max(1, x.S - prevS), 0, 1);
      const text = nxt.short + ' · ' + nxt.startT;
      isl = {
        ...flags(nxt),
        isClock: false,
        isOpen: false,
        notOpen: true,
        text,
        cells: this.roll('isl', this.hms(x.S - t), still),
        ringOff: '100',
        name: 'הבאה: ' + nxt.name,
        caption: 'נפתח ב-' + nxt.startT + ' · ' + nxt.endWord + ' ' + nxt.endT,
        pct: (frac * 100).toFixed(2),
        pctNow: Math.round(frac * 100),
        barLabel: 'התקרבות לפתיחת ' + nxt.name,
        cdLabel: 'נפתח בעוד',
        sideTxt: '',
        canMark: false,
        hasText: true,
        txtCls: 'wide',
        cta: '',
        markLabel: '',
        openText: nxt.open,
        markFn: () => {},
        urgentCls: '',
        aria: 'פעילות חיה: ' + text,
        w: Math.min(15, 5.4 + text.length * 0.5).toFixed(1) + 'em',
        h: '10.5em',
      };
    } else {
      const text = c.nextZ.short + ' · ' + c.nextZ.time;
      const frac = clamp((t - prevS) / Math.max(1, nzS - prevS), 0, 1);
      isl = {
        isSun: false,
        isBox: false,
        isBook: false,
        isMoon: false,
        isClock: true,
        isOpen: false,
        notOpen: true,
        text,
        cells: this.roll('isl', this.hms(nzS - t), still),
        ringOff: '100',
        name: c.nextZ.name,
        caption: 'ב-' + c.nextZ.time,
        pct: (frac * 100).toFixed(2),
        pctNow: Math.round(frac * 100),
        barLabel: 'התקרבות ל' + c.nextZ.name,
        cdLabel: 'בעוד',
        sideTxt: '',
        canMark: false,
        hasText: false,
        txtCls: '',
        cta: '',
        markLabel: '',
        openText: () => {},
        markFn: () => {},
        urgentCls: '',
        aria: 'פעילות חיה: ' + text,
        w: Math.min(15, 5.4 + text.length * 0.5).toFixed(1) + 'em',
        h: '8.3em',
      };
    }

    const wOpen = c.active.map((x, i) => {
      const it = itBy[x.id];
      const rem = it.E - t;
      const frac = clamp(rem / (it.E - it.S), 0, 1);
      return {
        ...x,
        ringOff: (100 * (1 - frac)).toFixed(2),
        headDeg: (frac * 360).toFixed(2),
        cells: this.roll('w:' + x.id, this.hms(rem), still),
        rangeTxt: x.fromName + ' עד ' + x.toName,
        leftTxt: 'נשארו ' + x.left,
        enter: 'enter-' + this.flip('wo' + i, x.id),
      };
    });

    const nzCells = this.roll('nz', this.hms(nzS - t), still);
    const zs = (id) => Z.find((z) => z.id === id).S;
    const pc = (v) => (((v - d0) / span) * 100).toFixed(2);
    const railBg = 'linear-gradient(to left, var(--cn) 0%, var(--cd) ' + pc(zs('netz')) + '%, var(--cd) ' + pc(zs('shkia')) + '%, var(--cn) ' + pc(zs('tzeit')) + '%, var(--cn) 100%)';
    const zdots = c.zmanim.map((z) => ({ p: z.p, cls: z.isNext ? 'next' : z.past ? 'past' : '' }));
    const zanch = ['netz', 'chatzot', 'shkia'].map((id) => {
      const z = c.zmanim.find((q) => q.id === id);
      return { p: z.p, short: z.short };
    });
    const zrows = c.zmanim.map((z, i) => ({
      ...z,
      aria: 'מעבר ל' + z.name + ' ב-' + z.time,
      go: () => this.twTo(Z[i].S),
    }));

    this.msgById = Object.fromEntries(c.messages.map((m) => [m.id, m]));
    const H = 7.2;
    const G = 0.55;
    const P = 0.9;
    const sw = s.swipe;
    const grpDefs = [
      { id: 'p', title: 'אישי', list: c.messages.filter((m) => m.isPersonal) },
      { id: 'g', title: 'כללי ומערכת', list: c.messages.filter((m) => !m.isPersonal) },
    ].filter((g) => g.list.length);
    const groups = grpDefs.map((g) => {
      const n = g.list.length;
      const open = n === 1 || Boolean(s.stk[g.id]);
      const toggle = () => this.setState((st) => ({ stk: { ...st.stk, [g.id]: !st.stk[g.id] } }));
      const front = Math.min(n, 3);
      const h = open ? n * H + (n - 1) * G : H + (front === 3 ? 1.1 : front === 2 ? 0.55 : 0);
      const cards = g.list.map((m, i) => {
        const mine = sw && sw.id === m.id ? sw : null;
        const dx = mine ? mine.dx : 0;
        const back = !open && i > 0;
        const hidden = !open && i > 2;
        const scale = open || i === 0 ? 1 : i === 1 ? 0.945 : 0.89;
        const y = open ? i * (H + G) : Math.min(i, 2) * P;
        const fade = mine && mine.fly ? 0 : 1 - Math.min(0.55, Math.abs(dx) / 340);
        const cls = (back ? 'back ' : '') + (mine && mine.drag ? 'drag ' : '') + (mine && mine.settle ? 'settle ' : '') + (mine && mine.fly ? 'fly ' : '') + m.cls;
        const isNext = m.id === 'next';
        const parts = isNext ? m.title.split(' · ') : [];
        return {
          ...m,
          tag: parts.length > 1 ? m.tag + ' · ' + parts[0] : m.tag,
          title: parts.length > 1 ? parts.slice(1).join(' · ') : m.title,
          kindCls: m.kindCls,
          cls,
          tf: 'translate3d(' + dx.toFixed(1) + 'px, ' + y.toFixed(2) + 'em, 0) scale(' + scale + ')',
          op: hidden ? '0' : fade.toFixed(2),
          z: String(30 - i),
          delay: (mine ? 0 : open ? i * 30 : (n - 1 - i) * 15) + 'ms',
          hasHit: (!open && i === 0) || (open && isNext),
          hitAria: !open ? 'הצגת כל ההודעות: ' + g.title + ' (' + n + ')' : 'עריכת ההתראה האישית: ' + m.title,
          tap: () => {
            if (this.justSwiped()) return;
            if (!open) toggle();
            else if (isNext) m.act();
          },
          dismissBtn: (e) => {
            e.stopPropagation();
            if (!this.justSwiped()) m.dismiss();
          },
          actBtn: (e) => {
            e.stopPropagation();
            if (!this.justSwiped()) m.act();
          },
          actAria: m.action + ': ' + m.title,
          down: (e) => this.nsDown(e, m),
          move: (e) => this.nsMove(e),
          up: (e) => this.nsUp(e),
        };
      });
      return { id: g.id, title: g.title, n, open, h: h.toFixed(2), cards, canToggle: n > 1, toggle, toggleText: open ? 'הצג פחות' : 'הצג הכול (' + n + ')' };
    });

    const nearest = Z.reduce((a, z) => (Math.abs(z.S - t) < Math.abs(a.S - t) ? z : a), Z[0]);
    const kxp = 326 / span;
    const snapped = Math.abs(nearest.S - t) * kxp < 6;
    const rel = snapped ? nearest.name : (t >= nearest.S ? 'אחרי ' : 'לפני ') + nearest.name;
    const marks = Z.map((z) => ({ p: pc(z.S), cls: (z.S <= t ? 'past ' : '') + (z.id === nearest.id && Math.abs(z.S - t) * kxp < 14 ? 'near' : '') }));

    if (!c.isScrub) this.liveRef = { t, at: Date.now(), key: c.dateKey };
    const lr = this.liveRef;
    const liveT = c.isScrub && lr && lr.key === c.dateKey ? lr.t + (Date.now() - lr.at) / 1000 : null;
    const showLive = liveT != null && liveT >= d0 && liveT < d1 && Math.abs(liveT - t) * kxp > 12;

    const islOpen = s.islOpen;
    const hold = s.scDrag || s.scKb;

    return {
      ...c,
      dragCls: still ? 'drag' : '',
      spacerH: 70 + (c.showBack ? 52 : 0),
      islDodge: c.showBack ? 52 : 0,
      dateTxt: c.weekday + ' · ' + c.hebDay + ' · ' + c.gregShort,
      clkCells,
      chipCls: c.isScrub ? 'view' : '',
      chipText: c.isScrub ? 'תצוגה' : 'עכשיו',
      secPct: c.isScrub ? '100' : ((sec / 60) * 100).toFixed(2),
      secCls: c.isScrub ? 'fz' : sec === 0 ? 'nt' : '',
      isl,
      islCls: (islOpen ? 'open ' : '') + (still ? 'drag' : ''),
      islOpen,
      islClosed: !islOpen,
      islTab: islOpen ? '0' : '-1',
      islW: islOpen ? '362px' : isl.w,
      islH: islOpen ? isl.h : '2.75em',
      islR: islOpen ? '2.1em' : '1.375em',
      islToggle: () => this.setState((st) => ({ islOpen: !st.islOpen })),
      islClose: () => this.setState({ islOpen: false }),
      islMark: () => {
        isl.markFn();
        this.setState({ islOpen: false });
      },
      wOpen,
      zxOpen: s.zx,
      zxCls: s.zx ? 'open' : '',
      zxLabel: s.zx ? 'סגירת רשימת הזמנים המלאה' : 'פתיחת רשימת הזמנים המלאה',
      zxToggle: () => this.setState((st) => ({ zx: !st.zx })),
      nzCells,
      railBg,
      zdots,
      zanch,
      zrows,
      groups,
      noMessages: c.messages.length === 0,
      msgCount: c.messages.length,
      doneZero: c.doneN === 0 ? 'zero' : '',
      missZero: c.missedN === 0 ? 'zero' : '',
      doneBump: 'bump-' + this.flip('dn', c.doneN),
      missBump: 'bump-' + this.flip('ms', c.missedN),
      segs: c.timeline.map((x) => ({ cls: x.status })),
      done: c.done.map((d, i) => ({ ...d, atTxt: 'סומן ב-' + d.at, enter: 'enter-' + this.flip('done' + i, d.id) })),
      missed: c.missed.map((x, i) => ({ ...x, enter: 'enter-' + this.flip('miss' + i, x.id) })),
      later: c.upcoming.map((x, i) => ({
        ...x,
        opensTxt: 'נפתח ב-' + x.startT,
        near: (clamp(1 - (itBy[x.id].S - t) / 21600, 0, 1) * 100).toFixed(1),
        enter: 'enter-' + this.flip('later' + i, x.id),
      })),
      noUpcoming: c.upcoming.length === 0,
      undoToast: () => {
        c.undoToast();
        if (s.toast && s.toast.msgId) this.setState({ swipe: null });
      },
      scCls: hold ? 'hold' : '',
      bubCls: snapped ? 'snap' : '',
      bubP: clamp(c.nowPos, 17, 83).toFixed(1),
      bubName: rel,
      marks,
      showLive,
      liveP: liveT == null ? '0' : pc(liveT),
      startClock: this.clock(d0),
      endClock: this.clock(d1) + ' מחר',
      sliderMin: Math.round(d0),
      sliderMax: Math.round(d1 - 60),
      sliderNow: Math.round(clamp(t, d0, d1 - 60)),
      sliderText: c.nowT + ' · ' + rel + ', הבא: ' + c.nextZ.name + ' ' + c.nextZ.left,
      scDown: (e) => this.scDown(e),
      scMove: (e) => this.scMove(e),
      scUp: (e) => this.scUp(e),
      scKey: (e) => this.scKey(e),
    };
  }
}
</script>
