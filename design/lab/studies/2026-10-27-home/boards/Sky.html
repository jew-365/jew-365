<script>
class Component extends DCLogic {
/*CORE*/

  boardState() {
    ['--sk1', '--sk2', '--sk3', '--hz', '--glow', '--ink', '--inkopp', '--inkchip'].forEach((n) => {
      try {
        CSS.registerProperty({ name: n, syntax: '<color>', inherits: true, initialValue: '#000000' });
      } catch (e) {}
    });
    this.zKey = null;
    this.sk = null;
    this.zr = null;
    this.skRaf = 0;
    this.skAnim = 0;
    this.skTgt = 0;
    this.skPos = 0;
    this.settleT = 0;
    return { fx: false };
  }

  skHex(c) {
    return [1, 3, 5].map((i) => parseInt(c.slice(i, i + 2), 16));
  }

  skStr(a) {
    return '#' + a.map((v) => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0')).join('');
  }

  skMix(a, b, k) {
    return a.map((v, i) => v + (b[i] - v) * k);
  }

  skLum(a) {
    const f = (v) => {
      v /= 255;
      return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
    };
    return 0.2126 * f(a[0]) + 0.7152 * f(a[1]) + 0.0722 * f(a[2]);
  }

  skCr(a, b) {
    const x = this.skLum(a);
    const y = this.skLum(b);
    return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05);
  }

  skClamp(v, lo, hi) {
    return Math.max(lo, Math.min(hi, v));
  }

  skZ() {
    const z = {};
    this.zmanimList().forEach((x) => (z[x.id] = x.S));
    return z;
  }

  skKeys() {
    const z = this.skZ();
    const end = this.dayEnd();
    const H = (c) => this.skHex(c);
    const K = (t, top, mid, bot, cloud, name) => ({ t, top: H(top), mid: H(mid), bot: H(bot), cloud: H(cloud), name });
    const dawnLen = z.netz - z.alot;
    const alotK = K(z.alot, '#18215F', '#4B3D8E', '#9B6BA8', '#C9A6D6', 'עלות השחר');
    return [
      alotK,
      K(z.netz, '#8DA3E0', '#F2B7B4', '#FFD9AE', '#FFD6CC', 'הנץ החמה'),
      K(z.netz + (z.chatzot - z.netz) * 0.3, '#76B6F2', '#A8D4F6', '#D8EDFA', '#FFFFFF', 'בוקר'),
      K(z.chatzot, '#4B9DEB', '#6DB4F1', '#A8D5F8', '#FFFFFF', 'צהריים'),
      K(z.plag, '#5E9FE0', '#9CC5E8', '#F5D9A2', '#FFF6E4', 'אחר הצהריים'),
      K(z.shkia, '#5C5AA8', '#E4708C', '#FFB05C', '#FFC8B0', 'שקיעה'),
      K(z.tzeit, '#161D58', '#2E3382', '#6C5BA8', '#9A8CC8', 'צאת הכוכבים'),
      K(z.tzeit + (z.chatzotL - z.tzeit) * 0.25, '#070C1F', '#0F1A3E', '#1B2A58', '#7F8FC8', 'לילה'),
      K(end - dawnLen * 0.7, '#060A19', '#0D1533', '#18224D', '#7F8FC8', 'לפני עלות השחר'),
      { ...alotK, t: end },
    ];
  }

  skAt(t) {
    const K = this.skKeys();
    let i = 0;
    while (i < K.length - 2 && t >= K[i + 1].t) i++;
    const a = K[i];
    const b = K[i + 1];
    const k = this.skClamp((t - a.t) / (b.t - a.t), 0, 1);
    const e = k * k * (3 - 2 * k);
    const m = (p) => this.skMix(a[p], b[p], e);
    return { top: m('top'), mid: m('mid'), bot: m('bot'), cloud: m('cloud'), name: a.name };
  }

  skInk(s) {
    const zone = this.skMix(s.top, s.mid, 0.14);
    const dark = this.skHex('#0A1228');
    const white = [255, 255, 255];
    const useWhite = this.skCr(zone, white) > this.skCr(zone, dark);
    const ink = useWhite ? white : dark;
    const opp = useWhite ? [8, 14, 34] : [255, 255, 255];
    let alpha = 0;
    while (alpha < 0.5 && this.skCr(this.skMix(zone, opp, alpha), ink) < 5.2) alpha += 0.05;
    return { zone, ink, opp, alpha, white: useWhite, contrast: this.skCr(this.skMix(zone, opp, alpha), ink) };
  }

  skArcLen(u) {
    let s = 0;
    const n = 24;
    for (let i = 0; i < n; i++) {
      const v = ((i + 0.5) / n) * u;
      const dy = -108 + 216 * v;
      s += (Math.sqrt(310 * 310 + dy * dy) * u) / n;
    }
    return s;
  }

  skCompact(sec) {
    const m = Math.max(0, Math.ceil(sec / 60));
    if (m < 60) return m + ' דק׳';
    const h = Math.floor(m / 60);
    const r = m % 60;
    return h + ' שע׳' + (r ? ' ו-' + r + ' דק׳' : '');
  }

  skGeo() {
    return { x0: 330, span: 270 };
  }

  skSmooth(v) {
    const k = this.skClamp(v, 0, 1);
    return k * k * (3 - 2 * k);
  }

  skyVals() {
    const t = this.now();
    const z = this.skZ();
    const end = this.dayEnd();
    const N = z.netz;
    const S = z.shkia;
    const G = this.skGeo();
    const s = this.skAt(Math.round(t / 20) * 20);
    const ik = this.skInk(s);
    const hy = (x) => {
      const u = (390 - x) / 390;
      return 214 - 92 * u * (1 - u);
    };

    const f = (t - N) / (S - N);
    const fc = this.skClamp(f, -0.1, 1.1);
    const sx = G.x0 - G.span * fc;
    const alt = Math.sin(Math.PI * fc);
    const sy = hy(sx) - 55 * alt;
    const sunOp = f < 0 ? this.skClamp(1 + f / 0.05, 0, 1) : f > 1 ? this.skClamp(1 - (f - 1) / 0.05, 0, 1) : 1;
    const hgt = this.skClamp(alt / 0.55, 0, 1);
    const sunC = this.skStr(this.skMix(this.skHex('#FF8A3D'), this.skHex('#FFE27A'), hgt));
    const sunC2 = this.skStr(this.skMix(this.skHex('#E8531F'), this.skHex('#FFB347'), hgt));

    const tw = Math.max(600, z.tzeit - S);
    const dw = Math.max(600, N - z.alot);
    let d = 0;
    if (t >= S) d = this.skClamp((t - S) / (2 * tw), 0, 1);
    else if (t <= N) d = this.skClamp((N - t) / dw, 0, 1);
    d = d * d * (3 - 2 * d);

    const g = t >= z.tzeit ? (t - z.tzeit) / (end - z.tzeit) : t < N ? 1.04 : -0.08;
    const gc = this.skClamp(g, -0.08, 1.08);
    const mx = G.x0 - G.span * gc;
    const my = hy(mx) - 55 * Math.sin(Math.PI * gc);

    let alt2 = alt;
    if (t < N) alt2 = -(N - t) / dw;
    else if (t > S) alt2 = -(t - S) / (2 * tw);
    const glowOp = this.skClamp(1 - Math.abs(alt2) / 0.5, 0, 1);
    const glowC = t < (N + S) / 2 ? '#FF9A86' : '#FF8A45';
    const hz = this.skStr(this.skMix(s.bot, [255, 255, 255], 0.35));
    const rgba = (a, al) => 'rgba(' + a.map((v) => Math.round(v)).join(',') + ',' + al.toFixed(2) + ')';

    const starsOp = Math.max(this.skSmooth((t - (z.tzeit - tw * 0.5)) / (tw * 1.5)), 1 - this.skSmooth((t - z.alot) / (dw * 0.9)));
    const stars = [
      [28, 64, 2], [74, 84, 1.6], [44, 118, 2.4], [98, 142, 1.6], [150, 112, 2], [190, 152, 1.6], [226, 116, 2.6], [262, 172, 1.6],
      [298, 128, 2], [332, 100, 1.6], [358, 152, 2.4], [374, 118, 1.6], [122, 174, 1.6], [18, 168, 2], [206, 98, 1.4], [150, 9, 1.6],
      [244, 10, 2], [334, 11, 1.6], [24, 12, 1.6], [66, 52, 1.4], [92, 100, 1.8], [312, 182, 1.4],
    ].map((a, i) => ({
      x: a[0],
      y: a[1],
      s: a[2],
      d: ((i * 0.37) % 3.4).toFixed(2) + 's',
      du: (2.4 + ((i * 0.53) % 2.6)).toFixed(2) + 's',
      o: this.skSmooth((starsOp - ((i * 0.618) % 1) * 0.6) / 0.4).toFixed(2),
    }));

    const u = (t - z.alot) / (end - z.alot);
    const phase = s.name;
    return {
      skyStyle: [
        '--sk1:' + this.skStr(s.top),
        '--sk2:' + this.skStr(s.mid),
        '--sk3:' + this.skStr(s.bot),
        '--hz:' + hz,
        '--glow:' + rgba(this.skHex(glowC), 0.6),
        '--ink:' + this.skStr(ik.ink),
        '--inkopp:' + this.skStr(ik.opp),
        '--inkchip:' + rgba(ik.opp, ik.alpha),
      ].join(';'),
      skyAria: 'השמיים עכשיו: ' + phase,
      skyName: phase,
      skyChip: this.clock(t) + ' · ' + phase,
      sunX: sx.toFixed(1),
      sunY: sy.toFixed(1),
      sunOp: sunOp.toFixed(2),
      sunC,
      sunC2,
      moonX: mx.toFixed(1),
      moonY: my.toFixed(1),
      moonOp: d.toFixed(2),
      starsOp: starsOp.toFixed(2),
      shootOp: this.skClamp((starsOp - 0.7) / 0.3, 0, 1).toFixed(2),
      cloudOp: ((1 - d) * 0.92).toFixed(2),
      cloudC: this.skStr(s.cloud),
      par1: (-u * 45).toFixed(1),
      par2: (-u * 90).toFixed(1),
      par3: (-u * 146).toFixed(1),
      glowX: this.skClamp(sx, 60, 330).toFixed(1),
      glowOp: glowOp.toFixed(2),
      thumbC: this.skStr(this.skMix(this.skHex(sunC), [230, 236, 255], d)),
      stars,
      skDay: t >= N && t < S,
    };
  }

  componentDidUpdate() {
    if (this.zKey !== this.start) {
      this.zKey = this.start;
      this.centerZ(true);
    }
  }

  boardMount() {
    this.zKey = this.start;
    this.rm = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };
    this.centerZ(false);
    this.mountT = setTimeout(() => this.centerZ(false), 400);
  }

  boardUnmount() {
    clearTimeout(this.mountT);
    clearTimeout(this.settleT);
    this.skStop();
    if (this.zr) cancelAnimationFrame(this.zr.raf);
  }

  skBounds() {
    return [this.dayStart(), this.dayEnd() - 60];
  }

  skRate(t) {
    const z = this.skZ();
    const G = this.skGeo();
    return t >= z.tzeit ? (this.dayEnd() - z.tzeit) / G.span : (z.shkia - z.netz) / G.span;
  }

  skPosOf(t) {
    const Z = this.zmanimList();
    const n = Z.length;
    if (t >= Z[n - 1].S) return n - 1 + 0.5 * Math.min(1, (t - Z[n - 1].S) / (this.dayEnd() - Z[n - 1].S));
    let i = 0;
    while (i < n - 2 && t >= Z[i + 1].S) i++;
    return i + Math.max(0, (t - Z[i].S) / (Z[i + 1].S - Z[i].S));
  }

  skTimeOf(pos) {
    const Z = this.zmanimList();
    const n = Z.length;
    if (pos >= n - 1) return Z[n - 1].S + Math.min(1, (pos - (n - 1)) / 0.5) * (this.dayEnd() - Z[n - 1].S);
    const i = Math.max(0, Math.min(n - 2, Math.floor(pos)));
    return Z[i].S + (pos - i) * (Z[i + 1].S - Z[i].S);
  }

  skSeek(sec) {
    this.skTgt = sec;
    if (this.skRaf) return;
    this.skRaf = requestAnimationFrame(() => {
      this.skRaf = 0;
      this.scrub(this.skTgt);
    });
  }

  skStop() {
    cancelAnimationFrame(this.skRaf);
    cancelAnimationFrame(this.skAnim);
    this.skRaf = 0;
    this.skAnim = 0;
    clearTimeout(this.settleT);
    const sc = document.getElementById('zsc');
    if (sc && this.settling) sc.scrollTo({ left: sc.scrollLeft, behavior: 'auto' });
    this.settling = false;
  }

  skSettle() {
    clearTimeout(this.settleT);
    this.settleT = setTimeout(() => {
      this.settling = true;
      this.centerZ(true);
    }, 450);
  }

  skEnd() {
    this.setState({ fx: false });
    this.skSettle();
  }

  skTween(to, ms, done, from) {
    this.skStop();
    const [lo, hi] = this.skBounds();
    const a = from == null ? this.now() : from;
    const b = Math.max(lo, Math.min(hi, to));
    const dur = ms == null ? Math.max(280, Math.min(1000, 280 + Math.abs(b - a) / 45)) : ms;
    if (this.rm.matches || Math.abs(b - a) < 1) {
      this.skPos = b;
      this.scrub(b);
      if (done) done();
      return;
    }
    const t0 = performance.now();
    const step = (ts) => {
      const k = Math.min(1, (ts - t0) / dur);
      this.skPos = a + (b - a) * (k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2);
      this.scrub(this.skPos);
      if (k < 1) this.skAnim = requestAnimationFrame(step);
      else {
        this.skAnim = 0;
        if (done) done();
      }
    };
    this.skAnim = requestAnimationFrame(step);
  }

  skGoTo(sec) {
    this.setState({ fx: true });
    this.skTween(sec, null, () => this.skEnd());
  }

  skFling(v0) {
    const [lo, hi] = this.skBounds();
    let v = Math.max(-2200, Math.min(2200, v0));
    let last = performance.now();
    const step = (ts) => {
      const dt = Math.min(0.05, (ts - last) / 1000);
      last = ts;
      v *= Math.exp(-dt / 0.3);
      this.skPos = Math.max(lo, Math.min(hi, this.skPos - v * dt * this.skRate(this.skPos)));
      this.scrub(this.skPos);
      if (Math.abs(v) > 25 && this.skPos > lo && this.skPos < hi) this.skAnim = requestAnimationFrame(step);
      else {
        this.skAnim = 0;
        this.skEnd();
      }
    };
    this.skAnim = requestAnimationFrame(step);
  }

  skDown(e) {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    if (e.target.closest && e.target.closest('input,button,a')) return;
    this.skStop();
    this.skPos = this.now();
    this.sk = { id: e.pointerId, el: e.currentTarget, x0: e.clientX, x: e.clientX, ts: performance.now(), v: 0, moved: false };
  }

  skMove(e) {
    const d = this.sk;
    if (!d || d.id !== e.pointerId) return;
    if (!d.moved) {
      if (Math.abs(e.clientX - d.x0) < 6) return;
      d.moved = true;
      d.x = e.clientX;
      d.ts = performance.now();
      try {
        d.el.setPointerCapture(e.pointerId);
      } catch (err) {}
      this.setState({ fx: true });
      return;
    }
    const ts = performance.now();
    const dx = e.clientX - d.x;
    d.v = d.v * 0.6 + ((dx / Math.max(1, ts - d.ts)) * 1000) * 0.4;
    d.x = e.clientX;
    d.ts = ts;
    const [lo, hi] = this.skBounds();
    this.skPos = Math.max(lo, Math.min(hi, this.skPos - dx * this.skRate(this.skPos)));
    this.skSeek(this.skPos);
  }

  skUp(e) {
    const d = this.sk;
    if (!d || d.id !== e.pointerId) return;
    this.sk = null;
    if (!d.moved) return;
    try {
      d.el.releasePointerCapture(e.pointerId);
    } catch (err) {}
    const v = performance.now() - d.ts > 90 ? 0 : d.v;
    if (this.rm.matches || Math.abs(v) < 90) {
      this.scrub(this.skPos);
      this.skEnd();
    } else this.skFling(v);
  }

  zrAt(x) {
    const tr = document.getElementById('ztr');
    if (!tr) return this.now();
    const r = tr.getBoundingClientRect();
    const n = this.zmanimList().length;
    const mk = ((r.right - x) / r.width) * n;
    return this.skTimeOf(Math.max(0, Math.min(n - 0.5, mk - 0.5)));
  }

  zrLoop() {
    const d = this.zr;
    if (!d) return;
    const sc = document.getElementById('zsc');
    if (sc) {
      const a = sc.getBoundingClientRect();
      let dx = 0;
      if (d.x < a.left + 40) dx = -Math.ceil((a.left + 40 - d.x) / 5);
      else if (d.x > a.right - 40) dx = Math.ceil((d.x - (a.right - 40)) / 5);
      if (dx) {
        sc.scrollLeft += dx;
        this.skSeek(this.zrAt(d.x));
      }
    }
    d.raf = requestAnimationFrame(() => this.zrLoop());
  }

  zrDown(e) {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    this.skStop();
    try {
      e.currentTarget.setPointerCapture(e.pointerId);
    } catch (err) {}
    this.zr = { id: e.pointerId, x0: e.clientX, x: e.clientX, moved: false, raf: 0 };
    this.setState({ fx: true });
    this.skTween(this.zrAt(e.clientX), 240, () => {
      if (!this.zr) this.skEnd();
    });
  }

  zrMove(e) {
    const d = this.zr;
    if (!d || d.id !== e.pointerId) return;
    d.x = e.clientX;
    if (!d.moved) {
      if (Math.abs(e.clientX - d.x0) < 4) return;
      d.moved = true;
      cancelAnimationFrame(this.skAnim);
      this.skAnim = 0;
      d.raf = requestAnimationFrame(() => this.zrLoop());
    }
    this.skSeek(this.zrAt(e.clientX));
  }

  zrUp(e) {
    const d = this.zr;
    if (!d || d.id !== e.pointerId) return;
    cancelAnimationFrame(d.raf);
    this.zr = null;
    if (d.moved) {
      this.scrub(this.zrAt(d.x));
      this.skEnd();
    } else if (!this.skAnim) this.skEnd();
  }

  centerZ(smooth) {
    const sc = document.getElementById('zsc');
    const mk = document.getElementById('zmk');
    if (!sc || !mk) return;
    const a = sc.getBoundingClientRect();
    const b = mk.getBoundingClientRect();
    const nx = sc.querySelector('.zs.next');
    let mid = b.left + b.width / 2;
    if (nx) {
      const r = nx.getBoundingClientRect();
      mid = (mid + r.left + r.width / 2) / 2;
    }
    const delta = mid - (a.left + a.width / 2);
    sc.scrollTo({ left: sc.scrollLeft + delta, behavior: smooth ? 'smooth' : 'auto' });
  }

  renderVals() {
    const c = this.coreVals();
    const sv = this.skyVals();
    const t = this.now();
    const Z = this.zmanimList();
    const n = Z.length;

    const actives = c.active.map((it, i) => {
      const u = this.skClamp(it.pctGone / 100, 0, 1);
      const y = 36 - 108 * u * (1 - u);
      return {
        ...it,
        dash: this.skArcLen(u).toFixed(1),
        dotR: ((4 + 310 * u) / 3.18).toFixed(2),
        dotT: ((y / 40) * 100).toFixed(2),
        dotCls: it.isMoon ? 'moon' : 'sun',
        delay: 0.26 + i * 0.07 + 's',
      };
    });

    const mk = (this.skPosOf(t) + 0.5).toFixed(3);
    const stops = c.zmanim.map((z, i) => ({
      ...z,
      nodeBg: this.skStr(this.skAt(Z[i].S).mid),
      inS: z.isNext ? 'בעוד ' + this.skCompact(Z[i].S - t) : '',
      aria: 'מעבר ל' + z.name + ' ב-' + z.time,
      go: () => this.skGoTo(Z[i].S),
    }));
    const ribbonBg =
      'linear-gradient(to left, ' +
      Z.map((z, i) => this.skStr(this.skAt(z.S).mid) + ' ' + (((i + 0.5) / n) * 100).toFixed(2) + '%').join(', ') +
      ')';

    const upGroups = [];
    c.upcoming.forEach((x) => {
      let g = upGroups.find((q) => q.time === x.startT);
      if (!g) {
        g = { time: x.startT, names: [], isSun: x.isSun, isBox: x.isBox, isBook: x.isBook, isMoon: x.isMoon };
        upGroups.push(g);
      }
      g.names.push(x.short);
    });
    upGroups.forEach((g) => (g.name = g.names.join(' · ')));

    return {
      ...c,
      ...sv,
      upGroups,
      actives,
      stops,
      ribbonBg,
      mk,
      zn: n,
      mkSun: sv.skDay,
      mkMoon: !sv.skDay,
      noGeneral: !c.hasMsgGeneral,
      fxCls: this.state.fx ? 'drag' : '',
      zCls: this.state.fx ? 'zdrag' : '',
      railDots: c.zmanim.map((z) => ({ p: z.p })),
      onRail: (e) => {
        this.skStop();
        this.scrub(Number(e.target.value));
        this.skSettle();
      },
      skDown: (e) => this.skDown(e),
      skMove: (e) => this.skMove(e),
      skUp: (e) => this.skUp(e),
      zrDown: (e) => this.zrDown(e),
      zrMove: (e) => this.zrMove(e),
      zrUp: (e) => this.zrUp(e),
    };
  }
}
</script>
