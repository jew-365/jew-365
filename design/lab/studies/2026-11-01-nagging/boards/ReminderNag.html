<!--board title="עורך התזכורת · נודניק"-->
<style>
/* Spec 4.3: the reminder editor opens over the mitzvah screen with the nag block between the send-time line and the
   label: לפי הרמה / בלי / מותאם, the count stepper (1 to 5), the interval chips, the placement control (or the
   before-only line) and the live preview of the repeat times, a dropped one in the urgent colour. The editor's body
   opens scrolled to the block; scroll up for the timing. */
.lvrow{padding:12px 0;min-height:68px;border-bottom:1px solid var(--border)}
</style>
<template>
<!--MITZVAH-->
<!--LEVELSHEET-->
<!--EDITOR-->
<!--TOAST-->
</template>
<script>
class Component extends DCLogic {
/*CORE*/

  mid() {
    if (String(this.opt('demo') || '') === 'drop') return 'shacharit';
    const m = String(this.opt('m') || 'shacharit');
    return this.data().mitzvot[m] ? m : 'shacharit';
  }

  // The mitzvah at level 3 with its first reminder carrying its own nag, so the editor opens on "מותאם" with every
  // field showing. r=<index> opens another reminder; demo=drop opens a set-time reminder 15 minutes before the window
  // closes with three repeats every 10 minutes after it, so two fall after the end.
  seed() {
    const id = this.mid();
    const demo = String(this.opt('demo') || '');
    const list = this.seedReminders(id);
    const before = this.placementsFor(id, list[0].anchor).length === 1;
    list[0].nag = before ? { count: 2, everyMin: 5, placement: 'before' } : { count: 3, everyMin: 5, placement: 'around' };
    return { levels: { [id]: 3 }, rem: { [id]: list }, sheet: null, editor: null, demo };
  }

  boardState() {
    return this.seed();
  }

  boardMount() {
    this.openDemo();
  }

  afterHash() {
    this.setState(this.seed(), () => this.openDemo());
  }

  openDemo() {
    const id = this.mid();
    const list = this.reminders(id);
    if (this.state.demo === 'drop') {
      const end = this.mitzvah(id).windows[0].end;
      const clock = Math.floor(end / 60000 / 5) * 5 - 15;
      this.openEditor(id, 0, { timing: 'clock', clock, mode: 'custom', count: 3, every: 10, placement: 'after' });
    } else {
      const r = Math.min(list.length - 1, Math.max(0, Number(this.opt('r')) || 0));
      this.openEditor(id, r);
    }
    clearTimeout(this.scrollTimer);
    this.scrollTimer = setTimeout(() => {
      const body = document.getElementById('ed-body');
      const block = body && body.querySelector('.nag');
      if (body && block) body.scrollTop = Math.max(0, block.offsetTop - body.offsetTop - 140);
    }, 60);
  }

  boardUnmount() {
    clearTimeout(this.scrollTimer);
  }

  renderVals() {
    return Object.assign(this.core(), this.mitzvahVals(this.mid()));
  }
}
</script>
