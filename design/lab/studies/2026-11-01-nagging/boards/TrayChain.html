<!--board title="מגש ההתראות · שרשרת"-->
<style>
/* Spec 4.5 and 3.6: an Android notification shade with one reminder's chain, the main and its repeats as separate
   notifications, each with "פתח נוסח" and "עשיתי", a repeat's body ending in "· תזכורת k מתוך n". "עשיתי" on any of
   them clears the ones in the tray and cancels the ones still waiting (cancelForMitzvah()). The bar at the bottom is
   the demo's, not the app's: it advances the clock to the next notification, starts over, and picks the chain. */
.shade{position:absolute;inset:0;display:flex;flex-direction:column;background:color-mix(in srgb,var(--text) 7%,var(--bg))}
.status{display:flex;align-items:center;justify-content:space-between;padding:10px 20px 4px;font-size:13px;line-height:18px;font-weight:600;color:var(--text)}
.status>span{display:inline-flex;gap:4px;align-items:center}
.status .ic{width:16px;height:16px;stroke-width:2}
.shade-h{padding:8px 20px 12px;display:grid;gap:2px}
.shade-h>b{font-size:28px;line-height:34px;font-weight:500;color:var(--text)}
.shade-scroll{flex:1;min-height:0;overflow-y:auto;padding:0 12px 12px;display:grid;gap:8px;align-content:start}
.ntf{background:var(--surface);border-radius:24px;padding:14px 16px 6px;box-shadow:0 1px 3px var(--shadowC);animation:ntfIn 320ms cubic-bezier(.23,1,.32,1) both}
.ntf.out{animation:ntfOut 260ms cubic-bezier(.4,0,1,1) both}
@keyframes ntfIn{from{opacity:0;transform:translateY(-14px) scale(.98)}to{opacity:1;transform:none}}
@keyframes ntfOut{to{opacity:0;transform:translateX(-60px)}}
.n-head{display:flex;align-items:center;gap:6px;font-size:12px;line-height:16px;color:var(--sub)}
.n-head>.img{width:16px;height:16px;display:block;background:center/contain no-repeat}
.n-head>b{font-weight:500;color:var(--text)}
.n-title{font-size:15px;line-height:22px;font-weight:600;color:var(--text);margin-top:6px}
.n-body{font-size:14px;line-height:20px;color:var(--sub)}
.n-body>em{font-style:normal;color:var(--text);font-weight:500}
.n-acts{display:flex;gap:4px;margin-top:4px}
.n-acts>button{min-height:44px;padding:0 12px;border-radius:999px;font-size:14px;font-weight:600;color:var(--notif)}
.empty{padding:28px 12px;text-align:center;font-size:13px;line-height:18px;color:var(--sub)}
.pending{margin-top:4px;background:var(--surface);border-radius:20px;padding:12px 16px}
.pending>h3{font-size:13px;line-height:18px;font-weight:600;color:var(--sub);margin-bottom:6px}
.p-row{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:13px;line-height:18px;color:var(--text)}
.p-row>b{font-variant-numeric:tabular-nums;font-weight:600;width:44px}
.p-row>span:nth-child(2){flex:1;min-width:0}
.tag{font-size:12px;line-height:16px;font-weight:600;border-radius:999px;padding:2px 10px;background:var(--surface2);color:var(--sub)}
.tag.sent{background:var(--goldLight);color:var(--goldText)}
.tag.cancel{background:var(--urgentBg);color:var(--urgent)}
.tag.done{background:color-mix(in srgb,var(--safe) 16%,var(--surface));color:var(--text)}
.demo{border-top:1px solid var(--border);background:var(--surface);padding:10px 12px 14px;display:grid;gap:8px}
.demo-l{font-size:12px;line-height:16px;color:var(--muted)}
.demo-row{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.demo-row::-webkit-scrollbar{display:none}
.demo-row>button{flex:none;white-space:nowrap}
.dbtn{min-height:44px;padding:0 16px;border-radius:14px;background:var(--gold);color:var(--onGold);font-size:14px;font-weight:600}
.dbtn.ghost{background:var(--surface2);color:var(--text)}
.dbtn[aria-disabled="true"]{opacity:.45;cursor:default}
</style>
<template>
<div class="shade">
<div class="status" aria-hidden="true"><b class="num">{{clock}}</b><span>[[ic:wifi]][[ic:battery]]</span></div>
<div class="shade-h"><b class="num">{{clock}}</b><span class="t-cap c-sub">{{dateLine}}</span></div>
<div class="shade-scroll" aria-live="polite">
<sc-for list="{{tray}}" as="n" hint-placeholder-count="2">
<article class="{{n.cls}}" aria-label="{{n.aria}}">
<div class="n-head"><i class="img" style="{{notifStyle}}" aria-hidden="true"></i><b>{{appName}}</b><span>·</span><span class="num">{{n.time}}</span></div>
<p class="n-title">{{n.title}}</p>
<p class="n-body">{{n.body}}<sc-if value="{{n.isRepeat}}" hint-placeholder-val="{{ false }}"> · <em>{{n.suffix}}</em></sc-if></p>
<div class="n-acts"><button onClick="{{n.openText}}">{{openTextLabel}}</button><button onClick="{{n.markDone}}">{{markDoneLabel}}</button></div>
</article>
</sc-for>
<sc-if value="{{trayEmpty}}" hint-placeholder-val="{{ false }}"><p class="empty">{{emptyText}}</p></sc-if>
<section class="pending" aria-labelledby="pd-t">
<h3 id="pd-t">{{pendingTitle}}</h3>
<ul><sc-for list="{{plan}}" as="p" hint-placeholder-count="3"><li class="p-row"><b>{{p.time}}</b><span>{{p.what}}</span><span class="{{p.tagCls}}">{{p.tag}}</span></li></sc-for></ul>
</section>
</div>
<div class="demo" role="group" aria-label="הדמיה">
<span class="demo-l">{{demoLabel}}</span>
<div class="demo-row"><button class="dbtn" onClick="{{advance}}" aria-disabled="{{advanceOff}}">{{advanceLabel}}</button><button class="dbtn ghost" onClick="{{reset}}">{{resetLabel}}</button></div>
<div class="demo-row"><sc-for list="{{chains}}" as="ch" hint-placeholder-count="2"><button class="chip" aria-pressed="{{ch.on}}" onClick="{{ch.pick}}">{{ch.label}}</button></sc-for><sc-for list="{{lvChips}}" as="lc" hint-placeholder-count="3"><button class="chip" aria-pressed="{{lc.on}}" onClick="{{lc.pick}}">{{lc.label}}</button></sc-for></div>
</div>
</div>
<!--TOAST-->
</template>
<script>
class Component extends DCLogic {
/*CORE*/

  // chain: which reminder (Shacharit's start reminder nags after it; the bedtime Shema's 23:00 only before it);
  // lv: the level that sets the chain (2 to 4); step: how many of the chain have arrived; marked: when "עשיתי" came.
  boardState() {
    return { chainId: this.opt('m') === 'krias_shma_al_hamita' ? 'krias_shma_al_hamita' : 'shacharit', lv: 3, step: 2, marked: null, leaving: false };
  }

  afterHash() {
    this.setState(this.boardState());
  }

  boardUnmount() {
    clearTimeout(this.leaveTimer);
  }

  items() {
    const id = this.state.chainId;
    const m = this.mitzvah(id);
    const r = m.reminders[0];
    const ch = this.chain(id, r, this.state.lv);
    const variants = r.bodyVariants.length ? r.bodyVariants : [r.label];
    // bodyForReminder(): the variant is picked by the main's trigger day, and every repeat reads the same text.
    const body = variants[Math.floor((this.data().epochMidnight + ch.main) / 86400000) % variants.length];
    const all = [{ t: ch.main, k: 0, of: 0 }].concat(ch.repeats.filter((x) => !x.drop).map((x) => ({ t: x.t, k: x.k, of: x.of })));
    all.sort((a, b) => a.t - b.t);
    return all.map((x) => ({ t: x.t, k: x.k, of: x.of, title: m.name, body, isRepeat: x.k > 0 }));
  }

  mark(at) {
    if (this.state.marked !== null) return;
    this.setState({ leaving: true });
    clearTimeout(this.leaveTimer);
    this.leaveTimer = setTimeout(() => this.setState({ leaving: false, marked: at }), 260);
    const items = this.items();
    const waiting = items.length - this.state.step;
    this.showToast('סומן: ' + this.mitzvah(this.state.chainId).name + (waiting > 0 ? ' · ' + waiting + ' בתור בוטלו' : ''));
  }

  renderVals() {
    const items = this.items();
    const step = Math.min(this.state.step, items.length);
    const marked = this.state.marked;
    const shown = marked === null ? items.slice(0, step) : [];
    const clockMs = step > 0 ? items[step - 1].t : items[0].t - 60000;
    const tray = shown
      .map((x, i) => ({
        cls: 'ntf' + (this.state.leaving ? ' out' : ''),
        time: this.hm(x.t),
        title: x.title,
        body: x.body,
        isRepeat: x.isRepeat,
        suffix: x.isRepeat ? this.str('notifications.nag.repeat', { k: x.k, n: x.of }) : '',
        aria: x.title + ', ' + this.hm(x.t),
        markDone: () => this.mark(i),
        openText: () => this.showToast('פותח את הנוסח של ' + x.title),
      }))
      .reverse();
    const plan = items.map((x, i) => {
      const sent = i < step;
      const tag = marked !== null ? (sent ? 'נוקתה מהמגש' : 'בוטלה') : sent ? 'נשלחה' : 'בתור';
      const tagCls = 'tag ' + (marked !== null ? (sent ? 'done' : 'cancel') : sent ? 'sent' : '');
      return { time: this.hm(x.t), what: x.isRepeat ? 'חזרה ' + x.k + ' מתוך ' + x.of : 'התזכורת', tag, tagCls };
    });
    const D = this.data();
    return Object.assign(this.core(), {
      clock: this.hm(clockMs),
      dateLine: D.dateLine,
      notifStyle: this.iconStyle('notif'),
      appName: 'יהודי 365',
      tray,
      trayEmpty: tray.length === 0,
      emptyText: marked !== null ? 'כל השרשרת ירדה מהמגש בלחיצה אחת, והחזרות שעוד לא הגיעו בוטלו.' : 'עוד לא הגיעה התראה. "ההתראה הבאה" מקדם את השעון.',
      openTextLabel: this.str('siddur.open'),
      markDoneLabel: this.str('notifications.markDone'),
      pendingTitle: 'השרשרת: ' + this.summary(this.mitzvah(this.state.chainId).reminders[0]) + ', ' + this.levelOf(this.state.lv).label,
      plan,
      demoLabel: 'הדמיה: השעון זז מהתראה להתראה',
      advance: () => this.setState({ step: Math.min(items.length, step + 1) }),
      advanceOff: marked !== null || step >= items.length,
      advanceLabel: 'ההתראה הבאה',
      reset: () => this.setState({ step: 1, marked: null, leaving: false }),
      resetLabel: 'מההתחלה',
      chains: [
        ['shacharit', this.mitzvah('shacharit').name],
        ['krias_shma_al_hamita', this.mitzvah('krias_shma_al_hamita').name],
      ].map(([id, label]) => ({ label, on: this.state.chainId === id, pick: () => this.setState({ chainId: id, step: 2, marked: null, leaving: false }) })),
      lvChips: [2, 3, 4].map((l) => ({ label: this.levelOf(l).name, on: this.state.lv === l, pick: () => this.setState({ lv: l, step: 2, marked: null, leaving: false }) })),
    });
  }
}
</script>
