<h2 class="hzh hz-rise" style="--d: .46s"><span class="hzh-i">[[ic:clock]]</span><span class="hzh-t">זמני היום</span><i class="hzh-l"></i><span class="hzh-n"><span>{{hebDay}}</span></span></h2>

<ul class="hz-tzl" role="list">
<sc-for list="{{zmanim}}" as="z" hint-placeholder-count="11">
<li class="hz-zr {{z.cls}}"><span class="hz-zi">[[icZ:z]]</span><span class="hz-zn">{{z.name}}</span><b class="hz-zt">{{z.time}}</b></li>
</sc-for>
</ul>

</div>
</div>
</template>
<script>
class Component extends DCLogic {
/*CORE*/

  boardState() {
    this.hz = { drag: false, id: null, sec: 0, v: 0, lx: 0, lt: 0, x0: 0, moved: false, raf: 0, qraf: 0, craf: 0, rt: 0, busy: false, chase: false, shown: null, dkey: null, goal: null, down: null, tapAt: 0, scale: 1 };
    this.hzMemo = {};
    return {};
  }

  boardUnmount() {
    const h = this.hz;
    cancelAnimationFrame(h.raf);
    cancelAnimationFrame(h.qraf);
    cancelAnimationFrame(h.craf);
    clearTimeout(h.rt);
  }

  hzCl(v, lo, hi) {
    return Math.max(lo, Math.min(hi, v));
  }

  hzHex(c) {
    return [1, 3, 5].map((i) => parseInt(c.slice(i, i + 2), 16));
  }

  hzStr(a) {
    return '#' + a.map((v) => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0')).join('');
  }

  hzMix(a, b, k) {
    return a.map((v, i) => v + (b[i] - v) * k);
  }

  hzLum(a) {
    const f = (v) => {
      v /= 255;
      return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
    };
    return 0.2126 * f(a[0]) + 0.7152 * f(a[1]) + 0.0722 * f(a[2]);
  }

  hzCr(a, b) {
    const x = this.hzLum(a);
    const y = this.hzLum(b);
    return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05);
  }

  hzKeys() {
    const dk = this.dayKey();
    if (this.hzMemo.kk === dk) return this.hzMemo.keys;
    const z = {};
    this.zmanimList().forEach((x) => (z[x.id] = x.S));
    const D = 86400;
    const H = (c) => this.hzHex(c);
    const K = (t, top, mid, bot, cloud, name, L, N) => ({ t, top: H(top), mid: H(mid), bot: H(bot), cloud: H(cloud), name, L, N });
    const night = K(z.tzeit + 5400, '#050A1C', '#0C1634', '#18265A', '#7F8FC8', 'לילה', 0, 1);
    const pre = K(z.alot - 3000, '#060A19', '#0D1533', '#18224D', '#7F8FC8', 'לפני עלות השחר', 0, 1);
    const keys = [
      { ...night, t: night.t - D },
      pre,
      K(z.alot, '#18215F', '#4B3D8E', '#9B6BA8', '#C9A6D6', 'עלות השחר', 0.12, 0.7),
      K(z.netz, '#7F97DA', '#F2B7B4', '#FFD9AE', '#FFD6CC', 'הנץ החמה', 0.5, 0.1),
      K(z.netz + 5400, '#76B6F2', '#A8D4F6', '#D8EDFA', '#FFFFFF', 'בוקר', 0.9, 0),
      K(z.chatzot, '#3F93E8', '#68B0F0', '#A8D5F8', '#FFFFFF', 'צהריים', 1, 0),
      K(z.plag, '#5E9FE0', '#9CC5E8', '#F5D9A2', '#FFF6E4', 'אחר הצהריים', 0.9, 0),
      K(z.shkia, '#4E4C9E', '#E4708C', '#FFB05C', '#FFC8B0', 'שקיעה', 0.5, 0.1),
      K(z.tzeit, '#161D58', '#2E3382', '#6C5BA8', '#9A8CC8', 'צאת הכוכבים', 0.1, 0.75),
      night,
      { ...pre, t: pre.t + D },
    ];
    this.hzMemo.kk = dk;
    this.hzMemo.keys = keys;
    return keys;
  }

  hzAt(tn) {
    const K = this.hzKeys();
    let i = 0;
    while (i < K.length - 2 && tn >= K[i + 1].t) i++;
    const a = K[i];
    const b = K[i + 1];
    const k = this.hzCl((tn - a.t) / (b.t - a.t), 0, 1);
    const e = k * k * (3 - 2 * k);
    const m = (p) => this.hzMix(a[p], b[p], e);
    return { top: m('top'), mid: m('mid'), bot: m('bot'), cloud: m('cloud'), L: a.L + (b.L - a.L) * e, N: a.N + (b.N - a.N) * e, name: a.name };
  }

  hzInk(s) {
    const zone = this.hzMix(s.top, s.mid, 0.3);
    const dark = this.hzHex('#0A1228');
    const white = [255, 255, 255];
    const useWhite = this.hzCr(zone, white) > this.hzCr(zone, dark);
    const ink = useWhite ? white : dark;
    const opp = useWhite ? [8, 14, 34] : [255, 255, 255];
    let alpha = 0;
    while (alpha < 0.55 && this.hzCr(this.hzMix(zone, opp, alpha), ink) < 5.2) alpha += 0.05;
    return { ink, opp, alpha };
  }

  hzAlt(t, z) {
    const D = 86400;
    const N = z.netz;
    const S = z.shkia;
    const C = z.chatzot;
    if (t >= N && t <= S) return t <= C ? Math.sin((Math.PI / 2) * ((t - N) / (C - N))) : Math.cos((Math.PI / 2) * ((t - C) / (S - C)));
    const tt = t < N ? t + D : t;
    const g = this.hzCl((tt - S) / (N + D - S), 0, 1);
    return -0.55 * Math.sin(Math.PI * g);
  }

  hzWave(x, a, seed) {
    return a * (0.5 * Math.sin(x / (74 + seed * 9) + seed * 1.7) + 0.32 * Math.sin(x / (37 + seed * 5) + seed * 2.9 + 1) + 0.18 * Math.sin(x / (19 + seed * 3) + seed * 0.7));
  }

  hzHills() {
    if (this.hzMemo.hills) return this.hzMemo.hills;
    const defs = [
      { gid: 'hzgf', rate: 0.07, base: 60, amp: 11, seed: 1, pad: 6, trees: false },
      { gid: 'hzgm', rate: 0.17, base: 42, amp: 13, seed: 2, pad: 6, trees: false },
      { gid: 'hzgn', rate: 0.38, base: 26, amp: 12, seed: 3, pad: 22, trees: true },
    ];
    const hills = defs.map((d) => {
      const w = Math.ceil(390 + d.rate * 2250 + 12);
      const up = d.base + d.amp + d.pad;
      const h = up + 26;
      const by = d.amp + d.pad;
      let p = 'M0 ' + h;
      for (let x = 0; x <= w; x += 6) p += 'L' + x + ' ' + (by - this.hzWave(x, d.amp, d.seed)).toFixed(1);
      p += 'L' + w + ' ' + h + 'Z';
      let trees = '';
      if (d.trees) {
        let sd = 11;
        const rnd = () => (sd = (sd * 16807) % 2147483647) / 2147483647;
        const ell = (cx, cy, rx, ry) => 'M' + (cx - rx).toFixed(1) + ' ' + cy.toFixed(1) + 'A' + rx + ' ' + ry + ' 0 1 0 ' + (cx + rx).toFixed(1) + ' ' + cy.toFixed(1) + 'A' + rx + ' ' + ry + ' 0 1 0 ' + (cx - rx).toFixed(1) + ' ' + cy.toFixed(1) + 'Z';
        for (let x = 14; x < w - 10; x += 24 + rnd() * 56) {
          const y = by - this.hzWave(x, d.amp, d.seed);
          if (rnd() < 0.5) {
            const ry = 9 + rnd() * 6;
            trees += ell(x, y - ry + 3, 2.8, ry);
          } else {
            const rx = 5 + rnd() * 3;
            trees += ell(x, y - rx * 0.6, rx, rx * 0.78);
          }
        }
      }
      return { gid: d.gid, rate: d.rate, w, h, up, d: p, trees: trees || 'M0 0' };
    });
    this.hzMemo.hills = hills;
    return hills;
  }

  hzStars() {
    if (this.hzMemo.stars) return this.hzMemo.stars;
    let sd = 5;
    const rnd = () => (sd = (sd * 16807) % 2147483647) / 2147483647;
    const out = [];
    for (let i = 0; i < 34; i++) {
      out.push({ x: Math.round(rnd() * 450), y: Math.round(6 + rnd() * 160), s: (1.3 + rnd() * 1.4).toFixed(1), d: (rnd() * 3.4).toFixed(2) + 's', du: (2.4 + rnd() * 2.6).toFixed(2) + 's' });
    }
    this.hzMemo.stars = out;
    return out;
  }

  hzLive() {
    this.timeNow();
    const want = String(this.opt('startTime') ?? 'live');
    const fixed = /^\d{1,2}:\d{2}$/.test(want) ? want.padStart(5, '0') : null;
    let t;
    if (fixed) t = this.sec(fixed) + this.state.e - this.base;
    else {
      const r = this.realNow();
      t = this.appDayOf(r.date, r.sec).sec;
    }
    const ds = this.dayStart();
    const de = this.dayEnd();
    if (t < ds) t += 86400;
    if (t >= de) t -= 86400;
    return t;
  }

  hzShown(target, dkey) {
    const h = this.hz;
    if (h.shown == null || h.dkey !== dkey || h.busy) {
      h.shown = target;
      h.dkey = dkey;
      return target;
    }
    if (h.chase) return h.shown;
    if (Math.abs(target - h.shown) > 240) {
      this.hzChase(h.shown, target);
      return h.shown;
    }
    h.shown = target;
    return target;
  }

  hzChase(from, to) {
    const h = this.hz;
    const t0 = performance.now();
    const dur = Math.max(500, Math.min(1300, 380 + Math.abs(to - from) * 0.025 * 0.4));
    h.chase = true;
    const step = (ts) => {
      if (!h.chase) return;
      const k = Math.min(1, (ts - t0) / dur);
      h.shown = from + (to - from) * (1 - Math.pow(1 - k, 3));
      if (k < 1) h.craf = requestAnimationFrame(step);
      else {
        h.chase = false;
        h.shown = null;
      }
      this.forceUpdate();
    };
    h.craf = requestAnimationFrame(step);
  }

  hzGlide(goal, dur, after) {
    const h = this.hz;
    const lo = this.dayStart();
    const hi = this.dayEnd() - 60;
    const to = this.hzCl(goal, lo, hi);
    const from = h.busy ? h.sec : this.now();
    cancelAnimationFrame(h.raf);
    cancelAnimationFrame(h.craf);
    h.chase = false;
    h.busy = true;
    h.goal = to;
    h.sec = from;
    const px = Math.abs(to - from) * 0.025;
    const d = dur != null ? dur : this.hzCl(420 + px * 0.42, 480, 1300);
    const t0 = performance.now();
    const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
    const step = (ts) => {
      const k = Math.min(1, (ts - t0) / d);
      h.sec = from + (to - from) * ease(k);
      this.scrub(h.sec);
      if (k < 1) h.raf = requestAnimationFrame(step);
      else {
        h.raf = 0;
        h.busy = false;
        h.goal = null;
        h.shown = null;
        if (after) after();
      }
    };
    h.raf = requestAnimationFrame(step);
  }

  hzFling(v0) {
    const h = this.hz;
    const lo = this.dayStart();
    const hi = this.dayEnd() - 60;
    let v = this.hzCl(v0, -3.5, 3.5) * 40;
    let last = performance.now();
    h.busy = true;
    const step = (ts) => {
      const dt = Math.min(48, ts - last);
      last = ts;
      h.sec += v * dt;
      v *= Math.exp(-dt / 360);
      if (h.sec <= lo) {
        h.sec = lo;
        v = 0;
      } else if (h.sec >= hi) {
        h.sec = hi;
        v = 0;
      }
      this.scrub(h.sec);
      if (Math.abs(v) / 40 > 0.012) h.raf = requestAnimationFrame(step);
      else {
        h.raf = 0;
        h.busy = false;
        h.shown = null;
      }
    };
    h.raf = requestAnimationFrame(step);
  }

  hzGoLive() {
    this.hzGlide(this.hzLive(), null, () => this.goLive());
  }

  hzOnDown(e) {
    const h = this.hz;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    if (e.target && e.target.closest && e.target.closest('.hz-range')) return;
    cancelAnimationFrame(h.raf);
    cancelAnimationFrame(h.craf);
    h.raf = 0;
    h.chase = false;
    h.busy = true;
    h.shown = null;
    h.drag = true;
    h.id = e.pointerId;
    h.moved = false;
    h.x0 = h.lx = e.clientX;
    h.lt = performance.now();
    h.v = 0;
    h.sec = this.now();
    h.goal = null;
    h.down = e.target;
    const r = e.currentTarget.getBoundingClientRect();
    h.scale = r.width / 390 || 1;
    try {
      e.currentTarget.setPointerCapture(e.pointerId);
    } catch (err) {}
  }

  hzOnMove(e) {
    const h = this.hz;
    if (!h.drag || e.pointerId !== h.id) return;
    if (!h.moved && Math.abs(e.clientX - h.x0) < 5) return;
    h.moved = true;
    const dx = (e.clientX - h.lx) / h.scale;
    const now = performance.now();
    const dt = Math.max(1, now - h.lt);
    h.v = 0.6 * (dx / dt) + 0.4 * h.v;
    h.lx = e.clientX;
    h.lt = now;
    h.sec = this.hzCl(h.sec + dx * 40, this.dayStart(), this.dayEnd() - 60);
    if (!h.qraf) {
      h.qraf = requestAnimationFrame(() => {
        h.qraf = 0;
        if (h.drag) this.scrub(h.sec);
      });
    }
  }

  hzOnUp(e) {
    const h = this.hz;
    if (!h.drag || e.pointerId !== h.id) return;
    h.drag = false;
    try {
      e.currentTarget.releasePointerCapture(e.pointerId);
    } catch (err) {}
    if (!h.moved) {
      h.busy = false;
      this.hzTap(e, h.down);
      return;
    }
    const idle = performance.now() - h.lt;
    const v = idle > 90 ? 0 : h.v;
    if (Math.abs(v) < 0.06) {
      this.scrub(h.sec);
      h.busy = false;
      h.shown = null;
      return;
    }
    this.hzFling(v);
  }

  hzOnCancel(e) {
    const h = this.hz;
    if (!h.drag) return;
    h.drag = false;
    try {
      e.currentTarget.releasePointerCapture(e.pointerId);
    } catch (err) {}
    if (h.moved) this.scrub(h.sec);
    h.busy = false;
    h.shown = null;
  }

  hzTap(e, down) {
    const h = this.hz;
    h.tapAt = Date.now();
    if (down && down.closest && down.closest('[data-hz-now]')) {
      this.hzGoLive();
      return;
    }
    if (down && down.closest && down.closest('[data-hz-next]')) {
      const nz = this.zmanimList().find((z) => z.S > this.now());
      if (nz) this.hzGlide(nz.S);
      return;
    }
    const r = e.currentTarget.getBoundingClientRect();
    const sc = r.width / 390 || 1;
    const ry =(e.clientY - r.top) / sc - (r.height / sc - 138);
    if (ry < 0 || ry > 64) return;
    const v = (r.right - e.clientX) / sc;
    const t = this.now();
    let best = null;
    let bd = 1e9;
    this.zmanimList().forEach((z) => {
      const d = Math.abs(195 + (z.S - t) * 0.025 - v);
      if (d < bd) {
        bd = d;
        best = z;
      }
    });
    if (best && bd <= 46) this.hzGlide(best.S);
  }

  hzOnKey(e) {
    const k = e.key;
    let goal = null;
    const base = this.hz.goal != null ? this.hz.goal : this.now();
    if (k === 'ArrowLeft' || k === 'ArrowUp') goal = base + (e.shiftKey ? 60 : 300);
    else if (k === 'ArrowRight' || k === 'ArrowDown') goal = base - (e.shiftKey ? 60 : 300);
    else if (k === 'PageUp') goal = base + 3600;
    else if (k === 'PageDown') goal = base - 3600;
    else if (k === 'Home') goal = this.dayStart();
    else if (k === 'End') goal = this.dayEnd() - 60;
    if (goal == null) return;
    e.preventDefault();
    this.hzGlide(goal, 190);
  }

  hzOnRange(e) {
    const h = this.hz;
    const v = Number(e.target.value);
    cancelAnimationFrame(h.raf);
    cancelAnimationFrame(h.craf);
    h.raf = 0;
    h.chase = false;
    h.busy = true;
    h.sec = v;
    this.scrub(v);
    clearTimeout(h.rt);
    h.rt = setTimeout(() => {
      h.busy = false;
      h.shown = null;
      this.forceUpdate();
    }, 260);
  }

  renderVals() {
    const c = this.coreVals();
    const K = 0.025;
    const D = 86400;
    const cl = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
    const ds = this.dayStart();
    const de = this.dayEnd();
    const big = /\bbig\b/.test(c.phCls);
    const dy = big ? 16 : 0;
    const RH = 138;
    const SH = 354 + dy;
    const rt = SH - RH;
    const t = this.hzShown(this.now(), c.dateKey);
    const tn = ((t % D) + D) % D;
    const Z = this.zmanimList();
    const zs = {};
    Z.forEach((z) => (zs[z.id] = z.S));
    const s = this.hzAt(tn);
    const ik = this.hzInk(s);
    const off = (t - ds) * K;
    const total = (de - ds) * K;
    const stripW = Math.round(total + 390);
    const R = (sec) => 195 + (sec - ds) * K;
    const px = (v) => v.toFixed(1) + 'px';
    const rgba = (a, al) => 'rgba(' + a.map((v) => Math.round(v)).join(',') + ',' + al.toFixed(2) + ')';

    const Y0 = rt - 58;
    const A = 56;
    const alt = this.hzAlt(t, zs);
    const f = (t - zs.netz) / (zs.shkia - zs.netz);
    const sx = cl(350 - 310 * f, -120, 520);
    const sy = Y0 - A * alt;
    const sunOp = cl((alt + 0.3) / 0.3, 0, 1);
    const hgt = cl(alt / 0.55, 0, 1);
    const sunC = this.hzStr(this.hzMix(this.hzHex('#FF8A3D'), this.hzHex('#FFE27A'), hgt));
    const sunC2 = this.hzStr(this.hzMix(this.hzHex('#E8531F'), this.hzHex('#FFB347'), hgt));
    const tt = t < zs.netz ? t + D : t;
    const gm = cl((tt - zs.shkia) / (zs.netz + D - zs.shkia), -0.15, 1.15);
    const mx = 350 - 310 * gm;
    const my = Y0 - A * 0.92 * Math.sin(Math.PI * gm);
    const glowOp = cl(1 - Math.abs(alt) / 0.5, 0, 1);

    const L = s.L;
    const col = (night, day, tint) => this.hzMix(this.hzMix(this.hzHex(night), this.hzHex(day), L), s.bot, tint);
    const cols = [col('#16204A', '#8FA6C8', 0.36), col('#0F1838', '#7E9A86', 0.22), col('#0A112B', '#5E7551', 0.12)];
    const haze = [0.5, 0.34, 0.2];
    const hills = this.hzHills().map((h, i) => ({
      gid: h.gid,
      w: h.w,
      h: h.h,
      top: rt - h.up,
      x: (h.rate * off).toFixed(1),
      d: h.d,
      trees: h.trees,
      c1: this.hzStr(cols[i]),
      c2: this.hzStr(this.hzMix(cols[i], s.bot, haze[i])),
      fill: 'url(#' + h.gid + ')',
      treeC: this.hzStr(this.hzMix(cols[i], [0, 0, 0], 0.3)),
    }));

    const mk = (a) => this.hzStr(a);
    const sceneStyle = [
      '--sh:' + SH + 'px',
      '--rh:' + RH + 'px',
      '--hs1:' + mk(s.top),
      '--hs2:' + mk(s.mid),
      '--hs3:' + mk(s.bot),
      '--glow:' + rgba(this.hzHex(t < (zs.netz + zs.shkia) / 2 ? '#FF9A86' : '#FF8A45'), 0.6),
      '--ink:' + mk(ik.ink),
      '--opp:' + mk(ik.opp),
      '--chip:' + rgba(ik.opp, ik.alpha),
    ].join(';');

    const nowLive = this.hzLive();
    const away = Math.abs(nowLive - t) > 90;
    const vN = 195 + (nowLive - t) * K;
    const nowOk = away && nowLive >= ds && nowLive < de;
    const nowR = cl(vN, 44, 346);

    const nzI = Z.findIndex((z) => z.S > t);
    const nzV = nzI >= 0 ? 195 + (Z[nzI].S - t) * K : 0;
    const nextEdge = nzI >= 0 && (nzV < 52 || nzV > 338);

    const hours = [];
    for (let hh = Math.ceil(ds / 3600); hh * 3600 <= de; hh++) {
      const x = R(hh * 3600);
      if (nowOk && Math.abs(x - R(nowLive)) < 30) continue;
      hours.push({ t: String(hh % 24).padStart(2, '0'), st: 'right: ' + px(x) });
    }
    const g10R = R(Math.ceil(ds / 600) * 600);
    const g60R = R(Math.ceil(ds / 3600) * 3600);

    const nextId = (c.zmanim.find((z) => z.isNext) || {}).id;
    const marks = c.zmanim.map((z, i) => ({
      id: z.id,
      short: z.short,
      time: z.time,
      cls: (i % 2 ? 'l' : 'u') + (z.isNext ? ' next' : z.past ? ' past' : ''),
      st: 'right: ' + px(R(Z[i].S)),
      nodeBg: mk(this.hzAt(((Z[i].S % D) + D) % D).mid),
      aria: 'נסיעה אל ' + z.name + ', ' + z.time,
      go: () => {
        if (Date.now() - this.hz.tapAt < 500) return;
        this.hzGlide(Z[i].S);
      },
    }));

    const items = this.items();
    const tl = {};
    c.timeline.forEach((x) => (tl[x.id] = x));
    const laneEnd = [];
    const bands = [];
    const pills = [];
    items
      .slice()
      .sort((a, b) => a.S - b.S || b.E - a.E)
      .forEach((it) => {
        let lane = laneEnd.findIndex((e) => e + 600 <= it.S);
        if (lane < 0) lane = laneEnd.length;
        laneEnd[lane] = it.E;
        const st = tl[it.id].status;
        const top = 84 + lane * 18;
        const wBand = (it.E - it.S) * K;
        let bg = '';
        if (st === 'open' || st === 'active') {
          const p = cl(((t - it.S) / (it.E - it.S)) * 100, 0, 100).toFixed(2);
          bg = ';background: linear-gradient(to left, var(--accent) 0, var(--accent) ' + p + '%, color-mix(in srgb, var(--accent) 20%, transparent) ' + p + '%)';
        }
        const d = this.doneAt(it.id);
        bands.push({
          cls: st === 'active' ? 'open' : st === 'upcoming' ? 'ahead' : st,
          st: 'right: ' + px(R(it.S)) + '; width: ' + px(wBand) + '; top: ' + top + 'px' + bg,
          isDone: st === 'done' && d != null,
          dotSt: 'right: ' + px(R(d != null ? d : it.S)) + '; top: ' + top + 'px',
        });
        const vS = 195 + (it.S - t) * K;
        const vE = 195 + (it.E - t) * K;
        const start = Math.max(vS, 0) + 5;
        const avail = Math.min(vE, 390) - start - 5;
        if (avail >= 46) {
          pills.push({
            cls: st === 'active' ? 'open' : st === 'upcoming' ? 'ahead' : st,
            st: 'right: ' + px(start) + '; top: ' + top + 'px; max-width: ' + px(avail),
            name: it.short,
            stText: tl[it.id].statusShort,
            isDone: st === 'done',
            isMissed: st === 'missed',
            isOpen: st === 'active',
          });
        }
      });

    const gk = c.dateKey;
    if (this.hzMemo.rk !== gk + '|' + stripW) {
      this.hzMemo.rk = gk + '|' + stripW;
      const sm = [];
      const mi = [];
      for (let sec = ds; sec <= de; sec += 1800) {
        const c2 = this.hzStr(this.hzAt(((sec % D) + D) % D).mid);
        sm.push(c2 + ' ' + (((sec - ds) / (de - ds)) * 100).toFixed(2) + '%');
        mi.push(c2 + ' ' + (((R(sec)) / stripW) * 100).toFixed(2) + '%');
      }
      this.hzMemo.railMini = 'linear-gradient(to left, ' + sm.join(', ') + ')';
      this.hzMemo.railBg = 'linear-gradient(to left, ' + mi.join(', ') + ')';
    }
    const pct = (sec) => cl(((sec - ds) / (de - ds)) * 100, 0, 100);
    const span = 195 / K;
    const winR = pct(t - span);
    const winL = pct(t + span);

    const upGroups = [];
    c.upcoming.forEach((x) => {
      let g = upGroups.find((q) => q.time === x.startT);
      if (!g) {
        g = { time: x.startT, names: [], isSun: x.isSun, isBox: x.isBox, isBook: x.isBook, isMoon: x.isMoon };
        upGroups.push(g);
      }
      g.names.push(x.short);
    });
    upGroups.forEach((g) => (g.name = g.names.join(' · ')));

    const actives = c.active.map((it, i) => ({
      ...it,
      ringOff: this.dash(157.1, it.pctLeft),
      dotCls: it.isMoon ? 'moon' : '',
      enter: 'enter-' + this.flip('act' + i, it.id),
    }));
    const doneRows = c.done.map((d, i) => ({ ...d, enter: 'enter-' + this.flip('dn' + i, d.id + d.at) }));
    const missedRows = c.missed.map((m, i) => ({ ...m, enter: 'enter-' + this.flip('ms' + i, m.id) }));
    const personalMsgs = c.msgPersonal.map((m) => ({ ...m, isNext: m.id === 'next', notNext: m.id !== 'next', shape: m.id === 'next' ? 'hz-next' : 'hz-pm' }));

    const clk = this.clock(t);
    const sliderText = clk + ', ' + s.name + '. הבא: ' + c.nextZ.name + ' ' + c.nextZ.left;

    return {
      ...c,
      sceneStyle,
      stars: this.hzStars(),
      starsOp: s.N.toFixed(2),
      starsX: (0.03 * off).toFixed(1),
      cloudOp: ((1 - s.N) * 0.92).toFixed(2),
      cloudC: mk(s.cloud),
      cloudX: (0.1 * off).toFixed(1),
      birdsOp: cl((L - 0.4) / 0.4, 0, 1).toFixed(2),
      motesOp: cl((s.N - 0.3) / 0.5, 0, 1).toFixed(2),
      moteY1: Math.round(rt - 70),
      moteY2: Math.round(rt - 46),
      moteY3: Math.round(rt - 24),
      sunX: sx.toFixed(1),
      sunY: sy.toFixed(1),
      sunOp: sunOp.toFixed(2),
      sunC,
      sunC2,
      moonX: mx.toFixed(1),
      moonY: my.toFixed(1),
      moonOp: s.N.toFixed(2),
      glowX: cl(sx, 40, 350).toFixed(1),
      glowY: Math.round(Y0 - 110),
      glowOp: glowOp.toFixed(2),
      hills,
      phaseName: s.name,
      bubbleT: clk,
      bubbleSub: c.isScrub ? 'תצוגה' : 'עכשיו',
      liveCls: c.isScrub ? '' : 'on',
      dayLastSec: de - 60,
      sliderText,
      stripW,
      stripX: off.toFixed(1),
      railBg: this.hzMemo.railBg,
      railMini: this.hzMemo.railMini,
      g10St: 'right: ' + px(g10R) + '; width: ' + px(stripW - g10R),
      g60St: 'right: ' + px(g60R) + '; width: ' + px(stripW - g60R),
      hours,
      marks,
      bands,
      pills,
      showNow: nowOk,
      nowLineSt: 'right: ' + px(R(nowLive)),
      nowSt: 'right: ' + px(nowR),
      nowArrowL: nowOk && vN > 346,
      nowArrowR: nowOk && vN < 44,
      showNextEdge: nextEdge,
      nextEdgeSt: 'right: ' + px(cl(nzV, 58, 332)) + '; top: ' + (nzI % 2 ? 29 : 11) + 'px',
      nextEdgeName: nzI >= 0 ? Z[nzI].short : '',
      nextEdgeTime: nzI >= 0 ? Z[nzI].t : '',
      nextEdgeAria: nzI >= 0 ? 'נסיעה אל ' + Z[nzI].name + ', ' + Z[nzI].t : '',
      nextArrowL: nextEdge && nzV > 338,
      nextArrowR: nextEdge && nzV < 52,
      hzNextClick: () => {
        if (Date.now() - this.hz.tapAt < 500) return;
        const nz = this.zmanimList().find((z) => z.S > this.now());
        if (nz) this.hzGlide(nz.S);
      },
      hzNowClick: () => {
        if (Date.now() - this.hz.tapAt < 500) return;
        this.hzGoLive();
      },
      railDots: Z.map((z) => ({ r: pct(z.S).toFixed(2) })),
      winR: winR.toFixed(2),
      winW: Math.max(0, winL - winR).toFixed(2),
      railNow: pct(nowLive).toFixed(2),
      railVal: Math.round(cl(t, ds, de - 60)),
      hzDown: (e) => this.hzOnDown(e),
      hzMove: (e) => this.hzOnMove(e),
      hzUp: (e) => this.hzOnUp(e),
      hzCancel: (e) => this.hzOnCancel(e),
      hzKey: (e) => this.hzOnKey(e),
      hzRange: (e) => this.hzOnRange(e),
      personalMsgs,
      noMessages: !c.hasMessages,
      actives,
      doneRows,
      missedRows,
      upGroups,
      noUpcoming: c.upcoming.length === 0,
    };
  }
}
</script>
