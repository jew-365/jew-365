<defs>
<linearGradient id="mtArcG" gradientUnits="userSpaceOnUse" x1="317" y1="0" x2="33" y2="0"><stop offset="0" stop-color="#C58BD9"></stop><stop offset=".16" stop-color="#FF9FB0"></stop><stop offset=".32" stop-color="#FFD27A"></stop><stop offset=".5" stop-color="#FFF1A8"></stop><stop offset=".68" stop-color="#FFC66B"></stop><stop offset=".84" stop-color="#FF8A5C"></stop><stop offset="1" stop-color="#B07CD8"></stop></linearGradient>
<linearGradient id="mtGrd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color: {{groundTop}}; stop-opacity: .55"></stop><stop offset="1" style="stop-color: {{groundBot}}; stop-opacity: .92"></stop></linearGradient>
</defs>
<rect x="0" y="158" width="350" height="58" fill="url(#mtGrd)"></rect>

</template>
<script>
class Component extends DCLogic {
/*CORE*/

  boardState() {
    return { zSel: null, drag: false, touched: false, vf: 0 };
  }

  boardMount() {
    this.chipTimer = setTimeout(() => this.centerChip(false), 80);
  }

  boardUnmount() {
    clearTimeout(this.chipTimer);
    cancelAnimationFrame(this.vRaf);
    cancelAnimationFrame(this.gRaf);
  }

  componentDidUpdate() {
    if (this.chipKey !== this.lastChip) {
      const first = this.lastChip === undefined;
      this.lastChip = this.chipKey;
      if (!first) this.centerChip(true);
    }
  }

  centerChip(smooth) {
    const box = document.getElementById('zchips');
    const on = box && box.querySelector('[aria-pressed="true"]');
    if (!box || !on) return;
    const b = box.getBoundingClientRect();
    const o = on.getBoundingClientRect();
    const dx = o.left + o.width / 2 - (b.left + b.width / 2);
    if (smooth) box.scrollBy({ left: dx, behavior: 'smooth' });
    else box.scrollLeft += dx;
  }

  geo() {
    return { CX: 175, CY: 158, RX: 142, RY: 116, NRX: 100, NRY: 46 };
  }

  ellipseLen(rx, ry, f) {
    const end = Math.PI * Math.max(0, Math.min(1, f));
    let len = 0;
    let px = rx;
    let py = 0;
    for (let i = 1; i <= 120; i++) {
      const a = (end * i) / 120;
      const x = rx * Math.cos(a);
      const y = ry * Math.sin(a);
      len += Math.hypot(x - px, y - py);
      px = x;
      py = y;
    }
    return len;
  }

  eased(t, key) {
    const now = performance.now();
    const dt = Math.min(100, now - (this.vAt || now - 16));
    this.vAt = now;
    const calm = typeof matchMedia === 'function' && matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (this.vis == null || this.visKey !== key || calm) {
      this.vis = t;
    } else {
      const d = t - this.vis;
      const tau = this.state.drag ? 42 : 130;
      this.vis = Math.abs(d) < 45 ? t : this.vis + d * (1 - Math.exp(-dt / tau));
    }
    this.visKey = key;
    if (this.vis !== t) this.kick();
    return this.vis;
  }

  kick() {
    if (this.vRaf) return;
    this.vRaf = requestAnimationFrame(() => {
      this.vRaf = 0;
      this.setState((s) => ({ vf: s.vf + 1 }));
    });
  }

  gPoint(e) {
    const r = document.getElementById('scene').getBoundingClientRect();
    return { x: ((e.clientX - r.left) * 350) / r.width, y: ((e.clientY - r.top) * 216) / r.height };
  }

  gTime(p) {
    const { CX, CY, RX, RY, NRX, NRY } = this.geo();
    const A0 = this.dayStart();
    const A1 = this.zmanSec('tzeit');
    const E = this.dayEnd();
    if (p.y <= CY) {
      const nu = (p.x - CX) / RX;
      const nv = (CY - p.y) / RY;
      const rho = Math.hypot(nu, nv);
      return { rho, near: rho > 0.55 && rho < 1.4, sec: A0 + (Math.atan2(nv, nu) / Math.PI) * (A1 - A0) };
    }
    const nu = (p.x - CX) / NRX;
    const nv = (p.y - CY) / NRY;
    const rho = Math.hypot(nu, nv);
    return { rho, near: rho > 0.62 && rho < 1.7, sec: A1 + (Math.atan2(nv, -nu) / Math.PI) * (E - A1) };
  }

  gSet(sec) {
    this.gPend = sec;
    if (this.gRaf) return;
    this.gRaf = requestAnimationFrame(() => {
      this.gRaf = 0;
      this.gFlush();
    });
  }

  gFlush() {
    if (this.gPend == null) return;
    const v = this.gPend;
    this.gPend = null;
    this.scrub(v);
  }

  gDown(e) {
    if (e.button > 0) return;
    const hit = this.gTime(this.gPoint(e));
    const onGrab = Boolean(e.target.closest && e.target.closest('.grab'));
    if (hit.rho < 0.15 || (!onGrab && !hit.near)) return;
    try {
      e.currentTarget.setPointerCapture(e.pointerId);
    } catch (err) {}
    const cur = this.now();
    this.gDrag = { id: e.pointerId, off: onGrab ? hit.sec - cur : 0, prev: cur };
    this.setState({ drag: true, touched: true, zSel: null });
    if (!onGrab) this.gSet(hit.sec);
  }

  gMove(e) {
    const d = this.gDrag;
    if (!d || e.pointerId !== d.id) return;
    const hit = this.gTime(this.gPoint(e));
    if (hit.rho < 0.15) return;
    const lo = this.dayStart();
    const hi = this.dayEnd() - 60;
    let sec = hit.sec - d.off;
    d.off *= 0.93;
    if (Math.abs(sec - d.prev) > (hi - lo) * 0.75) sec = d.prev < (lo + hi) / 2 ? lo : hi;
    sec = Math.max(lo, Math.min(hi, sec));
    d.prev = sec;
    this.gSet(sec);
  }

  gUp(e) {
    const d = this.gDrag;
    if (!d || e.pointerId !== d.id) return;
    this.gDrag = null;
    try {
      e.currentTarget.releasePointerCapture(e.pointerId);
    } catch (err) {}
    this.gFlush();
    this.setState({ drag: false });
  }

  gKey(e) {
    const t = this.now();
    const keys = { ArrowLeft: 300, ArrowUp: 300, ArrowRight: -300, ArrowDown: -300, PageUp: 3600, PageDown: -3600 };
    let to = null;
    if (e.key in keys) to = t + keys[e.key];
    else if (e.key === 'Home') to = this.dayStart();
    else if (e.key === 'End') to = this.dayEnd() - 60;
    if (to == null) return;
    e.preventDefault();
    this.setState({ zSel: null, touched: true });
    this.scrub(to);
  }

  mxHex(c) {
    return [1, 3, 5].map((i) => parseInt(c.slice(i, i + 2), 16));
  }

  mxStr(a) {
    return '#' + a.map((v) => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0')).join('');
  }

  mxMix(a, b, k) {
    return a.map((v, i) => v + (b[i] - v) * k);
  }

  mxLum(a) {
    const f = (v) => {
      v /= 255;
      return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
    };
    return 0.2126 * f(a[0]) + 0.7152 * f(a[1]) + 0.0722 * f(a[2]);
  }

  mxCr(a, b) {
    const x = this.mxLum(a);
    const y = this.mxLum(b);
    return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05);
  }

  mxCl(v, lo, hi) {
    return Math.max(lo, Math.min(hi, v));
  }

  mxKeys() {
    const z = {};
    this.zmanimList().forEach((x) => (z[x.id] = x.S));
    const end = this.dayEnd();
    const H = (c) => this.mxHex(c);
    const K = (t, top, mid, bot, cloud, name) => ({ t, top: H(top), mid: H(mid), bot: H(bot), cloud: H(cloud), name });
    const dawnLen = z.netz - z.alot;
    const alotK = K(z.alot, '#18215F', '#4B3D8E', '#9B6BA8', '#C9A6D6', 'עלות השחר');
    return [
      alotK,
      K(z.netz, '#8DA3E0', '#F2B7B4', '#FFD9AE', '#FFD6CC', 'הנץ החמה'),
      K(z.netz + (z.chatzot - z.netz) * 0.3, '#76B6F2', '#A8D4F6', '#D8EDFA', '#FFFFFF', 'בוקר'),
      K(z.chatzot, '#4B9DEB', '#6DB4F1', '#A8D5F8', '#FFFFFF', 'צהריים'),
      K(z.plag, '#5E9FE0', '#9CC5E8', '#F5D9A2', '#FFF6E4', 'אחר הצהריים'),
      K(z.shkia, '#5C5AA8', '#E4708C', '#FFB05C', '#FFC8B0', 'שקיעה'),
      K(z.tzeit, '#161D58', '#2E3382', '#6C5BA8', '#9A8CC8', 'צאת הכוכבים'),
      K(z.tzeit + (z.chatzotL - z.tzeit) * 0.25, '#070C1F', '#0F1A3E', '#1B2A58', '#7F8FC8', 'לילה'),
      K(end - dawnLen * 0.7, '#060A19', '#0D1533', '#18224D', '#7F8FC8', 'לפני עלות השחר'),
      { ...alotK, t: end },
    ];
  }

  mxAt(t) {
    const K = this.mxKeys();
    let i = 0;
    while (i < K.length - 2 && t >= K[i + 1].t) i++;
    const a = K[i];
    const b = K[i + 1];
    const k = this.mxCl((t - a.t) / (b.t - a.t), 0, 1);
    const e = k * k * (3 - 2 * k);
    const m = (p) => this.mxMix(a[p], b[p], e);
    return { top: m('top'), mid: m('mid'), bot: m('bot'), cloud: m('cloud'), name: a.name };
  }

  mxInk(s) {
    const zones = [s.top, this.mxMix(s.top, s.mid, 0.6), s.mid, s.bot];
    const dark = this.mxHex('#0A1228');
    const white = [255, 255, 255];
    const worst = (ink) => Math.min(...zones.map((z) => this.mxCr(z, ink)));
    const useWhite = worst(white) > worst(dark);
    const ink = useWhite ? white : dark;
    const opp = useWhite ? [8, 14, 34] : [255, 255, 255];
    let alpha = 0.18;
    while (alpha < 0.8 && Math.min(...zones.map((z) => this.mxCr(this.mxMix(z, opp, alpha), ink))) < 5.2) alpha += 0.04;
    return { ink, opp, alpha };
  }

  renderVals() {
    const c = this.coreVals();
    const s = this.state;
    const t = this.now();
    const A0 = this.dayStart();
    const A1 = this.zmanSec('tzeit');
    const E = this.dayEnd();
    const NIGHT = E - A1;
    const { CX, CY, RX, RY, NRX, NRY } = this.geo();
    const cl = (f) => Math.max(0, Math.min(1, f));
    const dayP = (f) => ({ x: CX + RX * Math.cos(Math.PI * cl(f)), y: CY - RY * Math.sin(Math.PI * cl(f)) });
    const nightP = (f) => ({ x: CX - NRX * Math.cos(Math.PI * cl(f)), y: CY + NRY * Math.sin(Math.PI * cl(f)) });
    const vis = this.eased(t, c.dateKey);
    const visNight = vis >= A1;
    const dayFrac = cl((vis - A0) / (A1 - A0));
    const nightFrac = cl((vis - A1) / NIGHT);
    if (!this.lens) this.lens = { day: this.ellipseLen(RX, RY, 1), night: this.ellipseLen(NRX, NRY, 1) };
    const dayLen = this.lens.day;
    const nightLen = this.lens.night;
    const dayAt = this.ellipseLen(RX, RY, dayFrac);
    const nightAt = this.ellipseLen(NRX, NRY, nightFrac);
    const sun = dayP(dayFrac);
    const moon = nightP(nightFrac);
    const orb = visNight ? moon : sun;
    const trail = (at, total) =>
      [
        { cls: 't3', L: 96 },
        { cls: 't2', L: 56 },
        { cls: 't1', L: 28 },
      ].map(({ cls, L }) => {
        const a = Math.max(0, at - L);
        return { cls, da: (at - a).toFixed(1) + ' ' + (total + 40).toFixed(0), off: (-a).toFixed(1) };
      });

    const zl = this.zmanimList();
    const zS = Object.fromEntries(zl.map((z) => [z.id, z.S]));
    const nextId = (c.zmanim.find((z) => z.isNext) || {}).id || null;
    const selId = (c.isScrub && s.zSel) || nextId;
    const sel = c.zmanim.find((z) => z.id === selId) || null;
    const selS = sel ? zS[sel.id] : 0;
    const read = sel
      ? {
          label: sel.name,
          hm: sel.time,
          rel: Math.abs(selS - t) < 30 ? 'הגיע הזמן' : selS > t ? 'בעוד ' + this.left(selS - t) : 'עבר לפני ' + this.left(t - selS),
          isNext: sel.isNext,
        }
      : { label: c.nextZ.name, hm: c.nextZ.time, rel: c.nextZ.left, isNext: true };
    if (this.readKey !== read.label) {
      this.readKey = read.label;
      this.readFlip = !this.readFlip;
    }
    this.chipKey = selId;

    const ticks = c.zmanim.map((z, i) => {
      const S = zl[i].S;
      const p = S <= A1 ? dayP((S - A0) / (A1 - A0)) : nightP((S - A1) / NIGHT);
      return { x: (p.x - 6).toFixed(1), y: (p.y - 6).toFixed(1), cls: (z.past ? 'past' : '') + (z.isNext ? ' nxt' : '') + (z.id === selId ? ' sel' : '') };
    });
    const zchips = c.zmanim.map((z) => ({
      id: z.id,
      label: z.isNext ? 'הבא · ' + z.short : z.short,
      time: z.time,
      cls: z.cls,
      pressed: z.id === selId,
      pick: () => {
        const same = Boolean(c.isScrub && s.zSel === z.id);
        this.setState({ zSel: same ? null : z.id, touched: true });
        if (!same) this.scrub(zS[z.id]);
      },
    }));

    const sk = this.mxAt(Math.round(t / 20) * 20);
    const ik = this.mxInk(sk);
    const rgba = (a, al) => 'rgba(' + a.map((v) => Math.round(v)).join(',') + ',' + al.toFixed(2) + ')';
    const dkc = [8, 12, 30];
    const alt = Math.sin(Math.PI * dayFrac);
    const hgt = this.mxCl(alt / 0.55, 0, 1);
    const sunC = this.mxStr(this.mxMix(this.mxHex('#FF8A3D'), this.mxHex('#FFE27A'), hgt));
    const sunC2 = this.mxStr(this.mxMix(this.mxHex('#E8531F'), this.mxHex('#FFB347'), hgt));
    const nz = (A1 - zS.shkia) || 1200;
    const dz = (zS.netz - A0) || 1200;
    let nightK = 0;
    if (t >= zS.shkia) nightK = this.mxCl((t - zS.shkia) / (2 * nz), 0, 1);
    else if (t <= zS.netz) nightK = this.mxCl((zS.netz - t) / dz, 0, 1);
    nightK = nightK * nightK * (3 - 2 * nightK);
    const stars = [
      [46, 40, 2.6, 0, 3.4], [92, 20, 2, 1.1, 4.1], [128, 62, 2, 2.2, 3.1], [224, 28, 3, 0.6, 3.8], [262, 60, 2, 1.7, 4.4], [302, 34, 2.6, 2.6, 3.3],
      [22, 94, 2, 1.4, 4.7], [330, 92, 2, 0.3, 3.6], [64, 122, 1.8, 2.9, 4.2], [288, 122, 1.8, 1.9, 3.5],
      [20, 18, 1.8, 0.8, 4.9], [172, 10, 1.8, 2.4, 3.7], [200, 52, 1.6, 1.3, 5.1], [334, 20, 1.8, 3.1, 4], [112, 34, 1.6, 0.4, 4.6],
      [48, 70, 1.6, 2.1, 3.9], [308, 76, 1.6, 0.9, 4.3], [14, 140, 1.6, 1.6, 5], [338, 140, 1.6, 2.7, 3.4],
    ].map(([x, y, sz, d, du]) => ({ x, y, s: sz, d, du }));

    const live = this.liveSec();
    const gp = live <= A1 ? dayP((live - A0) / (A1 - A0)) : nightP((live - A1) / NIGHT);
    const showGhost = c.isScrub && Math.abs(live - t) > 240;

    const first = c.hasHero ? c.hero : null;
    const nextItem = c.upcoming[0] || null;
    const midCaption = first ? first.short + ' · עוד ' + first.left : nextItem ? 'הבא: ' + nextItem.short + ' ב-' + nextItem.startT : 'הכול סומן להיום';

    const actives = c.active.map((it, i) => ({
      ...it,
      ringOff: this.dash(157.1, it.pctLeft),
      dotCls: it.isMoon ? 'moon' : '',
      enter: 'enter-' + this.flip('act' + i, it.id),
    }));
    const doneRows = c.done.map((d, i) => ({ ...d, enter: 'enter-' + this.flip('dn' + i, d.id + d.at) }));
    const missedRows = c.missed.map((m, i) => ({ ...m, enter: 'enter-' + this.flip('ms' + i, m.id) }));
    const msgs = [...c.msgPersonal, ...c.msgGeneral].map((m) => ({ ...m, body: m.body.replace(/(\d)–(\d)/g, '$1⁠–⁠$2'), noAction: !m.hasAction, action: m.id === 'next' ? 'פתיחת ההודעות האישיות' : m.action }));

    const up = c.upcoming[0] || null;
    const upRaw = up ? this.items().find((x) => x.id === up.id) : null;

    return {
      ...c,
      skyStyle: ['--sk1:' + this.mxStr(sk.top), '--sk2:' + this.mxStr(sk.mid), '--sk3:' + this.mxStr(sk.bot), '--ink:' + this.mxStr(ik.ink), '--inkchip:' + rgba(ik.opp, ik.alpha)].join(';'),
      groundTop: this.mxStr(this.mxMix(sk.bot, dkc, 0.35)),
      groundBot: this.mxStr(this.mxMix(sk.bot, dkc, 0.7)),
      hillBack: 'M0 158V142Q45 128 95 140T200 138T290 134T350 142V158Z',
      hillFront: 'M0 158V150Q60 140 120 150T250 148T350 150V158Z',
      hillBackC: this.mxStr(this.mxMix(sk.bot, dkc, 0.4)),
      hillFrontC: this.mxStr(this.mxMix(sk.bot, dkc, 0.58)),
      sceneCls: (s.drag ? 'drag ' : '') + (c.isScrub ? 'scr ' : '') + (s.touched ? '' : 'hintOn'),
      liveMode: s.drag ? 'off' : 'polite',
      gDown: (e) => this.gDown(e),
      gMove: (e) => this.gMove(e),
      gUp: (e) => this.gUp(e),
      gKey: (e) => this.gKey(e),
      read,
      readCls: this.readFlip ? 'ra' : 'rb',
      dayPath: 'M' + (CX + RX) + ' ' + CY + 'A' + RX + ' ' + RY + ' 0 0 0 ' + (CX - RX) + ' ' + CY,
      nightPath: 'M' + (CX - NRX) + ' ' + CY + 'A' + NRX + ' ' + NRY + ' 0 0 0 ' + (CX + NRX) + ' ' + CY,
      dayLen: dayLen.toFixed(1),
      nightLen: nightLen.toFixed(1),
      dayDash: (dayLen - dayAt).toFixed(1),
      nightDash: (nightLen - nightAt).toFixed(1),
      dayTr: trail(dayAt, dayLen),
      nightTr: trail(nightAt, nightLen),
      dayTrOp: !visNight && dayAt > 3 ? 1 : 0,
      nightTrOp: visNight && nightAt > 3 ? 1 : 0,
      ticks,
      zchips,
      stars,
      starsOp: nightK.toFixed(2),
      cloudOp: ((1 - nightK) * 0.9).toFixed(2),
      cloudC: this.mxStr(sk.cloud),
      auraCls: visNight ? 'off' : '',
      auraX: sun.x.toFixed(1),
      auraY: sun.y.toFixed(1),
      sunC,
      sunC2,
      sunCls: visNight ? 'off' : '',
      moonCls: visNight ? '' : 'off',
      sunX: (sun.x - 15).toFixed(1),
      sunY: (sun.y - 15).toFixed(1),
      moonX: (moon.x - 14).toFixed(1),
      moonY: (moon.y - 14).toFixed(1),
      ghostCls: showGhost ? '' : 'off',
      ghostX: (gp.x - 7).toFixed(1),
      ghostY: (gp.y - 7).toFixed(1),
      grabX: (orb.x - 24).toFixed(1),
      grabY: (orb.y - 24).toFixed(1),
      hintText: visNight ? 'גררו את הירח' : 'גררו את השמש',
      hintCls: s.touched || c.isScrub ? 'gone' : '',
      sliderMin: Math.round(A0),
      sliderMax: Math.round(E - 60),
      sliderNow: Math.round(t),
      sliderText: c.nowT + ', הבא: ' + c.nextZ.name + ' ' + c.nextZ.left,
      midCaption,
      edgeStart: c.zmanim.find((z) => z.id === 'alot').time,
      edgeEnd: c.zmanim.find((z) => z.id === 'tzeit').time,
      sumDoneCls: c.doneN ? 'has' : '',
      sumMissedCls: c.missedN ? 'has' : '',
      actives,
      snapCls: actives.length > 1 ? 'multi' : '',
      doneRows,
      missedRows,
      msgs,
      hasMsgs: msgs.length > 0,
      noMsgs: msgs.length === 0,
      hasUp: Boolean(up),
      noUp: !up,
      upItem: up || {},
      upName: up ? up.name : '',
      upTime: up ? up.startT : '',
      upIn: up ? up.inText : '',
      upGo: () => {
        if (!upRaw) return;
        this.setState({ zSel: null, touched: true });
        this.scrub(upRaw.S);
      },
    };
  }
}
</script>
