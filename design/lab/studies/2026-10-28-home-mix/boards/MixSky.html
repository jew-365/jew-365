<!--board title="ה · שמיים מלאים"-->
<style>
.ph{--csub:color-mix(in srgb,var(--sub) 72%,var(--text));--cacc:color-mix(in srgb,var(--accentText) 78%,var(--text));--curg:color-mix(in srgb,var(--urgent) 80%,var(--text));--csafe:color-mix(in srgb,var(--safe) 78%,var(--text));--hair:color-mix(in srgb,var(--text) 10%,transparent)}
.skyroot{position:absolute;inset:0;overflow:hidden;transition:--sk1 1.8s ease,--sk2 1.8s ease,--sk3 1.8s ease,--hf 1.8s ease,--hn 1.8s ease,--glow 1.8s ease,--ink 1.4s ease,--inkopp 1.4s ease,--inkchip 1.4s ease,--hsc 1.4s ease}

.hero{position:relative;height:auto;min-height:352px;margin:0 -16px;padding:20px 16px 78px;overflow:hidden;touch-action:pan-y;cursor:grab;user-select:none;-webkit-user-select:none}

.shoots{position:absolute;inset:0;overflow:hidden;pointer-events:none;transition:opacity 1.2s ease}

.shoot.s1{left:250px;top:30px;animation-delay:-37s}
.shoot.s2{left:300px;top:92px;animation-duration:67s;animation-delay:-49s}
.shoot.s3{left:170px;top:20px;animation-duration:89s;animation-delay:-80s}
@keyframes shoot{0%,96%{opacity:0;transform:translate(0,0) rotate(-24deg)}96.6%{opacity:.95}98.4%{opacity:.7}100%{opacity:0;transform:translate(-170px,76px) rotate(-24deg)}}
.clouds{position:absolute;inset:0;pointer-events:none;transition:opacity 1.8s ease,color 1.8s ease}

.cloud{position:absolute;left:0;top:0;width:120px;height:50px;fill:currentColor;filter:drop-shadow(0 6px 10px rgba(40,70,120,.12));animation:drift linear infinite;will-change:transform}
.cloud.c1{top:150px;width:96px;animation-duration:118s;animation-delay:-36s;opacity:.9}
.cloud.c2{top:184px;width:150px;animation-duration:160s;animation-delay:-104s;opacity:.95}
.cloud.c3{top:132px;width:84px;animation-duration:138s;animation-delay:-15s;opacity:.8}
@keyframes drift{from{transform:translateX(-330px)}to{transform:translateX(700px)}}
.heroart{position:absolute;left:0;right:0;bottom:0;height:250px;pointer-events:none}
.hglow{position:absolute;top:36px;width:360px;height:170px;margin-left:-180px;background:radial-gradient(ellipse at 50% 82%,var(--glow) 0%,transparent 68%);transition:left 1.8s linear,opacity 1.8s ease}
.pathsvg{position:absolute;inset:0;width:390px;height:250px;overflow:visible}
.path-all{fill:none;stroke:var(--ink);stroke-opacity:.42;stroke-width:1.6;stroke-dasharray:2 7;stroke-linecap:round}
.path-trail{fill:none;stroke:var(--thumb);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 5px var(--thumb))}
.ptick{position:absolute;width:7px;height:7px;margin:-3.5px 0 0 -3.5px;border-radius:50%;background:var(--ink);opacity:.5;border:1.5px solid color-mix(in srgb,var(--inkopp) 55%,transparent);box-sizing:content-box}
.ptick.past{opacity:.95}
.sun{position:absolute;width:48px;height:48px;margin:-24px 0 0 -24px;transition:left 1.8s linear,top 1.8s linear,opacity 1.8s ease}
.sun::after{content:"";position:absolute;inset:-26px;border-radius:50%;border:1.5px solid color-mix(in srgb,var(--sunc) 70%,transparent);opacity:0;animation:sunRing 6.5s ease-out infinite}

.sun-glow{position:absolute;inset:-46px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--sunc) 70%,transparent) 0%,color-mix(in srgb,var(--sunc) 22%,transparent) 42%,transparent 70%);animation:breathe 5s ease-in-out infinite}
.sun-disc{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 38% 34%,#fffdf0 0%,var(--sunc) 58%,var(--sunc2) 100%);box-shadow:0 0 22px 6px color-mix(in srgb,var(--sunc) 60%,transparent);transition:transform .35s ease,box-shadow .35s ease}
.skyroot.drag .sun-disc{transform:scale(1.1);box-shadow:0 0 30px 10px color-mix(in srgb,var(--sunc) 66%,transparent)}
@keyframes breathe{0%,100%{transform:scale(.92);opacity:.78}50%{transform:scale(1.16);opacity:1}}
.moon{position:absolute;width:40px;height:40px;margin:-20px 0 0 -20px;transition:left 1.8s linear,top 1.8s linear,opacity 1.8s ease}
.moon-glow{position:absolute;inset:-34px;border-radius:50%;background:radial-gradient(circle,rgba(214,224,255,.45) 0%,rgba(214,224,255,.12) 45%,transparent 70%);animation:breathe 6s ease-in-out infinite}

.skyroot.drag,.skyroot.drag .hglow,.skyroot.drag .sun,.skyroot.drag .moon,.skyroot.drag .clouds,.skyroot.drag .cl,.skyroot.drag .sw,.skyroot.drag .shoots,.skyroot.drag .hello,.skyroot.drag .spill{transition:none}

.herotxt{position:relative;z-index:2}

.srow{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px 8px}
.spill{display:inline-block;padding:2px 10px;border-radius:999px;background:var(--inkchip);font-size:.8125em;font-weight:600;line-height:1.5;color:var(--ink);text-shadow:0 1px 10px color-mix(in srgb,var(--inkopp) 45%,transparent);transition:color 1.4s ease}

.clkrow{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px 12px;margin-top:6px}
.bigclk{font-size:3.1em;font-weight:300;line-height:1;letter-spacing:-.02em;color:var(--ink);font-variant-numeric:tabular-nums;text-shadow:0 2px 20px color-mix(in srgb,var(--inkopp) 40%,transparent);transition:color 1.4s ease}
.cnts{display:flex;gap:6px}
.cn{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:62px;min-height:52px;padding:4px 8px;border-radius:16px;background:color-mix(in srgb,var(--surface) 86%,transparent);-webkit-backdrop-filter:blur(14px) saturate(1.2);backdrop-filter:blur(14px) saturate(1.2);border:1px solid var(--hair);box-shadow:var(--shadow);line-height:1.15;color:var(--text)}

.cn span{font-size:.75em;font-weight:600;color:var(--csub)}
.cn.safe b{color:var(--csafe)}
.cn.miss b{color:var(--curg)}
.cn.open b{color:var(--cacc)}

.rail{position:absolute;z-index:4;inset-inline:14px;bottom:10px;height:48px;border-radius:24px;background:color-mix(in srgb,var(--surface) 80%,transparent);-webkit-backdrop-filter:blur(14px) saturate(1.2);backdrop-filter:blur(14px) saturate(1.2);border:1px solid var(--hair);box-shadow:var(--shadow)}
.skrail-rg{position:absolute;inset-block:0;inset-inline:24px;pointer-events:none}
.skrail-line{position:absolute;inset-inline:0;top:50%;height:3px;margin-top:-1.5px;border-radius:2px;background:color-mix(in srgb,var(--text) 22%,transparent)}

.skrail-in::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:30px;height:30px;margin-top:9px;border-radius:50%;background:var(--thumb);border:2px solid #fff;box-shadow:0 0 0 4px color-mix(in srgb,var(--thumb) 30%,transparent),0 0 18px 3px color-mix(in srgb,var(--thumb) 65%,transparent)}

.zstrip{margin-top:12px;padding:8px 0}

.ring{position:relative;width:60px;height:60px;flex:none;display:grid;place-items:center}
.ring svg{position:absolute;inset:0;width:60px;height:60px}
.rg-t{fill:none;stroke:color-mix(in srgb,var(--text) 14%,transparent);stroke-width:4}
.rg-p{fill:none;stroke:var(--accent);stroke-width:4;stroke-linecap:round;transition:stroke-dashoffset .9s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 0 4px color-mix(in srgb,var(--accent) 70%,transparent))}

.hbar{position:relative;height:6px;margin:16px 5px 4px;border-radius:6px;background:color-mix(in srgb,var(--text) 12%,transparent)}
.hbar-f{position:absolute;top:0;bottom:0;right:0;border-radius:6px;background:linear-gradient(to left,color-mix(in srgb,var(--accent) 45%,transparent),var(--accent));transition:width .9s cubic-bezier(.2,.8,.2,1)}

.hbar-d{position:absolute;top:50%;width:16px;height:16px;margin:-8px -8px 0 0;border-radius:50%;background:radial-gradient(circle at 38% 34%,#fff7d0 0%,#ffc247 60%,#f5a524 100%);box-shadow:0 0 0 3px color-mix(in srgb,#ffb52e 30%,transparent),0 0 14px 3px rgba(255,170,40,.6);animation:dotB 3.4s ease-in-out infinite;transition:right .9s cubic-bezier(.2,.8,.2,1)}

@keyframes dotB{50%{filter:brightness(1.12);transform:scale(1.12)}}
.pe{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-top:8px;line-height:1.25}

.acts{display:flex;gap:10px;margin-top:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;border-radius:17px;font-weight:700;font-size:1.0625em;transition:transform .15s ease,background .25s,color .25s}
.btn:active{transform:scale(.97)}
.btn .ic{width:21px;height:21px;stroke-width:2.2}
.btn.primary{flex:2;background:var(--accent);color:var(--onAccent);box-shadow:0 8px 20px -8px color-mix(in srgb,var(--accent) 80%,transparent)}
.btn.ghost{flex:1;background:var(--surface2);color:var(--text)}
.nowc.marking .btn.primary{background:var(--safe);color:var(--onSafe)}

.pm{position:relative;display:flex;align-items:stretch;gap:4px;margin-bottom:10px;padding:0}

.gr-b{flex:1;min-width:0;display:flex;flex-direction:column}
.m-line{display:flex;align-items:center;gap:7px;flex-wrap:wrap}

.grps{display:flex;flex-direction:column;gap:10px}
.grp{overflow:hidden}
.gh{margin:0}
.gbtn{position:relative;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;width:100%;min-height:56px;padding:10px 14px 14px;border-radius:24px}
.gico{width:38px;height:38px;border-radius:13px;background:var(--surface2);color:var(--csub);display:flex;align-items:center;justify-content:center;flex:none}

.gico .ic{width:20px;height:20px}
.gt{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}

.rw{position:relative;display:flex;align-items:center;gap:10px;min-height:56px;padding:6px 4px;border-top:1px solid var(--hair)}
.rdot{position:relative;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;background:var(--surface2);color:var(--csub);transition:background .3s,color .3s}
.rdot .ic{width:16px;height:16px;stroke-width:2.3}
.rw.done .rdot{background:var(--safe);color:var(--onSafe)}
.rw.missed .rdot{background:var(--urgentSoft);color:var(--curg)}
.rw.active .rdot{background:var(--accent);color:var(--onAccent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 28%,transparent);animation:dotB 3.4s ease-in-out infinite}
.rw.upcoming .rdot{background:transparent;box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--text) 28%,transparent)}
.rw.marking .rdot{background:var(--safe);color:var(--onSafe)}
.rb{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.rn{font-weight:700;font-size:.9375em;line-height:1.3}
.rw.upcoming .rn{font-weight:600;color:var(--csub)}
.rs{font-size:.75em;line-height:1.35;color:var(--csub);font-variant-numeric:tabular-nums}
.rw.missed .rs{color:var(--curg);font-weight:600}
.lateTag{display:inline-block;margin-inline-start:5px;padding:0 6px;border-radius:6px;background:var(--urgentSoft);color:var(--curg);font-weight:700}
.rprog{position:relative;height:3px;margin-top:5px;border-radius:3px;background:color-mix(in srgb,var(--text) 12%,transparent)}
.rprog i{position:absolute;top:0;bottom:0;right:0;border-radius:3px;background:var(--accent);transition:width .8s}
.rw.urgentRow .rprog i{background:var(--urgent)}
.ract{flex:none;display:inline-flex;align-items:center;justify-content:center;gap:5px;min-width:44px;min-height:44px;padding:0 12px;border-radius:14px;background:var(--surface2);color:var(--text);font-weight:700;font-size:.8125em;text-align:center;transition:background .25s,color .25s}

<script>
class Component extends DCLogic {
/*CORE*/

  boardState() {
    ['--sk1', '--sk2', '--sk3', '--hf', '--hn', '--glow', '--ink', '--inkopp', '--inkchip', '--hsc'].forEach((n) => {
      try {
        CSS.registerProperty({ name: n, syntax: '<color>', inherits: true, initialValue: '#000000' });
      } catch (e) {}
    });
    this.zKey = null;
    this.nextKey = null;
    this.sk = null;
    this.skRaf = 0;
    this.skAnim = 0;
    this.skTgt = 0;
    this.skPos = 0;
    this.settleT = 0;
    return { fx: false, gTog: {} };
  }

  skHex(c) {
    return [1, 3, 5].map((i) => parseInt(c.slice(i, i + 2), 16));
  }

  skStr(a) {
    return '#' + a.map((v) => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0')).join('');
  }

  skMix(a, b, k) {
    return a.map((v, i) => v + (b[i] - v) * k);
  }

  skLum(a) {
    const f = (v) => {
      v /= 255;
      return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
    };
    return 0.2126 * f(a[0]) + 0.7152 * f(a[1]) + 0.0722 * f(a[2]);
  }

  skCr(a, b) {
    const x = this.skLum(a);
    const y = this.skLum(b);
    return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05);
  }

  skClamp(v, lo, hi) {
    return Math.max(lo, Math.min(hi, v));
  }

  skSmooth(v) {
    const k = this.skClamp(v, 0, 1);
    return k * k * (3 - 2 * k);
  }

  skZ() {
    const z = {};
    this.zmanimList().forEach((x) => (z[x.id] = x.S));
    return z;
  }

  skKeys() {
    const z = this.skZ();
    const end = this.dayEnd();
    const H = (c) => this.skHex(c);
    const K = (t, top, mid, bot, cloud, name) => ({ t, top: H(top), mid: H(mid), bot: H(bot), cloud: H(cloud), name });
    const dawnLen = z.netz - z.alot;
    const alotK = K(z.alot, '#18215F', '#4B3D8E', '#9B6BA8', '#C9A6D6', 'עלות השחר');
    return [
      alotK,
      K(z.netz, '#8DA3E0', '#F2B7B4', '#FFD9AE', '#FFD6CC', 'הנץ החמה'),
      K(z.netz + (z.chatzot - z.netz) * 0.3, '#76B6F2', '#A8D4F6', '#D8EDFA', '#FFFFFF', 'בוקר'),
      K(z.chatzot, '#4B9DEB', '#6DB4F1', '#A8D5F8', '#FFFFFF', 'צהריים'),
      K(z.plag, '#5E9FE0', '#9CC5E8', '#F5D9A2', '#FFF6E4', 'אחר הצהריים'),
      K(z.shkia, '#5C5AA8', '#E4708C', '#FFB05C', '#FFC8B0', 'שקיעה'),
      K(z.tzeit, '#161D58', '#2E3382', '#6C5BA8', '#9A8CC8', 'צאת הכוכבים'),
      K(z.tzeit + (z.chatzotL - z.tzeit) * 0.25, '#070C1F', '#0F1A3E', '#1B2A58', '#7F8FC8', 'לילה'),
      K(end - dawnLen * 0.7, '#060A19', '#0D1533', '#18224D', '#7F8FC8', 'לפני עלות השחר'),
      { ...alotK, t: end },
    ];
  }

  skAt(t) {
    const K = this.skKeys();
    let i = 0;
    while (i < K.length - 2 && t >= K[i + 1].t) i++;
    const a = K[i];
    const b = K[i + 1];
    const k = this.skClamp((t - a.t) / (b.t - a.t), 0, 1);
    const e = k * k * (3 - 2 * k);
    const m = (p) => this.skMix(a[p], b[p], e);
    return { top: m('top'), mid: m('mid'), bot: m('bot'), cloud: m('cloud'), name: a.name };
  }

  skInk(s) {
    const dark = this.skHex('#0A1228');
    const white = [255, 255, 255];
    const zs = [14, 50, 96, 150, 205, 245].map((y) => this.skMix(s.top, s.mid, this.skClamp(y / 388, 0, 1)));
    const need = (ink, opp) => {
      let a = 0;
      while (a < 0.62 && Math.min(...zs.map((z) => this.skCr(this.skMix(z, opp, a), ink))) < 5.2) a += 0.03;
      return a;
    };
    const darkOpp = [8, 14, 34];
    const aw = need(white, darkOpp);
    const ad = need(dark, white);
    const useWhite = aw < ad - 0.001;
    return useWhite ? { ink: white, opp: darkOpp, a: aw, white: true } : { ink: dark, opp: white, a: ad, white: false };
  }

  skCompact(sec) {
    const m = Math.max(0, Math.ceil(sec / 60));
    if (m < 60) return m + ' דק׳';
    const h = Math.floor(m / 60);
    const r = m % 60;
    return h + ' שע׳' + (r ? ' ו-' + r + ' דק׳' : '');
  }

  skGeo() {
    return { x0: 332, span: 272, base: 206, amp: 100, mamp: 82 };
  }

  skHy(x) {
    const G = this.skGeo();
    const u = (390 - x) / 390;
    return G.base - 32 * u * (1 - u);
  }

  skPt(fc, amp) {
    const G = this.skGeo();
    const x = G.x0 - G.span * fc;
    return { x, y: this.skHy(x) - amp * Math.sin(Math.PI * fc) };
  }

  skPath(amp, upto) {
    if (upto <= 0.001) return 'M0 0';
    const n = 40;
    let d = '';
    for (let i = 0; i <= n; i++) {
      const p = this.skPt((upto * i) / n, amp);
      d += (i ? 'L' : 'M') + p.x.toFixed(1) + ' ' + p.y.toFixed(1);
    }
    return d;
  }

  skyVals() {
    const t = this.now();
    const z = this.skZ();
    const end = this.dayEnd();
    const N = z.netz;
    const S = z.shkia;
    const G = this.skGeo();
    const s = this.skAt(Math.round(t / 20) * 20);
    const ik = this.skInk(s);

    const f = (t - N) / (S - N);
    const fc = this.skClamp(f, -0.1, 1.1);
    const sp = this.skPt(fc, G.amp);
    const alt = Math.sin(Math.PI * fc);
    const sunOp = f < 0 ? this.skClamp(1 + f / 0.05, 0, 1) : f > 1 ? this.skClamp(1 - (f - 1) / 0.05, 0, 1) : 1;
    const hgt = this.skClamp(alt / 0.55, 0, 1);
    const sunC = this.skStr(this.skMix(this.skHex('#FF8A3D'), this.skHex('#FFE27A'), hgt));
    const sunC2 = this.skStr(this.skMix(this.skHex('#E8531F'), this.skHex('#FFB347'), hgt));

    const tw = Math.max(600, z.tzeit - S);
    const dw = Math.max(600, N - z.alot);
    let d = 0;
    if (t >= S) d = this.skClamp((t - S) / (2 * tw), 0, 1);
    else if (t <= N) d = this.skClamp((N - t) / dw, 0, 1);
    d = d * d * (3 - 2 * d);

    const g = t >= z.tzeit ? (t - z.tzeit) / (end - z.tzeit) : t < N ? 1.04 : -0.08;
    const gc = this.skClamp(g, -0.08, 1.08);
    const mp = this.skPt(gc, G.mamp);

    let alt2 = alt;
    if (t < N) alt2 = -(N - t) / dw;
    else if (t > S) alt2 = -(t - S) / (2 * tw);
    const glowOp = this.skClamp(1 - Math.abs(alt2) / 0.5, 0, 1);
    const glowC = t < (N + S) / 2 ? '#FF9A86' : '#FF8A45';
    const rgba = (a, al) => 'rgba(' + a.map((v) => Math.round(v)).join(',') + ',' + al.toFixed(2) + ')';

    const starsOp = Math.max(this.skSmooth((t - (z.tzeit - tw * 0.5)) / (tw * 1.5)), 1 - this.skSmooth((t - z.alot) / (dw * 0.9)));
    const hf = this.skMix(this.skMix(s.bot, [58, 92, 124], 0.5), [8, 14, 34], 0.35 + 0.5 * starsOp);
    const hn = this.skMix(this.skMix(s.bot, [34, 58, 92], 0.7), [4, 8, 22], 0.4 + 0.55 * starsOp);
    const thumbC = this.skStr(this.skMix(this.skHex(sunC), [230, 236, 255], d));

    const stars = [
      [28, 64, 2], [74, 84, 1.6], [44, 118, 2.4], [98, 142, 1.6], [150, 112, 2], [190, 152, 1.6], [226, 116, 2.6], [262, 172, 1.6],
      [298, 128, 2], [332, 100, 1.6], [358, 152, 2.4], [374, 118, 1.6], [122, 174, 1.6], [18, 168, 2], [206, 98, 1.4], [150, 9, 1.6],
      [244, 10, 2], [334, 11, 1.6], [24, 12, 1.6], [66, 52, 1.4], [92, 100, 1.8], [312, 182, 1.4], [270, 210, 1.6], [60, 214, 1.6],
    ].map((a, i) => ({
      x: a[0],
      y: a[1],
      s: a[2],
      d: ((i * 0.37) % 3.4).toFixed(2) + 's',
      du: (2.4 + ((i * 0.53) % 2.6)).toFixed(2) + 's',
      o: this.skSmooth((starsOp - ((i * 0.618) % 1) * 0.6) / 0.4).toFixed(2),
    }));

    const u = (t - z.alot) / (end - z.alot);
    const dayMode = t >= N && t < S;
    let ticks;
    let pathAll;
    let pathTrail;
    if (dayMode) {
      ticks = ['netz', 'sofShma', 'sofTfila', 'chatzot', 'minchaG', 'plag', 'shkia'].map((id) => {
        const q = (z[id] - N) / (S - N);
        const p = this.skPt(q, G.amp);
        return { x: p.x.toFixed(1), y: p.y.toFixed(1), cls: q <= f ? 'past' : '' };
      });
      pathAll = this.skPath(G.amp, 1);
      pathTrail = this.skPath(G.amp, this.skClamp(f, 0, 1));
    } else {
      ticks = [0, (z.chatzotL - z.tzeit) / (end - z.tzeit), 1].map((q) => {
        const p = this.skPt(q, G.mamp);
        return { x: p.x.toFixed(1), y: p.y.toFixed(1), cls: q <= g ? 'past' : '' };
      });
      pathAll = this.skPath(G.mamp, 1);
      pathTrail = this.skPath(G.mamp, this.skClamp(g, 0, 1));
    }
    const phase = s.name;
    return {
      skyStyle: [
        '--sk1:' + this.skStr(s.top),
        '--sk2:' + this.skStr(s.mid),
        '--sk3:' + this.skStr(s.bot),
        '--hf:' + this.skStr(hf),
        '--hn:' + this.skStr(hn),
        '--glow:' + rgba(this.skHex(glowC), 0.6),
        '--ink:' + this.skStr(ik.white ? [255, 255, 255] : this.skHex('#0A1228')),
        '--inkopp:' + this.skStr(ik.opp),
        '--inkchip:' + rgba(ik.opp, 0.2),
        '--hsc:' + rgba(ik.opp, ik.a),
      ].join(';'),
      skyAria: 'השמיים עכשיו: ' + phase,
      skyName: phase,
      railText: this.clock(t) + ' · ' + phase,
      sunX: sp.x.toFixed(1),
      sunY: sp.y.toFixed(1),
      sunOp: sunOp.toFixed(2),
      sunC,
      sunC2,
      moonX: mp.x.toFixed(1),
      moonY: mp.y.toFixed(1),
      moonOp: d.toFixed(2),
      shootOp: this.skClamp((starsOp - 0.7) / 0.3, 0, 1).toFixed(2),
      cloudOp: ((1 - d) * 0.92).toFixed(2),
      cloudC: this.skStr(s.cloud),
      par1: (-u * 45).toFixed(1),
      par2: (-u * 90).toFixed(1),
      par3: (-u * 146).toFixed(1),
      glowX: this.skClamp(sp.x, 70, 330).toFixed(1),
      glowOp: glowOp.toFixed(2),
      thumbC,
      stars,
      ticks,
      pathAll,
      pathTrail,
    };
  }

  componentDidUpdate() {
    if (this.zKey !== this.start) {
      this.zKey = this.start;
      this.centerChip(false);
    }
    const nx = document.querySelector('#zchips .zc.next');
    const key = nx ? nx.textContent : '';
    if (key !== this.nextKey) {
      this.nextKey = key;
      this.centerChip(!this.sk && !this.skAnim);
    }
  }

  boardMount() {
    this.zKey = this.start;
    this.rm = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };
    this.centerChip(false);
    this.mountT = setTimeout(() => this.centerChip(false), 400);
  }

  boardUnmount() {
    clearTimeout(this.mountT);
    clearTimeout(this.settleT);
    this.skStop();
  }

  centerChip(smooth) {
    const box = document.getElementById('zchips');
    const nx = box && box.querySelector('.zc.next');
    if (!box || !nx) return;
    const b = box.getBoundingClientRect();
    const o = nx.getBoundingClientRect();
    const dx = o.left + o.width / 2 - (b.left + b.width / 2);
    if (smooth) box.scrollBy({ left: dx, behavior: 'smooth' });
    else box.scrollLeft += dx;
  }

  skBounds() {
    return [this.dayStart(), this.dayEnd() - 60];
  }

  skRate(t) {
    const z = this.skZ();
    const G = this.skGeo();
    return t >= z.tzeit ? (this.dayEnd() - z.tzeit) / G.span : (z.shkia - z.netz) / G.span;
  }

  skSeek(sec) {
    this.skTgt = sec;
    if (this.skRaf) return;
    this.skRaf = requestAnimationFrame(() => {
      this.skRaf = 0;
      this.scrub(this.skTgt);
    });
  }

  skStop() {
    cancelAnimationFrame(this.skRaf);
    cancelAnimationFrame(this.skAnim);
    this.skRaf = 0;
    this.skAnim = 0;
    clearTimeout(this.settleT);
  }

  skEnd() {
    this.setState({ fx: false });
  }

  skTween(to, ms, done, from) {
    this.skStop();
    const [lo, hi] = this.skBounds();
    const a = from == null ? this.now() : from;
    const b = Math.max(lo, Math.min(hi, to));
    const dur = ms == null ? Math.max(280, Math.min(1000, 280 + Math.abs(b - a) / 45)) : ms;
    if (this.rm.matches || Math.abs(b - a) < 1) {
      this.skPos = b;
      this.scrub(b);
      if (done) done();
      return;
    }
    const t0 = performance.now();
    const step = (ts) => {
      const k = Math.min(1, (ts - t0) / dur);
      this.skPos = a + (b - a) * (k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2);
      this.scrub(this.skPos);
      if (k < 1) this.skAnim = requestAnimationFrame(step);
      else {
        this.skAnim = 0;
        if (done) done();
      }
    };
    this.skAnim = requestAnimationFrame(step);
  }

  skGoTo(sec) {
    this.setState({ fx: true });
    this.skTween(sec, null, () => this.skEnd());
  }

  skFling(v0) {
    const [lo, hi] = this.skBounds();
    let v = Math.max(-2200, Math.min(2200, v0));
    let last = performance.now();
    const step = (ts) => {
      const dt = Math.min(0.05, (ts - last) / 1000);
      last = ts;
      v *= Math.exp(-dt / 0.3);
      this.skPos = Math.max(lo, Math.min(hi, this.skPos - v * dt * this.skRate(this.skPos)));
      this.scrub(this.skPos);
      if (Math.abs(v) > 25 && this.skPos > lo && this.skPos < hi) this.skAnim = requestAnimationFrame(step);
      else {
        this.skAnim = 0;
        this.skEnd();
      }
    };
    this.skAnim = requestAnimationFrame(step);
  }

  skDown(e) {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    if (e.target.closest && e.target.closest('input,button,a')) return;
    this.skStop();
    this.skPos = this.now();
    this.sk = { id: e.pointerId, el: e.currentTarget, x0: e.clientX, x: e.clientX, ts: performance.now(), v: 0, moved: false };
  }

  skMove(e) {
    const d = this.sk;
    if (!d || d.id !== e.pointerId) return;
    if (!d.moved) {
      if (Math.abs(e.clientX - d.x0) < 6) return;
      d.moved = true;
      d.x = e.clientX;
      d.ts = performance.now();
      try {
        d.el.setPointerCapture(e.pointerId);
      } catch (err) {}
      this.setState({ fx: true });
      return;
    }
    const ts = performance.now();
    const dx = e.clientX - d.x;
    d.v = d.v * 0.6 + ((dx / Math.max(1, ts - d.ts)) * 1000) * 0.4;
    d.x = e.clientX;
    d.ts = ts;
    const [lo, hi] = this.skBounds();
    this.skPos = Math.max(lo, Math.min(hi, this.skPos - dx * this.skRate(this.skPos)));
    this.skSeek(this.skPos);
  }

  skUp(e) {
    const d = this.sk;
    if (!d || d.id !== e.pointerId) return;
    this.sk = null;
    if (!d.moved) return;
    try {
      d.el.releasePointerCapture(e.pointerId);
    } catch (err) {}
    const v = performance.now() - d.ts > 90 ? 0 : d.v;
    if (this.rm.matches || Math.abs(v) < 90) {
      this.scrub(this.skPos);
      this.skEnd();
    } else this.skFling(v);
  }

  renderVals() {
    const c = this.coreVals();
    const sv = this.skyVals();
    const t = this.now();
    const Z = this.zmanimList();
    const zS = {};
    Z.forEach((x) => (zS[x.id] = x.S));

    const actives = c.active.map((it, i) => ({
      ...it,
      ringOff: this.dash(157.1, it.pctLeft),
      dotCls: it.isMoon ? 'moon' : 'sun',
      delay: 0.12 + i * 0.07 + 's',
    }));

    const zchips = c.zmanim.map((z, i) => ({
      id: z.id,
      name: z.short,
      time: z.time,
      cls: z.cls,
      isNext: z.isNext,
      inS: z.isNext ? 'בעוד ' + this.skCompact(Z[i].S - t) : '',
      pressed: Boolean(c.isScrub && Math.abs(t - Z[i].S) < 90),
      aria: z.name + ' ' + z.time + (z.isNext ? ', הבא' : '') + '. מעבר לזמן',
      pick: () => this.skGoTo(Z[i].S),
    }));

    const itemS = {};
    this.items().forEach((x) => (itemS[x.id] = x.S));
    const gOf = (sec) => (sec < zS.chatzot ? 0 : sec < zS.shkia ? 1 : 2);
    const cur = gOf(t);
    const defs = [
      { id: 'morning', name: 'בוקר', from: this.dayStart(), to: zS.chatzot },
      { id: 'noon', name: 'צהריים', from: zS.chatzot, to: zS.shkia },
      { id: 'eve', name: 'ערב ולילה', from: zS.shkia, to: this.dayEnd() },
    ];
    const groups = defs
      .map((g, gi) => {
        const rowsSrc = c.timeline.filter((x) => gOf(itemS[x.id]) === gi).sort((a, b) => itemS[a.id] - itemS[b.id]);
        const doneN = rowsSrc.filter((x) => x.isDone).length;
        const missedN = rowsSrc.filter((x) => x.isMissed).length;
        const openN = rowsSrc.length - doneN - missedN;
        const tog = this.state.gTog[g.id];
        const open = tog && tog.cur === cur ? tog.open : gi === cur;
        const rows = rowsSrc.map((x) => {
          const act = this.items().find((q) => q.id === x.id);
          const left = act ? act.E - t : 0;
          return {
            ...x,
            st: x.status,
            urgentRow: x.isActive && left <= 2700 ? 'urgentRow' : '',
            sub: x.isDone ? 'סומן ב-' + x.at + ' · ' + x.range : x.isMissed ? 'נגמר ב-' + x.endT + ' · ' + x.range : x.isActive ? 'נשארו ' + this.left(left) + ' · ' + x.range : 'נפתח ב-' + x.startT + ' · ' + x.range,
            late: x.isDone && this.doneAt(x.id) >= act.E,
            lateAria: 'בכל זאת עשיתי — סימון ' + x.name,
            pctGone: act ? Math.round(Math.max(0, Math.min(1, (t - act.S) / (act.E - act.S))) * 100) : 0,
            undoLabel: 'ביטול הסימון של ' + x.name,
          };
        });
        return {
          id: g.id,
          name: g.name,
          span: this.clock(g.from) + ' – ' + this.clock(g.to),
          isMorning: gi === 0,
          isNoon: gi === 1,
          isEve: gi === 2,
          isCur: gi === cur,
          cls: (gi === cur ? 'cur ' : '') + (open ? 'open' : ''),
          open,
          panelId: 'grp-' + g.id,
          delay: 0.28 + gi * 0.06 + 's',
          doneN,
          missedN,
          openN,
          hasDone: doneN > 0,
          hasMissed: missedN > 0,
          hasOpen: openN > 0,
          countAria: g.name + ': ' + doneN + ' בוצעו, ' + missedN + ' פוספסו, ' + openN + ' פתוחים או בהמשך',
          pct: rowsSrc.length ? Math.round((doneN / rowsSrc.length) * 100) : 0,
          toggle: () => this.setState((s) => ({ gTog: { ...s.gTog, [g.id]: { cur, open: !open } } })),
          rows,
        };
      })
      .filter((g) => g.rows.length);

    const msgPersonal = c.msgPersonal.map((m) => ({ ...m, noAction: !m.hasAction }));

    return {
      ...c,
      ...sv,
      msgPersonal,
      actives,
      manyCls: actives.length > 1 ? 'many' : '',
      zchips,
      groups,
      noGeneral: !c.hasMsgGeneral,
      fxCls: this.state.fx ? 'drag' : '',
      liveP: (Math.max(0, Math.min(1, (c.liveSec - c.dayStartSec) / (c.dayEndSec - c.dayStartSec))) * 100).toFixed(1),
      railDots: c.zmanim.map((z) => ({ p: z.p, cls: z.past ? 'past' : '' })),
      onRail: (e) => {
        this.skStop();
        this.scrub(Number(e.target.value));
      },
      skDown: (e) => this.skDown(e),
      skMove: (e) => this.skMove(e),
      skUp: (e) => this.skUp(e),
    };
  }
}
</script>
