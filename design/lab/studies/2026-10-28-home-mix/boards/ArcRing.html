<!--board title="ק8 · קשת טבעת"-->
<style>
.h1{font-size:1.5em;font-weight:700;letter-spacing:-.01em;line-height:1.15}
.label{display:flex;align-items:baseline;justify-content:space-between;gap:8px;font-size:.8125em;font-weight:700;color:var(--sub);margin:26px 4px 10px}
.label b{font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
.sum{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.sumc{display:inline-flex;align-items:center;gap:7px;min-height:34px;padding:0 13px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow);font-size:.8125em;font-weight:600}
.sumc i{width:8px;height:8px;border-radius:50%;flex:none}
.sumc b{font-weight:800;font-variant-numeric:tabular-nums}
.sumc.d i{background:var(--safe)}
.sumc.m i{background:var(--urgent)}
.sumc.o i{background:var(--accent)}
.sumc.m.has{background:var(--urgentSoft);color:var(--urgent)}
.sumc.d.has{background:var(--safeSoft);color:var(--safe)}
.sumc.t{margin-inline-start:auto}

.sky{position:relative;overflow:hidden;margin-top:16px;border-radius:28px;color:var(--text);background:linear-gradient(165deg,color-mix(in srgb,var(--accent) 9%,var(--surface)),var(--surface) 70%);box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.4);border:1px solid color-mix(in srgb,var(--text) 7%,transparent)}
.readout{position:relative;display:flex;justify-content:center;padding:12px 12px 0;min-height:52px}
.rpill{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:2px 7px;padding:6px 14px;border-radius:18px;background:var(--surface2);box-shadow:inset 0 0 0 1px var(--border);font-size:.875em;text-align:center;color:var(--text)}
.rpill b{font-weight:700}
.rpill.ra{animation:readA .4s both}
.rpill.rb{animation:readB .4s both}
@keyframes readA{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes readB{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.rd-a{display:inline-flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:4px 7px}
.rtag{font-size:.8125em;font-weight:700;padding:1px 9px;border-radius:999px;background:var(--accent);color:var(--onAccent)}
.stage{position:relative;height:312px;overflow:hidden}
.scene{position:relative;width:100%;max-width:350px;height:312px;margin:0 auto;touch-action:pan-y;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.disc{position:absolute;left:69px;top:48px;width:212px;height:212px;border-radius:50%;overflow:hidden;pointer-events:none;border:1px solid color-mix(in srgb,var(--text) 14%,transparent)}
.disc > *{position:absolute}
.stars,.lite{inset:0}
.stars{transition:opacity 1s}
.star{position:absolute;border-radius:50%;background:#F7F3E8;animation:twinkle 3.4s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:.95;transform:scale(1.2)}}
.clouds{inset:0;overflow:hidden;transition:opacity .6s;color:#fff}
.cl{position:absolute;left:0;width:84px;height:36px;animation:drift 80s linear infinite}
.cl.c2{width:60px;height:26px;animation-duration:110s}
.cl.c3{width:100px;height:42px;animation-duration:140s}
.cl svg{width:100%;height:100%;fill:currentColor;display:block}
@keyframes drift{from{transform:translateX(-120px)}to{transform:translateX(260px)}}
.hills{left:0;top:0;width:100%;height:100%}
.ringw{position:absolute;left:0;top:0;width:350px;height:312px;pointer-events:none;filter:drop-shadow(0 0 5px color-mix(in srgb,var(--accent) 35%,transparent))}
.ringc{position:absolute;left:49px;top:28px;width:252px;height:252px;border-radius:50%;transform:scaleX(-1);-webkit-mask:radial-gradient(circle closest-side,transparent calc(100% - 8px),#000 calc(100% - 7.5px),#000 calc(100% - .5px),transparent 100%);mask:radial-gradient(circle closest-side,transparent calc(100% - 8px),#000 calc(100% - 7.5px),#000 calc(100% - .5px),transparent 100%)}
.dots{position:absolute;left:0;top:0;width:350px;height:312px;pointer-events:none;fill:color-mix(in srgb,var(--text) 28%,transparent)}
.notch{position:absolute;width:4px;height:12px;border-radius:2px;pointer-events:none;background:color-mix(in srgb,var(--text) 45%,transparent);transition:background .3s}
.notch.past{background:var(--accent)}
.notch.nxt{animation:npulse 2.2s ease-out infinite}
@keyframes npulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 60%,transparent)}100%{box-shadow:0 0 0 7px transparent}}
.notch.sel{width:6px;height:18px;margin:-3px 0 0 -1px;background:var(--accentText);box-shadow:0 0 8px color-mix(in srgb,var(--accent) 70%,transparent)}
@keyframes ring{0%{opacity:.7;transform:scale(.5)}100%{opacity:0;transform:scale(1.5)}}
.glive{position:absolute;width:14px;height:14px;border-radius:50%;border:2px dashed var(--accentText);background:color-mix(in srgb,var(--surface) 70%,transparent);pointer-events:none}
.sun{position:absolute;width:30px;height:30px;border-radius:50%;pointer-events:none;background:radial-gradient(circle at 36% 30%,#FFF8E6 0,color-mix(in srgb,var(--accent) 55%,#FFE2A8) 40%,var(--accent) 100%);box-shadow:0 0 0 5px color-mix(in srgb,var(--accent) 24%,transparent),0 0 22px color-mix(in srgb,var(--accent) 65%,transparent);transition:opacity .5s,transform .5s cubic-bezier(.2,.8,.2,1);animation:glow 3.2s ease-in-out infinite}
@keyframes glow{50%{filter:brightness(1.1)}}
.moon{position:absolute;width:28px;height:28px;border-radius:50%;pointer-events:none;background:#2F3860;border:1.5px solid color-mix(in srgb,var(--text) 30%,transparent);box-shadow:inset 9px -4px 0 0 #F6E7BF,0 0 14px rgba(246,231,191,.55);transition:opacity .5s,transform .5s cubic-bezier(.2,.8,.2,1)}
.sun.off,.moon.off{opacity:0}
.scene.drag .sun,.scene.drag .moon{transform:scale(1.16)}
.grab{position:absolute;width:48px;height:48px;border-radius:50%;touch-action:none;cursor:grab;outline:none}
.grab:focus-visible{outline:3px solid var(--accentText);outline-offset:1px}
.scene.drag .grab{cursor:grabbing}
.scene.hintOn .grab::after{content:'';position:absolute;inset:4px;border-radius:50%;border:2px solid var(--accent);opacity:0;animation:ring 2.4s ease-out infinite}
.hint{position:absolute;left:50%;transform:translateX(-50%);top:288px;width:max-content;padding:2px 12px;border-radius:999px;background:var(--surface2);box-shadow:inset 0 0 0 1px var(--border);text-align:center;font-size:.75em;font-weight:600;color:var(--sub);pointer-events:none;transition:opacity .5s}
.hint.gone{opacity:0}
.pillx{position:absolute;padding:2px 10px;border-radius:999px;background:var(--surface2);box-shadow:inset 0 0 0 1px var(--border);color:var(--text);font-size:.75em;font-weight:600;line-height:1.4;pointer-events:none;white-space:nowrap}
.pillx b{font-weight:700;font-variant-numeric:tabular-nums}
.arcmid{position:absolute;left:50%;top:154px;transform:translate(-50%,-52%);display:flex;flex-direction:column;align-items:center;gap:5px;width:max-content;padding:8px 18px 10px;border-radius:26px;background:color-mix(in srgb,var(--surface) 90%,transparent);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);pointer-events:none;min-width:150px;max-width:190px;box-shadow:0 6px 24px color-mix(in srgb,var(--text) 14%,transparent),inset 0 0 0 1px var(--border)}
.bigtime{font-size:2.5em;font-weight:300;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1;color:var(--text)}
.scene.scr .bigtime{color:var(--accentText)}
.midcap{font-size:.8125em;font-weight:600;color:var(--accentText);text-align:center;line-height:1.3}
.zchips{display:flex;gap:8px;overflow-x:auto;padding:6px 4px 14px;margin:6px -4px 0;scroll-snap-type:x proximity;scrollbar-width:none}
.zchips::-webkit-scrollbar{display:none}
.zc{flex:none;scroll-snap-align:center;display:flex;flex-direction:column;align-items:flex-start;padding:7px 14px;border-radius:14px;background:var(--surface);box-shadow:var(--shadow);min-height:52px;text-align:right;transition:background .25s,color .25s}
.zl{font-size:.75em;color:var(--sub);white-space:nowrap}
.zt{font-weight:700;font-variant-numeric:tabular-nums}
.zc.past .zt{color:var(--sub);font-weight:500}
.zc.next{background:var(--soft);box-shadow:inset 0 0 0 2px var(--accent)}
.zc.next .zl{color:var(--accentText);font-weight:700}
.zc[aria-pressed="true"]{background:var(--text);color:var(--bg);box-shadow:none}
.zc[aria-pressed="true"] .zl,.zc[aria-pressed="true"] .zt{color:inherit}

.glass{background:linear-gradient(160deg,color-mix(in srgb,var(--accent) 7%,var(--surface)),var(--surface));border-radius:24px;box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.4);border:1px solid color-mix(in srgb,var(--text) 7%,transparent)}
.nowrail{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -20px;padding:4px 20px 14px;scrollbar-width:none}
.nowrail::-webkit-scrollbar{display:none}
.nowrail.one{overflow:visible}
.nowrail > li{flex:none;width:100%;scroll-snap-align:center}
.nowrail.many > li{width:calc(100% - 34px)}
.mx-now{position:relative;padding:14px;animation:fadeIn .5s both}
.mx-nh{display:flex;align-items:center;gap:12px}
.mx-tile{width:44px;height:44px;border-radius:15px;background:var(--soft);color:var(--accentText);display:grid;place-items:center;flex:none}
.mx-nt{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.mx-nn{font-size:1.0625em;font-weight:700;line-height:1.25}
.mx-ring{position:relative;width:60px;height:60px;flex:none;display:grid;place-items:center}
.mx-ring svg{position:absolute;inset:0;width:60px;height:60px}
.mx-rt{fill:none;stroke:color-mix(in srgb,var(--text) 14%,transparent);stroke-width:4}
.mx-rp{fill:none;stroke:var(--accent);stroke-width:4;stroke-linecap:round;transition:stroke-dashoffset .9s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 0 4px color-mix(in srgb,var(--accent) 70%,transparent))}
.mx-ring.urgent .mx-rp{stroke:var(--urgent);filter:drop-shadow(0 0 4px color-mix(in srgb,var(--urgent) 70%,transparent))}
.mx-rn{position:relative;display:flex;flex-direction:column;align-items:center;line-height:1.05}
.mx-rn b{font-size:1em;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.mx-rn span{font-size:.75em;color:var(--sub);font-weight:600}
.mx-ring.urgent .mx-rn b{color:var(--urgent)}
.mx-bar{position:relative;height:6px;margin:16px 6px 4px;border-radius:6px;background:color-mix(in srgb,var(--text) 12%,transparent)}
.mx-bf{position:absolute;top:0;bottom:0;right:0;border-radius:6px;background:linear-gradient(to left,color-mix(in srgb,var(--accent) 45%,transparent),var(--accent));transition:width .9s cubic-bezier(.2,.8,.2,1)}
.mx-bar.urgent .mx-bf{background:linear-gradient(to left,color-mix(in srgb,var(--urgent) 45%,transparent),var(--urgent))}
.mx-bd{position:absolute;top:50%;width:16px;height:16px;margin:-8px -8px 0 0;border-radius:50%;background:radial-gradient(circle at 38% 34%,#fff7d0 0%,#ffc247 60%,#f5a524 100%);box-shadow:0 0 0 3px rgba(255,181,46,.3),0 0 14px 3px rgba(255,170,40,.6);animation:thumb 3.4s ease-in-out infinite;transition:right .9s cubic-bezier(.2,.8,.2,1)}
.mx-bd.moon{background:radial-gradient(circle at 36% 34%,#fff 0%,#dfe4ff 60%,#b9c3f2 100%);box-shadow:0 0 0 2px color-mix(in srgb,var(--text) 35%,transparent),0 0 12px 2px rgba(200,212,255,.8)}
@keyframes thumb{50%{filter:brightness(1.12);transform:scale(1.12)}}
.mx-pe{display:flex;justify-content:space-between;gap:10px;margin-top:8px;line-height:1.25}
.mx-pe > span{display:flex;flex-direction:column;gap:1px;min-width:0}
.mx-pe > span:last-child{text-align:left}
.mx-pe .cap{font-size:.75em}
.mx-pe b{font-size:1.0625em;font-weight:800;font-variant-numeric:tabular-nums}
.mx-acts{display:flex;gap:10px;margin-top:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;border-radius:16px;font-weight:700;transition:transform .15s,background .25s,color .25s}
.btn:active{transform:scale(.97)}
.btn .ic{width:21px;height:21px;stroke-width:2.2}
.btn.primary{flex:2;background:var(--accent);color:var(--onAccent);box-shadow:0 8px 20px -8px color-mix(in srgb,var(--accent) 80%,transparent)}
.btn.ghost{flex:1;background:var(--surface2);color:var(--text)}
.btn.late{flex:1;background:var(--surface);color:var(--urgent);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--urgent) 45%,transparent)}
.btn.undo{flex:1;background:var(--surface);color:var(--safe);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--safe) 45%,transparent)}
.marking .btn.primary,.marking .btn.late{background:var(--safe);color:var(--onSafe)}
.mx-now.marking{animation:mxOut .6s .3s cubic-bezier(.6,0,.2,1) forwards}
@keyframes mxOut{to{opacity:0;transform:translateX(-30px)}}
.calm{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:24px 20px;animation:riseA .6s both}
.halo{width:64px;height:64px;border-radius:50%;background:var(--safeSoft);color:var(--safe);display:grid;place-items:center;animation:float 3.2s ease-in-out infinite;box-shadow:0 0 0 8px color-mix(in srgb,var(--safe) 10%,transparent)}
.halo .ic{width:30px;height:30px}
@keyframes float{50%{transform:translateY(-6px)}}
.calm h3{font-size:1.25em;font-weight:800}
.calm .cap{font-size:.9375em}
.calm .btn{margin-top:8px;padding:0 20px;flex:none}

.mcard{background:var(--surface);border-radius:22px;box-shadow:var(--shadow);overflow:hidden}
.mr{display:flex;align-items:stretch;animation:fadeIn .45s both}
.mr + .mr{border-top:1px solid var(--border)}
.mmain{flex:1;min-width:0;display:flex;align-items:flex-start;gap:10px;padding:10px 4px 10px 6px;padding-inline-start:12px;min-height:60px;text-align:right}
.mic{width:32px;height:32px;border-radius:11px;background:var(--surface2);color:var(--sub);display:flex;align-items:center;justify-content:center;flex:none;margin-top:1px}
.mic .ic{width:17px;height:17px}
.mr.personal .mic{background:var(--soft);color:var(--accentText)}
.mr.system .mic{background:var(--infoSoft);color:var(--info)}
.mtx{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.mtt{font-size:.875em;line-height:1.3}
.mtag{font-size:.8125em;font-weight:700;color:var(--sub);margin-inline-end:6px}
.mr.personal .mtag{color:var(--accentText)}
.mr.system .mtag{color:var(--info)}
.mtt b{font-weight:700}
.mbd{font-size:.8125em;line-height:1.4;color:var(--sub);text-wrap:pretty}
.mact{display:inline-flex;align-items:center;gap:2px;margin-top:2px;font-size:.8125em;font-weight:700;color:var(--accentText)}
.mr.system .mact{color:var(--info)}
.mact .ic{width:14px;height:14px}
.mx{width:44px;flex:none;display:flex;align-items:center;justify-content:center;color:var(--sub)}
.mx .ic{width:16px;height:16px}
.empty{display:flex;align-items:center;gap:10px;padding:14px 16px;border-radius:20px;border:1.5px dashed var(--border);color:var(--sub);font-size:.9375em;font-weight:500}
.empty .ic{width:20px;height:20px;color:var(--safe)}

.dayh{display:flex;flex-direction:column;align-items:stretch;gap:10px;margin:28px 0 10px}
.dayh h2{padding-inline:4px}
.dayh h2{font-size:1.3em;font-weight:700;line-height:1.2}
.seg{display:flex;padding:3px;gap:2px;border-radius:16px;background:var(--surface2);box-shadow:inset 0 0 0 1px var(--border)}
.seg button{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 12px;border-radius:13px;font-weight:700;font-size:.875em;color:var(--sub);transition:background .25s,color .25s}
.seg button .ic{width:18px;height:18px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--accentText);box-shadow:var(--shadow)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:7px;min-height:44px;padding:0 14px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow);font-weight:600;font-size:.875em;transition:background .25s,color .25s}
.chip b{font-weight:800;font-variant-numeric:tabular-nums;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--surface2);display:inline-flex;align-items:center;justify-content:center;font-size:.9em}
.chip[aria-pressed="true"]{background:var(--text);color:var(--bg);box-shadow:none}
.chip[aria-pressed="true"] b{background:color-mix(in srgb,var(--bg) 25%,transparent);color:var(--bg)}
.lk-a{animation:lkA .45s both}
.lk-b{animation:lkB .45s both}
@keyframes lkA{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes lkB{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.tl{position:relative}
.tl::before{content:'';position:absolute;top:24px;bottom:24px;right:59px;width:2px;border-radius:2px;background:var(--border)}
.ent{display:grid;grid-template-columns:42px 22px minmax(0,1fr);column-gap:6px;align-items:start;margin-bottom:10px}
.tcol{display:flex;flex-direction:column;padding-top:12px;text-align:right;font-size:.8125em;line-height:1.3;font-variant-numeric:tabular-nums}
.tcol b{font-weight:800}
.tcol span{color:var(--sub);font-weight:500}
.ent.active .tcol b{color:var(--accentText)}
.rcol{display:flex;justify-content:center;padding-top:16px}
.node{width:16px;height:16px;border-radius:50%;background:var(--bg);border:2px solid var(--sub);display:flex;align-items:center;justify-content:center;position:relative;z-index:1}
.ent.active .node{border-color:var(--accent);background:var(--soft)}
.ent.active .node::after{content:'';position:absolute;inset:-7px;border-radius:50%;border:2px solid var(--accent);opacity:0;animation:ring 2.2s ease-out infinite}
.ent.done .node{background:var(--safe);border-color:var(--safe);color:var(--onSafe);width:22px;height:22px;margin-top:-3px;animation:pop .6s cubic-bezier(.2,1.7,.4,1)}
.ent.done .node .ic{width:13px;height:13px;stroke-width:3.2}
.ent.missed .node{border-color:var(--urgent);background:var(--urgentSoft)}
.ent.upcoming .node{border-style:dashed}
@keyframes pop{from{transform:scale(.3)}to{transform:scale(1)}}
.ecard{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:10px 12px;display:flex;flex-direction:column;gap:10px;border:1.5px solid transparent}
.ent.active .ecard{border-color:var(--accent)}
.ent.done .ecard{background:var(--safeSoft);box-shadow:none}
.ent.missed .ecard{background:var(--urgentSoft);box-shadow:none;border-color:color-mix(in srgb,var(--urgent) 40%,transparent)}
.ent.upcoming .ecard{background:transparent;box-shadow:none;border:1.5px dashed var(--border);opacity:.82}
.ehead{display:flex;align-items:center;gap:12px;min-height:44px}
.tile{width:40px;height:40px;border-radius:13px;background:var(--soft);color:var(--accentText);display:flex;align-items:center;justify-content:center;flex:none}
.ent.done .tile{background:var(--surface);color:var(--safe)}
.ent.missed .tile{background:var(--surface);color:var(--urgent)}
.ent.upcoming .tile{background:var(--surface2);color:var(--sub)}
.etext{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.etitle{font-weight:600;line-height:1.3}
.ent.upcoming .etitle{color:var(--sub)}
.ent.active .cap{color:var(--accentText);font-weight:600}
.ent.done .cap{color:var(--safe);font-weight:600}
.ent.missed .cap{color:var(--urgent);font-weight:600}
.lateTag{font-size:.75em;font-weight:700;color:var(--urgent);background:var(--surface);border-radius:6px;padding:1px 6px;margin-inline-start:6px}
.lnk{min-height:44px;padding:0 12px;border-radius:12px;font-weight:700;font-size:.875em;color:var(--safe);flex:none}
.win{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px}
.win-e{display:flex;flex-direction:column;line-height:1.2}
.win-e .cap{font-size:.75em}
.win-e b{font-weight:800;font-size:.9375em;font-variant-numeric:tabular-nums}
.pbar{position:relative;display:block;height:6px;border-radius:6px;background:var(--surface2);overflow:hidden}
.pbar i{position:absolute;inset-block:0;right:0;border-radius:6px;background:var(--accent);transition:width .9s cubic-bezier(.2,.8,.2,1)}
.pbar.urgent i{background:var(--urgent)}
.btns{display:flex;gap:8px}
.ent.marking .btn.primary,.ent.marking .btn.late{background:var(--safe);color:var(--onSafe)}
.nowrow{display:grid;grid-template-columns:42px 22px minmax(0,1fr);column-gap:6px;align-items:center;margin:2px 0 12px}
.nowt{font-size:.8125em;font-weight:800;color:var(--accentText);font-variant-numeric:tabular-nums;text-align:right}
.nowdot{justify-self:center;width:12px;height:12px;border-radius:50%;background:var(--accent);position:relative;z-index:1;box-shadow:0 0 0 4px var(--bg)}
.nowdot::after{content:'';position:absolute;inset:-6px;border-radius:50%;background:var(--accent);opacity:.3;animation:ring 1.8s ease-out infinite}
.nowline{display:flex;align-items:center;gap:8px;font-size:.75em;font-weight:700;color:var(--accentText)}
.nowline::after{content:'';flex:1;border-top:2px dashed var(--accent);opacity:.6}

.gg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ph.big .gg{grid-template-columns:minmax(0,1fr)}
.gc{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:22px;background:var(--surface);box-shadow:var(--shadow);border:1.5px solid transparent;background-image:linear-gradient(160deg,color-mix(in srgb,var(--surface) 60%,transparent),transparent 60%)}
.gc.span2{grid-column:1/-1}
.gc.active{border-color:var(--accent);background-color:var(--soft)}
.gc.done{background-color:var(--safeSoft);box-shadow:none}
.gc.missed{background-color:var(--urgentSoft);box-shadow:none;border-color:color-mix(in srgb,var(--urgent) 40%,transparent)}
.gc.upcoming{background-color:transparent;background-image:none;box-shadow:none;border:1.5px dashed var(--border);opacity:.85}
.gc-h{display:flex;align-items:center;gap:10px}
.gc-t{width:40px;height:40px;border-radius:13px;background:var(--soft);color:var(--accentText);display:grid;place-items:center;flex:none}
.gc.active .gc-t{background:var(--surface)}
.gc.done .gc-t{background:var(--surface);color:var(--safe)}
.gc.missed .gc-t{background:var(--surface);color:var(--urgent)}
.gc.upcoming .gc-t{background:var(--surface2);color:var(--sub)}
.gc-n{display:flex;flex-direction:column;gap:1px;min-width:0}
.gc-n b{font-weight:700;line-height:1.25;font-size:.9375em}
.gc-s{font-size:.8125em;font-weight:600}
.gc.active .gc-s{color:var(--accentText)}
.gc.done .gc-s{color:var(--safe)}
.gc.missed .gc-s{color:var(--urgent)}
.gc.upcoming .gc-s{color:var(--sub)}
.gc-tm{font-size:.8125em;color:var(--sub);font-variant-numeric:tabular-nums}
.gc-act{margin-top:auto;display:flex;gap:8px}
.gc-act .btn{min-height:46px;font-size:.9375em;border-radius:14px}
.gc.marking .btn.primary,.gc.marking .btn.late{background:var(--safe);color:var(--onSafe)}

.rh{display:flex;align-items:center;gap:16px;padding:16px;margin-bottom:12px}
.rh-fig{position:relative;width:132px;height:132px;flex:none}
.rh-fig > svg{position:absolute;inset:0;width:132px;height:132px}
.rh-t{fill:none;stroke-width:9;stroke:color-mix(in srgb,var(--text) 10%,transparent)}
.rh-p{fill:none;stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1),opacity .4s;filter:drop-shadow(0 0 4px color-mix(in srgb,currentColor 50%,transparent))}
.rh-p.d{stroke:var(--safe);color:var(--safe)}
.rh-p.o{stroke:var(--accent);color:var(--accent)}
.rh-p.m{stroke:var(--urgent);color:var(--urgent)}
.rh-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.rh-c b{font-size:1.75em;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.rh-c span{font-size:.75em;color:var(--sub);font-weight:600}
.rh-leg{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.rh-lg{display:flex;align-items:center;gap:8px;width:100%;min-height:44px;padding:0 10px;border-radius:14px;font-weight:600;font-size:.875em;text-align:right;transition:background .25s}
.rh-lg i{width:10px;height:10px;border-radius:50%;flex:none}
.rh-lg.d i{background:var(--safe)}
.rh-lg.o i{background:var(--accent)}
.rh-lg.m i{background:var(--urgent)}
.rh-lg b{margin-inline-start:auto;font-weight:800;font-variant-numeric:tabular-nums}
.rh-lg[aria-pressed="true"]{background:var(--surface2);box-shadow:inset 0 0 0 1.5px var(--border)}
.rgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ph.big .rgrid{grid-template-columns:minmax(0,1fr)}
.rg{display:flex;flex-direction:column;border-radius:22px;background:var(--surface);box-shadow:var(--shadow);border:1.5px solid transparent;overflow:hidden}
.rg.open{grid-column:1/-1}
.rg.active{border-color:var(--accent);background:var(--soft)}
.rg.done{background:var(--safeSoft);box-shadow:none}
.rg.missed{background:var(--urgentSoft);box-shadow:none;border-color:color-mix(in srgb,var(--urgent) 40%,transparent)}
.rg.upcoming{background:transparent;box-shadow:none;border:1.5px dashed var(--border)}
.rg-b{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%;min-height:44px;padding:14px 10px 12px;text-align:center}
.rg.open .rg-b{flex-direction:row;text-align:right;gap:14px;padding:14px}
.rg-ring{position:relative;width:64px;height:64px;flex:none}
.rg-ring > svg{position:absolute;inset:0;width:64px;height:64px}
.rg-t{fill:none;stroke-width:6;stroke:color-mix(in srgb,var(--text) 12%,transparent)}
.rg.upcoming .rg-t{stroke:var(--sub);stroke-dasharray:3 6;stroke-linecap:round;opacity:.7}
.rg-p{fill:none;stroke-width:6;stroke-linecap:round;stroke:var(--accent);transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1),opacity .4s;filter:drop-shadow(0 0 3px color-mix(in srgb,var(--accent) 60%,transparent))}
.rg.active .rg-p{animation:rgGlow 3.4s ease-in-out infinite}
@keyframes rgGlow{50%{filter:drop-shadow(0 0 7px color-mix(in srgb,var(--accent) 90%,transparent))}}
.rg.done .rg-p,.rg.marking .rg-p{stroke:var(--safe);filter:drop-shadow(0 0 3px color-mix(in srgb,var(--safe) 55%,transparent))}
.rg.missed .rg-p{stroke:var(--urgent);filter:drop-shadow(0 0 3px color-mix(in srgb,var(--urgent) 55%,transparent))}
.rg-ic{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--accentText)}
.rg-ic .ic{flex:none;width:24px;height:24px}
.rg.done .rg-ic,.rg.marking .rg-ic{color:var(--safe)}
.rg.missed .rg-ic{color:var(--urgent)}
.rg.upcoming .rg-ic{color:var(--sub)}
.rg.done .rg-ic .ic{animation:pop .6s cubic-bezier(.2,1.7,.4,1)}
.rg-n{display:flex;flex-direction:column;gap:2px;min-width:0}
.rg-n b{font-weight:700;font-size:.9375em;line-height:1.25}
.rg-s{font-size:.8125em;font-weight:600;color:var(--sub)}
.rg.active .rg-s{color:var(--accentText)}
.rg.done .rg-s{color:var(--safe)}
.rg.missed .rg-s{color:var(--urgent)}
.rg-tm{font-size:.8125em;color:var(--sub);font-variant-numeric:tabular-nums}
.rg-strip{display:flex;flex-direction:column;gap:10px;padding:2px 12px 12px;animation:fadeIn .35s both}
</style>

<li class="rg {{g.cardCls}}">
<button class="rg-b" aria-pressed="{{g.sel}}" onClick="{{g.pick}}" aria-label="{{g.aria}}">
<span class="rg-ring"><svg viewBox="0 0 64 64" aria-hidden="true"><circle class="rg-t" cx="32" cy="32" r="26"></circle><circle class="rg-p" cx="32" cy="32" r="26" transform="rotate(-90 32 32)" style="stroke-dasharray: 163.4; stroke-dashoffset: {{g.ringOff}}; opacity: {{g.ringOp}}"></circle></svg><span class="rg-ic"><sc-if value="{{g.showItem}}" hint-placeholder-val="{{ true }}">[[icItem:g]]</sc-if><sc-if value="{{g.isDone}}" hint-placeholder-val="{{ false }}">[[ic:check]]</sc-if><sc-if value="{{g.isMissed}}" hint-placeholder-val="{{ false }}">[[ic:alert]]</sc-if></span></span>
<span class="rg-n"><b>{{g.name}}</b><span class="rg-s">{{g.statusText}}<sc-if value="{{g.late}}" hint-placeholder-val="{{ false }}"><span class="lateTag">באיחור</span></sc-if></span><span class="rg-tm">{{g.range}}</span></span>
</button>
<sc-if value="{{g.sel}}" hint-placeholder-val="{{ false }}">
<div class="rg-strip">
<sc-if value="{{g.isActive}}" hint-placeholder-val="{{ false }}">
<div class="win" role="group" aria-label="חלון הזמן">
<span class="win-e"><span class="cap">נפתח</span><b>{{g.startT}}</b></span>
<span class="pbar {{g.urgentCls}}" role="img" aria-label="{{g.barLabel}}"><i style="width: {{g.pctGone}}%"></i></span>
<span class="win-e"><span class="cap">נגמר</span><b>{{g.winEnd}}</b></span>
</div>
<div class="btns"><button class="btn primary" onClick="{{g.mark}}" aria-label="{{g.markLabel}}">[[ic:check]]<span>{{g.cta}}</span></button><button class="btn ghost" onClick="{{g.open}}">[[ic:book]]<span>נוסח</span></button></div>
</sc-if>
<sc-if value="{{g.isMissed}}" hint-placeholder-val="{{ false }}"><div class="btns"><button class="btn late" onClick="{{g.mark}}" aria-label="{{g.markLabel}}">[[ic:check]]<span>בכל זאת עשיתי</span></button></div></sc-if>
<sc-if value="{{g.isDone}}" hint-placeholder-val="{{ false }}"><div class="btns"><button class="btn undo" onClick="{{g.undo}}" aria-label="{{g.undoLabel}}">[[ic:undo]]<span>ביטול</span></button></div></sc-if>
<sc-if value="{{g.isUpcoming}}" hint-placeholder-val="{{ false }}"><p class="cap">{{g.statusText}} · {{g.range}}</p></sc-if>
</div>
</sc-if>
</li>
</sc-for>
</ul>
</sc-if>
</sc-if>

</div>
</template>
<script>
class Component extends DCLogic {
/*CORE*/

  boardState() {
    return { look: 'rings', filter: 'all', sel: null, drag: false, touched: false, zSel: null, vf: 0 };
  }

  boardMount() {
    this.chipTimer = setTimeout(() => this.centerChip(false), 80);
  }

  boardUnmount() {
    clearTimeout(this.chipTimer);
    cancelAnimationFrame(this.vRaf);
    cancelAnimationFrame(this.gRaf);
  }

  componentDidUpdate() {
    if (this.chipKey !== this.lastChip) {
      const first = this.lastChip === undefined;
      this.lastChip = this.chipKey;
      if (!first) this.centerChip(true);
    }
  }

  centerChip(smooth) {
    const box = document.getElementById('zchips');
    const on = box && box.querySelector('[aria-pressed="true"]');
    if (!box || !on) return;
    const b = box.getBoundingClientRect();
    const o = on.getBoundingClientRect();
    const dx = o.left + o.width / 2 - (b.left + b.width / 2);
    if (smooth) box.scrollBy({ left: dx, behavior: 'smooth' });
    else box.scrollLeft += dx;
  }

  geo() {
    return { CX: 175, CY: 154, R: 122 };
  }

  skyW(sec, A0, A1, E) {
    const z = (id) => this.zmanSec(id);
    const raw = [
      [A0, [10, 0, 70], [25, 12, 45]],
      [z('netz'), [22, 8, 25], [48, 12, 0]],
      [z('netz') + 5400, [16, 0, 0], [32, 0, 0]],
      [z('chatzot'), [14, 0, 0], [30, 0, 0]],
      [z('shkia') - 5400, [20, 0, 0], [38, 4, 0]],
      [z('shkia'), [30, 14, 20], [62, 26, 0]],
      [A1, [12, 8, 70], [34, 20, 40]],
      [Math.min(A1 + 3000, E - 60), [0, 0, 88], [0, 0, 78]],
      [E, [0, 0, 88], [0, 0, 78]],
    ];
    const K = [];
    raw.forEach((k) => {
      if (!K.length || k[0] > K[K.length - 1][0]) K.push(k);
    });
    const lerp = (a, b, f) => a.map((v, i) => v + (b[i] - v) * f);
    if (sec <= K[0][0]) return { top: K[0][1], bot: K[0][2] };
    for (let i = 1; i < K.length; i++) {
      if (sec <= K[i][0]) {
        const f = (sec - K[i - 1][0]) / (K[i][0] - K[i - 1][0]);
        return { top: lerp(K[i - 1][1], K[i][1], f), bot: lerp(K[i - 1][2], K[i][2], f) };
      }
    }
    const L = K[K.length - 1];
    return { top: L[1], bot: L[2] };
  }

  eased(t, key) {
    const now = performance.now();
    const dt = Math.min(100, now - (this.vAt || now - 16));
    this.vAt = now;
    const calm = typeof matchMedia === 'function' && matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (this.vis == null || this.visKey !== key || calm) {
      this.vis = t;
    } else {
      const d = t - this.vis;
      const tau = this.state.drag ? 42 : 130;
      this.vis = Math.abs(d) < 45 ? t : this.vis + d * (1 - Math.exp(-dt / tau));
    }
    this.visKey = key;
    if (this.vis !== t) this.kick();
    return this.vis;
  }

  kick() {
    if (this.vRaf) return;
    this.vRaf = requestAnimationFrame(() => {
      this.vRaf = 0;
      this.setState((s) => ({ vf: s.vf + 1 }));
    });
  }

  gPoint(e) {
    const r = document.getElementById('scene').getBoundingClientRect();
    return { x: ((e.clientX - r.left) * 350) / r.width, y: ((e.clientY - r.top) * 312) / r.height };
  }

  gTime(p) {
    const { CX, CY, R } = this.geo();
    const dx = p.x - CX;
    const dy = p.y - CY;
    const dist = Math.hypot(dx, dy);
    let th = Math.atan2(dx, dy);
    if (th < 0) th += 2 * Math.PI;
    const A0 = this.dayStart();
    return { dist, near: Math.abs(dist - R) < 38, sec: A0 + (th / (2 * Math.PI)) * (this.dayEnd() - A0) };
  }

  gSet(sec) {
    this.gPend = sec;
    if (this.gRaf) return;
    this.gRaf = requestAnimationFrame(() => {
      this.gRaf = 0;
      this.gFlush();
    });
  }

  gFlush() {
    if (this.gPend == null) return;
    const v = this.gPend;
    this.gPend = null;
    this.scrub(v);
  }

  gDown(e) {
    if (e.button > 0) return;
    const hit = this.gTime(this.gPoint(e));
    const onGrab = Boolean(e.target.closest && e.target.closest('.grab'));
    if (hit.dist < 40 || (!onGrab && !hit.near)) return;
    try {
      e.currentTarget.setPointerCapture(e.pointerId);
    } catch (err) {}
    const cur = this.now();
    this.gDrag = { id: e.pointerId, off: onGrab ? hit.sec - cur : 0, prev: cur };
    this.setState({ drag: true, touched: true, zSel: null });
    if (!onGrab) this.gSet(hit.sec);
  }

  gMove(e) {
    const d = this.gDrag;
    if (!d || e.pointerId !== d.id) return;
    const hit = this.gTime(this.gPoint(e));
    if (hit.dist < 40) return;
    const lo = this.dayStart();
    const hi = this.dayEnd() - 60;
    let sec = hit.sec - d.off;
    d.off *= 0.93;
    if (Math.abs(sec - d.prev) > (hi - lo) * 0.5) sec = d.prev < (lo + hi) / 2 ? lo : hi;
    sec = Math.max(lo, Math.min(hi, sec));
    d.prev = sec;
    this.gSet(sec);
  }

  gUp(e) {
    const d = this.gDrag;
    if (!d || e.pointerId !== d.id) return;
    this.gDrag = null;
    try {
      e.currentTarget.releasePointerCapture(e.pointerId);
    } catch (err) {}
    this.gFlush();
    this.setState({ drag: false });
  }

  gKey(e) {
    const t = this.now();
    const keys = { ArrowLeft: 300, ArrowUp: 300, ArrowRight: -300, ArrowDown: -300, PageUp: 3600, PageDown: -3600 };
    let to = null;
    if (e.key in keys) to = t + keys[e.key];
    else if (e.key === 'Home') to = this.dayStart();
    else if (e.key === 'End') to = this.dayEnd() - 60;
    if (to == null) return;
    e.preventDefault();
    this.setState({ zSel: null, touched: true });
    this.scrub(to);
  }

  hx(h) {
    const n = parseInt(h.slice(1), 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }

  mx(a, b, k) {
    const A = this.hx(a);
    const B = this.hx(b);
    return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * k).toString(16).padStart(2, '0')).join('');
  }

  lum(h) {
    const [r, g, b] = this.hx(h);
    return (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255;
  }

  skyAt(sec, A0, A1, E) {
    const z = (id) => this.zmanSec(id);
    const raw = [
      [A0, '#17234f', '#6b5b94'],
      [z('netz'), '#4a6fb5', '#f6b57a'],
      [z('netz') + 5400, '#5aa0e6', '#cfe8f8'],
      [z('chatzot'), '#4c9be8', '#bddff6'],
      [z('shkia') - 5400, '#5c98dc', '#f2dcaa'],
      [z('shkia'), '#3d4f93', '#ef8f5e'],
      [A1, '#151f47', '#4b3d72'],
      [Math.min(A1 + 3000, E - 60), '#0b1430', '#16264a'],
      [E, '#0b1430', '#101c3a'],
    ];
    const K = [];
    raw.forEach((k) => {
      if (!K.length || k[0] > K[K.length - 1][0]) K.push(k);
    });
    if (sec <= K[0][0]) return { top: K[0][1], bot: K[0][2] };
    for (let i = 1; i < K.length; i++) {
      if (sec <= K[i][0]) {
        const f = (sec - K[i - 1][0]) / (K[i][0] - K[i - 1][0]);
        return { top: this.mx(K[i - 1][1], K[i][1], f), bot: this.mx(K[i - 1][2], K[i][2], f) };
      }
    }
    const L = K[K.length - 1];
    return { top: L[1], bot: L[2] };
  }

  renderVals() {
    const c = this.coreVals();
    const s = this.state;
    const t = this.now();
    const A0 = this.dayStart();
    const A1 = this.zmanSec('tzeit');
    const E = this.dayEnd();
    const span = E - A0;
    const { CX, CY, R } = this.geo();
    const cl = (f) => Math.max(0, Math.min(1, f));
    const ringP = (f) => {
      const a = 2 * Math.PI * cl(f);
      return { x: CX + R * Math.sin(a), y: CY + R * Math.cos(a), a };
    };
    const posOf = (S) => ringP((S - A0) / span);
    const vis = this.eased(t, c.dateKey);
    const visNight = vis >= A1;
    const f = cl((vis - A0) / span);
    const orb = ringP(f);
    const NAVY = '#2A2F52';
    const ROSE = '#E8788F';
    const PEACH = '#FFE2A8';
    const mixE = (w, base) =>
      'color-mix(in srgb,' + NAVY + ' ' + w[2].toFixed(0) + '%,color-mix(in srgb,' + ROSE + ' ' + w[1].toFixed(0) + '%,color-mix(in srgb,var(--accent) ' + w[0].toFixed(0) + '%,' + base + ')))';
    const W = this.skyW(vis, A0, A1, E);
    const topC = mixE(W.top, 'var(--surface)');
    const botC = mixE(W.bot, 'var(--surface)');

    const zz = (id) => this.zmanSec(id);
    const RKraw = [
      [A0, 'color-mix(in srgb,' + ROSE + ' 55%,' + PEACH + ')'],
      [zz('netz'), 'color-mix(in srgb,var(--accent) 60%,' + PEACH + ')'],
      [zz('chatzot'), 'color-mix(in srgb,var(--accent) 38%,' + PEACH + ')'],
      [zz('shkia'), 'var(--accent)'],
      [A1, 'color-mix(in srgb,' + ROSE + ' 60%,var(--accent))'],
      [(A1 + E) / 2, '#6D77A8'],
      [E, 'color-mix(in srgb,#8F86B3 50%,' + ROSE + ')'],
    ];
    const RK = [];
    RKraw.forEach((k) => {
      if (!RK.length || k[0] > RK[RK.length - 1][0]) RK.push(k);
    });
    const colorAt = (sec) => {
      if (sec <= RK[0][0]) return RK[0][1];
      for (let i = 1; i < RK.length; i++) {
        if (sec <= RK[i][0]) {
          const g = (sec - RK[i - 1][0]) / (RK[i][0] - RK[i - 1][0]);
          return 'color-mix(in srgb,' + RK[i][1] + ' ' + (g * 100).toFixed(1) + '%,' + RK[i - 1][1] + ')';
        }
      }
      return RK[RK.length - 1][1];
    };
    const faint = (col) => 'color-mix(in srgb,' + col + ' 28%,transparent)';
    const degOf = (sec) => ((sec - A0) / span) * 360;
    const P = f * 360;
    const stops = [];
    RK.forEach((k) => {
      const d = degOf(k[0]);
      if (d < P - 0.01) stops.push(k[1] + ' ' + d.toFixed(2) + 'deg');
    });
    const here = colorAt(vis);
    stops.push(here + ' ' + P.toFixed(2) + 'deg');
    stops.push(faint(here) + ' ' + P.toFixed(2) + 'deg');
    RK.forEach((k) => {
      const d = degOf(k[0]);
      if (d > P + 0.01) stops.push(faint(k[1]) + ' ' + d.toFixed(2) + 'deg');
    });
    const ringBg = 'conic-gradient(from 180deg,' + stops.join(',') + ')';

    const sx = Math.sin(orb.a);
    const sy = Math.cos(orb.a);
    const liteBg = visNight
      ? 'radial-gradient(circle at ' + (50 + 40 * sx).toFixed(1) + '% ' + (50 + 40 * sy).toFixed(1) + '%,rgba(246,231,191,.3) 0,transparent 58%)'
      : 'radial-gradient(circle at ' + (50 + 40 * sx).toFixed(1) + '% ' + (50 + 40 * sy).toFixed(1) + '%,color-mix(in srgb,var(--accent) 42%,transparent) 0,transparent 60%)';
    const discBg = 'linear-gradient(180deg,' + topC + ' 0%,' + botC + ' 100%)';
    const discSh = 'inset 0 0 28px color-mix(in srgb,' + NAVY + ' 22%,transparent),0 8px 30px color-mix(in srgb,var(--accent) 22%,transparent)';
    const hillFar = 'color-mix(in srgb,#7A4F48 24%,' + botC + ')';
    const hillNear = 'color-mix(in srgb,#5E3E44 44%,' + botC + ')';
    const starsOp = cl(W.top[2] / 55);

    if (!this.dStars) {
      let sd = 7;
      const rnd = () => {
        sd = (sd * 9301 + 49297) % 233280;
        return sd / 233280;
      };
      this.dStars = [];
      while (this.dStars.length < 26) {
        const x = rnd() * 212;
        const y = rnd() * 212;
        if (Math.hypot(x - 106, y - 106) < 100) this.dStars.push({ x: x.toFixed(0), y: y.toFixed(0), s: (1.4 + rnd() * 1.6).toFixed(1), d: (rnd() * 3).toFixed(1), du: (3 + rnd() * 2.5).toFixed(1) });
      }
      this.dDots = Array.from({ length: 48 }, (_, i) => {
        const a = (i / 48) * 2 * Math.PI;
        return { x: (CX + 112 * Math.sin(a)).toFixed(1), y: (CY + 112 * Math.cos(a)).toFixed(1), r: i % 2 ? 1 : 1.8 };
      });
    }

    const zl = this.zmanimList();
    const zS = Object.fromEntries(zl.map((z) => [z.id, z.S]));
    const nextId = (c.zmanim.find((z) => z.isNext) || {}).id || null;
    const selId = (c.isScrub && s.zSel) || nextId;
    const sel = c.zmanim.find((z) => z.id === selId) || null;
    const selS = sel ? zS[sel.id] : 0;
    const read = sel
      ? {
          label: sel.name,
          hm: sel.time,
          rel: Math.abs(selS - t) < 30 ? 'הגיע הזמן' : selS > t ? 'בעוד ' + this.left(selS - t) : 'עבר לפני ' + this.left(t - selS),
          isNext: sel.isNext,
        }
      : { label: c.nextZ.name, hm: c.nextZ.time, rel: c.nextZ.left, isNext: true };
    if (this.readKey !== read.label) {
      this.readKey = read.label;
      this.readFlip = !this.readFlip;
    }
    this.chipKey = selId;

    const notches = c.zmanim.map((z, i) => {
      const a = ringP((zl[i].S - A0) / span).a;
      const rr = R + 11;
      return {
        x: (CX + rr * Math.sin(a) - 2).toFixed(1),
        y: (CY + rr * Math.cos(a) - 6).toFixed(1),
        rot: (-a * 180 / Math.PI).toFixed(1),
        cls: (z.past ? 'past' : '') + (z.isNext ? ' nxt' : '') + (z.id === selId ? ' sel' : ''),
      };
    });
    const zchips = c.zmanim.map((z) => ({
      id: z.id,
      label: z.isNext ? 'הבא · ' + z.short : z.short,
      time: z.time,
      cls: z.cls,
      pressed: z.id === selId,
      pick: () => {
        const same = Boolean(c.isScrub && s.zSel === z.id);
        this.setState({ zSel: same ? null : z.id, touched: true });
        if (!same) this.scrub(zS[z.id]);
      },
    }));

    const first = c.hasHero ? c.hero : null;
    const nextItem = c.upcoming[0] || null;
    const midCaption = first ? first.short + ' · עוד ' + first.left : nextItem ? 'הבא: ' + nextItem.short + ' ב-' + nextItem.startT : 'הכול סומן להיום';
    const actives = c.active.map((a, i) => ({
      ...a,
      ringOff: this.dash(157.1, a.pctLeft),
      dotCls: a.isMoon ? 'moon' : '',
      cls: a.isMarking ? 'marking' : '',
    }));

    const msgs = c.messages.map((m) => {
      const isNext = m.id === 'next';
      return { ...m, action: isNext ? 'לפרטים' : m.action, body: m.body.replace(/(\d)–(\d)/g, '$1⁠–⁠$2'), noAction: !m.hasAction };
    });

    const look = s.look;
    const fl = s.filter;
    const tlAll = c.timeline;
    const cnt = { all: tlAll.length, open: c.activeN + c.upcomingN, done: c.doneN, missed: c.missedN };
    const pass = (it) => fl === 'all' || (fl === 'open' && (it.isActive || it.isUpcoming)) || (fl === 'done' && it.isDone) || (fl === 'missed' && it.isMissed);
    const raw = this.items();
    const rawOf = (id) => raw.find((x) => x.id === id);
    const rows = tlAll.filter(pass).map((it) => {
      const dn = c.done.find((d) => d.id === it.id);
      const act = c.active.find((a) => a.id === it.id);
      const r = rawOf(it.id);
      const w = Math.max(3, it.p1 - it.p0);
      const fillPct = act && r ? Math.max(0, Math.min(100, ((t - r.S) / (r.E - r.S)) * 100)) : 0;
      const dAt = this.doneAt(it.id);
      return {
        ...it,
        late: dn ? dn.late : false,
        undoLabel: 'ביטול הסימון של ' + it.name,
        winEnd: it.endsTomorrow ? 'מחר ' + it.endT : it.endT,
        pctGone: act ? act.pctGone : 0,
        urgentCls: act ? act.urgentCls : '',
        dotCls: it.isMoon ? 'moon' : '',
        barLabel: act ? 'נשארו ' + act.left + ' מתוך החלון' : '',
        rowCls: it.status + (it.isMarking ? ' marking' : ''),
        span: '',
        notActive: !it.isActive,
        w: w.toFixed(1),
        p0: it.p0,
        fill: fillPct.toFixed(1),
        dotR: dAt != null ? Math.max(1, Math.min(99, ((dAt - A0) / (E - A0)) * 100)).toFixed(1) : 0,
      };
    });

    if (look === 'cards') {
      let col = 0;
      rows.forEach((r, i) => {
        if (r.isActive) {
          if (col === 1 && i > 0) rows[i - 1].span = 'span2';
          r.span = 'span2';
          col = 0;
        } else col = (col + 1) % 2;
      });
      if (col === 1 && rows.length) rows[rows.length - 1].span = 'span2';
    }
    const entries = [];
    if (look === 'rail') {
      const nowRow = { isNow: true, isItem: false, time: c.nowT, nowWord: c.isScrub ? 'בתצוגה' : 'עכשיו', label: (c.isScrub ? 'בתצוגה ' : 'עכשיו ') + c.nowT };
      let placed = fl !== 'all' && fl !== 'open';
      rows.forEach((it) => {
        if (!placed && it.isUpcoming) {
          entries.push(nowRow);
          placed = true;
        }
        entries.push({ ...it, isNow: false, isItem: true });
      });
      if (!placed && rows.length) entries.push(nowRow);
    }

    const MC = 163.4;
    const ringRows = look === 'rings' ? rows.map((it) => {
      const f = it.isActive ? Math.max(0.03, Math.min(1, (it.pctGone || 0) / 100)) : it.isDone || it.isMissed ? 1 : 0;
      const on = s.sel === it.id;
      return {
        ...it,
        sel: on,
        cardCls: it.status + (it.isMarking ? ' marking' : '') + (on ? ' open' : ''),
        ringOff: (MC * (1 - f)).toFixed(1),
        ringOp: f > 0 ? 1 : 0,
        showItem: !it.isDone && !it.isMissed,
        aria: it.name + ', ' + it.statusText + ', ' + it.range,
        pick: () => this.setState((st) => ({ sel: st.sel === it.id ? null : it.id })),
      };
    }) : [];
    const tot = tlAll.length;
    const heroRings = [
      { cls: 'd', r: 58, n: c.doneN },
      { cls: 'o', r: 46, n: cnt.open },
      { cls: 'm', r: 34, n: c.missedN },
    ].map((h) => {
      const C = 2 * Math.PI * h.r;
      const f = tot ? h.n / tot : 0;
      return { cls: h.cls, r: h.r, c: C.toFixed(1), off: (C * (1 - f)).toFixed(1), op: f > 0 ? 1 : 0 };
    });
    const legPick = (k) => () => this.setState((st) => ({ filter: st.filter === k ? 'all' : k, sel: null }));
    const heroLeg = [
      { cls: 'd', label: 'בוצעו', n: c.doneN, pressed: fl === 'done', pick: legPick('done') },
      { cls: 'o', label: 'פתוחות', n: cnt.open, pressed: fl === 'open', pick: legPick('open') },
      { cls: 'm', label: 'פוספסו', n: c.missedN, pressed: fl === 'missed', pick: legPick('missed') },
    ];

    const emptyMap = {
      all: ['אין מצוות להיום', 'כשיהיו מצוות להיום הן יופיעו כאן.'],
      open: ['הכול נסגר להיום', 'אין מצווה פתוחה או ממתינה כרגע.'],
      done: ['עוד לא סומן כלום', c.doneEmpty],
      missed: ['אין מה לתקן', c.missedEmpty],
    };
    const em = emptyMap[fl];
    const pick = (k) => () => this.setState({ filter: k, sel: null });

    const live = c.isScrub ? posOf(this.liveSec()) : null;

    return {
      ...c,
      sceneCls: (s.drag ? 'drag ' : '') + (c.isScrub ? 'scr ' : '') + (s.touched ? '' : 'hintOn'),
      liveMode: s.drag ? 'off' : 'polite',
      gDown: (e) => this.gDown(e),
      gMove: (e) => this.gMove(e),
      gUp: (e) => this.gUp(e),
      gKey: (e) => this.gKey(e),
      discBg,
      discSh,
      liteBg,
      hillFar,
      hillNear,
      ringBg,
      starsOp: starsOp.toFixed(2),
      cloudOp: (visNight ? 0.05 : 0.14 + 0.2 * (1 - starsOp)).toFixed(2),
      stars: this.dStars,
      dots: this.dDots,
      notches,
      read,
      readCls: this.readFlip ? 'ra' : 'rb',
      zchips,
      showGhost: Boolean(live),
      ghostX: live ? (live.x - 7).toFixed(1) : 0,
      ghostY: live ? (live.y - 7).toFixed(1) : 0,
      sunCls: visNight ? 'off' : '',
      moonCls: visNight ? '' : 'off',
      sunX: (orb.x - 15).toFixed(1),
      sunY: (orb.y - 15).toFixed(1),
      moonX: (orb.x - 14).toFixed(1),
      moonY: (orb.y - 14).toFixed(1),
      grabX: (orb.x - 24).toFixed(1),
      grabY: (orb.y - 24).toFixed(1),
      hintText: 'גררו את הטבעת',
      hintCls: s.touched || c.isScrub ? 'gone' : '',
      sliderMin: Math.round(A0),
      sliderMax: Math.round(E - 60),
      sliderNow: Math.round(t),
      sliderText: c.nowT + ', הבא: ' + c.nextZ.name + ' ' + c.nextZ.left,
      midCaption,
      edgeStart: c.zmanim.find((z) => z.id === 'alot').time,
      edgeEnd: c.zmanim.find((z) => z.id === 'tzeit').time,
      hasActive: c.activeN > 0,
      actives,
      railCls: actives.length > 1 ? 'many' : 'one',
      msgs,
      hasMsgs: msgs.length > 0,
      noMsgs: msgs.length === 0,
      lkRail: { pressed: look === 'rail', pick: () => this.setState({ look: 'rail' }) },
      lkCards: { pressed: look === 'cards', pick: () => this.setState({ look: 'cards' }) },
      lkRings: { pressed: look === 'rings', pick: () => this.setState({ look: 'rings' }) },
      filters: [
        { label: 'הכל', count: cnt.all, pressed: fl === 'all', pick: pick('all') },
        { label: 'פתוח', count: cnt.open, pressed: fl === 'open', pick: pick('open') },
        { label: 'בוצע', count: cnt.done, pressed: fl === 'done', pick: pick('done') },
        { label: 'פוספס', count: cnt.missed, pressed: fl === 'missed', pick: pick('missed') },
      ],
      noRows: rows.length === 0,
      hasRows: rows.length > 0,
      emptyTitle: em[0],
      emptyText: em[1],
      canReset: fl !== 'all',
      resetFilter: () => this.setState({ filter: 'all' }),
      isRail: look === 'rail',
      isCards: look === 'cards',
      isRings: look === 'rings',
      lkEnter: 'lk-' + this.flip('look', look + '|' + fl),
      entries,
      cardRows: look === 'cards' ? rows : [],
      ringRows,
      heroRings,
      heroLeg,
      heroTotal: tot,
      hasTot: tot > 0,
      heroAria: 'בוצעו ' + c.doneN + ', פתוחות ' + cnt.open + ', פוספסו ' + c.missedN + ' מתוך ' + tot,
    };
  }
}
</script>
