<sc-if value="{{sb.p}}" hint-placeholder-val="{{ false }}">
<section class="hbn" aria-label="לוח הזמנים">
<sc-if value="{{hbHasInfo}}" hint-placeholder-val="{{ false }}"><p class="hbi"><span>{{hbInfo.label}}</span><b>{{hbInfo.time}}</b></p></sc-if>
<div class="bento">
<button class="bt big {{bNext.lcls}}" onClick="{{bNext.pick}}" aria-label="{{bNext.aria}}"><span class="btl">הבא · {{bNext.layerName}}</span><span class="btr"><svg viewBox="0 0 64 64" aria-hidden="true"><circle class="mt" cx="32" cy="32" r="26"></circle><circle class="mp" cx="32" cy="32" r="26" transform="rotate(-90 32 32)" stroke-dasharray="163.36" stroke-dashoffset="{{bRingOff}}"></circle></svg></span><b class="btn-t">{{bNext.label}}</b><b class="btx num">{{bNext.time}}</b><span class="btl num">{{bNext.left}}</span></button>
<sc-for list="{{bFixed}}" as="f" hint-placeholder-count="4"><button class="bt sm {{f.cls}}" onClick="{{f.pick}}" aria-label="{{f.aria}}"><span class="btl">{{f.label}}</span><b class="btx num">{{f.time}}</b></button></sc-for>
<div class="bt wide sm2" role="list" aria-label="עכשיו, וגלילה הצידה לשאר זמני היום"><span class="btk">עכשיו</span><sc-for list="{{hbSmart}}" as="x" hint-placeholder-count="2"><button class="lc sm {{x.cls}}" role="listitem" onClick="{{x.pick}}" aria-label="{{x.aria}}"><span>{{x.label}}</span><b class="num">{{x.time}}</b></button></sc-for><span class="hbsep" aria-hidden="true"></span><sc-for list="{{hbRest}}" as="x" hint-placeholder-count="6"><button class="lc rest {{x.tcls}}" role="listitem" onClick="{{x.pick}}" aria-label="{{x.aria}}"><span>{{x.label}}</span><b class="num">{{x.time}}</b></button></sc-for></div>
<div class="bt wide mn" role="list" aria-label="שלי"><span class="btk">שלי</span><sc-for list="{{bMine}}" as="x" hint-placeholder-count="1"><button class="lc mine {{x.cls}}" role="listitem" onClick="{{x.pick}}" aria-label="{{x.aria}}"><span>{{x.label}}</span><b class="num">{{x.time}}</b></button></sc-for><button class="ladd" onClick="{{bAdd}}" aria-label="הוספת זמן">+</button></div>
</div>
</section>
</sc-if>
