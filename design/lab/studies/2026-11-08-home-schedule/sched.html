<sc-if value="{{schedA}}" hint-placeholder-val="{{ false }}">
<h2 class="sl first">לוח הזמנים</h2>
<section class="card lb" aria-label="לוח הזמנים">
<div class="lfix" role="list" aria-label="זמנים קבועים"><sc-for list="{{bFixed}}" as="f" hint-placeholder-count="4"><button class="lf {{f.cls}}" role="listitem" onClick="{{f.pick}}" aria-label="{{f.aria}}"><span class="ll">{{f.label}}</span><b class="lt num">{{f.time}}</b></button></sc-for></div>
<sc-if value="{{bHasSmart}}" hint-placeholder-val="{{ true }}">
<div class="lrow" role="list" aria-label="חכם לעכשיו"><span class="lk">[[ic:sparkle]]<span>עכשיו</span></span><sc-for list="{{bSmart}}" as="x" hint-placeholder-count="2"><button class="lc sm {{x.cls}}" role="listitem" onClick="{{x.pick}}" aria-label="{{x.aria}}"><span>{{x.label}}</span><b class="num">{{x.time}}</b></button></sc-for></div>
</sc-if>
<div class="lrow" role="list" aria-label="הזמנים שלי"><span class="lk">[[ic:star]]<span>שלי</span></span><sc-for list="{{bMine}}" as="x" hint-placeholder-count="1"><button class="lc mine {{x.cls}}" role="listitem" onClick="{{x.pick}}" aria-label="{{x.aria}}"><span>{{x.label}}</span><b class="num">{{x.time}}</b></button></sc-for><button class="ladd" onClick="{{bAdd}}" aria-label="{{bAddLabel}}">+</button></div>
</section>
</sc-if>
