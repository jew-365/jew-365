<!--board title="זמן בהתראה · חי, עם build"-->
<style>
/* One direction for the time left in a mitzvah reminder, on the day's real reminders as they reach the phone: the
   Android shade (subText in the header beside the app name, the accent colour on the small icon and the app name)
   or the iPhone lock screen (the bold subtitle between the title and the body). A notification is worded when it
   arrives and never changes, so the demo shows each one with how long ago it came. The bar at the bottom is the
   demo's: the moment the phone is looked at, the platform and the nagging level. */
.dev{position:absolute;inset:0 0 132px 0;display:flex;flex-direction:column;overflow:hidden}
.p-android .dev{background:color-mix(in srgb,var(--text) 7%,var(--bg))}
.status{display:flex;align-items:center;justify-content:space-between;padding:10px 20px 4px;font-size:13px;line-height:18px;font-weight:600;color:var(--text)}
.status>span{display:inline-flex;gap:4px;align-items:center}
.status .ic{width:16px;height:16px;stroke-width:2}
.shade-h{padding:8px 20px 12px;display:grid;gap:2px}
.shade-h>b{font-size:28px;line-height:34px;font-weight:500;color:var(--text)}
.list{flex:1;min-height:0;overflow-y:auto;padding:0 12px 16px;display:grid;gap:8px;align-content:start;scrollbar-width:none}
.list::-webkit-scrollbar{display:none}
.ntf{background:var(--surface);border-radius:24px;padding:14px 16px 6px;box-shadow:0 1px 3px var(--shadowC)}
.n-head{display:flex;align-items:center;gap:6px;font-size:12px;line-height:16px;color:var(--sub);min-width:0}
.n-ic{width:20px;height:20px;border-radius:50%;flex:none;display:grid;place-items:center}
.n-ic>i{display:block;width:13px;height:13px;background:var(--surface)!important}
.n-head>b{font-weight:500;flex:none}
.n-head>.sep{flex:none}
.n-head>.n-sub{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)}
.n-head>.n-ago{flex:none}
.n-title{font-size:15px;line-height:22px;font-weight:600;color:var(--text);margin-top:6px}
.n-body{font-size:14px;line-height:20px;color:var(--sub)}
.n-acts{display:flex;gap:4px;margin-top:4px}
.n-acts>button{min-height:44px;padding:0 12px;border-radius:999px;font-size:14px;font-weight:600;color:var(--notif)}
.cd{font-weight:700;font-size:13px}
.pbar{height:4px;border-radius:2px;background:var(--surface2);margin-top:8px;overflow:hidden}
.pbar>i{display:block;height:100%;border-radius:2px}
.island{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:150px;height:34px;border-radius:20px;background:#000;display:flex;align-items:center;justify-content:space-between;padding:0 12px;color:#fff;font-size:13px;font-weight:700;z-index:2}
.island>i{width:16px;height:16px;border-radius:50%;-webkit-mask:radial-gradient(circle,transparent 4.5px,#000 5px);mask:radial-gradient(circle,transparent 4.5px,#000 5px)}
.la{margin:0 12px 10px;border-radius:22px;padding:14px;background:rgba(246,246,248,.82);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);color:#111}
.t-dark .la{background:rgba(38,38,44,.82);color:#F2F2F7}
.la-top{display:flex;align-items:center;gap:8px}
.la-top>.ios-ic{width:26px;height:26px;border-radius:7px}
.la-top>b{flex:1;font-size:15px;font-weight:600}
.la-top>span{font-size:13px;opacity:.7}
.la-cd{font-size:44px;line-height:50px;font-weight:700;margin-top:4px}
.la-bar{height:6px;border-radius:3px;background:rgba(120,120,128,.25);overflow:hidden}
.la-bar>i{display:block;height:100%;border-radius:3px}
.la-acts{display:flex;gap:8px;margin-top:10px}
.la-acts>button{flex:1;min-height:44px;border-radius:14px;background:rgba(120,120,128,.18);font-size:14px;font-weight:600}
.empty{padding:28px 12px;text-align:center;font-size:13px;line-height:18px;color:var(--sub)}

/* the iPhone lock screen */
.p-iphone .dev{background:linear-gradient(170deg,#2B3A67 0%,#5B4A7A 45%,#C98A6B 100%);color:#fff}
.t-dark.p-iphone .dev{background:linear-gradient(170deg,#0B1022 0%,#1E1838 50%,#3A2430 100%)}
.p-iphone .status{color:#fff}
.lock-h{display:grid;justify-items:center;padding:6px 16px 18px;text-align:center}
.lock-h>span{font-size:17px;line-height:22px;font-weight:600;opacity:.9}
.lock-h>b{font-size:84px;line-height:88px;font-weight:600;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.ios{border-radius:22px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;background:rgba(246,246,248,.78);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);color:#111}
.t-dark .ios{background:rgba(38,38,44,.78);color:#F2F2F7}
.ios-ic{width:38px;height:38px;border-radius:9px;flex:none;background:#fff center/86% no-repeat;box-shadow:0 0 0 .5px rgba(0,0,0,.12)}
.ios-t{flex:1;min-width:0}
.ios-row{display:flex;align-items:baseline;gap:8px}
.ios-row>b{flex:1;min-width:0;font-size:15px;line-height:20px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ios-row>span{flex:none;font-size:13px;line-height:18px;opacity:.6}
.ios-sub{font-size:15px;line-height:20px;font-weight:600}
.ios-body{font-size:15px;line-height:20px}

/* the demo bar */
.demo{position:absolute;inset:auto 0 0 0;height:132px;border-top:1px solid var(--border);background:var(--surface);padding:8px 12px 10px;display:grid;gap:6px;align-content:start}
.demo-l{font-size:12px;line-height:16px;color:var(--muted)}
.demo-row{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.demo-row::-webkit-scrollbar{display:none}
.demo-row>.chip,.demo-row>.sc-interp{flex:none}
.demo-row .chip{white-space:nowrap}
</style>
<template>
<div class="dev">
<div class="status" aria-hidden="true"><b class="num">{{clock}}</b><span>[[ic:wifi]][[ic:battery]]</span></div>
<sc-if value="{{isAndroid}}" hint-placeholder-val="{{ true }}">
<div class="shade-h"><b class="num">{{clock}}</b><span class="t-cap c-sub">{{dateLine}}</span></div>
<div class="list" aria-live="polite">
<sc-for list="{{items}}" as="n" hint-placeholder-count="3">
<article class="ntf" aria-label="{{n.aria}}">
<div class="n-head"><span class="n-ic" style="{{n.accentStyle}}"><i style="{{n.maskStyle}}"></i></span><b style="{{n.inkStyle}}">{{appName}}</b><span class="sep">·</span><span class="cd num" style="{{n.inkStyle}}">{{n.countdown}}</span><span class="sep">·</span><span class="n-ago">{{n.endText}}</span></div>
<p class="n-title">{{n.title}}</p>
<p class="n-body">{{n.body}}</p>
<div class="pbar" aria-hidden="true"><i style="{{n.barStyle}}"></i></div>
<div class="n-acts"><button onClick="{{n.openText}}">{{openTextLabel}}</button><button onClick="{{n.markDone}}">{{markDoneLabel}}</button></div>
</article>
</sc-for>
<sc-if value="{{empty}}" hint-placeholder-val="{{ false }}"><p class="empty">{{emptyText}}</p></sc-if>
</div>
</sc-if>
<sc-if value="{{isIphone}}" hint-placeholder-val="{{ false }}">
<div class="island" aria-hidden="true"><i style="{{liveRingStyle}}"></i><span class="num" style="{{liveInk}}">{{liveCountdown}}</span></div>
<div class="lock-h"><span>{{dateLine}}</span><b>{{clock}}</b></div>
<sc-if value="{{hasLive}}" hint-placeholder-val="{{ true }}"><section class="la" aria-label="{{liveAria}}"><div class="la-top"><i class="ios-ic" style="{{appIconStyle}}"></i><b>{{liveName}}</b><span>{{liveUntil}}</span></div><p class="la-cd num" style="{{liveInk}}">{{liveCountdown}}</p><div class="la-bar"><i style="{{liveBar}}"></i></div><div class="la-acts"><button onClick="{{liveOpen}}">{{openTextLabel}}</button><button onClick="{{liveDone}}">{{markDoneLabel}}</button></div></section></sc-if>
<div class="list" aria-live="polite">
<sc-for list="{{items}}" as="n" hint-placeholder-count="3">
<article class="ios" aria-label="{{n.aria}}" onClick="{{n.markDone}}">
<i class="ios-ic" style="{{appIconStyle}}" aria-hidden="true"></i>
<div class="ios-t">
<div class="ios-row"><b>{{n.title}}</b><span>{{n.ago}}</span></div>
<sc-if value="{{n.hasSub}}" hint-placeholder-val="{{ true }}"><p class="ios-sub">{{n.sub}}</p></sc-if>
<p class="ios-body">{{n.body}}</p>
</div>
</article>
</sc-for>
<sc-if value="{{empty}}" hint-placeholder-val="{{ false }}"><p class="empty" style="color:#fff">{{emptyText}}</p></sc-if>
</div>
</sc-if>
</div>
<div class="demo" role="group" aria-label="הדמיה">
<span class="demo-l">הדמיה: מסתכלים בטלפון בשעה</span>
<div class="demo-row"><sc-for list="{{looks}}" as="l" hint-placeholder-count="6"><button class="chip num" aria-pressed="{{l.on}}" onClick="{{l.pick}}">{{l.label}}</button></sc-for></div>
<div class="demo-row"><sc-for list="{{plats}}" as="p" hint-placeholder-count="2"><button class="chip" aria-pressed="{{p.on}}" onClick="{{p.pick}}">{{p.label}}</button></sc-for><sc-for list="{{lvls}}" as="v" hint-placeholder-count="2"><button class="chip" aria-pressed="{{v.on}}" onClick="{{v.pick}}">{{v.label}}</button></sc-for></div>
</div>
<!--TOAST-->
</template>
<script>
const STYLE = 'combo';
class Component extends DCLogic {
/*CORE*/

  // With a build: a countdown that runs (Android's chronometer counting down, the iPhone's Live Activity), its digits
  // and a progress bar in the stage colour, from the moment looked at plus the seconds the board has been open.
  renderVals() {
    const v = this.core();
    const D = this.data();
    const since = (this.state.t || 0) * 1000;
    const now = this.lookMs() + since;
    const cd = (ms) => {
      const s = Math.max(0, Math.floor(ms / 1000));
      const h = Math.floor(s / 3600);
      const m = Math.floor((s % 3600) / 60);
      const x = s % 60;
      return (h ? h + ':' + String(m).padStart(2, '0') : String(m)) + ':' + String(x).padStart(2, '0');
    };
    const arrived = this.arrived();
    v.items = v.items.map((it, i) => {
      const n = arrived[i];
      const w = n.w;
      const stage = now >= w.end ? 'red' : this.stageOf(now, w);
      const color = this.stageColor(stage);
      const share = Math.max(0, Math.min(1, (w.end - now) / (w.end - w.start)));
      return Object.assign({}, it, {
        countdown: now >= w.end ? 'הזמן נגמר' : '⏱ ' + cd(w.end - now),
        endText: 'עד ' + this.hm(w.end),
        inkStyle: 'color:' + color,
        accentStyle: 'background:' + color,
        barStyle: 'width:' + (share * 100).toFixed(1) + '%;background:' + color,
      });
    }).filter((it, i) => now < arrived[i].w.end);
    v.empty = v.items.length === 0;
    const open = arrived.filter((n) => now < n.w.end).sort((a, b) => a.w.end - b.w.end)[0];
    v.hasLive = Boolean(open);
    if (open) {
      const w = open.w;
      const stage = this.stageOf(now, w);
      const color = this.stageColor(stage);
      const share = Math.max(0, Math.min(1, (w.end - now) / (w.end - w.start)));
      Object.assign(v, {
        liveName: w.name,
        liveUntil: 'סוף הזמן ' + this.hm(w.end),
        liveCountdown: cd(w.end - now),
        liveInk: 'color:' + color,
        liveBar: 'width:' + (share * 100).toFixed(1) + '%;background:' + color,
        liveRingStyle: 'background:conic-gradient(' + color + ' 0 ' + (share * 100).toFixed(1) + '%,rgba(255,255,255,.2) 0)',
        liveAria: w.name + ', נשארו ' + this.leftText(w.end - now),
        liveOpen: () => this.showToast('פותח את הנוסח של ' + w.name),
        liveDone: () => {
          this.setState({ done: Object.assign({}, this.state.done, { [open.id]: true }) });
          this.showToast('סומן: ' + w.name + ' · הפעילות החיה נסגרה');
        },
      });
    } else {
      Object.assign(v, { liveName: '', liveUntil: '', liveCountdown: '', liveInk: '', liveBar: '', liveRingStyle: 'display:none', liveAria: '', liveOpen: () => {}, liveDone: () => {} });
    }
    return v;
  }
}
</script>
