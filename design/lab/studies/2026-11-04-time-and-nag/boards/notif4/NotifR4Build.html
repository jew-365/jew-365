<!--board title="תוכן ההתראה · סבב 4 · עם בילד"-->
<style>
/* Round 4: one layout for the notification's text, on the day's real sends of the smart nag, as Samsung's One UI
   draws them in the shade (the owner's phone): collapsed, the title, the subText and the time share one row over one
   line of the body; expanded, the app name, the subText and the time make the header row over the title, the whole
   body and the actions. A card opens and closes with its arrow; the newest opens first. The iPhone lock screen beside
   it shows the bold subtitle between the title and the body. The bar at the bottom is the demo's. */
.dev{position:absolute;inset:0 0 132px 0;display:flex;flex-direction:column;overflow:hidden}
.p-samsung .dev{background:linear-gradient(170deg,#6B4A3F 0%,#8A6A5E 40%,#4E5A63 100%)}
.t-dark.p-samsung .dev{background:linear-gradient(170deg,#241A18 0%,#2E2624 45%,#1C2126 100%)}
.status{display:flex;align-items:center;justify-content:space-between;padding:10px 20px 4px;font-size:13px;line-height:18px;font-weight:600;color:#fff}
.status>span{display:inline-flex;gap:4px;align-items:center}
.status .ic{width:16px;height:16px;stroke-width:2}
.shade-h{padding:8px 22px 14px;display:flex;align-items:baseline;gap:10px;color:#fff}
.shade-h>b{font-size:30px;line-height:36px;font-weight:600}
.shade-h>span{font-size:14px;line-height:20px;opacity:.9}
.list{flex:1;min-height:0;overflow-y:auto;padding:0 12px 16px;display:grid;gap:8px;align-content:start;scrollbar-width:none}
.list::-webkit-scrollbar{display:none}
/* a One UI card: a dark glass on the wallpaper, the app icon in a circle on the start side, an arrow on the end side */
.sc{border-radius:26px;padding:12px 14px 6px;background:rgba(40,28,24,.72);color:#fff;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.t-dark .sc{background:rgba(30,24,22,.82)}
.sc-row{display:flex;align-items:flex-start;gap:10px}
.sc-ic{width:40px;height:40px;border-radius:50%;flex:none;background:#fff center/88% no-repeat}
.sc-main{flex:1;min-width:0;display:grid;gap:2px}
.sc-top{display:flex;align-items:baseline;gap:6px;min-width:0;font-size:13px;line-height:18px}
.sc-top>b{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc-top>.sc-title{font-size:15px;line-height:20px;flex:0 1 auto}
.sc-top>.sc-app{opacity:.85;flex:0 1 auto;max-width:34%}
.sc-top>.sc-sub{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;opacity:.9}
.sc-top>.sc-time{flex:none;opacity:.7}
.sc-top>.sep{flex:none;opacity:.7}
.sc-x{width:44px;height:44px;margin:-10px -10px -10px -6px;display:grid;place-items:center;color:#fff;flex:none}
.sc-x .ic{width:18px;height:18px;stroke-width:2.2}
.sc-title2{font-size:15px;line-height:21px;font-weight:700;margin-top:2px}
.sb-one{font-size:14px;line-height:20px;opacity:.92;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-line{font-size:14px;line-height:20px;opacity:.92}
.sb-line.lead{font-weight:600;opacity:1}
.sc-chrono{font-variant-numeric:tabular-nums;font-weight:700;flex:none}
.sc-prog{height:4px;border-radius:2px;background:rgba(255,255,255,.22);overflow:hidden;margin-top:6px}
.sc-prog>i{display:block;height:100%}
.sc-acts{display:flex;justify-content:space-around;margin-top:4px;border-top:1px solid rgba(255,255,255,.12)}
.sc-acts>button{flex:1;min-height:44px;font-size:15px;font-weight:700;color:#fff;text-align:center}
.empty{padding:28px 12px;text-align:center;font-size:13px;line-height:18px;color:#fff}

/* the iPhone lock screen */
.p-iphone .dev{background:linear-gradient(170deg,#2B3A67 0%,#5B4A7A 45%,#C98A6B 100%);color:#fff}
.t-dark.p-iphone .dev{background:linear-gradient(170deg,#0B1022 0%,#1E1838 50%,#3A2430 100%)}
.lock-h{display:grid;justify-items:center;padding:6px 16px 18px;text-align:center;color:#fff}
.lock-h>span{font-size:17px;line-height:22px;font-weight:600;opacity:.9}
.lock-h>b{font-size:84px;line-height:88px;font-weight:600;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.ios{border-radius:22px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;background:rgba(246,246,248,.78);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);color:#111;text-align:start;width:100%}
.t-dark .ios{background:rgba(38,38,44,.78);color:#F2F2F7}
.ios-ic{width:38px;height:38px;border-radius:9px;flex:none;background:#fff center/86% no-repeat;box-shadow:0 0 0 .5px rgba(0,0,0,.12)}
.ios-t{flex:1;min-width:0}
.ios-row{display:flex;align-items:baseline;gap:8px}
.ios-row>b{flex:1;min-width:0;font-size:15px;line-height:20px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ios-row>span{flex:none;font-size:13px;line-height:18px;opacity:.6}
.ios-sub{font-size:15px;line-height:20px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ios-body{font-size:15px;line-height:20px}

/* the demo bar */
.demo{position:absolute;inset:auto 0 0 0;height:132px;border-top:1px solid var(--border);background:var(--surface);padding:8px 12px 10px;display:grid;gap:6px;align-content:start}
.demo-l{font-size:12px;line-height:16px;color:var(--muted)}
.demo-row{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.demo-row::-webkit-scrollbar{display:none}
.demo-row>.chip,.demo-row>.sc-interp{flex:none}
.demo-row .chip{white-space:nowrap}
</style>
<template>
<div class="dev">
<div class="status" aria-hidden="true"><b class="num">{{clock}}</b><span>[[ic:wifi]][[ic:battery]]</span></div>
<sc-if value="{{isSamsung}}" hint-placeholder-val="{{ true }}">
<div class="shade-h"><b class="num">{{clock}}</b><span>{{dateLine}}</span></div>
<div class="list" aria-live="polite">
<sc-for list="{{items}}" as="n" hint-placeholder-count="3">
<article class="sc" aria-label="{{n.aria}}">
<div class="sc-row">
<i class="sc-ic" style="{{appIconStyle}}" aria-hidden="true"></i>
<div class="sc-main">
<sc-if value="{{n.closed}}" hint-placeholder-val="{{ false }}">
<div class="sc-top"><b class="sc-title">{{n.title}}</b><sc-if value="{{n.hasSub}}" hint-placeholder-val="{{ true }}"><span class="sc-sub">{{n.sub}}</span></sc-if><sc-if value="{{n.hasChrono}}" hint-placeholder-val="{{ false }}"><span class="sc-chrono">{{n.chrono}}</span></sc-if><span class="sc-time num">{{n.time}}</span></div>
<p class="sb-one">{{n.first}}</p>
</sc-if>
<sc-if value="{{n.open}}" hint-placeholder-val="{{ true }}">
<div class="sc-top"><b class="sc-app">{{appName}}</b><sc-if value="{{n.hasSub}}" hint-placeholder-val="{{ true }}"><span class="sep">·</span><span class="sc-sub">{{n.sub}}</span></sc-if><sc-if value="{{n.hasChrono}}" hint-placeholder-val="{{ false }}"><span class="sep">·</span><span class="sc-chrono">{{n.chrono}}</span></sc-if><span class="sep">·</span><span class="sc-time num">{{n.time}}</span></div>
<p class="sc-title2">{{n.title}}</p>
<sc-if value="{{n.hasEnd}}" hint-placeholder-val="{{ false }}"><p class="sb-line lead">{{n.endLead}}<span style="{{n.endStyle}}">{{n.endText}}</span></p></sc-if>
<sc-for list="{{n.lines}}" as="ln" hint-placeholder-count="2"><p class="{{ln.cls}}">{{ln.text}}</p></sc-for>
<sc-if value="{{n.hasProgress}}" hint-placeholder-val="{{ false }}"><div class="sc-prog" aria-hidden="true"><i style="{{n.progressStyle}}"></i></div></sc-if>
</sc-if>
</div>
<button class="sc-x" onClick="{{n.toggle}}" aria-label="{{n.toggleLabel}}" aria-expanded="{{n.open}}"><sc-if value="{{n.open}}" hint-placeholder-val="{{ true }}">[[ic:chevronUp]]</sc-if><sc-if value="{{n.closed}}" hint-placeholder-val="{{ false }}">[[ic:chevronDown]]</sc-if></button>
</div>
<sc-if value="{{n.open}}" hint-placeholder-val="{{ true }}"><div class="sc-acts"><button onClick="{{n.openText}}">{{openTextLabel}}</button><button onClick="{{n.markDone}}">{{markDoneLabel}}</button></div></sc-if>
</article>
</sc-for>
<sc-if value="{{empty}}" hint-placeholder-val="{{ false }}"><p class="empty">{{emptyText}}</p></sc-if>
</div>
</sc-if>
<sc-if value="{{isIphone}}" hint-placeholder-val="{{ false }}">
<div class="lock-h"><span>{{dateLine}}</span><b>{{clock}}</b></div>
<div class="list" aria-live="polite">
<sc-for list="{{items}}" as="n" hint-placeholder-count="3">
<button class="ios" aria-label="{{n.aria}}" onClick="{{n.markDone}}">
<i class="ios-ic" style="{{appIconStyle}}" aria-hidden="true"></i>
<span class="ios-t">
<span class="ios-row"><b>{{n.title}}</b><span>{{n.time}}</span></span>
<sc-if value="{{n.hasSub}}" hint-placeholder-val="{{ true }}"><span class="ios-sub" style="display:block">{{n.sub}}</span></sc-if>
<sc-for list="{{n.lines}}" as="ln" hint-placeholder-count="1"><span class="ios-body" style="display:block">{{ln.text}}</span></sc-for>
</span>
</button>
</sc-for>
<sc-if value="{{empty}}" hint-placeholder-val="{{ false }}"><p class="empty">{{emptyText}}</p></sc-if>
</div>
</sc-if>
</div>
<div class="demo" role="group" aria-label="הדמיה">
<span class="demo-l">הדמיה: מסתכלים בטלפון בשעה</span>
<div class="demo-row"><sc-for list="{{looks}}" as="l" hint-placeholder-count="5"><button class="chip num" aria-pressed="{{l.on}}" onClick="{{l.pick}}">{{l.label}}</button></sc-for></div>
<div class="demo-row"><sc-for list="{{plats}}" as="p" hint-placeholder-count="2"><button class="chip" aria-pressed="{{p.on}}" onClick="{{p.pick}}">{{p.label}}</button></sc-for><sc-for list="{{lvls}}" as="v" hint-placeholder-count="2"><button class="chip" aria-pressed="{{v.on}}" onClick="{{v.pick}}">{{v.label}}</button></sc-for></div>
</div>
<!--TOAST-->
</template>
<script>
const STYLE = 'r4build';
class Component extends DCLogic {
/*CORE*/

  renderVals() {
    return this.core();
  }
}
</script>
